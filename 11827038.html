<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brownsche Bewegung</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --btc: #f7931a; --white: #ffffff; --bg: #000000;
    --panel-bg: rgba(10,10,10,0.90); --muted: rgba(255,255,255,0.35);
    --font: 'Arial Black', 'Arial Bold', Arial, sans-serif;
  }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; color:#fff; font-family:var(--font); font-size:11px; }
  #canvas-wrap { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #panel {
    position:fixed; top:20px; right:20px; width:240px;
    background:var(--panel-bg); border:1px solid rgba(255,255,255,0.10);
    border-radius:7px; z-index:10; transition:opacity .25s;
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    overflow:hidden;
  }
  #panel-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px 11px; cursor:pointer; user-select:none;
    border-bottom:1px solid rgba(255,255,255,0.07);
  }
  #panel-header:hover { background:rgba(255,255,255,0.03); }
  .panel-title { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--btc); }
  #panel-toggle-icon { color:rgba(255,255,255,0.4); font-size:13px; transition:transform .25s; line-height:1; }
  #panel-toggle-icon.open { transform:rotate(180deg); }
  #panel-body { padding:14px 14px 12px; display:flex; flex-direction:column; gap:13px; }
  #panel-body.collapsed { display:none; }
  .field { display:flex; flex-direction:column; gap:5px; }
  label { color:var(--muted); font-size:9px; letter-spacing:.1em; text-transform:uppercase; display:flex; justify-content:space-between; align-items:center; gap:4px; }
  label span.val { color:#fff; }
  input[type="file"] { display:none; }
  .btn { width:100%; padding:8px 0; border-radius:3px; border:none; cursor:pointer; font-family:var(--font); font-size:9px; letter-spacing:.1em; text-transform:uppercase; transition:background .15s, color .15s; }
  .btn-run { background:var(--btc); color:#000; font-weight:bold; }
  .btn-run:hover { background:#ffaa33; }
  .btn-run:disabled { background:#3a2800; color:#6b4a00; cursor:not-allowed; }
  .btn-reset { background:transparent; color:var(--muted); border:1px solid rgba(255,255,255,.1); }
  .btn-reset:hover { color:#fff; border-color:rgba(255,255,255,.3); }
  input[type="range"] { -webkit-appearance:none; width:100%; height:2px; background:rgba(255,255,255,.12); outline:none; border-radius:2px; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:10px; height:10px; border-radius:50%; background:var(--btc); cursor:pointer; }
  input[type="range"]::-moz-range-thumb { width:10px; height:10px; border-radius:50%; background:var(--btc); cursor:pointer; border:none; }
  input[type="date"] { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); color:#fff; padding:5px 7px; border-radius:3px; font-family:var(--font); font-size:9px; width:100%; outline:none; }
  input[type="date"]:focus { border-color:var(--btc); }
  input[type="date"]::-webkit-calendar-picker-indicator { filter:invert(.4); cursor:pointer; }
  .divider { border:none; border-top:1px solid rgba(255,255,255,.07); }
  .bt-badge { font-size:8px; letter-spacing:.06em; color:var(--btc); background:rgba(247,147,26,0.12); border:1px solid rgba(247,147,26,0.25); border-radius:3px; padding:1px 5px; white-space:nowrap; flex-shrink:0; }
  #tooltip { position:fixed; pointer-events:none; background:rgba(8,8,8,.94); border:1px solid rgba(255,255,255,.12); border-radius:4px; padding:6px 10px; font-family:var(--font); font-size:11px; line-height:1.7; display:none; z-index:20; backdrop-filter:blur(8px); }
  #tooltip b { color:var(--btc); }
  #sim-start-marker { position:fixed; pointer-events:none; display:none; z-index:8; }
  #hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); font-size:10px; color:rgba(255,255,255,.22); letter-spacing:.08em; pointer-events:none; z-index:5; white-space:nowrap; }
  #reset-view { position:fixed; bottom:14px; right:20px; background:rgba(10,10,10,.8); border:1px solid rgba(255,255,255,.1); border-radius:4px; color:rgba(255,255,255,.4); font-family:var(--font); font-size:9px; letter-spacing:.1em; padding:6px 10px; cursor:pointer; z-index:10; text-transform:uppercase; backdrop-filter:blur(8px); }
  #reset-view:hover { color:#fff; border-color:rgba(255,255,255,.3); }
  #toggle-panel { position:fixed; top:20px; right:20px; z-index:11; background:rgba(10,10,10,.85); border:1px solid rgba(255,255,255,.1); border-radius:4px; color:var(--muted); font-family:var(--font); font-size:9px; letter-spacing:.1em; padding:7px 10px; cursor:pointer; display:none; backdrop-filter:blur(8px); }
  #toggle-panel:hover { color:#fff; }
  @media (max-width:600px) { #panel { width:calc(100vw - 24px); left:12px; right:12px; top:auto; bottom:60px; } #toggle-panel { display:block; } }
</style>
</head>
<body>
<div id="canvas-wrap"><canvas id="c"></canvas></div>

<div id="panel">
  <div id="panel-header" onclick="togglePanel()">
    <span class="panel-title">Brownsche Bewegung</span>
    <span id="panel-toggle-icon" class="open">▲</span>
  </div>
  <div id="panel-body">
    <div class="field">
      <label>Sim-Startdatum</label>
      <input type="date" id="start-date" min="2009-01-01">
    </div>
    <div class="field">
      <label>Simulationen <span class="val" id="sim-val">100</span></label>
      <input type="range" id="sim-count" min="1" max="200" value="100">
    </div>
    <div class="field">
      <label>
        <span>Volatilität σ <span class="val" id="vol-val">0.80</span></span>
        <span class="bt-badge" id="bt-sigma-badge" style="display:none">backtested</span>
      </label>
      <input type="range" id="vol" min="0.1" max="3.5" step="0.001" value="0.80">
    </div>
    <div class="field">
      <label>
        <span>Drift μ <span class="val" id="drift-val">0.30</span></span>
        <span class="bt-badge" id="bt-mu-badge" style="display:none">backtested</span>
      </label>
      <input type="range" id="drift" min="-2.0" max="15.0" step="0.001" value="0.30">
    </div>
    <button class="btn btn-run" id="run-btn" disabled>Simulation starten</button>
    <button class="btn btn-reset" id="reset-btn">Sims zurücksetzen</button>
  </div>
</div>

<button id="toggle-panel">☰</button>
<div id="tooltip"></div>
<div id="hint">Scroll = X-Zoom &nbsp;·&nbsp; Shift+Scroll = Y-Zoom &nbsp;·&nbsp; Drag = Pan &nbsp;·&nbsp; Y-Achse ziehen = Y-Stretch &nbsp;·&nbsp; Doppelklick auf Linie = Sim-Start &nbsp;·&nbsp; Leertaste = Simulation</div>
<button id="reset-view">↺ Reset</button>

function getBtParams(dateStr) {
  if (!BT_PARAMS.length) return null;
  let lo = 0, hi = BT_PARAMS.length - 1, best = null;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (BT_PARAMS[mid][0] <= dateStr) { best = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  if (best === null) return null;
  return { sigma: BT_PARAMS[best][1], mu: BT_PARAMS[best][2] };
}

// ── Constants ──
const ABS_Y_MIN = 0.0001, ABS_Y_MAX = 10_000_000;
const LOG_ABS_MIN = Math.log10(ABS_Y_MIN), LOG_ABS_MAX = Math.log10(ABS_Y_MAX);

// ── View state ──
const view = { xMin: 0, xMax: 1, yMin: LOG_ABS_MIN, yMax: LOG_ABS_MAX };

// ── App state ──
const state = {
  data: [], sims: [], simDates: [],
  animFrame: null, animStart: null, animDuration: 3000,
};

// ── Canvas ──
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth  * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width  = window.innerWidth  + 'px';
  canvas.style.height = window.innerHeight + 'px';
  rebuildSimCanvas();
  drawAll();
}
window.addEventListener('resize', resize);

function getPad(dpr) { return { padT: 28*dpr, padB: 58*dpr, padL: 92*dpr, padR: 28*dpr }; }

// ── Coordinate transforms ──
function priceToY(price, H, padT, padB) {
  const logP = Math.log10(Math.max(1e-14, price));
  return padT + (1 - (logP - view.yMin) / (view.yMax - view.yMin)) * (H - padT - padB);
}
function timeToX(ms, W, padL, padR) {
  return padL + ((ms - view.xMin) / (view.xMax - view.xMin)) * (W - padL - padR);
}
function xToTime(px, W, padL, padR) {
  return view.xMin + ((px - padL) / (W - padL - padR)) * (view.xMax - view.xMin);
}
function yToLog(py, H, padT, padB) {
  return view.yMin + (1 - (py - padT) / (H - padT - padB)) * (view.yMax - view.yMin);
}

// ── Reset view ──
function resetView() {
  const all = [...state.data.map(p => p.date), ...state.simDates];
  if (!all.length) {
    view.xMin = new Date(2009, 0, 1).getTime();
    view.xMax = new Date(2032, 0, 1).getTime();
  } else {
    const xs = Math.min(...all.map(d => d.getTime()));
    const xe = Math.max(...all.map(d => d.getTime()));
    const pad = (xe - xs) * 0.02;
    view.xMin = xs - pad; view.xMax = xe + pad;
  }
  view.yMin = LOG_ABS_MIN; view.yMax = LOG_ABS_MAX;
  rebuildSimCanvas();
  drawAll();
}

// ── Formatters ──
function formatYLabel(v) {
  if (v <= 0) return '';
  if (v < 1)     return v.toFixed(2);
  if (v < 1000)  return String(Math.round(v));
  if (v < 1e6)   return (v / 1000).toFixed(0) + 'k';
  if (v < 1e7)   return (v / 1e6).toFixed(0) + 'M';
  return (v / 1e6).toFixed(0) + 'M';
}
function formatPrice(p) {
  if (p >= 1e6)  return '$' + (p / 1e6).toFixed(2) + 'M';
  if (p >= 1000) return '$' + Math.round(p).toLocaleString('de-DE');
  if (p >= 1)    return '$' + p.toFixed(2);
  return '$' + p.toFixed(6);
}
function formatDateShort(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// ── Draw ──
function drawAll() {
  const W = canvas.width, H = canvas.height, dpr = devicePixelRatio;
  const { padT, padB, padL, padR } = getPad(dpr);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  // Clip to chart area
  ctx.save();
  ctx.beginPath(); ctx.rect(padL, padT, W - padL - padR, H - padT - padB); ctx.clip();
  if (state.sims.length) drawSimulations();
  if (state.data.length) drawPriceLine(W, H, padL, padR, padT, padB, dpr);
  drawSimStartMarker(W, H, padL, padR, padT, padB, dpr);
  ctx.restore();

  drawAxes(W, H, padL, padR, padT, padB, dpr);

  if (!state.data.length) {
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.font = `bold ${14*dpr}px Arial Black,Arial,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('DOPPELKLICK AUF LINIE → SIM-STARTDATUM WÄHLEN', W/2, H/2);
  }
}

// ── Axes ──
function drawAxes(W, H, padL, padR, padT, padB, dpr) {
  const FS = 13*dpr, FONT = `bold ${FS}px Arial Black,Arial,sans-serif`;

  // Y labels only (no gridlines)
  niceLogTicks(view.yMin, view.yMax).forEach(v => {
    const y = priceToY(v, H, padT, padB);
    if (y < padT - 2 || y > H - padB + 2) return;
    ctx.font = FONT; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(formatYLabel(v), padL - 12, y);
  });

  // X labels only (no gridlines)
  niceTimeTicks(view.xMin, view.xMax, W, padL, padR, dpr).forEach(({ ms, label }) => {
    const x = timeToX(ms, W, padL, padR);
    if (x < padL || x > W - padR) return;
    ctx.font = FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(label, x, H - padB + 12*dpr);
  });
}

function niceLogTicks(logMin, logMax) {
  return [0.0001, 0.001, 0.01, 0.1, 1, 10, 100, 1000, 10000, 100000, 1000000, 10000000]
    .filter(v => { const lv = Math.log10(v); return lv >= logMin - 0.001 && lv <= logMax + 0.001; });
}

function niceTimeTicks(xMin, xMax, W, padL, padR, dpr) {
  const spanDays = (xMax - xMin) / 86400000;
  let interval, fmt;
  if      (spanDays > 365*8)  { interval = {years:2};   fmt = d => String(d.getFullYear()); }
  else if (spanDays > 365*3)  { interval = {years:1};   fmt = d => String(d.getFullYear()); }
  else if (spanDays > 365)    { interval = {months:3};  fmt = d => d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0'); }
  else if (spanDays > 90)     { interval = {months:1};  fmt = d => d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0'); }
  else if (spanDays > 30)     { interval = {weeks:1};   fmt = d => String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0'); }
  else                         { interval = {days:1};    fmt = d => String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0'); }
  const ticks = [];
  if (interval.years) {
    let yr = Math.ceil(new Date(xMin).getFullYear() / interval.years) * interval.years;
    for (let i = 0; i < 300; i++) { const d = new Date(yr + i*interval.years, 0, 1); if (d.getTime() > xMax) break; ticks.push({ms: d.getTime(), label: fmt(d)}); }
  } else if (interval.months) {
    let d = new Date(new Date(xMin).getFullYear(), Math.floor(new Date(xMin).getMonth()/interval.months)*interval.months, 1);
    for (let i = 0; i < 600; i++) { if (d.getTime() > xMax) break; if (d.getTime() >= xMin) ticks.push({ms: d.getTime(), label: fmt(d)}); d = new Date(d.getFullYear(), d.getMonth()+interval.months, 1); }
  } else if (interval.weeks) {
    const t0 = Math.floor(xMin/(7*86400000))*7*86400000;
    for (let i = 0; i < 1000; i++) { const ms = t0+i*7*86400000; if (ms > xMax) break; if (ms >= xMin) ticks.push({ms, label: fmt(new Date(ms))}); }
  } else {
    const t0 = Math.floor(xMin/86400000)*86400000;
    for (let i = 0; i < 2000; i++) { const ms = t0+i*86400000; if (ms > xMax) break; if (ms >= xMin) ticks.push({ms, label: fmt(new Date(ms))}); }
  }
  const maxT = Math.floor((W - padL - padR) / (60*dpr));
  if (ticks.length > maxT) { const step = Math.ceil(ticks.length/maxT); return ticks.filter((_,i) => i%step===0); }
  return ticks;
}

// ── Price line with glow ──
function drawPriceLine(W, H, padL, padR, padT, padB, dpr) {
  const path = new Path2D();
  let first = true;
  state.data.forEach(pt => {
    const x = timeToX(pt.date.getTime(), W, padL, padR);
    const y = priceToY(pt.price, H, padT, padB);
    if (first) { path.moveTo(x, y); first = false; } else path.lineTo(x, y);
  });
  ctx.save();
  ctx.lineJoin = 'round';
  // Outermost halo — very wide, barely visible
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 40 * dpr;
  ctx.stroke(path);
  // Outer glow
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 24 * dpr;
  ctx.stroke(path);
  // Mid glow
  ctx.strokeStyle = 'rgba(255,255,255,0.20)';
  ctx.lineWidth = 12 * dpr;
  ctx.stroke(path);
  // Inner glow
  ctx.strokeStyle = 'rgba(255,255,255,0.50)';
  ctx.lineWidth = 5 * dpr;
  ctx.stroke(path);
  // Bright core
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 2.2 * dpr;
  ctx.stroke(path);
  // Sharp white center
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.2 * dpr;
  ctx.stroke(path);
  ctx.restore();
}

// ── Sim start marker (vertical line) ──
function drawSimStartMarker(W, H, padL, padR, padT, padB, dpr) {
  const sdVal = document.getElementById('start-date').value;
  if (!sdVal || !state.data.length) return;
  const sdMs = new Date(sdVal).getTime();
  const x = timeToX(sdMs, W, padL, padR);
  if (x < padL || x > W - padR) return;

  ctx.save();
  ctx.setLineDash([6*dpr, 4*dpr]);
  ctx.beginPath();
  ctx.strokeStyle = 'rgba(247,147,26,0.6)';
  ctx.lineWidth = 1.5*dpr;
  ctx.moveTo(x, padT); ctx.lineTo(x, H - padB);
  ctx.stroke();
  ctx.setLineDash([]);

  // small dot on line
  // find price at that date
  let nearest = state.data[0], minDiff = Infinity;
  state.data.forEach(pt => { const d = Math.abs(pt.date.getTime() - sdMs); if (d < minDiff) { minDiff = d; nearest = pt; } });
  const py = priceToY(nearest.price, H, padT, padB);
  ctx.beginPath();
  ctx.fillStyle = '#f7931a';
  ctx.arc(x, py, 5*dpr, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function initData() {
  state.data = BTC_RAW.map(([ds, price]) => ({
    date: new Date(ds),
    price
  }));
  state.data.sort((a, b) => a.date - b.date);
  const last = state.data[state.data.length - 1].date;
  const sd = document.getElementById('start-date');
  sd.min = '2009-01-01';
  sd.max = formatDateShort(last);
  sd.value = formatDateShort(last);
  document.getElementById('run-btn').disabled = false;
  applyBacktestedParams(formatDateShort(last));
}

// ── GBM Simulation ──
function runSimulations() {
  const startDateVal = document.getElementById('start-date').value;
  const n     = parseInt(document.getElementById('sim-count').value);
  const sigma = parseFloat(document.getElementById('vol').value);
  const mu    = parseFloat(document.getElementById('drift').value);
  const startDate = startDateVal ? new Date(startDateVal) : state.data[0].date;
  const endDate = new Date(2031, 11, 31);
  let si = 0;
  for (let i = 0; i < state.data.length; i++) { if (state.data[i].date >= startDate) { si = i; break; } }
  const S0 = state.data[si].price;
  const dates = []; const dd = new Date(startDate);
  while (dd <= endDate) { dates.push(new Date(dd)); dd.setDate(dd.getDate()+7); }
  state.simDates = dates;
  const dt = 7/365;
  state.sims = Array.from({length: n}, () => {
    const path = [S0]; let S = S0;
    for (let t = 1; t < dates.length; t++) {
      S *= Math.exp((mu - 0.5*sigma*sigma)*dt + sigma*Math.sqrt(dt)*randn());
      S = Math.max(ABS_Y_MIN, Math.min(ABS_Y_MAX*2, S));
      path.push(S);
    }
    return path;
  });
  animateSims();
}
function randn() {
  let u=0, v=0;
  while (!u) u = Math.random();
  while (!v) v = Math.random();
  return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
}

// Rebuild offscreen sim canvas from scratch (after zoom/pan/resize)
function rebuildSimCanvas() {
  if (!state.sims.length) return;
  simCanvas.width  = canvas.width;
  simCanvas.height = canvas.height;
  simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
  simLastStep = 0;
  paintSimSegments(state.simDates.length - 1);
}

// ── Offscreen sim canvas ──
// We render simulations onto a persistent offscreen buffer, drawing only
// new segments each frame — never redrawing old ones. This gives perfectly
// smooth left-to-right reveal with zero flicker.
const simCanvas = document.createElement('canvas');
const simCtx    = simCanvas.getContext('2d');
let   simLastStep = -1;   // last step already painted onto simCanvas

function initSimCanvas() {
  simCanvas.width  = canvas.width;
  simCanvas.height = canvas.height;
  simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
  simLastStep = 0;  // step 0 = just the start dot, painted on first frame
}

// Paint segments from (simLastStep) → toStep onto simCanvas
function paintSimSegments(toStep) {
  if (!state.sims.length || toStep <= simLastStep) return;
  const W  = simCanvas.width, H  = simCanvas.height;
  const dpr = devicePixelRatio;
  const { padT, padB, padL, padR } = getPad(dpr);
  const n     = state.sims.length;
  const alpha = Math.max(0.08, Math.min(0.9, 18 / n));

  simCtx.save();
  simCtx.beginPath();
  simCtx.rect(padL, padT, W - padL - padR, H - padT - padB);
  simCtx.clip();
  simCtx.lineWidth   = 0.9 * dpr;
  simCtx.lineJoin    = 'round';
  simCtx.lineCap     = 'round';
  simCtx.strokeStyle = `rgba(247,147,26,${alpha})`;

  const fromStep = simLastStep;
  state.sims.forEach(path => {
    if (fromStep >= path.length) return;
    const start = Math.max(0, fromStep);
    const end   = Math.min(toStep, path.length - 1);
    simCtx.beginPath();
    // Move to the last already-drawn point so segment connects cleanly
    const x0 = timeToX(state.simDates[start].getTime(), W, padL, padR);
    const y0 = priceToY(path[start], H, padT, padB);
    simCtx.moveTo(x0, y0);
    for (let i = start + 1; i <= end; i++) {
      const x = timeToX(state.simDates[i].getTime(), W, padL, padR);
      const y = priceToY(path[i], H, padT, padB);
      simCtx.lineTo(x, y);
    }
    simCtx.stroke();
  });

  simCtx.restore();
  simLastStep = toStep;
}

// Called from drawAll — just blit the offscreen buffer
function drawSimulations() {
  ctx.drawImage(simCanvas, 0, 0);
}

function animateSims() {
  if (state.animFrame) cancelAnimationFrame(state.animFrame);
  initSimCanvas();
  const totalSteps = state.simDates.length - 1;
  state.animStart  = null;

  function step(ts) {
    if (!state.animStart) state.animStart = ts;
    const elapsed  = ts - state.animStart;
    const p        = Math.min(1, elapsed / state.animDuration);
    // Linear progress for the x-reveal, so the front moves at constant speed
    const toStep   = Math.floor(p * totalSteps);

    // Paint only new segments onto offscreen buffer
    paintSimSegments(toStep);

    // Composite: background + offscreen sims + price line + axes
    drawAll();

    if (p < 1) state.animFrame = requestAnimationFrame(step);
  }
  state.animFrame = requestAnimationFrame(step);
}

// ── Backtested param update ──
function applyBacktestedParams(dateStr) {
  const bt = getBtParams(dateStr);
  if (!bt) return;
  const sigma = Math.max(0.1, Math.min(3.5, bt.sigma));
  const mu    = Math.max(-2.0, Math.min(15.0, bt.mu));
  document.getElementById('vol').value   = sigma;
  document.getElementById('vol-val').textContent = sigma.toFixed(2);
  document.getElementById('drift').value = mu;
  document.getElementById('drift-val').textContent = mu.toFixed(2);
  document.getElementById('bt-sigma-badge').style.display = 'inline';
  document.getElementById('bt-mu-badge').style.display   = 'inline';
}

// ── Mouse proximity to price line ──
// Returns nearest data point if within threshold pixels, else null
function nearestOnPriceLine(ex, ey) {
  if (!state.data.length) return null;
  const dpr = devicePixelRatio;
  const { padT, padB, padL, padR } = getPad(dpr);
  const W = canvas.width, H = canvas.height;
  const cx = ex * dpr, cy = ey * dpr;
  const THRESH = 12 * dpr;
  let best = null, bestDist = THRESH;
  state.data.forEach(pt => {
    const px = timeToX(pt.date.getTime(), W, padL, padR);
    const py = priceToY(pt.price, H, padT, padB);
    const dist = Math.sqrt((cx-px)**2 + (cy-py)**2);
    if (dist < bestDist) { bestDist = dist; best = pt; }
  });
  return best;
}

// ── Mouse interaction ──
let drag = null;
let lastMoveEvent = null;
let dblClickPending = false;

function getZone(ex, ey) {
  const dpr = devicePixelRatio, { padT, padB, padL, padR } = getPad(dpr);
  const W = canvas.width, H = canvas.height, cx = ex*dpr, cy = ey*dpr;
  if (cx < padL && cy >= padT && cy <= H-padB) return 'yaxis';
  if (cy > H-padB && cx >= padL && cx <= W-padR) return 'xaxis';
  if (cx >= padL && cx <= W-padR && cy >= padT && cy <= H-padB) return 'chart';
  return 'outside';
}

canvas.addEventListener('mousedown', e => {
  const zone = getZone(e.offsetX, e.offsetY);
  if (zone === 'outside') return;
  drag = { startX: e.clientX, startY: e.clientY, xMin0: view.xMin, xMax0: view.xMax, yMin0: view.yMin, yMax0: view.yMax, zone, moved: false };
  canvas.style.cursor = zone==='yaxis' ? 'ns-resize' : zone==='xaxis' ? 'ew-resize' : 'grabbing';
});

window.addEventListener('mousemove', e => {
  lastMoveEvent = e;
  if (!drag) {
    const zone = getZone(e.offsetX, e.offsetY);
    // Check proximity to price line for special cursor
    const near = nearestOnPriceLine(e.offsetX, e.offsetY);
    if (near) canvas.style.cursor = 'crosshair';
    else canvas.style.cursor = zone==='yaxis' ? 'ns-resize' : zone==='xaxis' ? 'ew-resize' : zone==='chart' ? 'crosshair' : 'default';
    showTooltip(e);
    return;
  }
  const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) drag.moved = true;
  const dpr = devicePixelRatio, { padT, padB, padL, padR } = getPad(dpr);
  const W = canvas.width, H = canvas.height, usW = W-padL-padR, usH = H-padT-padB;
  if (drag.zone === 'chart') {
    const xSh = -(dx*dpr/usW)*(drag.xMax0-drag.xMin0), ySh = (dy*dpr/usH)*(drag.yMax0-drag.yMin0);
    view.xMin = drag.xMin0+xSh; view.xMax = drag.xMax0+xSh;
    view.yMin = drag.yMin0+ySh; view.yMax = drag.yMax0+ySh;
  } else if (drag.zone === 'yaxis') {
    const f = Math.max(0.05, Math.min(20, 1+(dy*dpr/usH)*2.5));
    const c = (drag.yMin0+drag.yMax0)/2, h = ((drag.yMax0-drag.yMin0)/2)*f;
    view.yMin = c-h; view.yMax = c+h;
  } else if (drag.zone === 'xaxis') {
    const f = Math.max(0.05, Math.min(20, 1-(dx*dpr/usW)*2.5));
    const c = (drag.xMin0+drag.xMax0)/2, h = ((drag.xMax0-drag.xMin0)/2)*f;
    view.xMin = c-h; view.xMax = c+h;
  }
  clampView(); rebuildSimCanvas(); drawAll();
});

window.addEventListener('mouseup', () => { drag = null; canvas.style.cursor = 'crosshair'; });

// Dblclick: if near price line → set sim start date + auto-run; else reset view
canvas.addEventListener('dblclick', e => {
  const near = nearestOnPriceLine(e.offsetX, e.offsetY);
  if (near) {
    const dateStr = formatDateShort(near.date);
    document.getElementById('start-date').value = dateStr;
    applyBacktestedParams(dateStr);
    drawAll();
    if (!document.getElementById('run-btn').disabled) runSimulations();
  } else {
    resetView();
  }
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const dpr = devicePixelRatio, { padT, padB, padL, padR } = getPad(dpr);
  const W = canvas.width, H = canvas.height;
  const zone = getZone(e.offsetX, e.offsetY);
  const factor = e.deltaY < 0 ? 0.82 : 1/0.82;
  if (zone==='yaxis' || (zone==='chart' && e.shiftKey)) {
    const pl = yToLog(e.offsetY*dpr, H, padT, padB);
    view.yMin = pl-(pl-view.yMin)*factor; view.yMax = pl+(view.yMax-pl)*factor;
  } else if (zone==='xaxis' || zone==='chart') {
    const pm = xToTime(e.offsetX*dpr, W, padL, padR);
    view.xMin = pm-(pm-view.xMin)*factor; view.xMax = pm+(view.xMax-pm)*factor;
  }
  clampView(); rebuildSimCanvas(); drawAll();
}, { passive: false });

function clampView() {
  if (view.yMax-view.yMin < 0.15) { const c=(view.yMin+view.yMax)/2; view.yMin=c-0.075; view.yMax=c+0.075; }
  if (view.xMax-view.xMin < 86400000) { const c=(view.xMin+view.xMax)/2; view.xMin=c-43200000; view.xMax=c+43200000; }
}

// Touch
let lastTD = null;
canvas.addEventListener('touchstart', e => { if (e.touches.length===2) lastTD = tDist(e); }, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length===2 && lastTD) {
    const dist=tDist(e), mid=tMid(e), factor=lastTD/dist;
    const dpr=devicePixelRatio, {padT,padB,padL,padR}=getPad(dpr), W=canvas.width, H=canvas.height;
    const pm=xToTime(mid.x*dpr,W,padL,padR), pl=yToLog(mid.y*dpr,H,padT,padB);
    view.xMin=pm-(pm-view.xMin)*factor; view.xMax=pm+(view.xMax-pm)*factor;
    view.yMin=pl-(pl-view.yMin)*factor; view.yMax=pl+(view.yMax-pl)*factor;
    lastTD=dist; clampView(); rebuildSimCanvas(); drawAll();
  }
}, { passive: true });
canvas.addEventListener('touchend', () => { lastTD = null; });
function tDist(e) { const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY; return Math.sqrt(dx*dx+dy*dy); }
function tMid(e) { return { x:(e.touches[0].clientX+e.touches[1].clientX)/2, y:(e.touches[0].clientY+e.touches[1].clientY)/2 }; }

// Tooltip
const tooltip = document.getElementById('tooltip');
let hTout = null;
function showTooltip(e) {
  if (!state.data.length) return;
  clearTimeout(hTout);
  hTout = setTimeout(() => {
    const zone = getZone(e.offsetX, e.offsetY);
    if (zone !== 'chart') { tooltip.style.display = 'none'; return; }
    const dpr=devicePixelRatio, {padL,padR}=getPad(dpr), W=canvas.width;
    const hMs = xToTime(e.offsetX*dpr, W, padL, padR);
    let near=state.data[0], md=Infinity;
    state.data.forEach(pt => { const d=Math.abs(pt.date.getTime()-hMs); if(d<md){md=d;near=pt;} });
    tooltip.innerHTML = `<b>${formatDateShort(near.date)}</b><br>${formatPrice(near.price)}`;
    tooltip.style.display = 'block';
    tooltip.style.left = Math.min(e.clientX+14, window.innerWidth-160) + 'px';
    tooltip.style.top  = Math.max(e.clientY-44, 8) + 'px';
  }, 12);
}
canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

// Panel toggle
let panelOpen = true;
function togglePanel() {
  panelOpen = !panelOpen;
  document.getElementById('panel-body').classList.toggle('collapsed', !panelOpen);
  document.getElementById('panel-toggle-icon').classList.toggle('open', panelOpen);
}

// UI bindings

document.getElementById('start-date').addEventListener('change', () => {
  const v = document.getElementById('start-date').value;
  if (v) applyBacktestedParams(v);
  drawAll();
});

function bindSlider(id, dispId, dec) {
  document.getElementById(id).addEventListener('input', function() {
    document.getElementById(dispId).textContent = parseFloat(this.value).toFixed(dec);
    if (id==='vol')   document.getElementById('bt-sigma-badge').style.display = 'none';
    if (id==='drift') document.getElementById('bt-mu-badge').style.display   = 'none';
  });
}
bindSlider('sim-count', 'sim-val',   0);
bindSlider('vol',       'vol-val',   2);
bindSlider('drift',     'drift-val', 2);

document.getElementById('run-btn').addEventListener('click', () => { if (state.data.length) runSimulations(); });
document.getElementById('reset-btn').addEventListener('click', () => {
  state.sims = []; state.simDates = [];
  if (state.animFrame) cancelAnimationFrame(state.animFrame);
  drawAll();
});
document.getElementById('reset-view').addEventListener('click', () => resetView());

const toggleBtn = document.getElementById('toggle-panel');
let mobVisible = true;
toggleBtn.addEventListener('click', () => {
  mobVisible = !mobVisible;
  document.getElementById('panel').style.display = mobVisible ? 'block' : 'none';
});

// Spacebar → run simulation
window.addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON') return;
  e.preventDefault();
  if (!document.getElementById('run-btn').disabled) runSimulations();
});

// ── Hidden show sequence ──
// Activate by typing: S H O W  (4 letters in succession, no modifier keys)
const SHOW_KEY_SEQ = ['s','h','o','w'];
let showKeyBuf = [];
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  showKeyBuf.push(e.key.toLowerCase());
  if (showKeyBuf.length > SHOW_KEY_SEQ.length) showKeyBuf.shift();
  if (showKeyBuf.join('') === SHOW_KEY_SEQ.join('')) {
    showKeyBuf = [];
    startShowSequence();
  }
});

const SHOW_DATES = ['2015-08-10', '2019-04-01', '2023-01-02'];
let showSeqTimer = null;
let showSeqRunning = false;

// STOP sequence
const STOP_KEY_SEQ = ['s','t','o','p'];
let stopKeyBuf = [];
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  stopKeyBuf.push(e.key.toLowerCase());
  if (stopKeyBuf.length > STOP_KEY_SEQ.length) stopKeyBuf.shift();
  if (stopKeyBuf.join('') === STOP_KEY_SEQ.join('')) {
    stopKeyBuf = [];
    stopShowSequence();
  }
});

function stopShowSequence() {
  showSeqRunning = false;
  if (showSeqTimer) { clearTimeout(showSeqTimer); showSeqTimer = null; }
}

// Random future date: between 2015-08-10 and 2026-04-01,
// but at least 1 year away from the previously used date
const SEQ_EARLIEST = new Date('2015-08-10').getTime();
const SEQ_LATEST   = new Date('2026-04-01').getTime();
const SEQ_MIN_GAP  = 365 * 24 * 60 * 60 * 1000; // 1 year in ms
let lastSeqDateMs  = null;

function randomFutureDate() {
  // Build candidate pool: all months in range, excluding ±1yr around lastSeqDateMs
  let attempts = 0;
  while (attempts < 200) {
    const ms = SEQ_EARLIEST + Math.random() * (SEQ_LATEST - SEQ_EARLIEST);
    if (lastSeqDateMs === null || Math.abs(ms - lastSeqDateMs) >= SEQ_MIN_GAP) {
      lastSeqDateMs = ms;
      const d = new Date(ms);
      return d.getFullYear() + '-'
        + String(d.getMonth()+1).padStart(2,'0') + '-'
        + String(d.getDate()).padStart(2,'0');
    }
    attempts++;
  }
  // Fallback: just pick from the opposite half of the range
  const mid = (SEQ_EARLIEST + SEQ_LATEST) / 2;
  const ms  = lastSeqDateMs < mid
    ? mid + Math.random() * (SEQ_LATEST - mid)
    : SEQ_EARLIEST + Math.random() * (mid - SEQ_EARLIEST);
  lastSeqDateMs = ms;
  const d = new Date(ms);
  return d.getFullYear() + '-'
    + String(d.getMonth()+1).padStart(2,'0') + '-'
    + String(d.getDate()).padStart(2,'0');
}

function startShowSequence() {
  if (showSeqTimer) clearTimeout(showSeqTimer);
  if (state.animFrame) cancelAnimationFrame(state.animFrame);
  state.sims = []; state.simDates = [];
  rebuildSimCanvas();
  showSeqRunning = true;
  stopKeyBuf = [];
  lastSeqDateMs = null;

  const SIM_DURATION  = state.animDuration;  // 3000 ms
  const PAUSE_BETWEEN = 1200;
  const TOTAL_STEP    = SIM_DURATION + PAUSE_BETWEEN;

  // Fixed dates first, then infinite random future
  const fixedDates = [...SHOW_DATES];
  let step = 0;

  function runStep() {
    if (!showSeqRunning) return;

    const dateStr = step < fixedDates.length
      ? fixedDates[step]
      : randomFutureDate();

    document.getElementById('start-date').value = dateStr;
    applyBacktestedParams(dateStr);
    state.sims = []; state.simDates = [];
    rebuildSimCanvas();
    runSimulations();

    step++;
    showSeqTimer = setTimeout(runStep, TOTAL_STEP);
  }

  runStep();
}

initData();
resetView(); resize();
</script>
