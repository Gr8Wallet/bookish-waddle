<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC Power Law · Multiplier Bands</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden;
  font-family: 'Arial Black','Arial Bold',Arial,sans-serif; }
#canvas { display: block; position: fixed; top: 0; left: 0; }

#tooltip {
  position: fixed; display: none; pointer-events: none;
  background: rgba(8,8,8,0.93); border: 1px solid rgba(255,255,255,0.13);
  border-radius: 4px; backdrop-filter: blur(8px);
  padding: 9px 13px; font-family: 'Arial Black','Arial Bold',Arial,sans-serif;
  font-size: 11px; color: #fff; z-index: 100; min-width: 170px; line-height: 1.75;
}
#tooltip .tt-date  { color: #f7931a; font-weight: 900; font-size: 12px; }
#tooltip .tt-price { color: #fff; }
#tooltip .tt-mult  { color: rgba(255,180,50,0.85); font-size: 10px; }
#tooltip .tt-band  { color: rgba(255,255,255,0.45); font-size: 10px; }

#panel {
  position: fixed; top: 14px; right: 14px; width: 252px;
  background: rgba(10,10,10,0.90); border: 1px solid rgba(255,255,255,0.10);
  border-radius: 7px; backdrop-filter: blur(16px); z-index: 50; overflow: hidden;
}
#panel-header { padding: 10px 14px; cursor: pointer; display: flex; align-items: center;
  justify-content: space-between; user-select: none; }
#panel-title { color: #f7931a; font-size: 11px; letter-spacing: 0.16em;
  text-transform: uppercase; font-weight: 900; }
#panel-arrow { color: rgba(255,255,255,0.35); font-size: 10px; transition: transform .25s; }
#panel-arrow.open { transform: rotate(180deg); }
#panel-body { padding: 2px 14px 14px; }

.section-sep { height: 1px; background: rgba(255,255,255,0.07); margin: 10px 0; }
.section-label { color: rgba(255,255,255,0.22); font-size: 8px; letter-spacing: 0.14em;
  text-transform: uppercase; margin-bottom: 6px; }

/* Band rows */
#band-rows { display: flex; flex-direction: column; gap: 3px; }
.band-row {
  display: grid; grid-template-columns: 10px 1fr 50px 42px;
  align-items: center; gap: 6px; padding: 4px 6px; border-radius: 4px;
  cursor: pointer; transition: background .15s;
}
.band-row:hover { background: rgba(255,255,255,0.04); }
.band-row.hidden-band { opacity: 0.28; }
.band-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.band-label { color: rgba(255,255,255,0.75); font-size: 9.5px; white-space: nowrap; overflow: hidden; }
.band-days  { color: rgba(255,255,255,0.4); font-size: 8.5px; text-align: right; }
.band-pct   { color: #f7931a; font-size: 9px; font-weight: 900; text-align: right; }

/* Multiplier editor */
#mult-editor { margin-top: 8px; }
.mult-row { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
.mult-row label { color: rgba(255,255,255,0.35); font-size: 9px; width: 58px; flex-shrink: 0; }
.mult-input {
  flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  color: #fff; font-family: 'Arial Black','Arial Bold',Arial,sans-serif;
  font-size: 10px; padding: 3px 6px; border-radius: 3px; text-align: right;
  outline: none; transition: border-color .15s;
}
.mult-input:focus { border-color: #f7931a; }

.p-check-row { display: flex; align-items: center; gap: 7px; margin-top: 8px; cursor: pointer; user-select: none; }
.p-check-row input { accent-color: #f7931a; cursor: pointer; }
.p-check-label { color: rgba(255,255,255,0.45); font-size: 9px; letter-spacing: .07em; text-transform: uppercase; }

.p-row { margin-top: 8px; }
.p-label { color: rgba(255,255,255,0.35); font-size: 9px; letter-spacing: .07em;
  text-transform: uppercase; margin-bottom: 3px; }
.p-slider { width: 100%; accent-color: #f7931a; cursor: pointer; }
.p-val { color: rgba(255,255,255,0.55); font-size: 9px; float: right; }

.btn-row { display: flex; gap: 6px; margin-top: 10px; }
.btn-primary { flex: 1; background: #f7931a; color: #000; font-weight: 900;
  font-family: 'Arial Black','Arial Bold',Arial,sans-serif; font-size: 10px;
  border: none; border-radius: 4px; padding: 7px 0; cursor: pointer;
  letter-spacing: .05em; transition: background .15s; }
.btn-primary:hover { background: #ffaa33; }
.btn-secondary { flex: 1; background: transparent; color: rgba(255,255,255,0.55);
  font-family: 'Arial Black','Arial Bold',Arial,sans-serif; font-size: 10px;
  border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 7px 0;
  cursor: pointer; letter-spacing: .05em; transition: background .15s, border-color .15s; }
.btn-secondary:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }

#hint { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
  font-size: 10px; color: rgba(255,255,255,0.2); pointer-events: none;
  font-family: 'Arial Black','Arial Bold',Arial,sans-serif; letter-spacing: .04em;
  white-space: nowrap; z-index: 40; }
#resetbtn { position: fixed; bottom: 14px; right: 14px;
  background: rgba(10,10,10,0.8); border: 1px solid rgba(255,255,255,0.09);
  color: rgba(255,255,255,0.5); font-family: 'Arial Black','Arial Bold',Arial,sans-serif;
  font-size: 10px; border-radius: 5px; padding: 6px 12px; cursor: pointer;
  z-index: 50; transition: background .15s, color .15s; }
#resetbtn:hover { background: rgba(28,28,28,0.9); color: #fff; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="tooltip">
  <div class="tt-date"  id="tt-date"></div>
  <div class="tt-price" id="tt-price"></div>
  <div class="tt-mult"  id="tt-mult"></div>
  <div class="tt-band"  id="tt-band"></div>
</div>

<div id="panel">
  <div id="panel-header">
    <span id="panel-title">⚡ Power Law Bands</span>
    <span id="panel-arrow" class="open">▲</span>
  </div>
  <div id="panel-body">

    <div class="section-label">Band Statistics (click to toggle)</div>
    <div id="band-rows"></div>

    <div class="section-sep"></div>
    <div class="section-label">Band Multipliers (× Regression)</div>
    <div id="mult-editor"></div>

    <div class="section-sep"></div>

    <div class="p-row">
      <div class="p-label">Fill Opacity <span class="p-val" id="val-opacity">1.0</span></div>
      <input type="range" class="p-slider" id="sl-opacity" min="0.2" max="2.0" value="1.0" step="0.05">
    </div>

    <div class="p-check-row">
      <input type="checkbox" id="chk-reg" checked>
      <label class="p-check-label" for="chk-reg">Regression Line</label>
    </div>
    <div class="p-check-row">
      <input type="checkbox" id="chk-price" checked>
      <label class="p-check-label" for="chk-price">Price Line</label>
    </div>

    <div class="btn-row">
      <button class="btn-primary"   id="btn-apply">Apply</button>
      <button class="btn-secondary" id="btn-reset-view">Reset View</button>
    </div>
  </div>
</div>

<div id="hint">Scroll: Zoom X · Shift+Scroll: Zoom Y · Drag: Pan · Y-axis: Stretch Y · Dbl-click: Reset · <span style="color:rgba(247,147,26,0.5)">S → T: Animate</span></div>
<button id="resetbtn">↺ Reset</button>

<!-- Cinematic overlay -->
<div id="cinematic" style="display:none; position:fixed; inset:0; pointer-events:none; z-index:200; font-family:'Arial Black','Arial Bold',Arial,sans-serif;">
  <!-- Text card: fixed top-left, max 44vw wide so right half of chart stays clear -->
  <div id="cin-act" style="position:absolute; top:38px; left:0; width:44vw; display:flex; flex-direction:column; align-items:flex-start; padding: 0 0 0 7vw; opacity:0;">
    <div id="cin-eyebrow" style="color:#f7931a; font-size:clamp(9px,1vw,12px); letter-spacing:0.22em; text-transform:uppercase; margin-bottom:10px; opacity:0.85;"></div>
    <div id="cin-headline" style="color:#ffffff; font-size:clamp(18px,2.8vw,42px); font-weight:900; line-height:1.13; text-shadow:0 0 60px rgba(0,0,0,0.9),0 2px 20px rgba(0,0,0,1);"></div>
    <div id="cin-sub" style="color:rgba(255,255,255,0.5); font-size:clamp(10px,1vw,14px); margin-top:13px; font-weight:400; line-height:1.6; font-family:Arial,sans-serif;"></div>
    <div id="cin-tag" style="margin-top:16px; padding:4px 12px; border:1px solid rgba(247,147,26,0.3); border-radius:3px; color:#f7931a; font-size:clamp(8px,0.75vw,10px); letter-spacing:0.18em; text-transform:uppercase; opacity:0.7;"></div>
  </div>
  <!-- Ticker bar: always bottom-right, avoids x-axis label area (58px) -->
  <div id="cin-bar" style="position:absolute; bottom:62px; right:0; width:58vw; border-top:1px solid rgba(247,147,26,0.15); border-left:1px solid rgba(247,147,26,0.08); background:rgba(0,0,0,0.7); backdrop-filter:blur(10px); padding:7px 20px 7px 16px; display:flex; align-items:center; gap:20px; opacity:0; border-radius:2px 0 0 0;">
    <span style="color:#f7931a; font-size:8px; letter-spacing:0.22em; text-transform:uppercase; flex-shrink:0; border:1px solid rgba(247,147,26,0.45); padding:2px 6px; border-radius:2px;">BREAKING</span>
    <span id="cin-ticker" style="color:rgba(255,255,255,0.6); font-size:10px; letter-spacing:0.04em; font-family:Arial,sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></span>
  </div>
  <div style="position:absolute; bottom:0; left:0; right:0; height:2px; background:rgba(255,255,255,0.04);">
    <div id="cin-progress" style="height:100%; width:0%; background:linear-gradient(90deg,rgba(247,147,26,0.5),#f7931a);"></div>
  </div>
</div>

// ─── POWER LAW (genesis-block origin, Jan 3 2009) ────────────────────────────
const GENESIS_MS = 1230940800000;
const PL_A = -17.469586;   // log10(price) = PL_A + PL_B * log10(days_since_genesis)
const PL_B = 5.959364;
const MS_DAY = 86400000;

function toDays(ts)  { return (ts - GENESIS_MS) / MS_DAY + 1; }
function plPrice(ts) {
  const d = toDays(ts);
  return d > 0 ? Math.pow(10, PL_A + PL_B * Math.log10(d)) : NaN;
}
// Multiplier: actual price / regression price
function multiplier(ts, price) {
  const base = plPrice(ts);
  return base > 0 ? price / base : NaN;
}

const DATA = RAW_DATA;
const N_DATA = DATA.length;

// Pre-compute multipliers for all data points
const DATA_MULTS = DATA.map(([ts, p]) => multiplier(ts, p));

// ─── CANVAS ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
let dpr = devicePixelRatio || 1, W, H;

function resize() {
  dpr = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width  = W * dpr; canvas.height = H * dpr;
  canvas.style.width  = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();

// ─── LAYOUT ───────────────────────────────────────────────────────────────────
const PL = 92, PB = 58, PT = 28, PR = 14;
const cL = () => PL;
const cT = () => PT;
const cR = () => W - PR;
const cB = () => H - PB;
const cW = () => cR() - cL();
const cH = () => cB() - cT();

// ─── VIEW ─────────────────────────────────────────────────────────────────────
const LOG_Y_MIN = Math.log10(0.0001), LOG_Y_MAX = Math.log10(10_000_000);
const T_MIN = DATA[0][0], T_MAX = DATA[N_DATA-1][0];
let view = {};

function resetView() {
  const m = (T_MAX - T_MIN) * 0.03;
  view.xMin = T_MIN - m; view.xMax = T_MAX + m;
  view.logYMin = LOG_Y_MIN; view.logYMax = LOG_Y_MAX;
}
resetView();

// ─── TRANSFORMS ───────────────────────────────────────────────────────────────
const xToC  = ts   => cL() + (ts - view.xMin) / (view.xMax - view.xMin) * cW();
const yToC  = p    => p > 0 ? cB() - (Math.log10(p) - view.logYMin) / (view.logYMax - view.logYMin) * cH() : cB() + 99;
const cToX  = cx   => view.xMin + (cx - cL()) / cW() * (view.xMax - view.xMin);
const cToLY = cy   => view.logYMin + (cB() - cy) / cH() * (view.logYMax - view.logYMin);

// ─── BAND STATE ───────────────────────────────────────────────────────────────
// Default multiplier boundaries — user-editable
let multBorders = [0.5, 0.7, 1.0, 1.5, 2.0, 3.0];
let opacityScale  = 1.0;
let showReg       = true;
let showPrice     = true;
let bandVisible   = [];   // filled when bands computed

function computeBands() {
  const borders = multBorders;
  const nb = borders.length - 1;  // number of bands between borders
  // extend with "below" and "above" zones
  const zones = [];

  // below first border
  const cntBelow = DATA_MULTS.filter(m => m < borders[0]).length;
  zones.push({ lo: null, hi: borders[0], days: cntBelow, pct: cntBelow / N_DATA, isOuter: true });

  // inner bands
  for (let i = 0; i < nb; i++) {
    const lo = borders[i], hi = borders[i+1];
    const cnt = DATA_MULTS.filter(m => m >= lo && m < hi).length;
    zones.push({ lo, hi, days: cnt, pct: cnt / N_DATA, isOuter: false });
  }

  // above last border
  const cntAbove = DATA_MULTS.filter(m => m >= borders[borders.length-1]).length;
  zones.push({ lo: borders[borders.length-1], hi: null, days: cntAbove, pct: cntAbove / N_DATA, isOuter: true });

  return zones;
}

// ─── COLORS ───────────────────────────────────────────────────────────────────
// Zones: outer-below(dark), inner bands(orange gradient), outer-above(bright)
function zoneColor(idx, total, alpha) {
  if (idx === 0)          return `rgba(80,40,0,${alpha})`;           // below: dark brown
  if (idx === total - 1)  return `rgba(255,220,50,${alpha})`;        // above: yellow/hot
  const t = (idx - 1) / Math.max(total - 3, 1);
  const r = Math.round(150 + 105 * t);
  const g = Math.round(45  +  95 * t);
  return `rgba(${r},${g},0,${alpha})`;
}
function zoneBorderColor(idx, total) {
  if (idx === 0)          return [80,  40,  0];
  if (idx >= total - 1)   return [255, 220, 50];
  const t = idx / Math.max(total - 1, 1);
  return [Math.round(160 + 95*t), Math.round(50 + 90*t), 0];
}

// ─── DRAW ─────────────────────────────────────────────────────────────────────
function formatYLabel(p) {
  if (p < 0.01) return p.toFixed(4);
  if (p < 1)    return p.toFixed(2);
  if (p < 1000) return Math.round(p).toString();
  if (p < 1e6)  return Math.round(p/1000) + 'k';
  return (p/1e6).toFixed(0) + 'M';
}

function drawAxes() {
  // Y
  ctx.font = 'bold 13px Arial';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  [0.0001,0.001,0.01,0.1,1,10,100,1000,10000,100000,1000000,10000000].forEach(p => {
    const ly = Math.log10(p);
    if (ly < view.logYMin || ly > view.logYMax) return;
    const cy = yToC(p);
    if (cy < cT() || cy > cB()) return;
    ctx.fillStyle = '#fff';
    ctx.fillText(formatYLabel(p), cL() - 8, cy);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cL()-5, cy); ctx.lineTo(cL(), cy); ctx.stroke();
  });

  // X
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const span = view.xMax - view.xMin;
  const YEAR = 365.25 * MS_DAY;
  let interval, fmt;
  if (span < 90 * MS_DAY) {
    interval = 7 * MS_DAY;
    fmt = t => { const d=new Date(t); return `${d.getDate()}.${d.getMonth()+1}`; };
  } else if (span < 400 * MS_DAY) {
    interval = YEAR / 12;
    fmt = t => { const d=new Date(t); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+String(d.getFullYear()).slice(2); };
  } else if (span < 1500 * MS_DAY) {
    interval = YEAR / 4;
    fmt = t => { const d=new Date(t); return `Q${Math.floor(d.getMonth()/3)+1}'${String(d.getFullYear()).slice(2)}`; };
  } else {
    interval = YEAR;
    fmt = t => String(new Date(t).getFullYear());
  }
  let t0 = Math.ceil(view.xMin / interval) * interval, prevX = -Infinity;
  for (let t = t0; t <= view.xMax; t += interval) {
    const cx = xToC(t);
    if (cx < cL() || cx > cR() || cx - prevX < 50) continue;
    prevX = cx;
    ctx.fillStyle = '#fff';
    ctx.fillText(fmt(t), cx, cB() + 8);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, cB()); ctx.lineTo(cx, cB()+5); ctx.stroke();
  }

  // Axis lines
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cL(),cT()); ctx.lineTo(cL(),cB()); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cL(),cB()); ctx.lineTo(cR(),cB()); ctx.stroke();
}

function buildCurvePts(mult, nPts) {
  const pts = [];
  for (let i = 0; i <= nPts; i++) {
    const cx = cL() + (i / nPts) * cW();
    const ts = cToX(cx);
    const d  = toDays(ts);
    if (d <= 0) { pts.push(null); continue; }
    pts.push({ cx, cy: yToC(Math.pow(10, PL_A + PL_B * Math.log10(d)) * mult) });
  }
  return pts;
}

function ptsToPath(pts) {
  const p = new Path2D(); let s = false;
  for (const pt of pts) {
    if (!pt) { s = false; continue; }
    if (!s) { p.moveTo(pt.cx, pt.cy); s = true; } else p.lineTo(pt.cx, pt.cy);
  }
  return p;
}

function drawBands(zones) {
  const N = Math.min(500, Math.round(cW()));
  // Build curves for all zone borders (lo-mult of each zone, plus final hi)
  const borderMults = [];
  for (const z of zones) {
    if (z.lo !== null) borderMults.push(z.lo);
  }
  // hi of last zone
  borderMults.push(zones[zones.length-1].hi !== null
    ? zones[zones.length-1].hi
    : zones[zones.length-1].lo * 8); // outer top: draw high
  // prepend bottom of first outer zone
  const allMults = [zones[0].hi !== null ? zones[0].lo || 0.01 : 0.05, ...borderMults];

  // Actually: border curve for each zone edge
  // zones[0].hi = first inner border = multBorders[0]
  // We need: bottom edge = zones[0] lo → use tiny mult
  const curveMults = [];
  // below zone bottom  = multBorders[0] * 0.05 (floor)
  curveMults.push(Math.min(multBorders[0] * 0.12, 0.05));
  for (const b of multBorders) curveMults.push(b);
  // above zone top: multBorders[last] * 5 (ceiling)
  curveMults.push(multBorders[multBorders.length-1] * 5);

  const curves = curveMults.map(m => buildCurvePts(m, N));

  ctx.save();
  ctx.beginPath(); ctx.rect(cL(), cT(), cW(), cH()); ctx.clip();

  // Fill zones
  for (let zi = 0; zi < zones.length; zi++) {
    if (bandVisible[zi] === false) continue;
    const lower = curves[zi];
    const upper = curves[zi + 1];
    const alpha = zones[zi].isOuter
      ? Math.min(0.35, 0.08 + zones[zi].pct * opacityScale * 1.2)
      : Math.min(0.80, 0.06 + zones[zi].pct * opacityScale * 3.5);

    ctx.beginPath();
    let s = false;
    for (let i = 0; i <= N; i++) {
      const p = upper[i]; if (!p) continue;
      if (!s) { ctx.moveTo(p.cx, p.cy); s = true; } else ctx.lineTo(p.cx, p.cy);
    }
    for (let i = N; i >= 0; i--) {
      const p = lower[i]; if (!p) continue; ctx.lineTo(p.cx, p.cy);
    }
    ctx.closePath();
    const grad = ctx.createLinearGradient(cL(), 0, cR(), 0);
    grad.addColorStop(0, zoneColor(zi, zones.length, alpha * 0.6));
    grad.addColorStop(1, zoneColor(zi, zones.length, alpha));
    ctx.fillStyle = grad;
    ctx.fill();
  }

  // Glow on inner band borders (multBorders only, not outer edges)
  for (let bi = 0; bi < multBorders.length; bi++) {
    const path = ptsToPath(curves[bi + 1]); // +1 because curves[0] is floor
    const [r, g, b] = zoneBorderColor(bi, multBorders.length);
    const glows = [{w:8,a:.03},{w:4,a:.09},{w:2,a:.22},{w:1,a:.55},{w:.5,a:.85}];
    for (const gl of glows) {
      ctx.strokeStyle = `rgba(${r},${g},${b},${gl.a})`;
      ctx.lineWidth = gl.w;
      ctx.stroke(path);
    }
  }

  ctx.restore();
}

function drawRegressionLine() {
  if (!showReg) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(cL(), cT(), cW(), cH()); ctx.clip();
  const pts = buildCurvePts(1.0, 200);
  const path = ptsToPath(pts);
  ctx.setLineDash([7, 5]);
  [{w:10,a:.025},{w:5,a:.07},{w:2.5,a:.18},{w:1.2,a:.5},{w:.6,a:.9}].forEach(g => {
    ctx.strokeStyle = `rgba(255,255,255,${g.a})`;
    ctx.lineWidth = g.w;
    ctx.stroke(path);
  });
  ctx.setLineDash([]);
  ctx.restore();
}

function drawPriceLine() {
  if (!showPrice) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(cL(), cT(), cW(), cH()); ctx.clip();
  const path = new Path2D(); let s = false;
  for (const [ts, price] of DATA) {
    const cx = xToC(ts);
    if (cx < cL()-2 || cx > cR()+2) { s = false; continue; }
    const cy = yToC(price);
    if (!s) { path.moveTo(cx, cy); s = true; } else path.lineTo(cx, cy);
  }
  [{w:12,a:.05},{w:5,a:.17},{w:2,a:.52},{w:.9,a:1}].forEach(g => {
    ctx.strokeStyle = g.a === 1 ? '#fff' : `rgba(255,255,255,${g.a})`;
    ctx.lineWidth = g.w;
    ctx.stroke(path);
  });
  ctx.restore();
}

// ─── ANIMATION STATE ─────────────────────────────────────────────────────────
let anim = {
  running: false,
  startTime: 0,
  duration: 30000,       // ms total
  raf: null,
  // phase fractions (0-1) of total duration:
  //  0.00–0.55  bands reveal (left→right + fade in)
  //  0.40–0.75  regression line draws
  //  0.55–1.00  price line traces with glowing head
  BANDS_START:  0.00,
  BANDS_END:    0.60,
  REG_START:    0.38,
  REG_END:      0.72,
  PRICE_START:  0.52,
  PRICE_END:    1.00,
};

function easeInOut(t) {
  return t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
}
function easeOut(t) {
  return 1 - Math.pow(1-t, 2.5);
}
// local phase progress 0→1, clamped
function phaseP(t, start, end) {
  if (t <= start) return 0;
  if (t >= end)   return 1;
  return (t - start) / (end - start);
}

// Cinematic state
let cin = { active: false, lastActIdx: -1 };

function cinStart() {
  const el = document.getElementById('cinematic');
  el.style.display = 'block';
  cin.active = true;
  cin.lastActIdx = -1;
}

function cinStop() {
  const el = document.getElementById('cinematic');
  el.style.display = 'none';
  document.getElementById('cin-act').style.opacity = '0';
  document.getElementById('cin-bar').style.opacity = '0';
  cin.active = false;
  cin.lastActIdx = -1;
}

function cinUpdate(t) {
  if (!cin.active) return;

  // Progress bar
  document.getElementById('cin-progress').style.width = (t * 100) + '%';

  // Find active act
  let activeAct = null;
  for (const act of ACTS) {
    if (t >= act.t0 && t < act.t1) { activeAct = act; break; }
  }

  const actEl   = document.getElementById('cin-act');
  const barEl   = document.getElementById('cin-bar');

  if (!activeAct) {
    actEl.style.opacity = '0';
    barEl.style.opacity = '0';
    return;
  }

  // Detect act change → update content immediately
  const actIdx = ACTS.indexOf(activeAct);
  if (actIdx !== cin.lastActIdx) {
    cin.lastActIdx = actIdx;
    document.getElementById('cin-eyebrow').innerHTML  = activeAct.eyebrow;
    document.getElementById('cin-headline').innerHTML = activeAct.headline.replace(/\n/g,'<br>');
    document.getElementById('cin-sub').innerHTML      = activeAct.sub.replace(/\n/g,'<br>');
    document.getElementById('cin-tag').textContent    = activeAct.tag;
    document.getElementById('cin-ticker').textContent = activeAct.ticker;
  }

  // Compute act-local opacity envelope
  const span   = activeAct.t1 - activeAct.t0;
  const fi_end = activeAct.fadein  - activeAct.t0;  // relative: how far into act fade-in ends
  const fo_start = activeAct.fadeout - activeAct.t0; // relative: when fade-out starts
  const tRel = t - activeAct.t0;

  let opacity = 0;
  if (tRel < fi_end) {
    opacity = tRel / Math.max(fi_end, 0.001);
  } else if (tRel > fo_start) {
    opacity = 1 - (tRel - fo_start) / Math.max(span - fo_start, 0.001);
  } else {
    opacity = 1;
  }
  opacity = Math.max(0, Math.min(1, opacity));

  actEl.style.opacity = opacity;
  barEl.style.opacity = Math.min(1, opacity * 1.5);
}

function startAnimation() {
  if (anim.raf) cancelAnimationFrame(anim.raf);
  anim.running  = true;
  anim.startTime = performance.now();
  cinStart();
  animFrame();
}

function stopAnimation() {
  anim.running = false;
  if (anim.raf) { cancelAnimationFrame(anim.raf); anim.raf = null; }
  cinStop();
  draw();
}

function animFrame() {
  if (!anim.running) return;
  const elapsed = performance.now() - anim.startTime;
  const t = Math.min(elapsed / anim.duration, 1);

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  const zones = computeBands();
  while (bandVisible.length < zones.length) bandVisible.push(true);
  bandVisible.length = zones.length;

  // ── Phase 1: Bands reveal ─────────────────────────────────────────────────
  const bandP   = easeInOut(phaseP(t, anim.BANDS_START, anim.BANDS_END));
  const revealX = cL() + bandP * cW();   // left-to-right clip boundary
  const bandFade = Math.min(1, bandP * 2.2); // opacity fades in quickly

  drawBandsAnimated(zones, revealX, bandFade);

  // ── Phase 2: Regression line draws ───────────────────────────────────────
  const regP = easeOut(phaseP(t, anim.REG_START, anim.REG_END));
  if (regP > 0 && showReg) drawRegressionLineAnimated(regP);

  // ── Phase 3: Price line traces with glowing dot ───────────────────────────
  const priceP = easeInOut(phaseP(t, anim.PRICE_START, anim.PRICE_END));
  if (priceP > 0 && showPrice) drawPriceLineAnimated(priceP);

  drawAxes();
  cinUpdate(t);

  if (t < 1) {
    anim.raf = requestAnimationFrame(animFrame);
  } else {
    anim.running = false;
    anim.raf = null;
    cinStop();
    draw(); // final static draw
  }
}

// Animated band draw — clips to revealX, applies fade multiplier to alpha
function drawBandsAnimated(zones, revealX, fade) {
  const N = Math.min(500, Math.round(cW()));
  const curveMults = [];
  curveMults.push(Math.min(multBorders[0] * 0.12, 0.05));
  for (const b of multBorders) curveMults.push(b);
  curveMults.push(multBorders[multBorders.length-1] * 5);
  const curves = curveMults.map(m => buildCurvePts(m, N));

  ctx.save();
  ctx.beginPath();
  ctx.rect(cL(), cT(), revealX - cL(), cH());
  ctx.clip();

  for (let zi = 0; zi < zones.length; zi++) {
    if (bandVisible[zi] === false) continue;
    const lower = curves[zi], upper = curves[zi+1];
    const alpha = (zones[zi].isOuter
      ? Math.min(0.35, 0.08 + zones[zi].pct * opacityScale * 1.2)
      : Math.min(0.80, 0.06 + zones[zi].pct * opacityScale * 3.5)) * fade;

    ctx.beginPath();
    let s = false;
    for (let i = 0; i <= N; i++) {
      const p = upper[i]; if (!p) continue;
      if (!s) { ctx.moveTo(p.cx, p.cy); s = true; } else ctx.lineTo(p.cx, p.cy);
    }
    for (let i = N; i >= 0; i--) {
      const p = lower[i]; if (!p) continue; ctx.lineTo(p.cx, p.cy);
    }
    ctx.closePath();
    const grad = ctx.createLinearGradient(cL(), 0, cR(), 0);
    grad.addColorStop(0, zoneColor(zi, zones.length, alpha * 0.6));
    grad.addColorStop(1, zoneColor(zi, zones.length, alpha));
    ctx.fillStyle = grad; ctx.fill();
  }
  for (let bi = 0; bi < multBorders.length; bi++) {
    const path = ptsToPath(curves[bi+1]);
    const [r, g, b] = zoneBorderColor(bi, multBorders.length);
    [{w:8,a:.03*fade},{w:4,a:.09*fade},{w:2,a:.22*fade},{w:1,a:.55*fade},{w:.5,a:.85*fade}].forEach(gl => {
      ctx.strokeStyle = `rgba(${r},${g},${b},${gl.a})`;
      ctx.lineWidth = gl.w; ctx.stroke(path);
    });
  }
  ctx.restore();
}

// Animated regression line — draws from left, progress 0→1
function drawRegressionLineAnimated(progress) {
  ctx.save();
  const targetX = cL() + progress * cW();
  ctx.beginPath(); ctx.rect(cL(), cT(), targetX - cL(), cH()); ctx.clip();
  const pts = buildCurvePts(1.0, 200);
  const path = ptsToPath(pts);
  ctx.setLineDash([7, 5]);
  [{w:10,a:.025},{w:5,a:.07},{w:2.5,a:.18},{w:1.2,a:.5},{w:.6,a:.9}].forEach(g => {
    ctx.strokeStyle = `rgba(255,255,255,${g.a})`;
    ctx.lineWidth = g.w; ctx.stroke(path);
  });
  ctx.setLineDash([]);

  // Glowing dot at head of regression
  if (progress < 0.99) {
    const headIdx = Math.floor(progress * 200);
    const headPt  = pts.find((p, i) => p && i >= headIdx);
    if (headPt) {
      const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 120);
      [{r:40,a:.08},{r:18,a:.18},{r:8,a:.5},{r:3.5,a:.9}].forEach(({r, a}) => {
        ctx.beginPath();
        ctx.arc(headPt.cx, headPt.cy, r * pulse, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fill();
      });
    }
  }
  ctx.restore();
}

// Animated price line — traces from left, glowing dot at head
function drawPriceLineAnimated(progress) {
  ctx.save();

  // Find the canvas X that corresponds to progress
  const targetX = cL() + progress * cW();
  ctx.beginPath(); ctx.rect(cL(), cT(), targetX - cL(), cH()); ctx.clip();

  const path = new Path2D(); let s = false;
  let lastVis = null;
  for (const [ts, price] of DATA) {
    const cx = xToC(ts);
    if (cx < cL()-2 || cx > cR()+2) { s = false; continue; }
    const cy = yToC(price);
    if (!s) { path.moveTo(cx, cy); s = true; } else path.lineTo(cx, cy);
    if (cx <= targetX) lastVis = { cx, cy };
  }

  [{w:12,a:.05},{w:5,a:.17},{w:2,a:.52},{w:.9,a:1}].forEach(g => {
    ctx.strokeStyle = g.a === 1 ? '#fff' : `rgba(255,255,255,${g.a})`;
    ctx.lineWidth = g.w; ctx.stroke(path);
  });

  // Glowing dot at head of price line
  if (lastVis && progress < 0.995) {
    const pulse = 0.7 + 0.3 * Math.sin(performance.now() / 90);
    // outer glow rings
    [{r:28,a:.04},{r:16,a:.10},{r:9,a:.25},{r:5,a:.55},{r:2.5,a:.9}].forEach(({r, a}) => {
      ctx.beginPath();
      ctx.arc(lastVis.cx, lastVis.cy, r * pulse, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fill();
    });
    // solid white core
    ctx.beginPath();
    ctx.arc(lastVis.cx, lastVis.cy, 2, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
  }
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const zones = computeBands();
  while (bandVisible.length < zones.length) bandVisible.push(true);
  bandVisible.length = zones.length;
  drawBands(zones);
  drawRegressionLine();
  drawPriceLine();
  drawAxes();
}

function zoneLabel(z) {
  if (z.lo === null) return `< ${z.hi.toFixed(2)}×`;
  if (z.hi === null) return `> ${z.lo.toFixed(2)}×`;
  return `${z.lo.toFixed(2)}× – ${z.hi.toFixed(2)}×`;
}

function rebuildBandRows() {
  const zones = computeBands();
  while (bandVisible.length < zones.length) bandVisible.push(true);
  bandVisible.length = zones.length;

  const container = document.getElementById('band-rows');
  container.innerHTML = '';
  zones.forEach((z, i) => {
    const row = document.createElement('div');
    row.className = 'band-row' + (bandVisible[i] ? '' : ' hidden-band');

    const sw = document.createElement('div');
    sw.className = 'band-swatch';
    // color extraction from zone index
    const totalZ = zones.length;
    if (i === 0)            sw.style.background = 'rgb(80,40,0)';
    else if (i===totalZ-1)  sw.style.background = 'rgb(255,220,50)';
    else {
      const t = (i-1) / Math.max(totalZ-3, 1);
      sw.style.background = `rgb(${Math.round(150+105*t)},${Math.round(45+95*t)},0)`;
    }

    const lbl = document.createElement('div');
    lbl.className = 'band-label';
    lbl.textContent = zoneLabel(z);

    const days = document.createElement('div');
    days.className = 'band-days';
    days.textContent = `${z.days}d`;

    const pct = document.createElement('div');
    pct.className = 'band-pct';
    pct.textContent = `${(z.pct*100).toFixed(1)}%`;

    row.appendChild(sw); row.appendChild(lbl);
    row.appendChild(days); row.appendChild(pct);

    row.addEventListener('click', () => {
      bandVisible[i] = !bandVisible[i];
      row.classList.toggle('hidden-band', !bandVisible[i]);
      draw();
    });
    container.appendChild(row);
  });
}

function rebuildMultEditor() {
  const ed = document.getElementById('mult-editor');
  ed.innerHTML = '';
  multBorders.forEach((val, i) => {
    const row = document.createElement('div');

      const v = parseFloat(e.target.value);
      if (!isNaN(v) && v > 0) multBorders[i] = v;
    });

    // small suffix label

    sfx.textContent = '× reg';

  });

  btnAdd.addEventListener('click', () => {
    const last = multBorders[multBorders.length-1];
    multBorders.push(+(last * 2).toFixed(2));
    bandVisible = [];
    rebuildMultEditor(); rebuildBandRows(); draw();
  });

  btnRem.className = 'btn-secondary';
  btnRem.textContent = '− Border';
  btnRem.style.cssText = 'flex:1;font-size:9px;padding:4px 0;';
  btnRem.addEventListener('click', () => {
    if (multBorders.length > 2) {
      multBorders.pop();
      bandVisible = [];
      rebuildMultEditor(); rebuildBandRows(); draw();

  btnRow.appendChild(btnAdd); btnRow.appendChild(btnRem);
  ed.appendChild(btnRow);
}

  opacityScale = parseFloat(document.getElementById('sl-opacity').value);
  showReg   = document.getElementById('chk-reg').checked;
  showPrice = document.getElementById('chk-price').checked;
  bandVisible = [];
  rebuildMultEditor();
  rebuildBandRows();
  draw();
});

document.getElementById('btn-reset-view').addEventListener('click', () => { resetView(); draw(); });
document.getElementById('resetbtn').addEventListener('click', () => { resetView(); draw(); });

// ─── TOOLTIP ─────────────────────────────────────────────────────────────────
function showTooltip(x, y) {
  const ts = cToX(x);
  let bestI = 0, bestD = Infinity;
  for (let i = 0; i < N_DATA; i++) {
    const d = Math.abs(DATA[i][0] - ts); if (d < bestD) { bestD = d; bestI = i; }
  }
  const [ptTS, ptP] = DATA[bestI];
  const ptX = xToC(ptTS);
  if (ptX < cL() || ptX > cR()) { document.getElementById('tooltip').style.display='none'; return; }

  const mult = multiplier(ptTS, ptP);
  const zones = computeBands();
  let bandTxt = '';
  for (let zi = 0; zi < zones.length; zi++) {
    const z = zones[zi];
    const inZone = (z.lo === null ? mult < z.hi :
                    z.hi === null ? mult >= z.lo :
                    mult >= z.lo && mult < z.hi);
    if (inZone) { bandTxt = `${zoneLabel(z)}  ·  ${z.days}d  (${(z.pct*100).toFixed(1)}%)`; break; }
  }

  const dd = new Date(ptTS);
  document.getElementById('tt-date').textContent =
    `${String(dd.getDate()).padStart(2,'0')}.${String(dd.getMonth()+1).padStart(2,'0')}.${dd.getFullYear()}`;
  document.getElementById('tt-price').textContent =
    `$${ptP.toLocaleString('en-US', { maximumFractionDigits: ptP < 1 ? 6 : 2 })}`;
  document.getElementById('tt-mult').textContent =
    `${mult.toFixed(3)}× Regression  ($${plPrice(ptTS).toFixed(ptP < 1 ? 6 : 0)})`;
  document.getElementById('tt-band').textContent = bandTxt;

  const tt = document.getElementById('tooltip');
  let tx = x + 14, ty = y - 10;
  if (tx + 200 > W) tx = x - 210;
  if (ty < 0) ty = 5;
  tt.style.left = tx + 'px'; tt.style.top  = ty + 'px';
  tt.style.display = 'block';
}

// ─── INTERACTION ─────────────────────────────────────────────────────────────
let drag = false, dragMode = '', dsx = 0, dsy = 0;
let dsXMin, dsXMax, dsLYMin, dsLYMax;

function zone(x, y) {
  if (x < cL() && y >= cT() && y <= cB()) return 'yaxis';
  if (y > cB() && x >= cL() && x <= cR()) return 'xaxis';
  if (x >= cL() && x <= cR() && y >= cT() && y <= cB()) return 'chart';
  return 'out';
}

canvas.addEventListener('mousemove', e => {
  const {clientX:x, clientY:y} = e;
  const z = zone(x, y);
  if (!drag) canvas.style.cursor = z==='yaxis'?'ns-resize':z==='xaxis'?'ew-resize':z==='chart'?'crosshair':'default';
  if (drag) {
    const dx = x-dsx, dy = y-dsy;
    if (dragMode==='pan') {
      const xs = dsXMax-dsXMin, ys = dsLYMax-dsLYMin;
      view.xMin = dsXMin - dx/cW()*xs; view.xMax = dsXMax - dx/cW()*xs;
      view.logYMin = dsLYMin + dy/cH()*ys; view.logYMax = dsLYMax + dy/cH()*ys;
    } else if (dragMode==='ystretch') {
      const mid = (dsLYMin+dsLYMax)/2, half = (dsLYMax-dsLYMin)/2, f = Math.exp(-dy*.005);
      view.logYMin = mid-half*f; view.logYMax = mid+half*f;
    } else if (dragMode==='xstretch') {
      const mid = (dsXMin+dsXMax)/2, half = (dsXMax-dsXMin)/2, f = Math.exp(-dx*.003);
      view.xMin = mid-half*f; view.xMax = mid+half*f;
    }
    canvas.style.cursor = 'grabbing';
    draw();
  }
  if (z==='chart' && !drag) showTooltip(x, y);
  else document.getElementById('tooltip').style.display = 'none';
});

canvas.addEventListener('mousedown', e => {
  const z = zone(e.clientX, e.clientY);
  drag=true; dsx=e.clientX; dsy=e.clientY;
  dsXMin=view.xMin; dsXMax=view.xMax; dsLYMin=view.logYMin; dsLYMax=view.logYMax;
  dragMode = z==='yaxis'?'ystretch':z==='xaxis'?'xstretch':'pan';
  canvas.style.cursor='grabbing'; e.preventDefault();
});
window.addEventListener('mouseup', () => { drag=false; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 1.12 : 0.89;
  const z = zone(e.clientX, e.clientY);
  if (e.shiftKey || z==='yaxis') {
    const mly = cToLY(e.clientY);
    view.logYMin = mly+(view.logYMin-mly)*delta; view.logYMax = mly+(view.logYMax-mly)*delta;
  } else {
    const mts = cToX(e.clientX);
    view.xMin = mts+(view.xMin-mts)*delta; view.xMax = mts+(view.xMax-mts)*delta;
  }
  draw();
}, { passive: false });

canvas.addEventListener('dblclick', () => { resetView(); draw(); });

// Touch
let lp=null, lpX=null, lpY=null, ltX=null, ltY=null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length===1) { ltX=e.touches[0].clientX; ltY=e.touches[0].clientY; lp=null; }
  else if (e.touches.length===2) {
    const [t1,t2]=e.touches;
    lp=Math.hypot(t2.clientX-t1.clientX,t2.clientY-t1.clientY);
    lpX=(t1.clientX+t2.clientX)/2; lpY=(t1.clientY+t2.clientY)/2; ltX=null;
  }
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length===2) {
    const [t1,t2]=e.touches;
    const dist=Math.hypot(t2.clientX-t1.clientX,t2.clientY-t1.clientY);
    const mx=(t1.clientX+t2.clientX)/2, my=(t1.clientY+t2.clientY)/2;
    if (lp) {
      const sc=lp/dist, mts=cToX(mx), mly=cToLY(my);
      view.xMin=mts+(view.xMin-mts)*sc; view.xMax=mts+(view.xMax-mts)*sc;
      view.logYMin=mly+(view.logYMin-mly)*sc; view.logYMax=mly+(view.logYMax-mly)*sc;
      const dx=mx-lpX, dy=my-lpY, xs=view.xMax-view.xMin, ys=view.logYMax-view.logYMin;
      view.xMin-=dx/cW()*xs; view.xMax-=dx/cW()*xs;
      view.logYMin+=dy/cH()*ys; view.logYMax+=dy/cH()*ys;
    }
    lp=dist; lpX=mx; lpY=my; draw();
  } else if (e.touches.length===1 && ltX!==null) {
    const dx=e.touches[0].clientX-ltX, dy=e.touches[0].clientY-ltY;
    const xs=view.xMax-view.xMin, ys=view.logYMax-view.logYMin;
    view.xMin-=dx/cW()*xs; view.xMax-=dx/cW()*xs;
    view.logYMin+=dy/cH()*ys; view.logYMax+=dy/cH()*ys;
    ltX=e.touches[0].clientX; ltY=e.touches[0].clientY; draw();
  }
}, {passive:false});
canvas.addEventListener('touchend', e => {
  if (e.touches.length<2) lp=null;
  if (e.touches.length===0) { ltX=null; ltY=null; }
});

// ─── KEYBOARD: S then T triggers animation ───────────────────────────────────
let lastKey = '';
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 's') {
    lastKey = 's';
  } else if (k === 't' && lastKey === 's') {
    lastKey = '';
    if (anim.running) stopAnimation();
    else startAnimation();
  } else if (k === 'escape') {
    if (anim.running) stopAnimation();
    lastKey = '';
  } else {
    lastKey = k;
  }
});

window.addEventListener('resize', () => { resize(); draw(); });

// ─── INIT ─────────────────────────────────────────────────────────────────────
rebuildMultEditor();
rebuildBandRows();
draw();
</script>
</body>
</html>
