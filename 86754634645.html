/* ============================ Modell ============================ */
// Das Modell rechnet hier, beim Laden — jede Kennzahl im Bild ist reproduzierbar.
function ols(xs, ys){
  const n = xs.length; let mx=0,my=0;
  for(let i=0;i<n;i++){ mx+=xs[i]; my+=ys[i]; }
  mx/=n; my/=n;
  let sxx=0,sxy=0;
  for(let i=0;i<n;i++){ sxx+=(xs[i]-mx)*(xs[i]-mx); sxy+=(xs[i]-mx)*(ys[i]-my); }
  const b = sxy/sxx, a = my - b*mx;
  let ssr=0,sst=0;
  for(let i=0;i<n;i++){ const e=ys[i]-(a+b*xs[i]); ssr+=e*e; sst+=(ys[i]-my)*(ys[i]-my); }
  return {a, b, r2: sst>0 ? 1-ssr/sst : NaN};
}

// Zyklushochs: laufendes Maximum, dem ein Rueckgang > 50 % folgt (parameterfrei)
function findTops(P){
  const tops=[]; let mx=-1;
  for(let i=1;i<P.length-1;i++){
    if(P[i] >= mx){
      mx = P[i];
      let lo = Infinity;
      for(let j=i+1;j<Math.min(i+130,P.length);j++) lo = Math.min(lo, P[j]);
      if(lo < 0.5*P[i]){
        if(tops.length===0 || (dates[i]-dates[tops[tops.length-1]])/86400000 > 400) tops.push(i);
        else if(P[i] > P[tops[tops.length-1]]) tops[tops.length-1]=i;
      }
    }
  }
  return tops;
}

function buildModel(t0off, startYear, series){
  const P = series;
  const idx=[];
  for(let i=0;i<N;i++){
    if(P[i] == null || P[i] <= 0) continue;
    if(dates[i].getUTCFullYear() < startYear) continue;
    idx.push(i);
  }
  const xs = idx.map(i => Math.log10(dayNum[i] - t0off));
  const ys = idx.map(i => Math.log10(P[i]));
  const f = ols(xs, ys);
  const fair = new Array(N).fill(null), ratio = new Array(N).fill(null);
  for(let i=0;i<N;i++){
    const d = dayNum[i] - t0off;
    if(d <= 0) continue;
    fair[i] = Math.pow(10, f.a + f.b*Math.log10(d));
    if(P[i] != null && P[i] > 0) ratio[i] = P[i]/fair[i];
  }
  return {a:f.a, b:f.b, r2:f.r2, fair, ratio, n:idx.length, first:idx[0]};
}

const TOPS = findTops(price);

function cycleExtremes(M){
  // tiefstes Verhaeltnis je Hoch-zu-Hoch-Fenster
  const bounds = [0].concat(TOPS).concat([N-1]);
  const segs=[];
  for(let k=0;k<bounds.length-1;k++){
    let best=-1, bv=Infinity;
    for(let i=bounds[k]; i<=bounds[k+1]; i++){
      if(M.ratio[i]!=null && M.ratio[i] < bv){ bv=M.ratio[i]; best=i; }
    }
    if(best>=0) segs.push({i:best, r:bv});
  }
  return segs;
}

function buildNow(){
  const L = DATA.live;
  if(!L){ NOW = {date:dates[N-1], price:price[N-1], fair:MODEL.fair[N-1],
                 ratio:MODEL.ratio[N-1], live:false}; return; }
  const d = new Date(L.date+'T00:00:00Z');
  const tage = Math.round((d - GEN)/86400000) - S.t0;
  const fair = Math.pow(10, MODEL.a + MODEL.b*Math.log10(tage));
  NOW = {date:d, price:L.price, fair, ratio:L.price/fair, live:true,
         chg:L.chg, gain:L.gain, source:L.source,
         prevDate:L.prevDate, lowDate:L.lowDate, lowPrice:L.lowPrice};
}
function recompute(){
  MODEL = buildModel(S.t0, S.sy, price);

  const core = SEGS.slice(1, SEGS.length-1);
  BAND = { lo: Math.min(...core.map(s=>s.r)), hi: Math.max(...core.map(s=>s.r)), core };
  RUN  = SEGS[SEGS.length-1];

function buildFan(){
  const xs=[], ys=[];
  const out=[];
  let sx=0, sy2=0, sxx=0, sxy=0, n=0;
  const xNow = Math.log10(dayNum[N-1] - S.t0);
  for(let i=0;i<N;i++){
    const d = dayNum[i]-S.t0; if(d<=0) continue;
    const x = Math.log10(d), y = Math.log10(price[i]);
    sx+=x; sy2+=y; sxx+=x*x; sxy+=x*y; n++;
    if(dates[i].getUTCFullYear() < 2013) continue;
    if(dates[i] > new Date('2025-08-15T00:00:00Z')) break;
    const den = n*sxx - sx*sx; if(den<=0) continue;
    const b = (n*sxy - sx*sy2)/den, a = (sy2 - b*sx)/n;
    out.push({i, pred: Math.pow(10, a + b*xNow)});
  }
  return out;
}

let LAY = null;
function layout(){
  const padL = 74, padR = 30;
  const padT = Math.max(46, Hpx*0.075);
  const padB = Math.max(74, Hpx*0.115);   // eigener Streifen fuer die Wortmarke
  const gap = 24;
  const h2 = Math.round((Hpx - padT - padB - gap) * 0.30);   // Verhaeltnisfeld
  const h1 = (Hpx - padT - padB - gap) - h2;
  LAY = {padL, padR, padT, padB, gap,
    m:{x:padL, y:padT, w:Wpx-padL-padR, h:h1},
    r:{x:padL, y:padT+h1+gap, w:Wpx-padL-padR, h:h2}};
}

function yScaleFor(vals, box, logAxis){
  let lo=Infinity, hi=-Infinity;
  for(const v of vals){ if(v==null||!isFinite(v)||v<=0) continue; lo=Math.min(lo,v); hi=Math.max(hi,v); }
  if(!isFinite(lo)){ lo=1; hi=10; }
  const L = Math.log10(lo), H = Math.log10(hi);
  const padd = (H-L)*0.06;
  const l = L-padd, h = H+padd;      // Achsengrenzen folgen den Daten, nicht ganzen Dekaden
  return {
    lo:Math.pow(10,l), hi:Math.pow(10,h), l, h,
    y: v => box.y + box.h - ((Math.log10(v)-l)/(h-l))*box.h,
    inv: py => Math.pow(10, l + ((box.y+box.h-py)/box.h)*(h-l))
  };
}

function xAt(i, box){
  const t0 = dates[VIEW.from].getTime(), t1 = dates[VIEW.to].getTime();
  return box.x + ((dates[i].getTime()-t0)/(t1-t0))*box.w;
}
function iAtX(px, box){
  const t0 = dates[VIEW.from].getTime(), t1 = dates[VIEW.to].getTime();
  const t = t0 + ((px-box.x)/box.w)*(t1-t0);
  let best=VIEW.from, bd=Infinity;
  for(let i=VIEW.from;i<=VIEW.to;i++){ const d=Math.abs(dates[i].getTime()-t); if(d<bd){bd=d;best=i;} }

}

function ratioColor(r, alpha){
  if(r==null||!isFinite(r)) return 'rgba(120,120,120,'+(alpha||1)+')';

  } else {
    const k = t;
    c = [ Math.round(100 + (192-100)*k), Math.round(116 + (132-116)*k), Math.round(139 + (252-139)*k) ];
  }
  return 'rgba('+c[0]+','+c[1]+','+c[2]+','+(alpha==null?1:alpha)+')';
}

let grainCanvas = null;
function makeGrain(){
  const g = document.createElement('canvas'); g.width=g.height=180;
  const gx = g.getContext('2d'), id = gx.createImageData(180,180);
  for(let i=0;i<id.data.length;i+=4){
    const v = 120 + Math.random()*135;
    id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255;
  }
  gx.putImageData(id,0,0); grainCanvas = g;
}

const EASE = t => t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const clamp01 = t => Math.max(0, Math.min(1, t));

// 40-Sekunden-Sequenz (Kanalstandard)
function cinemaPlan(){
  const beats = [];

  // Haken: 4 Beats a 3,5 s = 14 s — zwei Aufbau, eine Kehrtwende, eine Einlösung
  push(3.5, {kind:'text', lines:['BITCOIN *__LIVE__*','*__WK__* IN EINER WOCHE']});
  push(3.5, {kind:'text', lines:['ALLE REDEN VOM','*AUSBRUCH*']});
  push(3.5, {kind:'text', lines:['DER BODEN STAND','SCHON *VORHER* FEST']});
  push(3.5, {kind:'text', lines:['*__BANDLO__ – __BANDHI__*','TIEF: *__LOWP__*']});
  // Welt
  push(4.5, {kind:'chart', phase:'price', cap:['DER KURS','16 Jahre']});
  // Das Band
  push(4.5, {kind:'chart', phase:'band', cap:['DAS BAND','vier Zyklen · *__BANDR__*']});

}

function startCinema(mode){
  if(!grainCanvas) makeGrain();
  // Reglerstand sichern: die Erklaersequenz fasst t0 an und muss ihn danach zuruecklegen
  S.cinema = {mode, plan: mode==='st' ? cinemaPlan() : explainPlan(), t0: performance.now(),
              savedT0: S.t0, savedSy: S.sy};
}
function endCinema(){
  const c = S.cinema;
  S.cinema = null;
  if(c && (S.t0 !== c.savedT0 || S.sy !== c.savedSy)){
    S.t0 = c.savedT0; S.sy = c.savedSy;
    syncControls(); FAN = null; recompute(); FAN = buildFan();
  }
}

/* ============================ Zeichnen ============================ */
function ensureSize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  if(CV.width !== Math.round(w*DPR) || CV.height !== Math.round(h*DPR)){
    CV.width = Math.round(w*DPR); CV.height = Math.round(h*DPR);
    CV.style.width = w+'px'; CV.style.height = h+'px';
  }
  Wpx = w; Hpx = h;
  layout();
}

function textFit(txt, maxW, base, weight){
  let fs = base;
  CX.font = weight+' '+fs+'px Inter, Segoe UI, sans-serif';
  while(CX.measureText(txt).width > maxW && fs > 10){
    fs -= 1; CX.font = weight+' '+fs+'px Inter, Segoe UI, sans-serif';
  }
  return fs;
}

// Text mit *Hervorhebung* in Bitcoin-Orange
function drawRich(line, cx, cy, fs, weight, baseCol){
  const parts = line.split('*');
  CX.font = weight+' '+fs+'px Inter, Segoe UI, sans-serif';
  let total = 0;
  for(const p of parts) total += CX.measureText(p).width;
  let x = cx - total/2;
  CX.textAlign = 'left'; CX.textBaseline='middle';
  for(let k=0;k<parts.length;k++){
    CX.fillStyle = (k%2===1) ? COL.model : baseCol;
    CX.fillText(parts[k], x, cy);
    x += CX.measureText(parts[k]).width;
  }
  CX.textAlign='start';
}
function richWidth(line, fs, weight){
  CX.font = weight+' '+fs+'px Inter, Segoe UI, sans-serif';
  let t=0; for(const p of line.split('*')) t += CX.measureText(p).width;
  return t;
}

function drawWatermark(){
  // GREAT / WALL+Y — zwei Zeilen gleicher Breite, Schriftgrad aus der Zielbreite
  const targetW = Math.max(96, Wpx*0.082);
  const x = LAY.padL - 2, yBase = Hpx - LAY.padB*0.24;
  const REF = 100;
  CX.font = '900 '+REF+'px Inter, Segoe UI, sans-serif';
  const w1 = CX.measureText('GREAT').width;
  const w2 = CX.measureText('WALLY').width;
  const wider = Math.max(w1,w2);
  const fs = targetW/wider*REF;
  CX.font = '900 '+fs+'px Inter, Segoe UI, sans-serif';
  const a1 = CX.measureText('GREAT').width;
  const aW = CX.measureText('WALL').width, aY = CX.measureText('Y').width;
  const a2 = aW+aY;
  const lh = fs*0.98;
  CX.textBaseline='alphabetic'; CX.textAlign='left';

  CX.save();
  CX.translate(x, yBase - lh);
  CX.scale(targetW/a1, 1);
  CX.fillStyle = '#FFFFFF'; CX.fillText('GREAT', 0, 0);
  CX.restore();

  CX.save();
  CX.translate(x, yBase);
  CX.scale(targetW/a2, 1);
  CX.fillStyle = COL.model; CX.fillText('WALL', 0, 0);
  CX.fillStyle = '#FFFFFF'; CX.fillText('Y', aW, 0);
  CX.restore();
}

function drawGrid(box, sc, label){
  CX.save();
  CX.strokeStyle = COL.grid; CX.lineWidth = 1;
  CX.fillStyle = COL.axis;
  const fs = Math.max(11, Math.min(21, Wpx*0.0125));
  CX.font = '600 '+fs+'px Inter, Segoe UI, sans-serif';
  CX.textAlign='right'; CX.textBaseline='middle';
  const from = Math.floor(sc.l), to = Math.ceil(sc.h);
  for(let e=from;e<=to;e++){
    const v = Math.pow(10,e);
    if(v < sc.lo*0.999 || v > sc.hi*1.001) continue;
    const y = sc.y(v);
    CX.beginPath(); CX.moveTo(box.x, y); CX.lineTo(box.x+box.w, y); CX.stroke();
    CX.globalAlpha=0.72;
    CX.fillText(label(v), box.x-9, y);
    CX.globalAlpha=1;
  }
  CX.restore();
}

function drawYears(box){
  CX.save();
  const fs = Math.max(11, Math.min(21, Wpx*0.0125));
  CX.font='600 '+fs+'px Inter, Segoe UI, sans-serif';
  CX.fillStyle=COL.axis; CX.globalAlpha=.72;
  CX.textAlign='center'; CX.textBaseline='top';
  const spanJ = (dates[VIEW.to]-dates[VIEW.from])/31557600000;
  const marks = [];
  if(spanJ > 3.5){
    const step = Wpx < 900 ? 4 : 2;
    const y0 = dates[VIEW.from].getUTCFullYear();
    for(let y=Math.ceil(y0/step)*step; y<=dates[VIEW.to].getUTCFullYear(); y+=step){
      for(let i=VIEW.from;i<=VIEW.to;i++) if(dates[i].getUTCFullYear()===y){ marks.push([i,String(y)]); break; }
    }
  } else {
    const MN = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
    const mstep = spanJ > 2 ? 3 : (spanJ > 1 ? 2 : 1);
    let last = -1;
    for(let i=VIEW.from;i<=VIEW.to;i++){
      const m = dates[i].getUTCMonth();
      if(m !== last && m % mstep === 0){
        last = m;
        marks.push([i, MN[m] + (m===0 ? " '"+String(dates[i].getUTCFullYear()).slice(2) : '')]);
      }
    }
  }
  for(const [idx, lab] of marks){
    const px = xAt(idx, box);
    CX.globalAlpha=.14;
    CX.strokeStyle='#fff'; CX.lineWidth=1;
    CX.beginPath(); CX.moveTo(px, box.y); CX.lineTo(px, box.y+box.h); CX.stroke();
    CX.globalAlpha=.72;
    CX.fillText(lab, px, box.y+box.h+7);
  }
  CX.restore();
}

function pathSeries(vals, box, sc, prog){
  const span = VIEW.to - VIEW.from;
  const lim = VIEW.from + Math.floor(span*clamp01(prog==null?1:prog));
  CX.beginPath();
  let started=false, lastX=0, lastY=0;
  for(let i=VIEW.from;i<=lim && i<N;i++){
    const v = vals[i]; if(v==null||!isFinite(v)||v<=0) continue;
    const x = xAt(i, box), y = sc.y(v);
    if(!started){ CX.moveTo(x,y); started=true; } else CX.lineTo(x,y);
    lastX=x; lastY=y;
  }
  return {x:lastX, y:lastY, started};
}

function render(now, F){
  ensureSize();                     // jeden Frame: passt die Canvas noch zum Fenster?
  const c = CX;
  c.setTransform(DPR,0,0,DPR,0,0);
  c.clearRect(0,0,Wpx,Hpx);
  c.fillStyle='#000'; c.fillRect(0,0,Wpx,Hpx);

  F = F || {chart:1, priceP:1, modelP:1, bandA:S.band?1:0, markP:S.marks?1:0,
            fanA:S.fan?1:0, funnel:0, camera:0, zoom:0, text:null, big:null, cap:null,
            bars:0, grain:0, dim:0};

  const M = LAY.m, R = LAY.r;
  const showRatio = true;

  // ---- Ansichtsfenster und Skalen (nur ueber die sichtbaren Punkte) ----
  setView(F.zoom);
  const allV = [], ratVals = [];
  for(let i=VIEW.from;i<=VIEW.to;i++){
    if(price[i]) allV.push(price[i]);
    if(MODEL.fair[i]){ allV.push(MODEL.fair[i]); allV.push(MODEL.fair[i]*BAND.lo); allV.push(MODEL.fair[i]*BAND.hi); }
    if(MODEL.ratio[i]!=null) ratVals.push(MODEL.ratio[i]);
  }
  const scM = yScaleFor(allV, M);
  const scR = yScaleFor(ratVals, R);

  c.save();
  if(F.chart < 1){ c.globalAlpha = F.chart; }
  // Kamerafahrt nur auf der Datenebene
  if(F.camera){
    const k = 1 + 0.06*F.camera;
    c.translate(Wpx*0.5, Hpx*0.52); c.scale(k,k); c.translate(-Wpx*0.5, -Hpx*0.52);
  }

  drawGrid(M, scM, v => v>=1000 ? (v/1000>=1000? (v/1e6)+'M' : Math.round(v/1000)+'k') :
                        (v>=1? String(Math.round(v)) : v.toFixed(2).replace('.',',')));
  drawYears(M);
  drawGrid(R, scR, v => fmtNum(v,2));
  drawYears(R);

  // Ab hier nur noch Daten: auf die Felder beschneiden, damit beim Heranfahren
  // nichts ueber die Achsenbeschriftung wandert.
  c.save();
  c.beginPath(); c.rect(M.x, M.y-2, M.w, (R.y+R.h)-M.y+4); c.clip();

  // ---- Bodenband im Hauptfeld ----
  if(F.bandA > 0){
    c.save(); c.globalAlpha = F.bandA*0.30;
    c.fillStyle = COL.low;
    c.beginPath();
    let st=false;
    for(let i=0;i<N;i++){ const v=MODEL.fair[i]; if(!v) continue;
      const x=xAt(i,M), y=scM.y(v*BAND.hi); if(!st){c.moveTo(x,y);st=true;} else c.lineTo(x,y); }
    for(let i=N-1;i>=0;i--){ const v=MODEL.fair[i]; if(!v) continue;
      c.lineTo(xAt(i,M), scM.y(v*BAND.lo)); }
    c.closePath(); c.fill();
    c.globalAlpha = F.bandA*0.85;
    c.strokeStyle = COL.low; c.lineWidth=1.4; c.setLineDash([5,4]);
    c.beginPath(); st=false;
    for(let i=0;i<N;i++){ const v=MODEL.fair[i]; if(!v) continue;
      const x=xAt(i,M), y=scM.y(v*BAND.lo); if(!st){c.moveTo(x,y);st=true;} else c.lineTo(x,y); }
    c.stroke(); c.setLineDash([]);
    c.restore();
  }

  // ---- Prognosefächer ----
  if(F.fanA > 0){
    if(!FAN) FAN = buildFan();
    c.save(); c.globalAlpha = F.fanA*0.42;
    c.lineWidth = 1;
    for(let k=0;k<FAN.length;k+=3){
      const f = FAN[k];
      if(f.i < VIEW.from) continue;
      const x0 = xAt(f.i, M), y0 = scM.y(price[f.i]);
      const x1 = xAt(N-1, M), y1 = scM.y(f.pred);
      c.strokeStyle = COL.high;
      c.beginPath(); c.moveTo(x0,y0); c.lineTo(x1,y1); c.stroke();
    }
    c.restore();
  }

  // ---- Modelllinie ----
  if(F.modelP > 0){
    c.save();
    c.strokeStyle = COL.model; c.lineWidth = 2.7;
    c.shadowColor = 'rgba(247,147,26,.55)'; c.shadowBlur = 13;
    const e = pathSeries(MODEL.fair, M, scM, F.modelP);
    c.stroke();
    if(F.modelP < 1 && e.started){
      c.shadowBlur=16; c.fillStyle=COL.model;
      c.beginPath(); c.arc(e.x,e.y,4,0,6.283); c.fill();
    }
    c.restore();
  }

  // ---- Bitstamp-Gegenprobe ----
  if(S.bs && MODEL_BS){
    c.save(); c.globalAlpha=.55;
    c.strokeStyle = COL.price; c.lineWidth=1.5; c.setLineDash([3,4]);
    pathSeries(bsr, M, scM, 1); c.stroke(); c.setLineDash([]);
    c.restore();
  }

  // ---- Kurslinie ----
  if(F.priceP > 0){
    c.save();
    c.strokeStyle = COL.price; c.lineWidth = 3.3;
    c.shadowColor='rgba(255,255,255,.42)'; c.shadowBlur=11;
    const e = pathSeries(price, M, scM, F.priceP);
    c.stroke();
    if(F.priceP < 1 && e.started){
      c.shadowBlur=18; c.fillStyle='#fff';
      c.beginPath(); c.arc(e.x,e.y,4.5,0,6.283); c.fill();
    }
    c.restore();
  }

  // ---- Verhältnisfeld ----
  c.save();
  // Bodenband als waagerechte Zone
  if(F.bandA>0){
    c.globalAlpha = F.bandA*0.26; c.fillStyle=COL.low;
    const yA = scR.y(BAND.hi), yB = scR.y(BAND.lo);
    c.fillRect(R.x, yA, R.w, yB-yA);
    c.globalAlpha = F.bandA*0.9; c.strokeStyle=COL.low; c.lineWidth=1.2; c.setLineDash([5,4]);
    c.beginPath(); c.moveTo(R.x,yA); c.lineTo(R.x+R.w,yA);
    c.moveTo(R.x,yB); c.lineTo(R.x+R.w,yB); c.stroke(); c.setLineDash([]);
  }
  // Linie bei 1,00 = Modelllinie
  c.globalAlpha=.55; c.strokeStyle=COL.model; c.lineWidth=1.3; c.setLineDash([2,5]);
  const y1 = scR.y(1);
  c.beginPath(); c.moveTo(R.x,y1); c.lineTo(R.x+R.w,y1); c.stroke(); c.setLineDash([]);
  c.globalAlpha=1;
  // Verhältniskurve, nach Zustand eingefärbt
  const lim = Math.floor(N*clamp01(F.priceP));
  c.lineWidth = 2.1;
  for(let i=1;i<=lim && i<N;i++){
    const a=MODEL.ratio[i-1], b=MODEL.ratio[i];
    if(a==null||b==null) continue;
    c.strokeStyle = ratioColor((a+b)/2, .92);
    c.beginPath(); c.moveTo(xAt(i-1,R), scR.y(a)); c.lineTo(xAt(i,R), scR.y(b)); c.stroke();
  }
  c.restore();

  // ---- Marker: Hochs und Tiefs ----
  if(F.markP > 0){
    const items = [];
    TOPS.forEach((i,k)=>items.push({i, kind:'top', r:MODEL.ratio[i], ord:k*2}));
    SEGS.slice(1).forEach((s,k)=>items.push({i:s.i, kind:'low', r:s.r, ord:k*2+1}));
    items.sort((a,b)=>a.ord-b.ord);
    const n = items.length;
    items.forEach((it, k)=>{
      if(it.i < VIEW.from || it.i > VIEW.to) return;   // ausserhalb des Fensters
      // gestaffeltes Erscheinen, Ueberlappung ~50 %
      const span = 1/(n*0.5+0.5);
      const local = clamp01((F.markP - k*span*0.5)/span);
      if(local<=0) return;
      const sc2 = 0.55 + 0.45*EASE(local);
      const puls = 1 + 0.06*Math.sin(now/1250 + k*1.1);
      const col = it.kind==='top' ? COL.high : COL.low;
      for(const [box, sc, val] of [[M, scM, price[it.i]], [R, scR, it.r]]){
        if(val==null) continue;
        const x = xAt(it.i, box), y = sc.y(val);
        c.save();
        c.globalAlpha = local;
        c.fillStyle = col;
        c.shadowColor = col;
        c.shadowBlur = 10 + 26*(1-local);
        c.beginPath(); c.arc(x, y, 4.6*sc2*puls, 0, 6.283); c.fill();
        c.restore();
      }
      // Wert nur im Verhältnisfeld beschriften (dort ist es die Aussage)
      if(local>0.4 && it.r!=null){
        c.save();
        c.globalAlpha = clamp01((local-0.4)/0.6);
        c.fillStyle = col;
        const fs = Math.max(10, Math.min(15, Wpx*0.0092));
        c.font='700 '+fs+'px Inter, Segoe UI, sans-serif';
        c.textAlign='center';
        c.textBaseline = it.kind==='top' ? 'bottom' : 'top';
        const x = xAt(it.i, R), y = scR.y(it.r);
        c.fillText(fmtNum(it.r,2), x, y + (it.kind==='top' ? -9 : 9));
        c.restore();
      }
    });
  }

  // ---- Trichter-Hüllkurven (Kernszene) ----
  if(F.funnel > 0){
    c.save();
    c.globalAlpha = F.funnel;
    const inv = i => i>=VIEW.from && i<=VIEW.to;
    const tps = TOPS.filter(inv).map(i=>({x:xAt(i,R), y:scR.y(MODEL.ratio[i])}));
    const lws = SEGS.slice(1).filter(s=>inv(s.i)).map(s=>({x:xAt(s.i,R), y:scR.y(s.r)}));
    c.lineWidth=2.2; c.setLineDash([7,5]);
    c.strokeStyle=COL.high; c.beginPath();
    tps.forEach((p,k)=> k? c.lineTo(p.x,p.y) : c.moveTo(p.x,p.y)); c.stroke();
    c.strokeStyle=COL.low; c.beginPath();
    lws.forEach((p,k)=> k? c.lineTo(p.x,p.y) : c.moveTo(p.x,p.y)); c.stroke();
    c.setLineDash([]);
    c.restore();
  }

  // ---- HEUTE-Marker ----
  {
    const x = xAt(N-1, M);
    const p = 0.55 + 0.45*Math.sin(now/900);
    c.save();
    c.strokeStyle = 'rgba(255,255,255,'+(0.28+0.22*p)+')';
    c.lineWidth=1.4; c.setLineDash([5,5]);
    c.beginPath(); c.moveTo(x, M.y); c.lineTo(x, R.y+R.h); c.stroke();
    c.setLineDash([]);
    const y = scM.y(price[N-1]);
    c.strokeStyle='rgba(255,255,255,'+(0.5*(1-((now/4000)%1)))+')';
    c.lineWidth=2;
    c.beginPath(); c.arc(x,y, 5+16*((now/4000)%1), 0, 6.283); c.stroke();
    c.fillStyle='#fff'; c.shadowColor='#fff'; c.shadowBlur=12;
    c.beginPath(); c.arc(x,y,4.6,0,6.283); c.fill();
    c.restore();
  }

  c.restore();  // Ende Beschneidung
  c.restore();  // Ende Kamera/Datenebene

  // ---- Feldbeschriftungen ----
  c.save();
  c.globalAlpha = F.chart;          // gehoert zur Chart-Ebene, nicht zum Vordergrund
  const lfs = Math.max(10, Math.min(14, Wpx*0.0088));
  c.font='700 '+lfs+'px Inter, Segoe UI, sans-serif';
  c.textAlign='left'; c.textBaseline='top';
  c.fillStyle='rgba(255,255,255,.42)';
  c.fillText('BITCOIN · US-DOLLAR · LOGARITHMISCH', M.x+4, M.y+4);
  c.fillStyle='rgba(255,255,255,.42)';
  c.fillText('KURS GETEILT DURCH MODELLLINIE', R.x+4, R.y+4);
  c.restore();

  // ---- Vignette über den Daten ----
  {
    const g = c.createRadialGradient(Wpx*0.5,Hpx*0.5,Math.min(Wpx,Hpx)*0.25,
                                     Wpx*0.5,Hpx*0.5,Math.max(Wpx,Hpx)*0.78);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.55)');
    c.fillStyle=g; c.fillRect(0,0,Wpx,Hpx);
  }

  c.save();
  c.globalAlpha = Math.max(F.chart, F.bars>0.9 ? 0 : 1);
  drawWatermark();
  c.restore();

  // ---- Cinema-Overlays ----
  if(F.dim>0){ c.fillStyle='rgba(0,0,0,'+(F.dim*0.72)+')'; c.fillRect(0,0,Wpx,Hpx); }

  // Zentraler Text bekommt immer einen eigenen Abdunkler, damit er nie auf
  // Kurven oder hellen Flaechen sitzt — unabhaengig davon, was dahinter laeuft.
  function centerScrim(strength){
    if(!(strength>0)) return;
    const cx = Wpx/2, cy = Hpx*0.42;
    const rad = Math.max(Wpx, Hpx)*0.70;
    const g = c.createRadialGradient(cx, cy, 0, cx, cy, rad);
    g.addColorStop(0.00, 'rgba(0,0,0,'+(0.90*strength)+')');
    g.addColorStop(0.38, 'rgba(0,0,0,'+(0.78*strength)+')');
    g.addColorStop(0.70, 'rgba(0,0,0,'+(0.42*strength)+')');
    g.addColorStop(1.00, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(0,0,Wpx,Hpx);
  }

  if(F.cap){
    const cy = Hpx*0.085;
    // Abdunkler hinter der Caption
    const g = c.createLinearGradient(0, cy-Hpx*0.055, 0, cy+Hpx*0.085);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(0.42,'rgba(0,0,0,.70)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=g; c.fillRect(0, cy-Hpx*0.055, Wpx, Hpx*0.14);
    c.save();
    c.globalAlpha = F.capA==null?1:F.capA;
    const f1 = Math.max(13, Math.min(20, Wpx*0.0125));
    c.font='800 '+f1+'px Inter, Segoe UI, sans-serif';
    c.fillStyle=COL.model; c.textAlign='center'; c.textBaseline='middle';
    c.letterSpacing = '0.14em';
    c.fillText(F.cap[0], Wpx/2, cy-f1*0.85);
    c.letterSpacing = '0em';
    let f2 = Math.max(14, Math.min(25, Wpx*0.0165));
    while(richWidth(F.cap[1], f2, '600') > Wpx*0.84 && f2>11) f2--;
    drawRich(F.cap[1], Wpx/2, cy+f2*0.72, f2, '600', 'rgba(255,255,255,.94)');
    c.restore();
  }

  if(F.text){
    centerScrim(F.textA==null?1:F.textA);
    c.save();
    c.globalAlpha = F.textA==null?1:F.textA;
    const lines = F.text;
    let fs = Math.max(20, Math.min(60, Wpx*0.040));
    while(lines.some(l=>richWidth(l, fs, '900') > Wpx*0.82) && fs>14) fs--;
    const lh = fs*1.30;
    const cy = Hpx*0.42 - (lines.length-1)*lh/2;
    lines.forEach((l,k)=> drawRich(l, Wpx/2, cy+k*lh, fs, '900', '#FFFFFF'));
    c.restore();
  }

  if(F.big){
    centerScrim(F.bigA==null?1:F.bigA);
    c.save();
    c.globalAlpha = F.bigA==null?1:F.bigA;
    let fs = Math.max(28, Math.min(96, Wpx*0.062));
    while(richWidth(F.big.val, fs, '900') > Wpx*0.86 && fs>18) fs--;
    // Bloom: zweifach gezeichnet
    c.shadowColor='rgba(247,147,26,.55)'; c.shadowBlur=34;
    drawRich(F.big.val, Wpx/2, Hpx*0.42, fs, '900', '#FFFFFF');
    c.shadowBlur=0;
    drawRich(F.big.val, Wpx/2, Hpx*0.42, fs, '900', '#FFFFFF');
    const sf = Math.max(12, Math.min(22, Wpx*0.0135));
    c.font='700 '+sf+'px Inter, Segoe UI, sans-serif';
    c.fillStyle='rgba(255,255,255,.60)'; c.textAlign='center'; c.textBaseline='middle';
    c.letterSpacing='0.16em';
    c.fillText(F.big.sub, Wpx/2, Hpx*0.42 + fs*0.86);
    c.letterSpacing='0em';
    c.restore();
  }

  // Cinemascope-Balken
  if(F.bars>0){
    const bh = Hpx*0.12*F.bars;
    c.fillStyle='#000'; c.fillRect(0,0,Wpx,bh); c.fillRect(0,Hpx-bh,Wpx,bh);
  }

  // Filmkorn
  if(F.grain>0 && grainCanvas){
    c.save(); c.globalAlpha = F.grain*0.09; c.globalCompositeOperation='overlay';
    for(let y=0;y<Hpx;y+=180) for(let x=0;x<Wpx;x+=180){
      c.drawImage(grainCanvas, x+(Math.random()*6|0), y+(Math.random()*6|0));
    }
    c.restore();
  }

  // Blitzschnitt
  if(F.flash>0){ c.fillStyle='rgba(255,255,255,'+F.flash+')'; c.fillRect(0,0,Wpx,Hpx); }
}

/* ============================ Textersetzung ============================ */
function subst(s){
  if(!s) return s;
  return s
    .replace(/__FAIR__/g, fmtUSD(NOW.fair))
    .replace(/__PRICE__/g, fmtUSD(NOW.price))
    .replace(/__BETA__/g, fmtNum(MODEL.b,2))
    .replace(/__R2__/g, fmtNum(MODEL.r2,3))
    .replace(/__BANDLO__/g, fmtUSD(NOW.fair*BAND.lo))
    .replace(/__BANDHI__/g, fmtUSD(NOW.fair*BAND.hi))
    .replace(/__BANDR__/g, fmtNum(BAND.lo,3)+'–'+fmtNum(BAND.hi,3))
    .replace(/__BANDF__/g, fmtNum(BAND.hi/BAND.lo,2))
    .replace(/__JUNE__/g, fmtNum(RUN.r,3))
    .replace(/__TODAY__/g, deDate(dates[N-1]))
    .replace(/__NBIAS__/g, String(FANCOUNT))
    .replace(/__CORE__/g, BAND.core.map(s=>fmtNum(s.r,3)).join(' · '))
    .replace(/__LOW__/g, fmtUSD(price[RUN.i]))
    .replace(/__LOWR__/g, fmtNum(RUN.r,3))
    .replace(/__RATIO__/g, fmtNum(NOW.ratio,3))
    .replace(/__GAIN__/g, (NOW.gain!=null ? '+'+fmtNum(NOW.gain*100,1)+' %'
                                          : '+'+fmtNum((price[N-1]/price[RUN.i]-1)*100,1)+' %'))
    .replace(/__WK__/g, (NOW.chg!=null ? ((NOW.chg>=0?'+':'')+fmtNum(NOW.chg*100,1)+' %')
                                       : ((price[N-1]>=price[N-2]?'+':'')+fmtNum((price[N-1]/price[N-2]-1)*100,1)+' %')))
    .replace(/__LIVE__/g, fmtUSD(NOW.price))
    .replace(/__LOWP__/g, fmtUSD(NOW.lowPrice!=null ? NOW.lowPrice : price[RUN.i]));
}
let FANCOUNT = 658;

/* ============================ Animationsschleife ============================ */
function frameFor(el){
  const F = {chart:1, priceP:1, modelP:1, bandA:S.band?1:0, markP:S.marks?1:0,
             fanA:S.fan?1:0, funnel:0, camera:0, zoom:0, text:null, big:null, cap:null,
             bars:0, grain:0, dim:0, flash:0};
  if(!S.cinema) return F;
  const {plan, t0} = S.cinema;
  const t = (performance.now()-t0)/1000;
  if(t > plan.dur){ endCinema(); return F; }
  let b = plan.beats[0];
  for(const x of plan.beats) if(t>=x.t0 && t<x.t1){ b=x; break; }
  const local = (t-b.t0)/(b.t1-b.t0);
  const fade = Math.min(1, Math.min(local, 1-local)/0.16);

  F.grain = 0; F.bars = 0;
  if(b.kind==='text'){
    F.chart=0; F.bars=1; F.text=b.lines.map(subst); F.textA=fade;
    const idx = plan.beats.indexOf(b);
    F.grain = idx<=1 ? 0.5+0.4*local : Math.max(0, 0.9-0.7*local);
    if(idx===2 && local<0.12) F.flash = (1-local/0.12)*0.85;   // Blitzschnitt auf der Kehrtwende
    return F;
  }
  F.bars = 0.35;
  F.cap = b.cap ? [b.cap[0], subst(b.cap[1])] : null;
  F.capA = fade;
  const ph = b.phase;
  if(ph==='price'){ F.priceP=EASE(clamp01(local*1.15)); F.modelP=0; F.bandA=0; F.markP=0; F.fanA=0; }
  else if(ph==='model'){ F.priceP=1; F.modelP=EASE(clamp01(local*1.2)); F.bandA=0; F.markP=0; F.fanA=0; }
  else if(ph==='band'){ F.priceP=1; F.modelP=1;
    F.bandA=EASE(clamp01(local*1.3)); F.markP=EASE(clamp01(local*1.1)); F.fanA=0; }
  else if(ph==='hit'){
    // Kernszene: heranfahren, bis der Bandtreffer wirklich sichtbar ist
    F.priceP=1; F.modelP=1; F.bandA=1; F.fanA=0; F.funnel=0;
    F.zoom  = EASE(clamp01((local-0.08)/0.55));
    F.markP = EASE(clamp01((local-0.35)/0.5));
  }
  else if(ph==='funnel'){ F.priceP=1; F.modelP=1; F.bandA=1;
    F.markP=EASE(clamp01(local*1.45)); F.funnel=EASE(clamp01((local-0.42)/0.5));
    F.camera=EASE(clamp01((local-0.2)/0.7)); F.fanA=0; }
  else if(ph==='fan'){ F.priceP=1; F.modelP=1; F.bandA=0.5; F.markP=1;
    F.fanA=EASE(clamp01(local*1.2)); }
  else if(ph==='sliders'){ F.priceP=1; F.modelP=1; F.bandA=1; F.markP=1; F.fanA=0;
    const k=(Math.sin(local*Math.PI*2)*0.5+0.5);
    S.t0=Math.round((-180+k*545)/15)*15; syncControls(); recompute(); }
  else { F.priceP=1; F.modelP=1; F.bandA=1; F.markP=1; F.funnel=0; F.fanA=0; F.bars=0;
         F.zoom = 1-EASE(clamp01(local*1.1)); }

  if(b.kind==='big'){
    F.dim = 0.80; F.big = {val: subst(b.val), sub: subst(b.sub)}; F.bigA = fade;
    F.priceP=1; F.modelP=1; F.bandA=1; F.markP=1; F.funnel=0; F.zoom=1;
  }
  return F;
}

function loop(){
  const now = performance.now();
  const F = frameFor();
  if(!S.cinema){
    S.zoomV += (S.zoomT - S.zoomV) * 0.09;
    if(Math.abs(S.zoomT - S.zoomV) < 0.002) S.zoomV = S.zoomT;
    F.zoom = S.zoomV;
  }
  render(now, F);
  requestAnimationFrame(loop);
}

/* ============================ Panel ============================ */
function updatePanel(){
  document.getElementById('stichtag').textContent = deDate(dates[N-1]);
  document.getElementById('v_price').textContent =
    fmtUSD(NOW.price) + (NOW.live ? ' · live' : '');
  document.getElementById('v_fair').textContent = fmtUSD(NOW.fair);
  const r = NOW.ratio;
  const vr = document.getElementById('v_ratio');
  vr.textContent = fmtNum(r,3) + (r > BAND.hi ? '  ↑' : (r >= BAND.lo ? '  ●' : '  ↓'));
  vr.style.color = ratioColor(r,1);
  document.getElementById('v_band').textContent =
    fmtUSD(NOW.fair*BAND.lo).replace(' $','') + ' – ' + fmtUSD(NOW.fair*BAND.hi);
  document.getElementById('l_t0').textContent =
    S.t0===0 ? 'Genesis' : (S.t0>0?'+':'') + S.t0 + ' T';
  document.getElementById('l_sy').textContent = String(S.sy);
  document.getElementById('note').innerHTML =
    'β = <b>'+fmtNum(MODEL.b,4)+'</b> · R² = <b>'+fmtNum(MODEL.r2,4)+'</b> · n = '+MODEL.n+' Wochen.<br>'+
    'Bodenband aus den vier abgeschlossenen Zyklen: '+BAND.core.map(s=>fmtNum(s.r,3)).join(' · ')+
    ' — Faktor '+fmtNum(BAND.hi/BAND.lo,2)+'.<br>'+
    'Tief '+deDate(dates[RUN.i])+': <b>'+fmtNum(RUN.r,3)+'</b>'+
    (RUN.r>=BAND.lo && RUN.r<=BAND.hi ? ' — im Band.' : ' — ausserhalb.')+
    ' Seitdem <b>+'+fmtNum((NOW.gain!=null?NOW.gain:(price[N-1]/price[RUN.i]-1))*100,1)+' %</b>'+
    (NOW.chg!=null ? ' (davon <b>+'+fmtNum(NOW.chg*100,1)+' %</b> in der letzten Woche)' : '')+
    ', heute '+fmtNum(NOW.ratio,3)+
    (NOW.ratio > BAND.hi ? ' — über dem Band.' : '.')+
    (NOW.live ? '<br>Kurs- und Veränderungsangaben: '+NOW.source+', Stand '+deDate(NOW.date)+
                '; Regression auf Coin Metrics bis '+deDate(dates[N-1])+'.' : '');
}
function syncControls(){
  document.getElementById('s_t0').value = S.t0;
  document.getElementById('s_sy').value = S.sy;
}

document.getElementById('tg').addEventListener('click', ()=>{
  const b = document.getElementById('pb');
  b.classList.toggle('hid');
  document.getElementById('tg').textContent = b.classList.contains('hid') ? '▶' : '◀';
});
document.getElementById('s_t0').addEventListener('input', e=>{
  S.t0 = +e.target.value; FAN=null; recompute();
});
document.getElementById('s_sy').addEventListener('input', e=>{
  S.sy = +e.target.value; FAN=null; recompute();
});
document.querySelectorAll('.tgl').forEach(el=>{
  el.addEventListener('click', ()=>{
    const k = el.dataset.k;
    S[k] = !S[k];
    el.classList.toggle('on', S[k]);
    if(k==='bs' && S.bs) MODEL_BS = buildModel(S.t0, S.sy, bsr);
    if(k==='fan' && S.fan && !FAN) FAN = buildFan();
  });
});

// Panel verschiebbar
(function(){
  const p = document.getElementById('panel'), h = document.getElementById('ph');
  let dx=0, dy=0, drag=false;
  h.addEventListener('mousedown', e=>{
    if(e.target.id==='tg') return;
    drag=true; dx=e.clientX-p.offsetLeft; dy=e.clientY-p.offsetTop;
  });
  window.addEventListener('mousemove', e=>{
    if(!drag) return;
    p.style.left = Math.max(0, Math.min(window.innerWidth-80, e.clientX-dx))+'px';
    p.style.top  = Math.max(0, Math.min(window.innerHeight-40, e.clientY-dy))+'px';
  });
  window.addEventListener('mouseup', ()=>drag=false);
})();

/* ============================ Tooltip ============================ */
const TIP = document.getElementById('tip');
CV.addEventListener('mousemove', e=>{
  if(S.cinema){ TIP.style.display='none'; return; }
  const M = LAY.m, R = LAY.r;
  const inM = e.clientY>=M.y && e.clientY<=M.y+M.h && e.clientX>=M.x && e.clientX<=M.x+M.w;
  const inR = e.clientY>=R.y && e.clientY<=R.y+R.h && e.clientX>=R.x && e.clientX<=R.x+R.w;
  if(!inM && !inR){ TIP.style.display='none'; return; }
  const i = iAtX(e.clientX, inM?M:R);
  const r = MODEL.ratio[i], f = MODEL.fair[i];
  const band = f ? (fmtUSD(f*BAND.lo)+' – '+fmtUSD(f*BAND.hi)) : '–';
  TIP.innerHTML =
    '<div class="d">'+deDate(dates[i])+'</div>'+
    '<div class="row"><span class="l">Kurs</span><span style="color:#fff;font-weight:700">'+fmtUSD(price[i])+'</span></div>'+
    '<div class="row"><span class="l">Modelllinie</span><span style="color:'+COL.model+';font-weight:700">'+fmtUSD(f)+'</span></div>'+
    '<div class="row"><span class="l">Verhältnis</span><span style="color:'+ratioColor(r,1)+';font-weight:700">'+fmtNum(r,3)+'</span></div>'+
    '<div class="row"><span class="l">Bodenband</span><span style="color:'+COL.low+'">'+band+'</span></div>'+
    (bsr[i]!=null ? '<div class="row"><span class="l">Bitstamp</span><span style="color:rgba(255,255,255,.72)">'+fmtUSD(bsr[i])+'</span></div>' : '');
  TIP.style.display='block';
  const bw = TIP.offsetWidth, bh = TIP.offsetHeight;
  TIP.style.left = Math.min(window.innerWidth-bw-12, e.clientX+16)+'px';
  TIP.style.top  = Math.min(window.innerHeight-bh-12, e.clientY+16)+'px';
});
CV.addEventListener('mouseleave', ()=>TIP.style.display='none');
CV.addEventListener('dblclick', ()=>{ S.zoomT = S.zoomT > 0.5 ? 0 : 1; });

/* ============================ Teilen ============================ */
(function(){
  const url = location.href;
  const txt = 'Bitcoin hat den Power-Law-Boden wieder getroffen — zum fünften Mal.';
  document.getElementById('sh_wa').href = 'https://wa.me/?text='+encodeURIComponent(txt+' '+url);
  document.getElementById('sh_x').href  = 'https://twitter.com/intent/tweet?text='+
    encodeURIComponent(txt)+'&url='+encodeURIComponent(url);
  document.getElementById('sh_cp').addEventListener('click', ev=>{
    ev.preventDefault();
    const lbl = document.getElementById('cp_lbl');   // nur die Beschriftung anfassen
    const done = ()=>{ lbl.textContent='Kopiert ✓'; setTimeout(()=>lbl.textContent='Link kopieren', 1900); };
    if(navigator.clipboard) navigator.clipboard.writeText(url).then(done, done);
    else done();
  });
})();

/* ============================ Tasten ============================ */
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(k==='escape'){ endCinema(); return; }
  if(k==='s' || k==='t'){ startCinema('st'); }
  if(k==='a' || k==='r'){ startCinema('ar'); }
});

/* ============================ Start ============================ */
recompute();
buildNow();
FAN = buildFan();
FANCOUNT = FAN.length;
updatePanel();
window.addEventListener('resize', ()=>{ ensureSize(); });
ensureSize();
loop();
</script>
