<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Arial Black',Arial,sans-serif; color:#FFF; font-weight:900; }
canvas { display:block; width:100%; height:100%; cursor:crosshair; touch-action:none; }

.panel {
    position:fixed; bottom:24px; left:24px; width:320px;
    background:rgba(0,0,0,0.95); border:3px solid #F7931A; z-index:100;
    backdrop-filter:blur(20px);
    box-shadow:0 0 60px rgba(247,147,26,0.55), inset 0 0 30px rgba(247,147,26,0.08);
    border-radius:4px; transition: transform .3s ease, opacity .3s ease;
}
.panel-header {
    padding:14px 16px;
    background:linear-gradient(135deg,#F7931A,#FF6B35);
    cursor:grab; display:flex; justify-content:space-between; align-items:center;
    letter-spacing:2px; border-radius:2px 2px 0 0; gap:24px;
}
.panel-header:active { cursor:grabbing; }
.panel-title { color:#000; font-size:15px; font-weight:900; }
.toggle-btn {
    background:#000; border:none; color:#F7931A;
    font-size:12px; cursor:pointer; padding:2px 8px;
    font-weight:900; border-radius:2px;
    min-width:26px; height:22px; line-height:1;
    transition: background .15s, transform .15s;
}
.toggle-btn:hover { background:#222; transform:scale(1.15); }
.panel.collapsed .panel-body { display:none; }
.panel-body { padding:18px; max-height:70vh; overflow-y:auto; }
.panel-body::-webkit-scrollbar { width:6px; }
.panel-body::-webkit-scrollbar-thumb { background:#F7931A; border-radius:3px; }

.control-group { margin-bottom:14px; }
.group-label {
    color:#F7931A; text-transform:uppercase; font-size:12px; font-weight:900;
    letter-spacing:2px; border-left:4px solid #F7931A; padding-left:10px;
    margin-bottom:12px; cursor:pointer; user-select:none;
    display:flex; align-items:center; justify-content:space-between;
    padding-right:8px; transition: color .15s, background .15s;
    padding-top:4px; padding-bottom:4px;
}
.group-label:hover { color:#FFF; background:rgba(247,147,26,0.08); }
.group-arrow { font-size:10px; transition: transform .25s; display:inline-block; color:#F7931A; }
.control-group.collapsed .group-arrow { transform: rotate(-90deg); }
.control-group.collapsed .group-body { display:none; }
.group-body { animation: fadeIn .25s ease; }
@keyframes fadeIn { from{opacity:0; transform: translateY(-4px);} to{opacity:1; transform:none;} }

.checkbox-row {
    display:flex; align-items:center; gap:10px; margin:7px 0; padding:6px;
    cursor:pointer; border-radius:3px; transition: background .15s, transform .1s;
}
.checkbox-row:hover { background:rgba(247,147,26,0.12); transform: translateX(2px); }
.checkbox-row input { cursor:pointer; accent-color:#F7931A; width:17px; height:17px; }
.checkbox-row label { cursor:pointer; font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.5px; flex:1; }
.color-dot { width:11px; height:11px; flex-shrink:0; border-radius:50%; box-shadow:0 0 6px currentColor; }

.slider-row { margin:12px 0; }
.slider-label { display:flex; justify-content:space-between; font-size:11px; margin-bottom:7px; text-transform:uppercase; font-weight:900; }
.slider-label-val { color:#F7931A; font-size:13px; }
input[type="range"] {
    width:100%; height:7px;
    background:linear-gradient(90deg,rgba(247,147,26,.2),rgba(247,147,26,.35));
    border-radius:4px; border:none; -webkit-appearance:none; cursor:pointer;
}
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance:none; width:17px; height:17px; border-radius:50%;
    background:#F7931A; border:2px solid #FFF; cursor:pointer; box-shadow:0 0 12px #F7931A;
}

.btn-group { display:flex; gap:9px; margin-top:12px; }
button {
    flex:1; background:rgba(247,147,26,.13); border:2px solid #F7931A; color:#F7931A;
    padding:10px; cursor:pointer; font-family:'Arial Black'; text-transform:uppercase;
    font-size:11px; font-weight:900; transition:all .18s; border-radius:3px; letter-spacing:1px;
}
button:hover { background:#F7931A; color:#000; box-shadow:0 0 22px #F7931A; }

.stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
.stat { background:rgba(247,147,26,.08); border:2px solid rgba(247,147,26,.45); padding:11px; border-radius:3px; }
.stat-label { font-size:9px; text-transform:uppercase; margin-bottom:5px; letter-spacing:1px; }
.stat-val { font-size:14px; color:#FFF; font-weight:900; }
.hint { font-size:9px; color:#888; margin-top:7px; font-weight:400; line-height:1.4; font-style:italic; }

/* Distance legend */
.legend-bar {
    height:14px; border-radius:3px; margin-top:6px;
    background: linear-gradient(90deg, #1B0C41 0%, #4A0C6B 18%, #781C6D 32%, #BB3754 50%, #ED6925 68%, #FCB519 85%, #FCFFA4 100%);
    box-shadow: 0 0 12px rgba(252,181,25,.35);
}
.legend-ticks { display:flex; justify-content:space-between; font-size:10px; color:#bbb; margin-top:4px; font-weight:700; }

#tooltip {
    position:fixed; z-index:200; pointer-events:none;
    background:rgba(0,0,0,.97); border:2px solid #F7931A;
    padding:14px 16px; min-width:260px; max-width:320px;
    box-shadow:0 0 30px rgba(247,147,26,.5);
    backdrop-filter:blur(12px);
    opacity:0; transition: opacity .12s, transform .12s;
    transform: translateY(4px); border-radius:3px;
}
#tooltip.show { opacity:1; transform: translateY(0); }
.tt-year { color:#F7931A; font-size:20px; font-weight:900; margin-bottom:10px; letter-spacing:1px; padding-bottom:8px; border-bottom:2px solid rgba(247,147,26,.35); }
.tt-row { display:flex; justify-content:space-between; gap:14px; margin:5px 0; align-items:center; }
.tt-key { display:flex; align-items:center; gap:8px; font-size:11px; text-transform:uppercase; font-weight:900; letter-spacing:.5px; }
.tt-key-dot { width:9px; height:9px; border-radius:50%; box-shadow:0 0 6px currentColor; flex-shrink:0; }
.tt-val { font-weight:900; font-size:13px; color:#FFF; font-family:'Courier New',monospace; }
.tt-note { color:#bbb; font-size:11px; margin-top:10px; font-weight:400; line-height:1.55; padding-top:9px; border-top:1px solid rgba(255,255,255,.1); }
.tt-event { color:#FFD700; font-size:11px; margin-top:9px; font-weight:900; line-height:1.45; padding-top:8px; border-top:1px solid rgba(255,215,0,.25); }

#shareBar { position:fixed; right:0; top:50%; transform: translateY(-50%); z-index:120; display:flex; align-items:center; }
.share-trigger {
    width:8px; height:140px;
    background: linear-gradient(180deg, #F7931A, #FF6B35);
    box-shadow: 0 0 25px rgba(247,147,26,.7);
    border-radius:6px 0 0 6px; cursor:pointer; transition: width .2s;
    display:flex; align-items:center; justify-content:center;
    color:#000; font-weight:900; font-size:10px;
    writing-mode: vertical-rl; transform: rotate(180deg);
    letter-spacing:3px; text-transform:uppercase;
}
.share-trigger:hover { width:14px; }
.share-options {
    background:rgba(0,0,0,0.96);
    border:3px solid #F7931A; border-right:none;
    border-radius:6px 0 0 6px; padding:14px 10px;
    display:flex; flex-direction:column; gap:10px;
    box-shadow: -10px 0 40px rgba(247,147,26,.5);
    max-width:0; overflow:hidden; opacity:0;
    transition: max-width .35s cubic-bezier(.4,0,.2,1), opacity .25s, padding .35s;
    padding-left:0; padding-right:0;
}
#shareBar:hover .share-options, #shareBar.open .share-options {
    max-width:200px; opacity:1; padding-left:12px; padding-right:12px;
}
.share-btn {
    display:flex; align-items:center; gap:10px;
    background: rgba(247,147,26,.1); border:2px solid #F7931A; color:#F7931A;

#watermark .wm-wally { color:#F7931A; font-weight:900; font-size:20px; letter-spacing:1px; text-shadow: 0 0 10px rgba(247,147,26,0.6); }

@media (max-width: 768px) {

    #watermark .wm-wally { font-size:15px; }

const GENESIS = new Date('2009-01-03T00:00:00Z');
const PL_A = 4.22115e-18;
const PL_B = 5.81846;

for (const [d, p, s] of RAW_DATA) {

const LAST_SUPPORT_EXCEL = RAW_DATA[RAW_DATA.length-1][2];
// Skaliere die Extrapolation so, dass sie am letzten Excel-Wert nahtlos anschliesst.
const _lastDays = (LAST_DATE - GENESIS) / 86400000;
const _fitAtLast = PL_A * Math.pow(_lastDays, PL_B);
const PL_SCALE = LAST_SUPPORT_EXCEL / _fitAtLast;
const END_DATE  = new Date(Date.UTC(LAST_DATE.getUTCFullYear()+10, LAST_DATE.getUTCMonth(), LAST_DATE.getUTCDate()));
{

    while (cursor <= END_DATE) {
        const days = (cursor - GENESIS) / 86400000;
        const support = PL_A * PL_SCALE * Math.pow(days, PL_B);
        const iso = cursor.toISOString().slice(0,10);
        ROWS.push({ date: iso, t: cursor.getTime(), price: null, support: support, future:true });
        cursor = new Date(cursor.getTime() + 7*24*3600*1000);

}

function fmtUSD(v) {

// Inferno colormap, pseudo-log auf ratio x1..x20.
// Eingang: log10(price/support). t=0 bei x1 (dunkel), t=1 bei x20 (hell).
const LOG20 = Math.log10(20);
function distColor(ratioLog) {
    let t = ratioLog / LOG20;
    if (t < 0) t = 0; else if (t > 1) t = 1;
    const stops = [
        [0.00, [ 27, 12, 65]],
        [0.18, [ 74, 12,107]],
        [0.32, [120, 28,109]],
        [0.50, [187, 55, 84]],
        [0.68, [237,105, 37]],
        [0.85, [252,181, 25]],
        [1.00, [252,255,164]],
    ];
    for (let i=0; i<stops.length-1; i++) {
        if (t <= stops[i+1][0]) {
            const u = (t - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
            const c0 = stops[i][1], c1 = stops[i+1][1];
            const R = Math.round(c0[0]+(c1[0]-c0[0])*u);
            const G = Math.round(c0[1]+(c1[1]-c0[1])*u);
            const B = Math.round(c0[2]+(c1[2]-c0[2])*u);
            return `rgb(${R},${G},${B})`;
        }
    }
    return 'rgb(252,255,164)';
}

    if (k === 's') { _stKeyTs = performance.now(); }
    else if (k === 't' && performance.now() - _stKeyTs < 1200) {
        animActive = true; animStart = performance.now(); _stKeyTs = 0;
    } else if (k !== 's') { _stKeyTs = 0; }
});

const canvas = document.getElementById('chart');
const ctx    = canvas.getContext('2d');
const DPR    = window.devicePixelRatio || 1;

let mx=-1, my=-1;

// Particles
const PARTICLES = [];

    const N = Math.min(70, Math.floor((innerWidth*innerHeight)/22000));
    for (let i=0;i<N;i++) {
        PARTICLES.push({
            x: Math.random()*innerWidth, y: Math.random()*innerHeight,
            vx: (Math.random()-0.5)*0.15, vy:(Math.random()-0.5)*0.15,
            r: Math.random()*1.4+0.4, twinkle: Math.random()*Math.PI*2
        });
    }
}

})();

// =================================================================
// DRAW
// =================================================================
function draw() {
    updateLayerAnim();
    const W=innerWidth, H=innerHeight;
    const isMobile = W < 768;
    const m = isMobile
        ? {top:70, right:30, bottom: H*0.45 + 40, left:90}
        : {top:140, right:220, bottom:120, left:150};
    const cw = W - m.left - m.right;
    const ch = H - m.top - m.bottom;
    const x0 = m.left, y0 = m.top + ch;

    let progress = animActive ? Math.min(1, (performance.now()-animStart)/ANIM_DURATION) : 1;
    if (progress >= 1) animActive = false;
    const pAxes    = subProg(0.00, 0.20, progress);
    const pLabels  = subProg(0.10, 0.25, progress);
    const pSegs    = subProg(0.20, 0.55, progress);
    const pLines   = subProg(0.30, 0.75, progress);
    const pEvents  = subProg(0.65, 0.90, progress);
    const pTitle   = subProg(0.50, 0.90, progress);

    // Background — pure black, no overlays
    ctx.fillStyle = '#000000'; ctx.fillRect(0,0,W,H);

    // Filter rows by year window
    const t1 = Date.UTC(S.y1,0,1), t2 = Date.UTC(S.y2,11,31);
    const filtered = ROWS.filter(d => d.t >= t1 && d.t <= t2);
    if (filtered.length < 2) return;

    const tMin = filtered[0].t, tMax = filtered[filtered.length-1].t;
    const tSpan = tMax - tMin || 1;

    // Y log range
    let lo=Infinity, hi=-Infinity;
    for (const d of filtered) {
        if (d.price && d.price < lo) lo = d.price;
        if (d.support && d.support < lo) lo = d.support;
        if (d.price && d.price > hi) hi = d.price;
        if (d.support && d.support > hi) hi = d.support;
    }
    // Y range adaptiv: passt sich an gewaehlten Zeitraum an,
    // aber Hartboden bei $0.10 (Decade -1).
    const Y_FLOOR = 0.10;
    const loEff = Math.max(lo, Y_FLOOR);
    let minLog = Math.floor(Math.log10(loEff) - 0.04);
    if (minLog < -1) minLog = -1;
    const maxLog = Math.ceil(Math.log10(hi) + 0.04);

    const xP = t   => x0 + (t - tMin)/tSpan * cw;
    const yP = val => y0 - (Math.log10(Math.max(val, Math.pow(10,minLog))) - minLog) / (maxLog - minLog) * ch;

    // ── Future label (no band — Chart bleibt #000000)
    if (layerAnim[4] > 0.001) {
        const futT = LAST_DATE.getTime();
        if (futT >= tMin && futT <= tMax) {
            const xf = xP(futT);
            const pT = performance.now()/1000;
            const fade = 0.55 + 0.45 * Math.sin(pT * 1.3);
            ctx.save();
            ctx.globalAlpha = 0.75 * layerAnim[4] * (animActive ? pTitle : 1) * fade;
            ctx.fillStyle = '#F7931A';
            ctx.font = '900 ' + (isMobile?15:20) + 'px "Arial Black",Arial';
            ctx.textAlign='left'; ctx.textBaseline='top';
            ctx.shadowColor = '#F7931A'; ctx.shadowBlur = 14;
            ctx.fillText('PROGNOSE', xf+10, m.top+12);
            ctx.restore();
        }
    }

    // ── Gridlines (log Y, year X)
    ctx.save();
    ctx.globalAlpha = pAxes;
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 1;
    for (let p = minLog; p <= maxLog; p++) {
        const yp = yP(Math.pow(10,p));
        ctx.beginPath(); ctx.moveTo(x0,yp); ctx.lineTo(x0+cw,yp); ctx.stroke();
        for (let m2=2; m2<=9; m2++) {
            const yp2 = yP(Math.pow(10,p)*m2);
            if (yp2<m.top||yp2>y0) continue;
            ctx.strokeStyle='rgba(255,255,255,0.025)';
            ctx.beginPath(); ctx.moveTo(x0,yp2); ctx.lineTo(x0+cw,yp2); ctx.stroke();
            ctx.strokeStyle='rgba(255,255,255,0.07)';
        }
    }
    const yearSpan = S.y2 - S.y1;
    const xStep = yearSpan <= 6 ? 1 : yearSpan <= 14 ? 2 : 5;
    for (let y = Math.ceil(S.y1/xStep)*xStep; y <= S.y2; y += xStep) {
        const xp = xP(Date.UTC(y,0,1));
        if (xp - x0 < 24) continue; // tick zu nah am linken Rand ueberspringen (z.B. "2010")
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.beginPath(); ctx.moveTo(xp,m.top); ctx.lineTo(xp,y0); ctx.stroke();
    }
    ctx.restore();

    // ── Axes
    ctx.save();
    ctx.strokeStyle='#FFF'; ctx.lineWidth=4;
    ctx.shadowColor='rgba(255,255,255,0.35)'; ctx.shadowBlur=12;
    const axDraw = easeOut(pAxes);
    ctx.beginPath();
    ctx.moveTo(x0, m.top); ctx.lineTo(x0, m.top + ch*axDraw);
    if (axDraw >= 1) ctx.lineTo(x0 + cw*axDraw, y0);
    ctx.stroke();
    if (axDraw < 1) { ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x0+cw*axDraw, y0); ctx.stroke(); }
    ctx.shadowBlur = 0;
    ctx.restore();

    // Y labels — large with glow
    ctx.save();
    ctx.globalAlpha = pLabels;
    ctx.fillStyle='#FFF';
    const yFS = isMobile?19:28;
    ctx.font = '900 '+yFS+'px "Arial Black",Arial';
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.shadowColor = 'rgba(247,147,26,0.45)';
    ctx.shadowBlur = 10;
    const startP = Math.ceil(minLog);
    for (let p = startP; p <= maxLog; p++) {
        const yp = yP(Math.pow(10,p));
        if (yp<m.top-5||yp>y0+5) continue;
        ctx.strokeStyle='#FFF'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(x0-16,yp); ctx.lineTo(x0,yp); ctx.stroke();
        ctx.fillText(fmtUSD(Math.pow(10,p)), x0-24, yp);
    }
    ctx.restore();

    // X labels — large with glow
    ctx.save();
    ctx.globalAlpha = pLabels;
    ctx.fillStyle='#FFF';
    const xFS = isMobile?19:28;
    ctx.font = '900 '+xFS+'px "Arial Black",Arial';
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.shadowColor = 'rgba(247,147,26,0.45)';
    ctx.shadowBlur = 10;
    for (let y = Math.ceil(S.y1/xStep)*xStep; y <= S.y2; y += xStep) {
        const xp = xP(Date.UTC(y,0,1));
        if (xp - x0 < 24) continue; // tick zu nah am linken Rand ueberspringen (z.B. "2010")
        ctx.strokeStyle='#FFF'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(xp,y0); ctx.lineTo(xp,y0+16); ctx.stroke();
        ctx.fillText(String(y), xp, y0+26);
    }
    ctx.restore();

    // ── DISTANCE SEGMENTS (price ↔ support) — gap-free filled rects
    let segMinX = Infinity, segMaxX = -Infinity, segMinY = Infinity, segMaxY = -Infinity;
    if (layerAnim[3] > 0.001) {
        const drawT = tMin + (tMax - tMin) * easeInOut(pSegs);
        const N = filtered.length;
        ctx.save();
        ctx.globalAlpha = layerAnim[3] * 0.92;
        for (let i=0; i<N-1; i++) {
            const d = filtered[i];
            if (d.t > drawT) break;
            if (d.price == null || d.support == null) continue;
            const dn = filtered[i+1];
            const x1 = xP(d.t);
            const x2 = xP(Math.min(dn.t, drawT));
            const yPrc = yP(d.price);
            const ySup = yP(d.support);
            const ratioLog = Math.log10(d.price / d.support);
            ctx.fillStyle = distColor(ratioLog);
            const yMin = Math.min(yPrc, ySup);
            const yMax = Math.max(yPrc, ySup);
            ctx.fillRect(x1, yMin, (x2 - x1) + 0.6, (yMax - yMin) + 0.5);
            if (x1 < segMinX) segMinX = x1;
            if (x2 > segMaxX) segMaxX = x2;
            if (yMin < segMinY) segMinY = yMin;
            if (yMax > segMaxY) segMaxY = yMax;
        }
        ctx.restore();

        // Shimmer: heller, wandernder Lichtstreifen ueber die Segmente
        if (isFinite(segMinX) && segMaxX > segMinX) {
            const period = 6.5;
            const phase = (performance.now() / 1000) % period / period;
            const stripeW = (segMaxX - segMinX) * 0.18;
            const cxS = segMinX - stripeW + (segMaxX - segMinX + stripeW*2) * phase;
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = layerAnim[3] * 0.35;
            const grd = ctx.createLinearGradient(cxS - stripeW, 0, cxS + stripeW, 0);
            grd.addColorStop(0,   'rgba(255,255,255,0)');
            grd.addColorStop(0.5, 'rgba(255,255,255,0.55)');
            grd.addColorStop(1,   'rgba(255,255,255,0)');
            ctx.fillStyle = grd;
            // clip to segments bounding box so shimmer only over inferno area
            ctx.beginPath();
            ctx.rect(segMinX, segMinY, segMaxX-segMinX, segMaxY-segMinY);
            ctx.clip();
            ctx.fillRect(cxS - stripeW, segMinY, stripeW*2, segMaxY-segMinY);
            ctx.restore();
        }
    }

    // helper — multi-pass glow line
    function glowLine(points, color, baseW, dashed) {
        if (points.length < 2) return;
        // 3 passes: wide soft halo, medium glow, sharp core
        const passes = [
            {w: baseW*4.5, a: 0.10, blur: 28},
            {w: baseW*2.2, a: 0.35, blur: 16},
            {w: baseW,     a: 1.00, blur: 8},
        ];
        for (const ps of passes) {
            ctx.save();
            ctx.globalAlpha *= ps.a;
            ctx.strokeStyle = color;
            ctx.lineWidth = ps.w;
            ctx.lineCap='round'; ctx.lineJoin='round';
            ctx.shadowColor = color;
            ctx.shadowBlur = ps.blur;
            if (dashed) ctx.setLineDash([10,6]); else ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(points[0][0], points[0][1]);
            for (let i=1; i<points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
            ctx.stroke();
            ctx.restore();
        }
    }

    // ── POWER-LAW SUPPORT LINE (orange)
    let supportEnd = null;
    function drawSupport() {
        if (layerAnim[2] <= 0.001) return;
        const lineProg = animActive ? Math.min(pLines, layerAnim[2]) : layerAnim[2];
        if (lineProg <= 0) return;
        const drawT = tMin + (tMax - tMin) * easeInOut(lineProg);
        const futStart = LAST_DATE.getTime();
        const histPts = [], futPts = [];
        for (const d of filtered) {
            if (d.t > drawT) break;
            const xp=xP(d.t), yp=yP(d.support);
            if (d.t <= futStart) histPts.push([xp,yp]);
            else if (layerAnim[4] > 0.001) futPts.push([xp,yp]);
        }
        ctx.save();
        ctx.globalAlpha = layerAnim[2];
        glowLine(histPts, '#F7931A', isMobile?2.6:3.6, false);
        ctx.globalAlpha = layerAnim[2] * layerAnim[4];
        glowLine(futPts, '#F7931A', isMobile?2.2:3.0, true);
        ctx.restore();
        const lastArr = futPts.length ? futPts : histPts;
        if (lastArr.length) supportEnd = lastArr[lastArr.length-1];
    }

    // ── BTC PRICE LINE (weiss)
    let priceEnd = null;
    function drawPrice() {
        if (layerAnim[1] <= 0.001) return;
        const lineProg = animActive ? Math.min(pLines, layerAnim[1]) : layerAnim[1];
        if (lineProg <= 0) return;
        const drawT = tMin + (tMax - tMin) * easeInOut(lineProg);
        const pts = [];
        for (const d of filtered) {
            if (d.t > drawT) break;
            if (d.price == null) break;
            pts.push([xP(d.t), yP(d.price)]);
        }
        ctx.save();
        ctx.globalAlpha = layerAnim[1];
        glowLine(pts, '#FFFFFF', isMobile?2.6:3.6, false);
        ctx.restore();
        if (pts.length) priceEnd = pts[pts.length-1];
    }

    drawSupport();
    drawPrice();

    // ── Pulsierende End-Glow auf Preis- und Support-Linie
    const pulseT = performance.now() / 1000;
    function pulseDot(p, color) {
        if (!p) return;
        const pulse = 0.55 + 0.45 * Math.sin(pulseT * 2.4);
        const ringR = 14 + 10 * pulse;
        ctx.save();
        // outer ring
        const grd = ctx.createRadialGradient(p[0], p[1], 2, p[0], p[1], ringR);
        grd.addColorStop(0, color);
        grd.addColorStop(0.35, color.replace('rgb','rgba').replace(')',',0.5)'));
        grd.addColorStop(1, color.replace('rgb','rgba').replace(')',',0)'));
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(p[0], p[1], ringR, 0, Math.PI*2); ctx.fill();
        // sharp core
        ctx.fillStyle = '#FFFFFF';
        ctx.shadowColor = color; ctx.shadowBlur = 24;
        ctx.beginPath(); ctx.arc(p[0], p[1], isMobile?3.5:4.5, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }
    pulseDot(supportEnd, 'rgb(247,147,26)');
    pulseDot(priceEnd,   'rgb(255,255,255)');

    // ── HEUTE-MARKER (vertikale Linie mit Puls)
    {
        const todayTs = Date.now();
        if (todayTs >= tMin && todayTs <= tMax) {
            const xT = xP(todayTs);
            const breathe = 0.65 + 0.35 * Math.sin(pulseT * 1.6);
            ctx.save();
            ctx.globalAlpha = (animActive ? pLabels : 1) * 0.95;
            // outer haze
            const haze = ctx.createLinearGradient(xT-10, 0, xT+10, 0);
            haze.addColorStop(0, 'rgba(255,255,255,0)');
            haze.addColorStop(0.5, `rgba(255,255,255,${0.18*breathe})`);
            haze.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = haze;
            ctx.fillRect(xT-10, m.top, 20, ch);
            // crisp dashed line
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = isMobile ? 1.8 : 2.4;
            ctx.setLineDash([7, 5]);
            ctx.shadowColor = '#FFFFFF'; ctx.shadowBlur = 12*breathe;
            ctx.beginPath(); ctx.moveTo(xT, m.top); ctx.lineTo(xT, y0); ctx.stroke();
            ctx.setLineDash([]); ctx.shadowBlur = 0;
            // Label
            ctx.fillStyle = '#FFFFFF';
            ctx.font = '900 ' + (isMobile?16:22) + 'px "Arial Black",Arial';
            ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
            ctx.shadowColor = '#000'; ctx.shadowBlur = 10;
            ctx.fillText('HEUTE', xT, m.top - 10);
            ctx.restore();
        }
    }

    // ── EVENTS (crisis markers) — sanft pulsierend
    if (layerAnim[5] > 0.001 && pEvents > 0) {
        EVENT_ROWS.forEach((ev, i) => {
            if (ev.t < tMin || ev.t > tMax) return;
            const row = ROWS[ev.idx];
            const xp = xP(ev.t);
            const yp = row.price ? yP(row.price) : yP(row.support);
            const op = easeOut(subProg(i*0.025, i*0.025+0.3, pEvents)) * layerAnim[5];
            if (op <= 0) return;
            const phase = i * 0.7;
            const pulse = 0.55 + 0.45 * Math.sin(pulseT * 1.8 + phase);
            // hex -> rgb
            const hx = ev.color.replace('#','');
            const cR = parseInt(hx.substring(0,2),16);
            const cG = parseInt(hx.substring(2,4),16);
            const cB = parseInt(hx.substring(4,6),16);
            ctx.save();
            // ambient halo
            const haloR = (isMobile?14:22) + 8*pulse;
            const halo = ctx.createRadialGradient(xp,yp,0, xp,yp, haloR);
            halo.addColorStop(0,   `rgba(${cR},${cG},${cB},0.9)`);
            halo.addColorStop(0.5, `rgba(${cR},${cG},${cB},0.25)`);
            halo.addColorStop(1,   `rgba(${cR},${cG},${cB},0)`);
            ctx.fillStyle = halo;
            ctx.globalAlpha = op * 0.7 * (0.5 + 0.5*pulse);
            ctx.beginPath(); ctx.arc(xp, yp, haloR, 0, Math.PI*2); ctx.fill();
            // dashed connector
            ctx.globalAlpha = op * 0.4;
            ctx.strokeStyle = ev.color;
            ctx.setLineDash([3,4]); ctx.lineWidth=1.4;
            ctx.beginPath(); ctx.moveTo(xp, m.top); ctx.lineTo(xp, yp-8); ctx.stroke();
            ctx.setLineDash([]);
            // pin head
            ctx.globalAlpha = op;
            ctx.fillStyle = ev.color;
            ctx.shadowColor = ev.color; ctx.shadowBlur = 18;
            ctx.beginPath(); ctx.arc(xp, yp, isMobile?6:7.5, 0, Math.PI*2); ctx.fill();
            // bright core
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath(); ctx.arc(xp, yp, isMobile?2.2:2.8, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        });
    }

    // ── CINEMATIC PHASE LABEL (nur waehrend Animation)
    if (animActive) {
        const phases = [
            {a:0.02, b:0.18, text:'ACHSEN'},
            {a:0.18, b:0.38, text:'ABSTAND'},
            {a:0.38, b:0.58, text:'POWER-LAW'},
            {a:0.58, b:0.78, text:'BITCOIN-PREIS'},
            {a:0.78, b:0.92, text:'KRISEN'},
            {a:0.92, b:1.00, text:'HEUTE'},
        ];
        for (const ph of phases) {
            if (progress < ph.a || progress > ph.b) continue;
            const local = (progress - ph.a) / (ph.b - ph.a);
            // fade in 0-0.18, hold, fade out 0.82-1.0
            let alpha;
            if (local < 0.18)      alpha = local / 0.18;
            else if (local > 0.82) alpha = (1 - local) / 0.18;
            else                   alpha = 1;
            alpha = Math.max(0, Math.min(1, alpha));
            const cxC = m.left + cw/2;
            const cyC = m.top + ch/2;
            const fs = Math.min(isMobile?42:64, Math.round(cw/16));
            ctx.save();
            ctx.globalAlpha = alpha * 0.7;
            ctx.font = '900 ' + fs + 'px "Arial Black",Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(247,147,26,0.55)';
            ctx.shadowBlur = 35;
            ctx.fillStyle = `rgba(247,147,26,0.30)`;
            ctx.fillText(ph.text, cxC, cyC);
            ctx.shadowBlur = 14;
            ctx.fillStyle = `rgba(255,255,255,0.85)`;
            ctx.fillText(ph.text, cxC, cyC);
            ctx.restore();
            break;
        }
    }

    // ── HOVER
    const tt = document.getElementById('tooltip');
    if (!animActive && mx >= x0 && mx <= x0+cw && my >= m.top && my <= y0) {
        const tAtMouse = tMin + (mx - x0)/cw * tSpan;
        let snap = filtered[0], bd = Infinity;
        for (const d of filtered) {
            const dd = Math.abs(d.t - tAtMouse);
            if (dd < bd) { bd = dd; snap = d; }
        }
        const xSnap = xP(snap.t);

        // Crosshair
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.28)';
        ctx.lineWidth=1; ctx.setLineDash([4,4]);
        ctx.beginPath(); ctx.moveTo(xSnap, m.top); ctx.lineTo(xSnap, y0); ctx.stroke();
        ctx.restore();

        // Dots
        if (snap.price && layerAnim[1] > 0.05) {
            const yp = yP(snap.price);
            ctx.save();
            ctx.fillStyle='#FFFFFF'; ctx.shadowColor='#FFFFFF'; ctx.shadowBlur=18;
            ctx.beginPath(); ctx.arc(xSnap, yp, 6, 0, Math.PI*2); ctx.fill();
            ctx.restore();
            ctx.strokeStyle='#000'; ctx.lineWidth=1.5;
            ctx.beginPath(); ctx.arc(xSnap, yp, 6, 0, Math.PI*2); ctx.stroke();
        }
        if (snap.support && layerAnim[2] > 0.05) {
            const yp = yP(snap.support);
            ctx.save();
            ctx.fillStyle='#F7931A'; ctx.shadowColor='#F7931A'; ctx.shadowBlur=18;
            ctx.beginPath(); ctx.arc(xSnap, yp, 6, 0, Math.PI*2); ctx.fill();
            ctx.restore();
            ctx.strokeStyle='#000'; ctx.lineWidth=1.5;
            ctx.beginPath(); ctx.arc(xSnap, yp, 6, 0, Math.PI*2); ctx.stroke();
        }

        // Tooltip content
        const ratio = snap.price && snap.support ? snap.price/snap.support : null;
        const ratioLog = ratio ? Math.log10(ratio) : 0;
        const ratioColor = distColor(ratioLog);

        // Find nearby event within ±21 days
        let nearbyEv = null, evBd = Infinity;
        for (const ev of EVENT_ROWS) {
            const dd = Math.abs(ev.t - snap.t);
            if (dd <= 21*86400000 && dd < evBd) { evBd = dd; nearbyEv = ev; }
        }

        const dateLbl = snap.date;
        const futureBadge = snap.future ? ' <span style="color:#F7931A;font-size:11px;">PROGNOSE</span>' : '';
        tt.innerHTML =
            `<div class="tt-year">${dateLbl}${futureBadge}</div>` +
            (snap.price != null ? `<div class="tt-row"><span class="tt-key" style="color:#FFFFFF"><span class="tt-key-dot" style="background:#FFFFFF;color:#FFFFFF"></span>BTC-PREIS</span><span class="tt-val">${fmtFull(snap.price)}</span></div>` : '') +
            `<div class="tt-row"><span class="tt-key" style="color:#F7931A"><span class="tt-key-dot" style="background:#F7931A;color:#F7931A"></span>POWER-LAW</span><span class="tt-val">${fmtFull(snap.support)}</span></div>` +
            (ratio != null ? `<div class="tt-row"><span class="tt-key" style="color:${ratioColor}"><span class="tt-key-dot" style="background:${ratioColor};color:${ratioColor}"></span>RATIO</span><span class="tt-val" style="color:${ratioColor}">x ${ratio.toFixed(2)}</span></div>` : '') +
            (ratio != null ? `<div class="tt-note">${
                ratio < 0.90 ? 'Preis <strong>unter</strong> Support &mdash; Modell-Bruch-Risiko'
              : ratio < 1.15 ? '<strong>Am Support</strong> &mdash; Modell-Test-Zone'
              : ratio < 1.60 ? 'Knapp ueber Support &mdash; Akkumulations-Zone'
              : ratio < 2.50 ? 'Solide ueber Support'
              : ratio < 4.50 ? 'Stark ueber Support &mdash; Bull-Phase'
              :                'Weit ueber Support &mdash; historische Top-Zone'
            }</div>` : '') +
            (nearbyEv ? `<div class="tt-event">${nearbyEv.label}<br><span style="color:#888;font-weight:400;">${nearbyEv.date}</span></div>` : '');
        tt.classList.add('show');

        const ttW = tt.offsetWidth || 280;
        const ttH = tt.offsetHeight || 200;
        let tx = mx + 18, ty = my - ttH/2;
        if (tx + ttW > W - 20) tx = mx - ttW - 18;
        ty = Math.max(10, Math.min(ty, H - ttH - 10));
        tt.style.left = tx+'px';
        tt.style.top  = ty+'px';
    } else {
        tt.classList.remove('show');
    }

    // ── Stats panel
    // Use latest historical row in window
    let latest = null;
    for (const d of filtered) if (d.price != null) latest = d;
    if (latest) {
        document.getElementById('sPrice').textContent  = fmtFull(latest.price);
        document.getElementById('sSupport').textContent = fmtFull(latest.support);
        const r = latest.price / latest.support;
        document.getElementById('sRatio').textContent = 'x ' + r.toFixed(2);
        const stEl = document.getElementById('sStatus');
        if (r < 0.90)      { stEl.textContent='UNTER';    stEl.style.color='#FF3B3B'; }
        else if (r < 1.15) { stEl.textContent='AM SUPP.'; stEl.style.color='#FF8A30'; }
        else if (r < 1.60) { stEl.textContent='AKKUM.';   stEl.style.color='#F7931A'; }
        else if (r < 2.50) { stEl.textContent='SOLIDE';   stEl.style.color='#FFD700'; }
        else if (r < 4.50) { stEl.textContent='BULL';     stEl.style.color='#FCB519'; }
        else               { stEl.textContent='EUPHORIE'; stEl.style.color='#FCFFA4'; }
    }
}

function loop() { draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
