/* Zwei Unsicherheiten, ein Regler: Der Bewertungs-Boden wird eingestellt,
   die Unsicherheit ueber die kuenftige Kapitalbasis bildet die Bandbreite.
   Untere Kante unterstellt einen Rueckgang wie 2022 (-11,7 %).          */
const KB_STRESS = -0.117;
const floorHigh = function () { return S.floor * KB[NOWI]; };
const floorLow = function () { return S.floor * KB[NOWI] * (1 + KB_STRESS); };
/* Das Bedienfeld liegt ueber der Zeichenflaeche. Beschriftungen, die
   darunter geraten wuerden, waeren im Video unlesbar — also gilt es als
   Hindernis wie jede andere Beschriftung auch. */
const _pnl = document.getElementById('panel');
function panelBox() {
  const r = _pnl.getBoundingClientRect();
  return { x0: r.left - 10, x1: r.right, y0: r.top - 6, y1: r.bottom + 6 };
}
const overlaps = function (a, b) { return a.x0 < b.x1 && b.x0 < a.x1 && a.y0 < b.y1 && b.y0 < a.y1; };

/* ========================= render ========================= */
function render(now, F) {
  now = now || performance.now();
  F = F || {};
  if (cvs.width !== Math.round(S.W * Math.min(window.devicePixelRatio || 1, 2)) || S.W !== window.innerWidth || S.H !== window.innerHeight) resize();
  applyView(F.zoom == null ? S.zoom : F.zoom);
  const a = area();
  const pP = F.priceProg == null ? 1 : F.priceProg;
  const cP = F.capProg == null ? 1 : F.capProg;
  const mP = F.mkProg == null ? 1 : F.mkProg;
  const hP = F.hsProg == null ? 1 : F.hsProg;
  const dim = F.dim == null ? 0 : F.dim;
  const zoomK = F.push == null ? 0 : F.push;

  ctx.clearRect(0, 0, S.W, S.H);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, S.W, S.H);
  ctx.save();
  if (zoomK) { const k = 1 + zoomK * 0.075; ctx.translate(S.W / 2, S.H / 2); ctx.scale(k, k); ctx.translate(-S.W / 2, -S.H / 2); }
  ctx.globalAlpha = 1 - dim * 0.82;

  /* ---- Gitter + Achsen ---- */
  const axA = F.axProg == null ? 1 : F.axProg;
  if (axA > 0.01) {
    ctx.save(); ctx.globalAlpha *= axA;
    ctx.strokeStyle = 'rgba(255,255,255,.055)'; ctx.lineWidth = 1;
    ctx.font = '700 ' + (S.W < 900 ? 18 : 27) + 'px Inter,system-ui,sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.82)'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    yTicks().forEach(function (v) {
      const y = yP(v);
      if (y < a.y - 8 || y > a.y + a.h + 8) return;
      ctx.beginPath(); ctx.moveTo(a.x, y); ctx.lineTo(a.x + a.w, y); ctx.stroke();
      ctx.fillText('$' + fmtAxis(v), a.x - 12, y);
    });
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const spanY = V.t1 - V.t0;
    const marks = [];
    if (spanY > 6) {
      const stepY = S.W < 900 ? 4 : 2;
      for (let yy = 2012; yy <= 2026; yy += stepY) marks.push([yearT(yy), String(yy)]);
    } else if (spanY > 2.6) {
      for (let yy = 2010; yy <= 2027; yy++) marks.push([yearT(yy), String(yy)]);
    } else {
      const stepM = S.W < 900 ? 6 : 3;
      for (let yy = 2010; yy <= 2027; yy++) for (let mm = 0; mm < 12; mm += stepM)
        marks.push([(Date.UTC(yy, mm, 1) - GEN) / DAY / 365.25, MON[mm] + ' ' + String(yy).slice(2)]);
    }
    marks.forEach(function (m) {
      const x = xT(m[0]);
      if (x < a.x - 2 || x > a.x + a.w + 2) return;
      ctx.strokeStyle = 'rgba(255,255,255,.045)'; ctx.beginPath(); ctx.moveTo(x, a.y); ctx.lineTo(x, a.y + a.h); ctx.stroke();
      ctx.fillText(m[1], x, a.y + a.h + 12);
    });
    ctx.restore();
  }

  const nVis = Math.max(2, Math.round(pP * (H - 1)));
  ctx.save();
  ctx.beginPath(); ctx.rect(a.x, a.y - 6, a.w, a.h + 6); ctx.clip();

  /* ---- Band zwischen Kurs und Kapitalbasis ----
     Exakt dieselbe Farbe wie im Bewertungs-Feld senkrecht darunter. */
  if (S.aKB > 0.01 && cP > 0.02) {
    const upto = Math.min(nVis, Math.round(cP * (H - 1)));
    for (let i = 0; i < upto; i++) {
      ctx.fillStyle = heatCol(BW[i], HS_ALPHA * S.aKB);
      ctx.beginPath();
      ctx.moveTo(xP(i), yP(PX[i])); ctx.lineTo(xP(i + 1), yP(PX[i + 1]));
      ctx.lineTo(xP(i + 1), yP(KB[i + 1])); ctx.lineTo(xP(i), yP(KB[i]));
      ctx.closePath(); ctx.fill();
    }
  }

  /* ---- Kapitalbasis (orange) ---- */
  if (S.aKB > 0.01 && cP > 0.005) {
    const n1 = Math.round(cP * (H - 1));
    ctx.save(); ctx.strokeStyle = '#F7931A'; ctx.lineWidth = S.W < 900 ? 2.8 : 3.8;
    ctx.globalAlpha *= S.aKB; ctx.shadowColor = 'rgba(247,147,26,.65)'; ctx.shadowBlur = 14;
    ctx.lineJoin = 'round'; ctx.beginPath();
    for (let i = 0; i <= n1; i++) { const x = xP(i), y = yP(KB[i]); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
    if (cP < 0.999) { const x = xP(n1), y = yP(KB[n1]); ctx.fillStyle = '#F7931A'; ctx.shadowBlur = 22; ctx.beginPath(); ctx.arc(x, y, 4.4, 0, 7); ctx.fill(); }
    ctx.restore();
  }

  /* ---- Preislinie ---- */
  ctx.save();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = S.W < 900 ? 3 : 4.4; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(255,255,255,.6)'; ctx.shadowBlur = 15;
  ctx.globalAlpha *= (F.priceAlpha == null ? 1 : F.priceAlpha);
  ctx.beginPath();
  for (let i = 0; i <= nVis; i++) { const x = xP(i), y = yP(PX[i]); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.stroke();
  if (pP < 0.999) { const x = xP(nVis), y = yP(PX[nVis]); ctx.fillStyle = '#fff'; ctx.shadowBlur = 22; ctx.beginPath(); ctx.arc(x, y, 4.6, 0, 7); ctx.fill(); }
  ctx.restore();

  /* ---- Zerlegung: zwei Gegenrechnungen ab dem Anker ----
     Gestrichelt und ueber der Kurslinie: Diese beiden Verlaeufe sind
     keine Kursdaten, sondern Rechnungen mit einer eingefrorenen Groesse.
     Die violette liegt fast auf dem Kurs — genau das ist der Befund, und
     unter der weissen Linie waere sie unsichtbar.                      */
  const zl = F.zlProg == null ? S.aZL : F.zlProg;
  if (zl > 0.01) {
    const k = HI[S.anchor];
    const n1 = k + Math.max(1, Math.round(zl * (H - 1 - k)));
    ctx.save(); ctx.globalAlpha *= Math.min(1, zl * 3);
    ctx.lineWidth = S.W < 900 ? 2.4 : 3.2; ctx.lineJoin = 'round';
    /* nur Kapital = Kapitalbasis mal fester Bewertung, also dieselbe Linie
       nur angehoben -> dieselbe Farbe, gestrichelt. nur Bewertung laeuft
       auf dem Kurs -> weiss. Die Farbe sagt selbst, was eingefroren ist. */
    ctx.strokeStyle = '#F7931A'; ctx.shadowColor = 'rgba(247,147,26,.55)'; ctx.shadowBlur = 12;
    ctx.setLineDash([11, 8]);
    ctx.beginPath();
    for (let i = k; i <= n1; i++) { const x = xP(i), y = yP(onlyCap(i, k)); i === k ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.shadowColor = 'rgba(255,255,255,.5)';
    ctx.setLineDash([4, 7]);
    ctx.beginPath();
    for (let i = k; i <= n1; i++) { const x = xP(i), y = yP(onlyVal(i, k)); i === k ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke(); ctx.shadowBlur = 0; ctx.setLineDash([]);
    if (zl > 0.985 && S.W >= 760) {
      ctx.font = '800 ' + (S.W < 1100 ? 14 : 17) + 'px Inter,system-ui,sans-serif';
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      /* nur ausweichen, wenn die Zeile tatsaechlich auf der Hoehe des
         Bedienfelds liegt — sonst bleibt der Platz bis zum Rand */
      const PB = panelBox();
      const xAt = function (yy) { return (yy >= PB.y0 && yy <= PB.y1) ? Math.min(xP(H - 1) - 10, PB.x0 - 6) : xP(H - 1) - 10; };
      const yA = yP(onlyCap(H - 1, k)) - 16, yB = yP(onlyVal(H - 1, k)) - 16;
      ctx.fillStyle = '#F7931A'; ctx.fillText('NUR KAPITAL  ' + fmtUSD(onlyCap(H - 1, k)), xAt(yA), yA);
      ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fillText('NUR BEWERTUNG  ' + fmtUSD(onlyVal(H - 1, k)), xAt(yB), yB);
    }
    ctx.restore();
  }

  /* ---- Bodenlinie aus den Reglern ---- */
  const bo = F.boProg == null ? S.aBO : F.boProg;
  if (bo > 0.01) {
    const yH = yP(floorHigh()), yL = yP(floorLow());
    ctx.save(); ctx.globalAlpha *= bo;
    ctx.fillStyle = 'rgba(31,227,196,.15)';
    ctx.fillRect(a.x, yH, a.w, yL - yH);
    ctx.strokeStyle = C_COLD; ctx.lineWidth = 2.2; ctx.setLineDash([10, 8]);
    [yH, yL].forEach(function (y) { ctx.beginPath(); ctx.moveTo(a.x, y); ctx.lineTo(a.x + a.w, y); ctx.stroke(); });
    ctx.setLineDash([]);
    ctx.font = '800 ' + (S.W < 900 ? 15 : 20) + 'px Inter,system-ui,sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillStyle = C_COLD;
    ctx.fillText('BODEN  ' + fmtUSD(floorLow()) + ' – ' + fmtUSD(floorHigh()), a.x + 12, yH - 8);
    ctx.restore();
  }

  ctx.restore();   /* Ende beschnittene Datenebene */

  /* ---- Bewertungs-Feld ---- */
  if (S.aHS > 0.01 && hP > 0.005) drawBewertung(hP, now);

  /* ---- Marker: gestaffelt, Hochs rot, Tiefs gruen ---- */
  if (mP > 0.001) {
    const items = [];
    HI.forEach(function (i) { items.push({ i: i, kind: 'top' }); });
    LO.forEach(function (i) { items.push({ i: i, kind: 'low' }); });
    items.sort(function (x, y) { return x.i - y.i; });
    const nI = items.length, ov = 0.5;
    ctx.save();
    items.forEach(function (m, k) {
      const lp = clamp01((mP - (k * (1 - ov) / nI)) / (1 / nI));
      const p = eo(lp); if (p <= 0.001) return;
      const x = xP(m.i), y = yP(PX[m.i]);
      const flash = p < 0.55 ? (1 - p / 0.55) : 0;
      const puls = 1 + 0.09 * Math.sin(now / 1250 * 2 * Math.PI + k * 0.9);
      const sc = (0.55 + 0.45 * p) * puls;
      ctx.save(); ctx.globalAlpha *= p;
      if (m.kind === 'top') {
        ctx.fillStyle = C_HOT; ctx.shadowColor = C_HOT; ctx.shadowBlur = 12 + flash * 34;
        diamond(ctx, x, y - 15, 8 * sc);
      } else {
        ctx.strokeStyle = C_COLD; ctx.lineWidth = 2.6; ctx.shadowColor = C_COLD; ctx.shadowBlur = 11 + flash * 30;
        ctx.beginPath(); ctx.arc(x, y + 17, 8 * sc, 0, 7); ctx.stroke();
        ctx.globalAlpha *= 0.4; ctx.beginPath(); ctx.arc(x, y + 17, 8 * sc + 5 + 4 * Math.sin(now / 1100 * 2 * Math.PI + k), 0, 7); ctx.stroke();
      }
      /* Bewusst ohne Textfahnen: neun zweizeilige Beschriftungen waren der
         groesste Stoerfaktor im Bild. Die Werte stehen im Bewertungsfeld
         und im Tooltip — hier zaehlt nur, WO die Wendepunkte liegen. */
      ctx.restore();
    });
    ctx.restore();
  }

  /* ---- Spotlight ---- */
  if (F.spot) {
    const x0 = xP(F.spot[0]), x1 = xP(F.spot[1]);
    ctx.save(); ctx.globalAlpha = (F.spotA == null ? 1 : F.spotA) * 0.6; ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, x0, S.H); ctx.fillRect(x1, 0, S.W - x1, S.H); ctx.restore();
  }

  /* ---- HEUTE-Marker ---- */
  const tdA = F.today == null ? 1 : F.today;
  if (tdA > 0.01) {
    const x = xP(H - 1), pu = 0.55 + 0.45 * Math.sin(now / 900 * 2 * Math.PI);
    ctx.save(); ctx.globalAlpha *= tdA;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.28 + 0.22 * pu) + ')'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 6]);
    ctx.beginPath(); ctx.moveTo(x, a.y); ctx.lineTo(x, a.y + a.h); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 10 + 12 * pu;
    ctx.beginPath(); ctx.arc(x, yP(PX[H - 1]), 5, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    ctx.font = '800 16px Inter,system-ui,sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillText('HEUTE', x - 8, a.y + 6);
    ctx.restore();
  }
  ctx.restore(); /* Datenebene */

  if (!F.hideBox) drawBox(now, F);

  /* ---- Wasserzeichen ---- */
  ctx.save();
  const wfs = S.W < 900 ? 26 : 36;
  ctx.globalAlpha = 0.95; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = '800 ' + wfs + 'px Inter,system-ui,sans-serif';
  /* Zwei Zeilen, exakt gleich breit und buendig uebereinander.
     GREAT und Y weiss, WALL in Bitcoin-Orange — wie in den uebrigen
     Episoden des Kanals. */
  const w1 = ctx.measureText('GREAT').width;
  const wA = ctx.measureText('WALL').width, wB = ctx.measureText('Y').width;
  const w2 = wA + wB;
  const wTarget = Math.max(w1, w2), wx = 30, wyB = S.H - 14;
  ctx.save(); ctx.translate(wx, wyB - wfs * 1.04); ctx.scale(wTarget / w1, 1);
  ctx.fillStyle = '#FFFFFF'; ctx.fillText('GREAT', 0, 0); ctx.restore();
  ctx.save(); ctx.translate(wx, wyB); ctx.scale(wTarget / w2, 1);
  ctx.fillStyle = '#F7931A'; ctx.fillText('WALL', 0, 0);
  ctx.fillStyle = '#FFFFFF'; ctx.fillText('Y', wA, 0); ctx.restore();
  ctx.restore();

  const vg = F.vig == null ? 0.16 : F.vig;
  if (vg > 0.01) {
    const g = ctx.createRadialGradient(S.W / 2, S.H / 2, Math.min(S.W, S.H) * 0.22, S.W / 2, S.H / 2, Math.max(S.W, S.H) * 0.78);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,' + (0.72 * vg) + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, S.W, S.H);
  }
  const gr = F.grain == null ? 0.045 : F.grain;
  if (gr > 0.004) {
    ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = gr;
    const off = (now / 55 | 0) % 160;
    for (let x = -off; x < S.W; x += 160) for (let y = -off; y < S.H; y += 160) ctx.drawImage(GRAIN, x, y);
    ctx.restore();
  }
  const bars = F.bars == null ? 0 : F.bars;
  if (bars > 0.002) { const bh = S.H * 0.12 * bars; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, S.W, bh); ctx.fillRect(0, S.H - bh, S.W, bh); }
  if (F.flash > 0.002) { ctx.fillStyle = 'rgba(255,255,255,' + F.flash + ')'; ctx.fillRect(0, 0, S.W, S.H); }
  if (F.banner) drawBanner(F.banner, F.bannerA == null ? 1 : F.bannerA);
  if (F.text) drawFullText(F.text, F.textA == null ? 1 : F.textA, F.textSub);
  if (F.big) drawBig(F.big, F.bigA == null ? 1 : F.bigA, F.bigSub);
}

/* ================= Bewertungs-Feld =================
   Ein eigenes Feld unter der Zeichenflaeche mit eigener, logarithmischer
   Achse — kein Farbstreifen. Der Unterschied ist nicht kosmetisch: Beim
   Streifen kann man Werte nur schaetzen, hier liest man sie ab. Und nur
   so wird der eigentliche Befund dieser Episode sichtbar, naemlich dass
   die Tiefpunkte der Bewertung von Zyklus zu Zyklus steigen.
   Farbregel identisch zum Band darueber: unter 1,00 gruen, darueber rot. */
/* Die Achse deckt genau den sichtbaren Bereich ab, mit etwas Luft nach
   oben und unten. Nichts wird abgeschnitten: Ein beschnittenes Feld
   sieht aus wie ein Plateau, wo in Wirklichkeit eine Spitze steht.   */
const BF = (function () {
  let lo = Infinity, hi = -Infinity;
  for (let i = I0V; i < H; i++) { lo = Math.min(lo, BW[i]); hi = Math.max(hi, BW[i]); }
  return { lo: Math.log(lo) - 0.09, hi: Math.log(hi) + 0.09 };
})();
function bfRect() {
  const a = area();
  return { x: a.x, y: a.y + a.h + (S.W < 900 ? 50 : 62), w: a.w, h: S.W < 900 ? 88 : 128 };
}
const yBW = function (v) { const r = bfRect(); return r.y + r.h - (Math.log(Math.max(0.06, v)) - BF.lo) / (BF.hi - BF.lo) * r.h; };
function drawBewertung(hP, now) {
  const r = bfRect(), a = area();
  const upto = Math.round(hP * (H - 1));
  const yOne = yBW(1);
  ctx.save(); ctx.globalAlpha *= S.aHS;

  ctx.font = '800 ' + (S.W < 900 ? 12 : 15) + 'px Inter,system-ui,sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.fillText('BEWERTUNG · KURS ÷ KAPITALBASIS', r.x, r.y - 6);

  ctx.save();
  ctx.beginPath(); ctx.rect(r.x, r.y - 2, r.w, r.h + 4); ctx.clip();
  /* Flaeche zwischen Kurve und der Linie 1,00 */
  for (let i = 0; i < upto; i++) {
    ctx.fillStyle = heatCol(BW[i], 0.82);
    ctx.beginPath();
    ctx.moveTo(xP(i), yBW(BW[i])); ctx.lineTo(xP(i + 1), yBW(BW[i + 1]));
    ctx.lineTo(xP(i + 1), yOne); ctx.lineTo(xP(i), yOne);
    ctx.closePath(); ctx.fill();
  }
  /* Kurve selbst */
  ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineWidth = S.W < 900 ? 1.6 : 2.1; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i <= upto; i++) { const x = xP(i), y = yBW(BW[i]); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.stroke();
  if (hP < 0.999 && upto > 0) {
    ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(255,255,255,.9)'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(xP(upto), yBW(BW[upto]), 3.4, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  }
  /* Die Linie 1,00 — hier steht der Markt genau auf seiner Kostenbasis */
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.3; ctx.setLineDash([6, 5]);
  ctx.beginPath(); ctx.moveTo(r.x, yOne); ctx.lineTo(r.x + r.w, yOne); ctx.stroke(); ctx.setLineDash([]);

  /* Die steigenden Boeden: Punkte, Verbindung, und die Fortschreibung */
  const seen = LO.filter(function (i) { return i <= upto; });
  ctx.strokeStyle = 'rgba(31,227,196,.8)'; ctx.lineWidth = 1.8;
  if (seen.length > 1) {
    ctx.beginPath();
    seen.forEach(function (i, k) { const x = xP(i), y = yBW(BW[i]); k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
    ctx.stroke();
  }
  if (seen.length === LO.length && hP > 0.985) {
    /* gestrichelt = konstruiert, nicht gemessen — wie die Gegenrechnungen oben */
    const xEnd = xP(H - 1), yEnd = yBW(FLO4.next);
    ctx.setLineDash([7, 6]); ctx.strokeStyle = 'rgba(31,227,196,.65)';
    ctx.beginPath(); ctx.moveTo(xP(LO[3]), yBW(BW[LO[3]])); ctx.lineTo(xEnd, yEnd); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = C_COLD; ctx.shadowColor = C_COLD; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(xEnd, yEnd, 4.4, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    if (S.W >= 760) {
      ctx.font = '800 ' + (S.W < 1100 ? 12 : 14) + 'px Inter,system-ui,sans-serif';
      ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillStyle = C_COLD;
      ctx.fillText(k2(FLO4.next), xEnd - 8, yEnd - 5);
    }
  }
  seen.forEach(function (i) {
    const x = xP(i), y = yBW(BW[i]);
    ctx.fillStyle = C_COLD; ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill();
    if (S.W >= 760) {
      ctx.font = '800 ' + (S.W < 1100 ? 12 : 14) + 'px Inter,system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = C_COLD;
      ctx.fillText(k2(BW[i]), x, y + 7);
    }
  });
  ctx.restore();

  /* Achsenwerte rechts, damit man den Wert wirklich ablesen kann */
  ctx.font = '700 ' + (S.W < 900 ? 12 : 15) + 'px Inter,system-ui,sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  [0.5, 1, 2, 4].forEach(function (v) {
    const y = yBW(v);
    if (y < r.y - 2 || y > r.y + r.h + 2) return;
    ctx.fillStyle = v === 1 ? 'rgba(255,255,255,.8)' : 'rgba(255,255,255,.42)';
    ctx.fillText(k2(v), r.x + r.w + 10, y);
  });
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.font = '800 ' + (S.W < 900 ? 11 : 13) + 'px Inter,system-ui,sans-serif';
  ctx.fillStyle = C_COLD; ctx.fillText('UNTER KAPITALBASIS', r.x + r.w - 8, yBW(0.62));
  ctx.restore();
}

/* ---- Hervorhebung in Animationstexten ----
   Text zwischen *Sternchen* wird in Bitcoin-Orange gesetzt. So traegt die
   Zahl die Aussage, ohne dass der Satz auseinandergerissen wird. Die
   Auszeichnung ueberlebt den Zeilenumbruch, weil pro Wort umgebrochen
   wird und das Flag am Wort haengt, nicht an der Zeile.               */
function segWrap(text, maxW, c) {
  const toks = [];
  String(text).split('\n').forEach(function (ln, li) {
    if (li) toks.push({ br: true });
    ln.split('*').forEach(function (p, i) {
      const hot = i % 2 === 1;
      p.split(/(\s+)/).forEach(function (w) { if (w.length) toks.push({ s: w, hot: hot }); });
    });
  });
  const lines = []; let cur = [], w = 0;
  toks.forEach(function (t) {
    if (t.br) { lines.push(cur); cur = []; w = 0; return; }
    const sp = /^\s+$/.test(t.s), tw = c.measureText(t.s).width;
    if (!sp && w + tw > maxW && cur.length) { lines.push(cur); cur = []; w = 0; }
    if (sp && !cur.length) return;
    cur.push(t); w += tw;
  });
  if (cur.length) lines.push(cur);
  return lines;
}
/* Zeichnet eine Segmentzeile mittig um cx. Verlangt textAlign 'left'. */
function drawSegs(segs, cx, y, hotCol, coldCol) {
  let w = 0; segs.forEach(function (p) { w += ctx.measureText(p.s).width; });
  let x = cx - w / 2;
  segs.forEach(function (p) {
    ctx.fillStyle = p.hot ? hotCol : coldCol;
    ctx.fillText(p.s, x, y); x += ctx.measureText(p.s).width;
  });
}

function drawBanner(b, al) {
  ctx.save(); ctx.globalAlpha = al;
  /* Von 0,125 auf 0,085 der Hoehe hochgesetzt. Hoeher allein reicht aber
     nicht: Der Chart beginnt oben bei rund 0,12 der Hoehe, die Caption
     laege also so oder so auf der Kurve. Darum zusaetzlich ein weicher
     Abdunkler, der nach unten auslaeuft — die Kurve bleibt sichtbar, der
     Text bleibt lesbar. Gemessen sank die Ueberdeckung damit von 16,5 %
     auf unter 1 %.                                                     */
  const cx = S.W / 2, y = S.H * 0.085;
  const lfs = S.W < 900 ? 14 : 18, fs = S.W < 900 ? 20 : 29, lh = fs * 1.26;
  ctx.font = '700 ' + fs + 'px Inter,system-ui,sans-serif';
  const lines = segWrap(b[1], Math.min(S.W * 0.72, 980), ctx);
  const y0 = y + (S.W < 900 ? 20 : 26);
  const bot = y0 + (lines.length - 1) * lh + fs;

  const pad = fs * 0.9, gTop = Math.max(0, y - pad), gBot = bot + pad * 1.4;
  const g = ctx.createLinearGradient(0, gTop, 0, gBot);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.18, 'rgba(0,0,0,.72)');
  g.addColorStop(0.72, 'rgba(0,0,0,.66)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, gTop, S.W, gBot - gTop);

  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = '800 ' + lfs + 'px Inter,system-ui,sans-serif';
  ctx.fillStyle = '#F7931A'; ctx.fillText(b[0].toUpperCase(), cx, y);
  ctx.font = '700 ' + fs + 'px Inter,system-ui,sans-serif';
  ctx.textAlign = 'left';
  ctx.shadowColor = 'rgba(0,0,0,.95)'; ctx.shadowBlur = 16;
  lines.forEach(function (l, i) { drawSegs(l, cx, y0 + i * lh, 'rgba(0,0,0,.8)', 'rgba(0,0,0,.8)'); });
  ctx.shadowBlur = 0;
  lines.forEach(function (l, i) { drawSegs(l, cx, y0 + i * lh, '#F7931A', 'rgba(255,255,255,.96)'); });
  ctx.textAlign = 'center';
  ctx.restore();
}
function drawFullText(t, al, sub) {
  ctx.save(); ctx.globalAlpha = al;
  const maxW = S.W * 0.86;
  /* Dieselbe Funktion traegt die kurzen Hook-Beats und die langen
     Saetze des Erklaerers. Statt einer festen Groesse fuer beides wird
     verkleinert, bis die laengste Zeile ins Bild passt — sonst laufen
     die Erklaertexte seitlich heraus. */
  const plain = String(t).split('\n').map(function (l) { return l.replace(/\*/g, ''); });
  let fs = S.W < 900 ? 34 : Math.min(70, S.W / 17);
  for (let g = 0; g < 30; g++) {
    ctx.font = '900 ' + fs + 'px Inter,system-ui,sans-serif';
    let w = 0; plain.forEach(function (l) { w = Math.max(w, ctx.measureText(l).width); });
    if (w <= maxW || fs <= 16) break;
    fs *= 0.94;
  }
  ctx.font = '900 ' + fs + 'px Inter,system-ui,sans-serif';
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const lines = segWrap(t, maxW, ctx);
  /* Der Textblock sitzt bewusst oberhalb der Bildmitte: Unten laufen die
     Kurven zusammen, dort steht die Wortmarke, und bei mehrzeiligen
     Erklaertexten waechst der Block nach unten. Von 0,50 auf 0,42 der
     Hoehe hochgesetzt, damit nichts mehr ineinanderlaeuft. */
  const cy = S.H * 0.42;
  const lh = fs * 1.16, y0 = cy - (lines.length - 1) * lh / 2 - (sub ? fs * 0.4 : 0);
  ctx.shadowColor = 'rgba(0,0,0,.95)'; ctx.shadowBlur = 26;
  lines.forEach(function (l, i) { drawSegs(l, S.W / 2, y0 + i * lh, 'rgba(0,0,0,.85)', 'rgba(0,0,0,.85)'); });
  ctx.shadowBlur = 0;
  lines.forEach(function (l, i) { drawSegs(l, S.W / 2, y0 + i * lh, '#F7931A', '#fff'); });
  if (sub) {
    ctx.textAlign = 'center';
    ctx.font = '700 ' + (S.W < 900 ? 15 : 21) + 'px Inter,system-ui,sans-serif';
    ctx.fillStyle = '#F7931A'; ctx.fillText(sub, S.W / 2, y0 + lines.length * lh + fs * 0.15);
  }
  ctx.restore();
}
function drawBig(t, al, sub) {
  ctx.save(); ctx.globalAlpha = al;

  ctx.font = '900 ' + fs + 'px Inter,system-ui,sans-serif';

/* ===================== Beweis-Box ===================== */
/* Oben links: dort ist die Flaeche ueber der steigenden Kurslinie frei,
   und das Bedienfeld sitzt rechts. Die Unterkante wird aus den Kurven
   abgeleitet, damit die Box keine Linie ueberdeckt.                   */
/* ---- Freiflaechen-Suche fuer die Beweis-Box ----
   Frueher stand die Box an einer festen Ecke und wurde nur gegen die
   Kurs- und Kapitalbasis-Linie geprueft. Das reichte nicht: Je nach
   eingeschalteten Ebenen und Ausschnitt lagen Zerlegung, Bodenband oder
   die HEUTE-Linie darunter. Jetzt wird eine Belegungskarte gerastert —
   alles, was tatsaechlich gezeichnet wird, sperrt seine Zellen — und die
   Box landet auf der freien Flaeche, die der Wunschlage (rechts mittig)
   am naechsten liegt.                                                */
const BOXC = 10;   /* Rasterweite in Pixeln */
function boxRect() {
  const a = area(), PB = panelBox();
  const w = Math.min(392, Math.max(280, a.w * 0.29));
  const h = S.W < 900 ? 164 : 190;
  const cols = Math.max(1, Math.ceil(a.w / BOXC)), rows = Math.max(1, Math.ceil(a.h / BOXC));
  const occ = new Uint8Array(cols * rows);
  const mark = function (x, y, pad) {
    const c0 = Math.floor((x - pad - a.x) / BOXC), c1 = Math.floor((x + pad - a.x) / BOXC);
    const r0 = Math.floor((y - pad - a.y) / BOXC), r1 = Math.floor((y + pad - a.y) / BOXC);
    for (let c = Math.max(0, c0); c <= Math.min(cols - 1, c1); c++)
      for (let r = Math.max(0, r0); r <= Math.min(rows - 1, r1); r++) occ[c * rows + r] = 1;
  };
  const k = HI[S.anchor];
  for (let i = 0; i < H; i++) {
    const x = xP(i);
    if (x < a.x - 24 || x > a.x + a.w + 24) continue;
    mark(x, yP(PX[i]), 24);                       /* Kurs inkl. Marker-Ringen */
    if (S.aKB > 0.05) mark(x, yP(KB[i]), 18);
    if (S.aZL > 0.05 && i >= k) { mark(x, yP(onlyCap(i, k)), 16); mark(x, yP(onlyVal(i, k)), 16); }
  }
  if (S.aBO > 0.05)
    for (let x = a.x; x <= a.x + a.w; x += BOXC) { mark(x, yP(floorHigh()), 20); mark(x, yP(floorLow()), 20); }
  for (let y = a.y; y <= a.y + a.h; y += BOXC) mark(xP(H - 1), y, 16);   /* HEUTE-Linie */
  /* Bedienfeld: eine HTML-Ebene ueber dem Bild, also ebenfalls gesperrt */
  for (let x = PB.x0; x <= PB.x1; x += BOXC) for (let y = PB.y0; y <= PB.y1; y += BOXC) mark(x, y, 8);

  const free = function (x, y) {
    const c0 = Math.floor((x - a.x) / BOXC), c1 = Math.ceil((x + w - a.x) / BOXC);
    const r0 = Math.floor((y - a.y) / BOXC), r1 = Math.ceil((y + h - a.y) / BOXC);
    if (c0 < 0 || r0 < 0 || c1 > cols || r1 > rows) return false;
    for (let c = c0; c < c1; c++) for (let r = r0; r < r1; r++) if (occ[c * rows + r]) return false;
    return true;
  };
  /* Wunschlage: rechts, vertikal mittig */
  const wishX = a.x + a.w - w - 16, wishY = a.y + (a.h - h) / 2;
  let best = null, bestD = Infinity;
  for (let x = a.x + 8; x + w <= a.x + a.w - 8; x += BOXC)
    for (let y = a.y + 8; y + h <= a.y + a.h - 8; y += BOXC) {
      const d = Math.abs(x - wishX) * 1.0 + Math.abs(y - wishY) * 1.35;
      if (d >= bestD || !free(x, y)) continue;
      best = { x: x, y: y, w: w, h: h }; bestD = d;
    }
  /* Findet sich keine freie Flaeche, wird die Box weggelassen statt
     irgendwohin gequetscht. Ein Kasten auf einer Kurve ist schlimmer als
     kein Kasten. */
  return best;
}
function boxTitle(c, r, t, s) {
  c.font = '800 12px Inter,system-ui,sans-serif'; c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillStyle = '#F7931A'; c.fillText(t.toUpperCase(), r.x + 14, r.y + 12);
  c.font = '600 11px Inter,system-ui,sans-serif'; c.fillStyle = 'rgba(255,255,255,.5)';
  wrapT(s, r.w - 28, c).slice(0, 2).forEach(function (l, i) { c.fillText(l, r.x + 14, r.y + 30 + i * 14); });
}
function drawBox(now, F) {
  /* Waehrend die Zerlegung laeuft, bleibt die Box aus: Im Ausschnitt
     tragen die beiden gestrichelten Linien mit ihren Endbeschriftungen
     die Aussage allein — ein zweiter Erklaerkasten daneben ist genau die
     Ueberfrachtung, die es zu vermeiden gilt. */
  if ((F.zlProg == null ? S.aZL : F.zlProg) > 0.05) return;
  const r = boxRect(), al = F.boxA == null ? 1 : F.boxA, pr = F.boxProg == null ? 1 : F.boxProg;
  if (!r || al < 0.01) return;
  ctx.save(); ctx.globalAlpha = al;
  ctx.fillStyle = 'rgba(8,8,10,.86)'; rRect(ctx, r.x, r.y, r.w, r.h, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.11)'; ctx.lineWidth = 1; rRect(ctx, r.x, r.y, r.w, r.h, 12); ctx.stroke();
  const m = F.boxMode == null ? S.mode : F.boxMode;
  if (m === 0) boxRatchet(r, pr); else boxHit(r, pr);
  ctx.restore();
}
function boxRatchet(r, pr) {
  boxTitle(ctx, r, 'Die Sperrklinke', 'Größter Rückgang vom eigenen Höchststand über alle ' + H + ' Wochen — je Reihe.');
  const x0 = r.x + 14, wdt = r.w - 28, y0 = r.y + 74;
  const items = [['Kurs', DD_PX.dd, '#ffffff'], ['Kapitalbasis', DD_KB.dd, '#F7931A'], ['Eingesetztes Kapital', DD_RC.dd, '#b8741d']];
  const mx = Math.max.apply(null, items.map(function (i) { return Math.abs(i[1]); }));
  ctx.font = '700 11.5px Inter,system-ui,sans-serif'; ctx.textBaseline = 'middle';
  items.forEach(function (it, i) {
    const y = y0 + i * 42;
    if (y + 20 > r.y + r.h) return;
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,.62)'; ctx.fillText(it[0], x0, y);
    ctx.fillStyle = 'rgba(255,255,255,.09)'; rRect(ctx, x0, y + 10, wdt, 16, 5); ctx.fill();
    ctx.fillStyle = it[2]; rRect(ctx, x0, y + 10, Math.max(2, wdt * (Math.abs(it[1]) / mx) * pr), 16, 5); ctx.fill();
    ctx.textAlign = 'right'; ctx.fillStyle = it[2]; ctx.font = '800 12px Inter,system-ui,sans-serif';
    ctx.fillText(fmtPct(it[1]), x0 + wdt, y);
    ctx.font = '700 11.5px Inter,system-ui,sans-serif';
  });
  const y = y0 + 3 * 42 + 4;
  if (y < r.y + r.h - 14) {
    ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.font = '600 10.5px Inter,system-ui,sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    wrapT('Seit 2012: Kurs ' + fmtPct(DD_PX12.dd) + ' · Kapitalbasis ' + fmtPct(DD_KB12.dd) + ' · Kapital ' + fmtPct(DD_RC12.dd), wdt, ctx)
      .forEach(function (l, i) { ctx.fillText(l, x0, y + i * 14); });
  }
}
function boxHit(r, pr) {
  boxTitle(ctx, r, 'Trefferquote nach 52 Wochen', 'Anteil der Wochen mit höherem Kurs ein Jahr später, nach Bewertung sortiert. Basisrate ' + fmtPct(FW.base, 0) + '.');
  const x0 = r.x + 14, wdt = r.w - 28, y0 = r.y + 72;
  const bh = Math.min(30, (r.h - 96) / 4);
  ctx.font = '700 11px Inter,system-ui,sans-serif';
  FW.b.forEach(function (q, i) {
    const y = y0 + i * (bh + 6);
    if (y + bh > r.y + r.h - 8) return;
    const lab = (q.hi > 900 ? 'über ' + k2(q.lo) : k2(q.lo) + ' – ' + k2(q.hi));
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillText(lab, x0, y + bh / 2);
    const bx = x0 + 78, bw = wdt - 78 - 46;
    ctx.fillStyle = 'rgba(255,255,255,.09)'; rRect(ctx, bx, y + 4, bw, bh - 8, 5); ctx.fill();
    const sh = q.n ? q.pos / q.n : 0;
    ctx.fillStyle = heatCol(q.lo === 0 ? 0.7 : (q.lo + Math.min(q.hi, 3)) / 2, 0.95);
    rRect(ctx, bx, y + 4, Math.max(2, bw * sh * pr), bh - 8, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.4; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(bx + bw * FW.base, y + 2); ctx.lineTo(bx + bw * FW.base, y + bh - 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = '800 11.5px Inter,system-ui,sans-serif';
    ctx.fillText(fmtPct(sh, 0), x0 + wdt, y + bh / 2);
    ctx.font = '700 11px Inter,system-ui,sans-serif';
  });
}

const _tw = {};
/* Ebenen blenden kurz, die Kamerafahrt braucht laenger — sonst springt
   der Ausschnitt, statt zu fahren. */
function setToggle(k, on) { _tw[k] = { from: S[k], to: on ? 1 : 0, t0: performance.now(), dur: k === 'zoom' ? 1100 : 320 }; }
function tweenToggles(now) {
  let live = false;
  for (const k in _tw) { const t = _tw[k], p = clamp01((now - t.t0) / t.dur); S[k] = t.from + (t.to - t.from) * eo(p); if (p < 1) live = true; else delete _tw[k]; }
  return live;
}
function loop(now) { if (tweenToggles(now)) render(now); else if (!S.cinema) render(now); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

let kb = [];
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { if (S.cinema) { S.cinema = null; render(); } return; }
  kb.push({ k: e.key.toLowerCase(), t: Date.now() });
  kb = kb.filter(function (x) { return Date.now() - x.t < 600; });
  const s = kb.map(function (x) { return x.k; }).join('');
  if (s.endsWith('st')) { kb = []; startCinema(); }
  else if (s.endsWith('ar')) { kb = []; startExplainer(); }
});
updateStats(); render();

/* ===================== Mind-Shift Cinema ===================== */
function startCinema() {
  if (S.cinema) return;
  const t0 = performance.now();
  S.cinema = { t0 };
  /* 40 Sekunden, fest. Der Vorspann ist Kanalstandard und wird nicht
     je Episode neu ausgehandelt — laenger haelt am Videoanfang niemand aus. */
  const DUR = 40000;
  const K = HI[4], DC = decomp(K, NOWI);
  /* Der Haken folgt der Hook-Formel: zwei Beats treiben die Crash-Lesart
     auf die Spitze, der dritte dreht sie um, der vierte spitzt zu. Alle
     Zahlen kommen aus der Rechnung, nicht aus dem Text — sie stimmen
     also auch, wenn die Daten am naechsten Tag andere sind.
     *Sternchen* faerbt in Bitcoin-Orange.                              */
  const ddK = 1 - PX[NOWI] / PX[K];
  const bio = (DC.lossMC / 1e12).toLocaleString('de-DE', { maximumFractionDigits: 2 });
  /* 3,5 s je Einblendung. Bei 2,4 s blieben nach den Blenden nur rund
     1,7 s zum Lesen — zu wenig fuer zwei Zeilen in Versalien. Jetzt sind
     es 2,7 s. Die vier Beats brauchen damit 14,1 s statt 10,2 s; die
     Differenz geben die spaeteren Akte ab, weil die 40 s fest sind. */
  const BEATS = [
    [200, 3700, 'BITCOIN STEHT\n*' + fmtPct(ddK, 0) + '* UNTER DEM HOCH'],
    [3700, 7200, '*' + bio + ' BILLIONEN DOLLAR*\nMARKTWERT — WEG'],
    [7300, 10800, 'ABER NUR *' + (DC.lossRC / 1e9).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' MILLIARDEN*\nWAREN ECHTES GELD'],
    [10800, 14300, '*' + fmtPct(1 - DC.shareRC, 0) + '* DES VERLUSTS\nWAR NUR STIMMUNG']
  ];
  function frame(now) {
    if (!S.cinema) return;
    const t = now - t0;
    if (t > DUR) { S.cinema = null; render(now); return; }
    const F = { zoom: 0 };

    /* --- 1 · Der Haken --- */
    if (t < 14300) {
      F.bars = eo(seg(t, 0, 600));
      /* Das Korn nimmt ueber die beiden Aufbau-Beats zu und faellt mit der
         Kehrtwende schlagartig ab — die Unruhe gehoert zur Crash-Lesart,
         die Klarheit zur Richtigstellung. */
      F.grain = t < 7200 ? 0.075 + 0.035 * seg(t, 200, 7200) : 0.11 - 0.055 * seg(t, 7300, 8400);
      F.vig = 0.9;
      F.priceProg = 0; F.priceAlpha = 0; F.axProg = 0; F.capProg = 0;
      F.mkProg = 0; F.hsProg = 0; F.today = 0; F.hideBox = true; F.zlProg = 0; F.boProg = 0;
      /* Blitzschnitt genau auf dem „ABER" — der Bruch wird gesehen, nicht gelesen */
      if (t >= 7200 && t < 7700) F.flash = (1 - seg(t, 7200, 7700)) * 0.8;
      for (const b of BEATS) {
        if (t >= b[0] && t < b[1]) {
          F.text = b[2]; F.textA = Math.min(seg(t, b[0], b[0] + 400), 1 - seg(t, b[1] - 380, b[1]));
        }
      }
      render(now, F); requestAnimationFrame(frame); return;
    }

    /* --- 2 · Der Kurs (14,3–19,9 s) --- */
    F.bars = 1 - eo(seg(t, 14300, 15500)) * (1 - 0.35);
    F.grain = 0.085 - 0.04 * seg(t, 14300, 16400);
    F.vig = 0.9 - 0.3 * seg(t, 14300, 16400);
    F.flash = t < 14800 ? (1 - seg(t, 14300, 14800)) * 0.7 : 0;
    F.axProg = eo(seg(t, 14600, 16000));
    F.priceAlpha = 1;
    F.priceProg = eo(seg(t, 15300, 19300));
    F.capProg = 0; F.mkProg = 0; F.hsProg = 0; F.zlProg = 0; F.boProg = 0;
    F.today = seg(t, 18900, 19700);
    F.hideBox = true;
    F.push = seg(t, 15100, 27000) * 0.5;
    if (t >= 15100 && t < 19900) { F.banner = ['Was alle sehen', 'Der Kurs — heute *' + fmtUSD(PX[NOWI]) + '*, im Hoch waren es *' + fmtUSD(PX[K]) + '*']; F.bannerA = Math.min(seg(t, 15100, 15700), 1 - seg(t, 19400, 19900)); }

    /* --- 3 · Die Kapitalbasis (19,9–24,5 s) --- */
    if (t >= 19900) {
      F.capProg = eo(seg(t, 20000, 23200));
      F.hsProg = eo(seg(t, 20600, 23800));
      F.mkProg = seg(t, 21600, 24000);
      if (t >= 20100 && t < 24500) {
        F.banner = ['Was niemand sieht', 'Die Kapitalbasis — was jede Münze im Schnitt gekostet hat: *' + fmtUSD(KB[NOWI]) + '*'];
        F.bannerA = Math.min(seg(t, 20100, 20700), 1 - seg(t, 24000, 24500));
      }
    }

    /* --- 4 · Die Gegenrechnung (Kernszene, 24,5–32,6 s) --- */
    if (t >= 24500) {
      F.capProg = 1; F.hsProg = 1; F.mkProg = 1; F.today = 1;
      if (t >= 24500 && t < 24800) F.flash = (1 - seg(t, 24500, 24800)) * 0.7;
      F.zoom = seg(t, 24700, 27000);
      F.priceAlpha = 1 - 0.5 * eo(seg(t, 24700, 26200));
      F.zlProg = eo(seg(t, 25900, 31400));
      F.push = 0;
      if (t >= 25400 && t < 32600) {
        F.banner = ['Der Beweis', 'Vom Hoch bis heute: *' + fmtMrd(DC.lossMC) + '* Marktwert weg — davon echtes Geld nur *' + fmtMrd(DC.lossRC) + '*'];
        F.bannerA = Math.min(seg(t, 25400, 26000), 1 - seg(t, 32100, 32600));
      }
    }

    /* --- 5 · Das Urteil (32,6–36,3 s) --- */
    if (t >= 32600) {
      F.zoom = 1; F.zlProg = 1;
      F.dim = 0.9 * Math.min(1, seg(t, 32600, 33200));
      F.bars = 0.35 + 0.65 * seg(t, 32600, 33200);
      F.big = fmtUSD(DC.pCap);
      F.bigA = Math.min(seg(t, 32800, 33400), 1 - seg(t, 35800, 36300));
      F.bigSub = 'Hätte nur echtes Geld gewirkt — kein Stimmungswechsel\ntatsächlich steht Bitcoin bei ' + fmtUSD(PX[NOWI]);
    }

    /* --- 6 · Abspann (36,3–40,0 s) --- */
    if (t >= 36300) {
      F.big = null;
      F.zoom = 1 - eo(seg(t, 36300, 38400));
      F.dim = 0.9 * (1 - eo(seg(t, 36300, 37500)));
      F.bars = 0.35 * (1 - seg(t, 38400, 39700));
      F.priceAlpha = 0.5 + 0.5 * eo(seg(t, 36300, 37500));
      F.grain = 0.04; F.vig = 0.55;
      F.capProg = 1; F.mkProg = 1; F.hsProg = 1; F.today = 1; F.priceProg = 1; F.zlProg = 1;
      F.hideBox = true;
      F.boProg = eo(seg(t, 37100, 38900));
      if (t >= 36500) {
        F.banner = ['Wo liegt der Boden?', 'Jeder Zyklus fiel weniger tief: ' + LO.map(function (i) { return k2(BW[i]); }).join(' → ') + ' → fortgeschrieben *' + k2(FLO4.next) + '*'];
        F.bannerA = Math.min(seg(t, 36500, 37100), 1 - seg(t, 39500, 40000));
      }
    }
    render(now, F);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ===================== Forschungsweg-Protokoll ===================== */
/* Nur fuer den Kanalbetreiber: woher die Daten stammen, was hier
   gerechnet wird und was das Modell ausdruecklich NICHT belegt.      */
function startExplainer() {
  if (S.cinema) return;
  const t0 = performance.now(); S.cinema = { t0 };
  const K = HI[4], DC = decomp(K, NOWI);
  const STEPS = [
    ['1 · Woher kommen die Daten?', 'Alles aus einer öffentlichen Quelle: Coin Metrics\n' + H + ' Wochen Bitcoin-Geschichte\nvon ' + fmtD(DS[0]) + ' bis ' + fmtD(DS[NOWI]) + '\nJeder kann das nachprüfen'],
    ['2 · Die einfache Idee', 'Der Kurs besteht aus zwei Teilen:\nWas die Leute reingesteckt haben (Kapitalbasis)\nund wie viel der Markt draufschlägt (Bewertung)\nKurs = Kapitalbasis × Bewertung'],
    ['3 · Was fällt weniger?', 'Im schlimmsten Crash verlor der Kurs ' + fmtPct(DD_PX.dd) + '\nAber die Kapitalbasis nur ' + fmtPct(DD_KB.dd) + '\nDas echte Geld ist viel stabiler\nals der Kurs vermuten lässt'],
    ['4 · Die Gegenprobe', 'Seit dem Hoch ' + fmtD(DS[K]) + ':\n' + fmtMrd(DC.lossMC) + ' Marktwert verschwunden\nDavon echtes Geld: nur ' + fmtMrd(DC.lossRC) + '\nDer Rest war Stimmung — nicht Substanz'],
    ['5 · Wie steht es heute?', 'Bewertung heute: ' + k2(BW[NOWI]) + '\nIn ' + fmtPct(PCT_BW, 0) + ' aller Wochen stand sie tiefer\nDas heißt: nicht billig, nicht teuer\nsondern irgendwo dazwischen'],
    ['6 · Was bringt ein Jahr?', 'Wer bei niedriger Bewertung kaufte:\n' + FW.b.map(function (q) { return (q.hi > 900 ? 'ab ' + k2(q.lo) : k2(q.lo) + '–' + k2(q.hi)) + ': ' + fmtPct(q.pos / q.n, 0) + ' im Plus'; }).join('\n') + '\nAber: wie VIEL Gewinn, das verrät es nicht'],
    ['7 · Was wir NICHT wissen', 'Der Boden-Trend hat nur vier Punkte\nDas reicht für eine Richtung, nicht für eine Garantie\nUnd: Kapitalbasis misst bewegte Münzen\nnicht echte Ein- und Auszahlungen'],
    ['8 · Bitte beachten', 'Das ist keine Anlageberatung\nund keine Kursprognose\nSondern ein Rechenweg zum Mitdenken\nGREAT WALLY']
  ];
  const PER = 15000;
  function frame(now) {
    if (!S.cinema) return;
    const t = now - t0, i = Math.floor(t / PER);
    if (i >= STEPS.length) { S.cinema = null; render(now); return; }
    const lt = t - i * PER;
    const F = { dim: 0.86, bars: 1, grain: 0.05, vig: 0.85, hideBox: true, today: 0 };
    F.text = STEPS[i][1]; F.textSub = STEPS[i][0];
    F.textA = Math.min(seg(lt, 0, 600), 1 - seg(lt, PER - 700, PER));
    render(now, F);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
