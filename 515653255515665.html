*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#fff}
canvas{display:block;width:100%;height:100%}
#panel{position:fixed;top:20px;right:20px;width:280px;background:rgba(10,10,15,0.92);border:1px solid rgba(255,255,255,0.12);border-radius:12px;z-index:100;backdrop-filter:blur(12px);user-select:none;display:flex;flex-direction:column;max-height:calc(100vh - 40px);overflow:hidden;transition:width 0.3s,opacity 0.3s}
#panel.collapsed{width:44px;overflow:hidden}
#panel.collapsed #panel-body{display:none}
#panel.collapsed #panel-header h3{display:none}
#panel-header{padding:12px 16px 10px;cursor:grab;border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
#panel-header h3{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.6);margin:0}
#panel-toggle{width:24px;height:24px;background:none;border:1px solid rgba(255,255,255,0.2);border-radius:6px;color:rgba(255,255,255,0.5);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all 0.2s;flex-shrink:0}
#panel-toggle:hover{border-color:#F7931A;color:#F7931A}
#panel-body{padding:12px 16px 16px;overflow-y:auto;flex:1}
.stat{margin-bottom:12px}
.stat-label{font-size:11px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.stat-value{font-size:17px;font-weight:700;letter-spacing:-0.3px}
.stat-value.price{color:#fff}
.stat-value.fair{color:#F7931A}
.stat-value.gap{color:#00d4aa}
.stat-value.zscore{color:#ff4466}
.divider{height:1px;background:rgba(255,255,255,0.08);margin:12px 0}
.slider-group{margin-bottom:10px}
.slider-group label{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:4px}
.slider-group label span:last-child{color:#F7931A;font-weight:600}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:rgba(255,255,255,0.12);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:#F7931A;border-radius:50%;cursor:pointer}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:12px;color:rgba(255,255,255,0.65)}
.toggle{width:36px;height:20px;background:rgba(255,255,255,0.15);border-radius:10px;position:relative;cursor:pointer;transition:background 0.2s;flex-shrink:0}
.toggle.on{background:#F7931A}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform 0.2s}
.toggle.on::after{transform:translateX(16px)}
.share-rail{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:0;transition:all 0.3s}
.share-rail .rail-strip{width:4px;height:120px;background:linear-gradient(to bottom,#F7931A33,#F7931A11);border-radius:2px 0 0 2px;cursor:pointer;transition:opacity 0.3s}
.share-rail .rail-icons{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;padding:10px 8px;background:rgba(10,10,15,0.92);border:1px solid rgba(255,255,255,0.12);border-right:none;border-radius:12px 0 0 12px;backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity 0.25s,transform 0.25s;transform:translateY(-50%) translateX(10px)}
.share-rail:hover .rail-icons{opacity:1;pointer-events:auto;transform:translateY(-50%) translateX(0)}
.share-rail:hover .rail-strip{opacity:0}
.share-btn{width:38px;height:38px;border-radius:10px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;padding:0}
.share-btn svg{width:20px;height:20px;transition:transform 0.2s}
.share-btn:hover svg{transform:scale(1.15)}
.share-btn.wa:hover{background:rgba(37,211,102,0.15)}
.share-btn.x:hover{background:rgba(255,255,255,0.1)}
.share-btn.yt:hover{background:rgba(255,0,0,0.15)}
.share-btn.lnk:hover{background:rgba(247,147,26,0.15)}
@media(max-width:500px){#panel{width:220px;top:10px;right:10px}#panel-body{padding:8px 12px 12px}.stat-value{font-size:14px}}
</style>

  let sxy=0,sxx=0;
  for(let i=0;i<n;i++){sxy+=(X[i]-mx)*(Y[i]-my);sxx+=(X[i]-mx)*(X[i]-mx);}
  const beta=sxx?sxy/sxx:0,alpha=my-beta*mx;
  let ssr=0,sst=0;
  for(let i=0;i<n;i++){const pr=alpha+beta*X[i];ssr+=(Y[i]-pr)*(Y[i]-pr);sst+=(Y[i]-my)*(Y[i]-my);}
  const sd=n>2?Math.sqrt(ssr/(n-2)):1;
  MODEL={alpha,beta,r2:sst?1-ssr/sst:0,sd:sd||1,n};

  data=rows.map((r,i)=>{
    const m2=M2W[Math.max(0,i-lag)];
    const fair=Math.exp(alpha+beta*Math.log(m2));
    return{date:r.date,price:r.price,m2,fair,
      z:(Math.log(r.price)-Math.log(fair))/MODEL.sd,
      gapPct:(r.price/fair-1)*100,
      inSample:+r.date.slice(0,4)>=startY};
  });
}
recompute();

// =================================================================
// KINO-VORBERECHNUNG
// Fair-Value-Kurve je Startjahr, damit der Schwenk zwischen den
// Spezifikationen fluessig laufen kann statt ruckweise zu springen.
// =================================================================
const FV_YEARS=[2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021];
const FV_CACHE={};
(function buildCurveCache(){
  const saved=S.startYear;
  for(const y of FV_YEARS){
    S.startYear=y;recompute();
    FV_CACHE[y]={fair:data.map(d=>d.fair),beta:MODEL.beta,r2:MODEL.r2,sd:MODEL.sd};
  }
  S.startYear=saved;recompute();
})();

// Blendet stufenlos zwischen zwei Startjahren und schreibt das Ergebnis in `data`
function applyYearBlend(yf){
  const lo=Math.max(2010,Math.min(2021,Math.floor(yf)));
  const hi=Math.max(2010,Math.min(2021,lo+1));
  const t=Math.max(0,Math.min(1,yf-lo));
  const A=FV_CACHE[lo],B=FV_CACHE[hi]||A;
  const sd=A.sd*(1-t)+B.sd*t;
  for(let i=0;i<N;i++){
    const f=Math.exp(Math.log(A.fair[i])*(1-t)+Math.log(B.fair[i])*t);
    data[i].fair=f;
    data[i].gapPct=(data[i].price/f-1)*100;
    data[i].z=(Math.log(data[i].price)-Math.log(f))/sd;
    data[i].inSample=+data[i].date.slice(0,4)>=Math.round(yf);
  }
  return{fairNow:data[N-1].fair,gapNow:data[N-1].gapPct,
    beta:A.beta*(1-t)+B.beta*t,r2:A.r2*(1-t)+B.r2*t};
}

// Filmkorn — einmal erzeugte Rauschkachel, im Bild versetzt getilet
const GRAIN=document.createElement('canvas');GRAIN.width=GRAIN.height=128;
(function(){
  const g=GRAIN.getContext('2d'),id=g.createImageData(128,128);
  for(let i=0;i<id.data.length;i+=4){
    const v=200+Math.random()*55;
    id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;
  }
  g.putImageData(id,0,0);
})();

// =================================================================
// MARKERS — snapped to actual extremes
// =================================================================
function findPeak(from,to){let mi=from,mv=-Infinity;for(let i=from;i<=Math.min(to,N-1);i++){if(data[i].price>mv){mv=data[i].price;mi=i;}}return mi;}
function findTrough(from,to){let mi=from,mv=Infinity;for(let i=from;i<=Math.min(to,N-1);i++){if(data[i].price<mv){mv=data[i].price;mi=i;}}return mi;}

function getMarkers(){
  return[
    {i:findPeak(70,85),type:'top',label:'Top 2011'},
    {i:findTrough(95,110),type:'bottom',label:'Boden 2011'},
    {i:findPeak(200,215),type:'top',label:'Top 2013'},
    {i:findTrough(260,275),type:'bottom',label:'Boden 2015'},
    {i:findPeak(415,425),type:'top',label:'Top 2017'},
    {i:findTrough(465,480),type:'bottom',label:'Boden 2018'},
    {i:findPeak(615,630),type:'top',label:'Top 2021'},
    {i:findTrough(670,685),type:'bottom',label:'Boden 2022'},
    {i:findPeak(815,835),type:'top',label:'Top 2025'},
    {i:N-1,type:'now',label:'HEUTE'}
  ];
}

// =================================================================
// CANVAS SETUP
// =================================================================
const cvs=document.getElementById('c');
const ctx=cvs.getContext('2d');

function resize(){
  S.dpr=window.devicePixelRatio||1;
  S.W=window.innerWidth;S.H=window.innerHeight;
  cvs.width=S.W*S.dpr;cvs.height=S.H*S.dpr;
  ctx.setTransform(S.dpr,0,0,S.dpr,0,0);
  if(S.W<500){S.padL=70;S.padB=80;S.padT=40;S.padR=15;}
  else{S.padL=120;S.padB=100;S.padT=60;S.padR=30;}
}
window.addEventListener('resize',()=>{resize();render();});
resize();

// =================================================================
// CHART MATH
// =================================================================
function area(){return{x:S.padL,y:S.padT,w:S.W-S.padL-S.padR,h:S.H-S.padT-S.padB};}

function getYR(){
  let mx=-Infinity;
  for(const d of data)mx=Math.max(mx,d.price,d.fair);
  return{min:0.01,max:mx*2};
}

function xP(i){const a=area();return a.x+i/(N-1)*a.w;}
function yP(v){
  const a=area(),r=getYR();
  if(v<=0)v=r.min;
  const lMin=Math.log10(r.min),lMax=Math.log10(r.max);
  return a.y+(Math.log10(r.max)-Math.log10(v))/(lMax-lMin)*a.h;
}

// =================================================================
// RENDER
// =================================================================
// Layer-Schalter wischen ueber eine feste Dauer mit weichem Ein- und Auslauf.
// Feste Dauer statt exponentiellem Glaetten, weil eine Wischkante sonst
// losschiessen und dann kriechen wuerde — hier laeuft sie gleichmaessig durch.
const TGL_DUR=1000;
const _tglAnim={aFV:null,aGap:null,aZS:null,aMK:null};
function setToggle(key,on){
  _tglAnim[key]={from:S[key],to:on?1:0,t0:performance.now()};
}
function tweenToggles(now){
  if(!now)return;
  for(const k in _tglAnim){
    const an=_tglAnim[k];
    if(!an)continue;
    const p=Math.min(1,(now-an.t0)/TGL_DUR);
    const e=p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;   // easeInOutCubic
    S[k]=an.from+(an.to-an.from)*e;
    if(p>=1){S[k]=an.to;_tglAnim[k]=null;}
  }
}

function render(now,F){
  if(S.W!==window.innerWidth||S.H!==window.innerHeight||cvs.width!==Math.round(S.W*S.dpr))resize();
  tweenToggles(now);
  if(!F)F={grid:1,fill:1,priceLine:1,fairLine:1,markers:1,heatStrip:1,
    priceProgress:1,fairProgress:1,headerAlpha:1,panelAlpha:1,shareAlpha:1,
    vignetteAlpha:0,storyAlpha:0,storyText:'',storyColor:'#F7931A',
    twistAlpha:0,twistText:'',phaseLabel:'',phaseLabelAlpha:0,zoomScale:1};

  ctx.clearRect(0,0,S.W,S.H);
  ctx.fillStyle='#000';ctx.fillRect(0,0,S.W,S.H);

  const a=area(),yr=getYR();
  const pP=F.priceProgress,fP=F.fairProgress;

  // Layer-Schalter wischen statt zu faden: Die Wischkante sitzt bei `v` (0..1)
  // der Plotbreite. Einblenden laeuft sie nach rechts, Ausblenden nach links —
  // beides faellt auf dieselbe Formel zusammen, weil v einfach zurueckwandert.
  const WIPE_EDGE=55;
  const wipeAt=(x,v)=>{
    if(v>=0.999)return 1;
    if(v<=0.001)return 0;
    return Math.max(0,Math.min(1,(a.x+a.w*v-x)/WIPE_EDGE));
  };
  const wipeGrad=(rgb,v)=>{
    const g=ctx.createLinearGradient(a.x,0,a.x+a.w,0);
    if(v>=0.999){g.addColorStop(0,`rgba(${rgb},1)`);g.addColorStop(1,`rgba(${rgb},1)`);return g;}
    const q=Math.max(0,Math.min(1,v)),p=Math.max(0,q-WIPE_EDGE/a.w);
    g.addColorStop(0,`rgba(${rgb},1)`);
    if(p>0)g.addColorStop(p,`rgba(${rgb},1)`);
    g.addColorStop(q,`rgba(${rgb},0)`);
    if(q<1)g.addColorStop(1,`rgba(${rgb},0)`);
    return g;
  };

  // KAMERA — langsame Fahrt auf die Datenebene. Text und UI bleiben ruhig,
  // nur die Daten bewegen sich. Das erzeugt Tiefe statt Zappeln.
  const camS=F.camScale||1;
  const camFX=F.camFocusX!=null?F.camFocusX:S.W/2;
  const camFY=F.camFocusY!=null?F.camFocusY:S.H/2;
  if(camS!==1){
    ctx.save();
    ctx.translate(camFX,camFY);ctx.scale(camS,camS);ctx.translate(-camFX,-camFY);
  }

  // Grid + axis labels
  if(F.grid>0){
    const ticks=[0.001,0.01,0.1,1,10,100,1000,10000,100000];
    ctx.globalAlpha=F.grid*0.12;ctx.strokeStyle='#fff';ctx.lineWidth=0.5;
    for(const t of ticks){
      if(t<yr.min||t>yr.max)continue;
      const yy=yP(t);
      ctx.beginPath();ctx.moveTo(a.x,yy);ctx.lineTo(a.x+a.w,yy);ctx.stroke();
    }
    ctx.globalAlpha=F.grid*0.7;
    ctx.font=`600 ${S.W<500?15:21}px 'Segoe UI',system-ui,sans-serif`;
    ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle='#fff';
    const labels={0.001:'$0.001',0.01:'$0.01',0.1:'$0.10',1:'$1',10:'$10',100:'$100',1000:'$1K',10000:'$10K',100000:'$100K'};
    for(const t of ticks){
      if(t<yr.min||t>yr.max)continue;
      ctx.fillText(labels[t]||'$'+t,a.x-12,yP(t));
    }
    // X-axis years
    ctx.textAlign='center';ctx.textBaseline='top';
    const step=S.W<500?4:2;
    for(let yr2=2010;yr2<=2026;yr2+=step){
      const idx=data.findIndex(d=>d.date.startsWith(yr2+'-01')||d.date.startsWith(yr2+'-02'));
      if(idx>=0)ctx.fillText(String(yr2),xP(idx),a.y+a.h+8);
    }
    ctx.globalAlpha=1;
  }

  // Z-Score Heat Strip
  if(F.heatStrip>0&&S.aZS>0.003){
    // Kino-Enthuellung und Layer-Schalter teilen sich dieselbe Wischkante
    const hs=Math.min(F.heatStrip,S.aZS);
    const sH=S.W<500?18:28,sY=a.y+a.h+38;
    const maxI=Math.floor(N*pP);
    const revI=Math.floor(maxI*hs);
    for(let i=0;i<revI;i++){
      const x1=xP(i),x2=xP(Math.min(i+1,N-1));
      const z=data[i].z;
      const norm=Math.max(0,Math.min(1,(z+2.5)/5));
      const hue=(1-norm)*145; // unterbewertet = gruen, ueberbewertet = rot (wie das Gap-Band)
      const edge=Math.max(0,1-(revI-i)/50);          // Leuchtkante an der Wischfront
      const base=data[i].inSample?0.65:0.18;
      ctx.fillStyle=`hsla(${hue},85%,${50+edge*26}%,${Math.min(1,base+edge*0.3)})`;
      ctx.fillRect(x1,sY,Math.max(x2-x1,1.2),sH);
    }
    if(hs<0.999&&revI>2){                            // weicher Lichtsaum vorne
      const ex=xP(Math.min(revI,N-1)),gw=26;
      const g=ctx.createLinearGradient(ex-gw,0,ex,0);
      g.addColorStop(0,'rgba(255,255,255,0)');
      g.addColorStop(1,'rgba(255,255,255,0.42)');
      ctx.fillStyle=g;ctx.fillRect(ex-gw,sY,gw,sH);
    }
    ctx.globalAlpha=hs*0.45;
    ctx.font=`600 ${S.W<500?10:12}px 'Segoe UI',system-ui,sans-serif`;
    ctx.textAlign='left';ctx.fillStyle='rgba(255,255,255,0.75)';ctx.fillText('Z-Score',a.x,sY-4);
    ctx.fillStyle='#44ff88';ctx.fillText('-2.5 unterbewertet',a.x,sY+sH+12);
    ctx.textAlign='right';ctx.fillStyle='#ff4466';ctx.fillText('überbewertet +2.5',a.x+a.w,sY+sH+12);
    ctx.globalAlpha=1;
  }

  // Gap Band
  if(F.fill>0&&S.aGap>0.003){
    const maxI=Math.floor(N*Math.min(pP,fP));
    for(let i=0;i<maxI-1;i++){
      if(!data[i].inSample)continue;
      const x1=xP(i),x2=xP(i+1);
      const gf=F.fill*wipeAt(x1,S.aGap);
      if(gf<=0.002)continue;
      const py1=yP(data[i].price),py2=yP(data[i+1].price);
      const fy1=yP(data[i].fair),fy2=yP(data[i+1].fair);
      const gp=data[i].gapPct;
      let col;
      if(gp<-40)col=`rgba(0,212,170,${gf*0.4})`;
      else if(gp<-15)col=`rgba(0,212,170,${gf*0.22})`;
      else if(gp<15)col=`rgba(255,255,255,${gf*0.04})`;
      else if(gp<60)col=`rgba(255,160,60,${gf*0.15})`;
      else col=`rgba(255,68,102,${gf*0.3})`;
      ctx.fillStyle=col;
      ctx.beginPath();ctx.moveTo(x1,py1);ctx.lineTo(x2,py2);ctx.lineTo(x2,fy2);ctx.lineTo(x1,fy1);ctx.closePath();ctx.fill();
    }
  }

  // Fair Value Line — ausserhalb des Schaetzfensters gestrichelt und gedimmt,
  // weil das Modell dort extrapoliert statt zu erklaeren
  if(S.aFV>0.003&&fP>0){
    const maxI=Math.floor(N*fP);
    ctx.strokeStyle=wipeGrad('247,147,26',S.aFV);ctx.lineWidth=S.W<500?2.2:2.8;
    ctx.shadowColor='#F7931A';
    for(const phase of [0,1]){
      ctx.globalAlpha=F.fairLine*(phase?1:0.32);
      ctx.shadowBlur=phase?10:0;
      ctx.setLineDash(phase?[]:[5,6]);
      ctx.beginPath();let pen=false;
      for(let i=0;i<maxI;i++){
        if(!!data[i].inSample!==!!phase){pen=false;continue;}
        const x=xP(i),y=yP(data[i].fair);
        if(!pen){ctx.moveTo(x,y);pen=true;}else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.setLineDash([]);ctx.shadowBlur=0;ctx.globalAlpha=1;
  }

  // Price Line
  if(pP>0){
    const maxI=Math.floor(N*pP);
    ctx.globalAlpha=F.priceLine;ctx.strokeStyle='#fff';ctx.lineWidth=S.W<500?2.6:3.4;
    ctx.shadowColor='#fff';ctx.shadowBlur=8;
    ctx.beginPath();
    for(let i=0;i<maxI;i++){
      const x=xP(i),y=yP(data[i].price);
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.stroke();
    if(pP<1){
      const ti=Math.min(maxI,N-1);
      ctx.beginPath();ctx.arc(xP(ti),yP(data[ti].price),6,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.9)';ctx.shadowBlur=20;ctx.fill();
    }else if(now){
      const li=N-1,lx=xP(li),ly=yP(data[li].price);
      const pulse=0.5+0.5*Math.sin(now/650);
      ctx.beginPath();ctx.arc(lx,ly,3.5+pulse*3,0,Math.PI*2);
      ctx.strokeStyle=`rgba(255,255,255,${0.4-pulse*0.15})`;ctx.lineWidth=1.4;ctx.stroke();
      ctx.beginPath();ctx.arc(lx,ly,2.5,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fill();
    }
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }

  // Markers — erscheinen zeitversetzt nacheinander, ruhig eingeblendet
  if(S.aMK>0.003&&F.markers>0){
    const markers=getMarkers();
    const K=markers.length;
    const SPREAD=0.5;                          // Anteil des Fensters je Marker
    const step=(1-SPREAD)/Math.max(1,K-1);
    markers.forEach((m,k)=>{
      if(m.i>=Math.floor(N*pP))return;
      const local=eo(Math.max(0,Math.min(1,(F.markers-k*step)/SPREAD)));
      if(local<=0.002)return;
      const d=data[m.i],mx=xP(m.i),my=yP(d.price);
      const detail=`$${fmtK(d.price)} / Z ${d.z.toFixed(1)}`;
      const arrive=1-local;                    // kurzer Lichtblitz beim Auftauchen
      const grow=0.55+0.45*local;
      const breathe=now?0.5+0.5*Math.sin(now/1250+m.i*0.7):0;   // ruhiger Atem
      const mw=wipeAt(mx,S.aMK);          // Marker folgen derselben Wischkante
      if(mw<=0.002)return;
      const labelA=Math.max(0,(local-0.4)/0.6)*mw;
      ctx.globalAlpha=local*mw;
      if(m.type==='top'){
        ctx.fillStyle='#ff4466';
        ctx.shadowColor='#ff4466';ctx.shadowBlur=3+breathe*6+arrive*30;
        drawDiamond(ctx,mx,my-14,(6.8+breathe*0.9)*grow);
        ctx.shadowBlur=0;
        if(labelA>0){ctx.globalAlpha=labelA;drawMLabel(ctx,mx,my-30,m.label,detail,'#ff4466');}
      }else if(m.type==='bottom'){
        const r=5*grow;
        ctx.fillStyle='#00d4aa';ctx.shadowColor='#00d4aa';ctx.shadowBlur=3+arrive*30;
        ctx.beginPath();ctx.arc(mx,my+10,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
        ctx.strokeStyle='#00d4aa';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(mx,my+10,r*1.8,0,Math.PI*2);ctx.stroke();
        if(now){
          ctx.strokeStyle=`rgba(0,212,170,${0.38*(1-breathe)*local*mw})`;ctx.lineWidth=1.5;
          ctx.beginPath();ctx.arc(mx,my+10,r*1.8+breathe*8,0,Math.PI*2);ctx.stroke();
        }
        if(labelA>0){ctx.globalAlpha=labelA;drawMLabel(ctx,mx,my+26,m.label,detail,'#00d4aa');}
      }else if(m.type==='now'){
        const pulse=now?0.5+0.5*Math.sin(now/900):1;
        ctx.strokeStyle=`rgba(255,255,255,${0.5*pulse*local*mw})`;ctx.lineWidth=2;ctx.setLineDash([8,6]);
        ctx.beginPath();ctx.moveTo(mx,a.y);ctx.lineTo(mx,a.y+a.h);ctx.stroke();ctx.setLineDash([]);
        ctx.globalAlpha=labelA;
        ctx.font=`900 ${S.W<500?13:16}px 'Segoe UI',system-ui,sans-serif`;
        ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('HEUTE',mx,a.y-10);
        ctx.font=`600 ${S.W<500?9:11}px 'Segoe UI',system-ui,sans-serif`;
        ctx.fillStyle='rgba(255,255,255,0.55)';
        ctx.fillText(`$${fmtK(d.price)} / Gap ${d.gapPct.toFixed(0)}%`,mx,a.y-10+18);
      }
      ctx.globalAlpha=1;
    });
    ctx.globalAlpha=1;
  }

  if(camS!==1)ctx.restore();   // Kamera schliessen

  // Vignette liegt UEBER der Datenebene — dunkle Raender, Blick nach innen gezogen
  if(F.vignetteAlpha>0){
    const vg=ctx.createRadialGradient(S.W/2,S.H/2,S.W*0.18,S.W/2,S.H/2,S.W*0.78);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,`rgba(0,0,0,${Math.min(1,F.vignetteAlpha*0.92)})`);
    ctx.fillStyle=vg;ctx.fillRect(0,0,S.W,S.H);
  }

  // SPOTLIGHT — alles ausserhalb des Fokusbereichs faellt ins Dunkel
  if(F.focusAmt>0&&F.focusFrom!=null){
    const fx1=xP(F.focusFrom),fx2=xP(F.focusTo),fade=70,dk=F.focusAmt*0.78;
    ctx.fillStyle=`rgba(0,0,0,${dk})`;
    ctx.fillRect(0,0,Math.max(0,fx1-fade),S.H);
    ctx.fillRect(Math.min(S.W,fx2+fade),0,S.W,S.H);
    const gl=ctx.createLinearGradient(fx1-fade,0,fx1,0);
    gl.addColorStop(0,`rgba(0,0,0,${dk})`);gl.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gl;ctx.fillRect(fx1-fade,0,fade,S.H);
    const gr=ctx.createLinearGradient(fx2,0,fx2+fade,0);
    gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,`rgba(0,0,0,${dk})`);
    ctx.fillStyle=gr;ctx.fillRect(fx2,0,fade,S.H);
  }

  // Explainer caption banner (top, uses empty headroom — never covers the plot)
  if(F.bannerAlpha>0){
    const lbOff=(F.letterbox||0)*S.H*0.12;   // unter den Cinemascope-Balken rutschen
    const bh=(S.W<500?68:88)+lbOff;
    const grad=ctx.createLinearGradient(0,lbOff,0,bh);
    grad.addColorStop(0,`rgba(0,0,0,${F.bannerAlpha*0.8})`);
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grad;ctx.fillRect(0,lbOff,S.W,bh-lbOff);
    ctx.globalAlpha=F.bannerAlpha;
    ctx.textAlign='center';ctx.textBaseline='alphabetic';
    if(F.bannerLabel){
      ctx.font=`700 ${S.W<500?10:12}px 'Segoe UI',system-ui,sans-serif`;
      ctx.fillStyle=F.bannerColor||'#F7931A';ctx.letterSpacing=`${S.W<500?2:4}px`;
      ctx.fillText(F.bannerLabel.toUpperCase(),S.W/2,lbOff+(S.W<500?18:24));
      ctx.letterSpacing='0px';
    }
    ctx.font=`800 ${S.W<500?15:22}px 'Segoe UI',system-ui,sans-serif`;
    ctx.fillStyle='#fff';ctx.shadowColor='rgba(255,255,255,0.35)';ctx.shadowBlur=8;
    ctx.fillText(F.bannerText||'',S.W/2,lbOff+(S.W<500?40:52));
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }

  // Watermark — bottom-left, centered
  if(F.headerAlpha>0){
    ctx.globalAlpha=F.headerAlpha*0.55;
    ctx.textAlign='center';ctx.textBaseline='bottom';
    const wmX=55;
    ctx.font='900 16px "Segoe UI",system-ui,sans-serif';ctx.fillStyle='#fff';
    ctx.fillText('GREAT',wmX,S.H-32);
    ctx.font='900 20px "Segoe UI",system-ui,sans-serif';
    const wallTxt='WALL',yTxt='Y';
    const wallW=ctx.measureText(wallTxt).width,yW2=ctx.measureText(yTxt).width;
    const totalW=wallW+yW2;
    ctx.fillStyle='#F7931A';
    ctx.textAlign='left';
    ctx.fillText(wallTxt,wmX-totalW/2,S.H-10);
    ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=6;
    ctx.fillText(yTxt,wmX-totalW/2+wallW,S.H-10);
    ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.textAlign='left';
  }

  // Tooltip
  if(S.hover>=0&&S.hover<N&&!S.cinema){
    const d=data[S.hover],hx=xP(S.hover),hy=yP(d.price);
    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(hx,a.y);ctx.lineTo(hx,a.y+a.h);ctx.stroke();
    ctx.beginPath();ctx.moveTo(a.x,hy);ctx.lineTo(a.x+a.w,hy);ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(hx,hy,5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
    const tw=S.W<500?175:225,th=92;
    let tx=hx+15,ty=hy-th/2;
    if(tx+tw>S.W-10)tx=hx-tw-15;
    if(ty<a.y)ty=a.y;if(ty+th>a.y+a.h)ty=a.y+a.h-th;
    ctx.fillStyle='rgba(10,10,20,0.93)';rRect(ctx,tx,ty,tw,th,8);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;rRect(ctx,tx,ty,tw,th,8);ctx.stroke();
    const fs=S.W<500?11:13;
    ctx.font=`600 ${fs}px 'Segoe UI',system-ui,sans-serif`;ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillStyle='rgba(255,255,255,0.45)';ctx.fillText(d.date,tx+12,ty+10);
    ctx.fillStyle='#fff';ctx.font=`700 ${fs+1}px 'Segoe UI',system-ui,sans-serif`;
    ctx.fillText(`Preis: $${fmtK(d.price)}`,tx+12,ty+28);
    ctx.fillStyle='#F7931A';ctx.fillText(`Fair Value: $${fmtK(d.fair)}`,tx+12,ty+48);
    ctx.fillStyle=d.gapPct<0?'#00d4aa':'#ff4466';
    ctx.fillText(`Gap: ${d.gapPct>0?'+':''}${d.gapPct.toFixed(1)}%`,tx+12,ty+68);
    const zNorm=Math.max(0,Math.min(1,(d.z+3)/6));
    const zHue=(1-zNorm)*145;
    ctx.fillStyle=`hsl(${zHue},85%,50%)`;
    ctx.fillText(`Z: ${d.z.toFixed(2)}`,tx+tw/2+4,ty+68);
  }

  // Cinema text
  if(F.storyAlpha>0){
    const sc=F.zoomScale||1;
    ctx.save();ctx.translate(S.W/2,S.H/2);ctx.scale(sc,sc);ctx.translate(-S.W/2,-S.H/2);
    const tFs=(S.W<500?36:90)*(F.storyScale||1);
    ctx.font=`900 ${tFs}px 'Segoe UI',system-ui,sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=F.storyColor||'#F7931A';ctx.shadowColor=F.storyColor||'#F7931A';ctx.shadowBlur=40;
    ctx.globalAlpha=F.storyAlpha;ctx.letterSpacing=`${(S.W<500?3:12)*(F.storyScale||1)}px`;
    const lines=wrapT(F.storyText,S.W*0.92,ctx);
    const lH=tFs*1.25;const sY=S.H/2-(lines.length-1)*lH/2;
    lines.forEach((l,li)=>{ctx.fillText(l,S.W/2,sY+li*lH);});
    ctx.shadowBlur=70;ctx.globalAlpha=F.storyAlpha*0.35;
    lines.forEach((l,li)=>{ctx.fillText(l,S.W/2,sY+li*lH);});
    ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.letterSpacing='0px';ctx.restore();
  }
  if(F.twistAlpha>0){
    const twFs=S.W<500?32:75;
    ctx.font=`900 ${twFs}px 'Segoe UI',system-ui,sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=30;
    ctx.globalAlpha=F.twistAlpha;ctx.fillText(F.twistText||'',S.W/2,S.H/2);
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
  // GROSSE ZAHL — der Moment, in dem eine Kennzahl das ganze Bild uebernimmt
  if(F.bigAlpha>0){
    const bf=(S.W<500?46:104)*(F.bigScale||1);
    const col=F.bigColor||'#F7931A';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=`900 ${bf}px 'Segoe UI',system-ui,sans-serif`;
    ctx.fillStyle=col;ctx.shadowColor=col;
    ctx.globalAlpha=F.bigAlpha;ctx.shadowBlur=38;
    ctx.fillText(F.bigText||'',S.W/2,S.H*0.44);
    ctx.globalAlpha=F.bigAlpha*0.32;ctx.shadowBlur=70;   // Bloom
    ctx.fillText(F.bigText||'',S.W/2,S.H*0.44);
    ctx.shadowBlur=0;ctx.globalAlpha=F.bigAlpha;
    if(F.bigSub){
      ctx.font=`700 ${S.W<500?13:23}px 'Segoe UI',system-ui,sans-serif`;
      ctx.fillStyle='rgba(255,255,255,0.8)';
      ctx.letterSpacing=`${S.W<500?2:5}px`;
      ctx.fillText(F.bigSub.toUpperCase(),S.W/2,S.H*0.44+bf*0.60);
      ctx.letterSpacing='0px';
    }
    ctx.globalAlpha=1;
  }

  if(F.phaseLabelAlpha>0){
    const plFs=S.W<500?13:22;
    ctx.font=`700 ${plFs}px 'Segoe UI',system-ui,sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.globalAlpha=F.phaseLabelAlpha;
    ctx.letterSpacing=`${S.W<500?2:7}px`;
    ctx.fillText((F.phaseLabel||'').toUpperCase(),S.W/2,16);
    ctx.letterSpacing='0px';ctx.globalAlpha=1;
  }

  // FILMKORN — nimmt dem Schwarz das Digitale
  if(F.grain>0){
    ctx.save();
    ctx.globalAlpha=F.grain*0.05;ctx.globalCompositeOperation='overlay';
    const ox=-Math.random()*128,oy=-Math.random()*128;
    for(let gx=ox;gx<S.W;gx+=128)for(let gy=oy;gy<S.H;gy+=128)ctx.drawImage(GRAIN,gx,gy);
    ctx.restore();
  }

  // BLITZ — harter Schnitt auf den Wendepunkt
  if(F.flash>0){
    ctx.fillStyle=`rgba(255,255,255,${Math.min(1,F.flash)})`;
    ctx.fillRect(0,0,S.W,S.H);
  }

  // CINEMASCOPE — Balken fahren zu den Textmomenten zu und zum Chart wieder auf
  if(F.letterbox>0){
    const bh=S.H*0.12*F.letterbox;
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,S.W,bh);ctx.fillRect(0,S.H-bh,S.W,bh);
  }

  const panel=document.getElementById('panel'),share=document.querySelector('.share-bar');
  if(panel)panel.style.opacity=F.panelAlpha!=null?F.panelAlpha:1;
  if(share)share.style.opacity=F.shareAlpha!=null?F.shareAlpha:1;
}

// Helpers
function fmtK(n){if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(n>=10000?0:1)+'K';if(n>=1)return n.toFixed(2);return n.toPrecision(3);}
function drawDiamond(c,x,y,s){c.beginPath();c.moveTo(x,y-s);c.lineTo(x+s,y);c.lineTo(x,y+s);c.lineTo(x-s,y);c.closePath();c.fill();}
function drawMLabel(c,x,y,t1,t2,col){
  const fs=S.W<500?8:10;c.font=`700 ${fs}px 'Segoe UI',system-ui,sans-serif`;
  const w=Math.max(c.measureText(t1).width,c.measureText(t2).width)+10;
  c.fillStyle=col;c.globalAlpha*=0.15;rRect(c,x-w/2,y-1,w,fs*2+8,4);c.fill();
  c.globalAlpha/=0.15;c.fillStyle=col;c.textAlign='center';c.textBaseline='top';
  c.fillText(t1,x,y+1);c.fillStyle='rgba(255,255,255,0.65)';c.font=`500 ${fs-1}px 'Segoe UI',system-ui,sans-serif`;
  c.fillText(t2,x,y+fs+3);
}
function rRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function wrapT(text,maxW,c){const lines=[];for(const seg of String(text).split('\n')){const words=seg.split(' ');let cur='';for(const w of words){const test=cur?cur+' '+w:w;if(c.measureText(test).width>maxW&&cur){lines.push(cur);cur=w;}else cur=test;}if(cur)lines.push(cur);}return lines;}

  keyBuf.push({key:e.key.toLowerCase(),t:Date.now()});
  keyBuf=keyBuf.filter(k=>Date.now()-k.t<500);

    const l2=keyBuf.slice(-2);
    if(l2[0].key==='s'&&l2[1].key==='t'&&!S.cinema){startCinema();keyBuf=[];}

  }
});

function startCinema(){
  const t0=performance.now();S.cinema=true;
  const DUR=64000;
  const BASE_YEAR=S.startYear;
  let appliedYear=BASE_YEAR,lastBlend=applyYearBlend(BASE_YEAR);
  const fmtUSD=v=>Math.round(v).toLocaleString('de-DE')+' $';
  function banner(F,t,s,e,label,text,color){
    F.bannerAlpha=eio(t,s,s+700,e-900,e);
    F.bannerLabel=label;F.bannerText=text;F.bannerColor=color;
  }
  // Hook: erst in eine Richtung reden, dann Kehrtwende, dann Zuspitzung, dann Capper
  const HOOK=[
    {s:0,e:3000,text:'BITCOIN FOLGT\nDER GELDMENGE',color:'#fff',scale:0.52},
    {s:3000,e:5800,text:'BESTIMMTHEITSMASS\n0,89',color:'#fff',scale:0.52},
    {s:5800,e:8800,text:'ICH HABE EINE\nEINSTELLUNG GEÄNDERT',color:'#F7931A',scale:0.50},
    {s:8800,e:11800,text:'74.000 $\nODER 249.000 $',color:'#fff',scale:0.70},
    {s:11800,e:15500,text:'KEINE MESSUNG\nEINE WAHL',color:'#F7931A',scale:0.76}
  ];
  function frame(now){
    if(!S.cinema)return;
    const t=now-t0;
    if(t>=DUR){S.cinema=null;S.startYear=BASE_YEAR;recompute();updateStats();render();return;}
    const F={grid:0,fill:0,priceLine:0,fairLine:0,markers:0,heatStrip:0,
      priceProgress:0,fairProgress:0,headerAlpha:0,panelAlpha:0,shareAlpha:0,
      vignetteAlpha:0,storyAlpha:0,storyText:'',storyColor:'#F7931A',storyScale:1,
      twistAlpha:0,twistText:'',phaseLabel:'',phaseLabelAlpha:0,zoomScale:1,
      bannerAlpha:0,bannerLabel:'',bannerText:'',bannerColor:'#F7931A',
      letterbox:0,grain:0,flash:0,camScale:1,camFocusX:null,camFocusY:null,
      focusAmt:0,focusFrom:null,focusTo:null,
      bigAlpha:0,bigText:'',bigSub:'',bigColor:'#F7931A',bigScale:1};
    let wantYear=BASE_YEAR;

    if(t<15500){
      // ── AKT I · DER HAKEN ──────────────────────────────────────────
      F.vignetteAlpha=1;F.letterbox=eo(t/800);F.grain=0.9;
      for(const b of HOOK){
        if(t>=b.s&&t<b.e){
          F.storyAlpha=eio(t,b.s,b.s+450,b.e-550,b.e);
          F.storyText=b.text;F.storyColor=b.color;F.storyScale=b.scale;
          F.zoomScale=0.95+0.08*((t-b.s)/(b.e-b.s));
        }
      }
    }else if(t<17200){
      // ── Übergang: Balken öffnen, die Welt erscheint ────────────────
      const p=(t-15500)/1700;
      F.grid=eo(p);F.vignetteAlpha=1-p*0.6;F.letterbox=1-p*0.65;
      F.grain=0.9-p*0.35;F.camScale=1+0.01*p;
    }else if(t<22500){
      // ── AKT II · DIE WELT ──────────────────────────────────────────
      const p=(t-17200)/5300;
      F.grid=1;F.priceLine=1;F.priceProgress=eo(p);
      F.vignetteAlpha=0.4;F.letterbox=0.35;F.grain=0.55;F.camScale=1.01+0.025*p;
      banner(F,t,17200,22500,'Bitcoin','871 Wochenschlusskurse seit 2009 — Log-Skala','#fff');
    }else if(t<28000){
      // ── AKT III · DAS MODELL ───────────────────────────────────────
      const p=(t-22500)/5500;
      F.grid=1;F.priceLine=1;F.priceProgress=1;F.fairLine=1;
      F.fairProgress=eo((t-22500)/4000);F.fill=F.fairProgress*0.5;
      F.vignetteAlpha=0.4;F.letterbox=0.35;F.grain=0.55;F.camScale=1.035+0.015*p;
      banner(F,t,22500,28000,'M2 Fair Value','OLS-Regression auf die US-Geldmenge — R² = 0,89','#F7931A');
    }else if(t<35500){
      // ── AKT IV · DIE BEWEISLAGE ────────────────────────────────────
      const p=(t-28000)/7500;
      F.grid=1;F.priceLine=1;F.priceProgress=1;F.fairLine=1;F.fairProgress=1;
      F.fill=1;F.markers=eo((t-28000)/3300);F.heatStrip=eo((t-29200)/2900);
      F.vignetteAlpha=0.4;F.letterbox=0.35;F.grain=0.55;F.camScale=1.05+0.012*p;
      banner(F,t,28000,35500,'Heute','Bitcoin liegt 37% unter dem Fair Value — Z-Score -0,63','#00d4aa');
    }else if(t<40200){
      // ── AKT V · DIE WENDE ──────────────────────────────────────────
      const p=Math.min(1,(t-35500)/1800);
      F.grid=1-p*0.75;F.priceLine=1-p*0.55;F.priceProgress=1;
      F.fairLine=1-p*0.55;F.fairProgress=1;
      F.fill=1-p*0.75;F.markers=1-p*0.85;F.heatStrip=1-p*0.75;
      F.vignetteAlpha=0.4+p*0.6;F.letterbox=0.35+p*0.65;
      F.camScale=1.062-0.062*p;F.grain=0.55+p*0.35;
      F.flash=(t>=37300&&t<37700)?Math.max(0,1-(t-37300)/400):0;
      F.twistAlpha=eio(t,37700,38200,39400,40200);
      F.twistText='ÄNDERE DAS STARTJAHR';
    }else if(t<53500){
      // ── AKT VI · DER SCHWENK ───────────────────────────────────────
      // Kernszene: die Fair-Value-Linie wandert sichtbar mit dem Startjahr.
      const open=Math.min(1,(t-40200)/1300);
      F.grid=1;F.priceLine=1;F.priceProgress=1;F.fairLine=1;F.fairProgress=1;
      F.fill=1;F.markers=0.35;F.heatStrip=0.7;
      F.letterbox=1-open*0.65;F.grain=0.5;F.vignetteAlpha=0.9-open*0.5;
      F.camScale=1.02;
      F.focusFrom=Math.max(0,N-210);F.focusTo=N-1;
      F.focusAmt=eio(t,41500,42800,51800,53000)*0.85;

      if(t<43200)      wantYear=BASE_YEAR+(2017-BASE_YEAR)*eo((t-41500)/1700);
      else if(t<45000) wantYear=2017;
      else if(t<48200) wantYear=2017+(2010-2017)*eo((t-45000)/3200);
      else if(t<50000) wantYear=2010;
      else if(t<52000) wantYear=2010+(BASE_YEAR-2010)*eo((t-50000)/2000);

      if(t>=44000&&t<45000){
        F.bigAlpha=eio(t,44000,44400,44700,45000);
        F.bigText=fmtUSD(lastBlend.fairNow);F.bigSub='Startjahr 2017';F.bigColor='#00d4aa';
      }else if(t>=48700&&t<50000){
        F.bigAlpha=eio(t,48700,49100,49600,50000);
        F.bigText=fmtUSD(lastBlend.fairNow);F.bigSub='Startjahr 2010';F.bigColor='#ff4466';
      }else{
        banner(F,t,40200,53500,'Dieselbe Formel, dieselben Daten',
          'Nur das Startjahr der Regression ändert sich','#F7931A');
      }
    }else if(t<60000){
      // ── AKT VII · DAS URTEIL ───────────────────────────────────────
      F.grid=0.35;F.priceLine=0.4;F.priceProgress=1;F.fairLine=0.4;F.fairProgress=1;
      F.fill=0.3;F.heatStrip=0.3;
      F.vignetteAlpha=0.95;F.letterbox=0.55;F.grain=0.7;
      if(t<56300){
        F.bigAlpha=eio(t,53500,54100,55600,56300);
        F.bigText='0,887';F.bigSub='R² in Niveaus';F.bigColor='#00d4aa';
      }else{
        F.flash=t<56600?Math.max(0,(1-(t-56300)/300)*0.5):0;
        F.bigAlpha=eio(t,56600,57200,59300,60000);
        F.bigText='0,017';F.bigSub='R² auf Wachstumsraten';F.bigColor='#ff4466';
        F.bigScale=1.05;
      }
    }else{
      // ── AKT VIII · ABSPANN ─────────────────────────────────────────
      const p=(t-60000)/4000;
      F.grid=1;F.priceLine=1;F.priceProgress=1;F.fairLine=1;F.fairProgress=1;
      F.fill=1;F.markers=eo(p*1.4);F.heatStrip=eo(p*1.5);
      F.headerAlpha=eo(Math.max(0,(p-0.25)/0.5));
      F.vignetteAlpha=0.4;F.letterbox=Math.max(0,0.35*(1-p));F.grain=0.45;
      banner(F,t,60000,DUR,'6. August 2026',
        'M2 +4,8% · Bitcoin -45,7% · das Modell erklärt es nicht','#fff');
    }

    if(Math.abs(wantYear-appliedYear)>0.004){
      lastBlend=applyYearBlend(wantYear);appliedYear=wantYear;
    }
    render(now,F);requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function startExplainer(){
  const t0=performance.now();S.cinema=true;
  const DUR=120000;
  const phases=[
    {s:0,e:11000,label:'',text:'M2 FAIR-VALUE-TEST',color:'#F7931A'},
    {s:11000,e:25000,label:'Preis',text:'Wochenschlusskurse seit 2010 — Log-Skala',color:'#fff',
     show:{grid:1,priceLine:1,priceAnim:true}},
    {s:25000,e:39000,label:'Fair Value',text:'Was Bitcoin laut M2-Geldmenge kosten müsste',color:'#F7931A',
     show:{grid:1,priceLine:1,fairLine:1,fairAnim:true}},
    {s:39000,e:53000,label:'Gap-Band',text:'Grün: unterbewertet · Rot: überbewertet',color:'#00d4aa',
     show:{grid:1,priceLine:1,fairLine:1,fill:1}},
    {s:53000,e:68000,label:'Z-Score',text:'Abstand zum Fair Value in Standardabweichungen',color:'#ff6644',
     show:{grid:1,priceLine:1,fairLine:1,fill:1,heatStrip:1}},
    {s:68000,e:82000,label:'Marker',text:'Sitzen exakt auf Top oder Boden',color:'#ff4466',
     show:{grid:1,priceLine:1,fairLine:1,fill:1,heatStrip:1,markers:1}},
    {s:82000,e:95000,label:'Panel',text:'Regressions-Startjahr verschieben — der Fair Value springt mit',color:'#F7931A',
     show:{grid:1,priceLine:1,fairLine:1,fill:1,heatStrip:1,markers:1,showPanel:true}},
    {s:95000,e:109000,label:'Heute',text:'Z-Score -0,63 — 216 von 709 Wochen lagen tiefer',color:'#00d4aa',
     show:{grid:1,priceLine:1,fairLine:1,fill:1,heatStrip:1,markers:1}},
    {s:109000,e:120000,label:'Los geht\'s',text:'Jetzt selbst erkunden',color:'#fff',
     show:{grid:1,priceLine:1,fairLine:1,fill:1,heatStrip:1,markers:1,showAll:true}}
  ];
  function frame(now){
    if(!S.cinema)return;
    const t=now-t0;
    if(t>=DUR){S.cinema=null;render();return;}
    const F={grid:0,fill:0,priceLine:0,fairLine:0,markers:0,heatStrip:0,
      priceProgress:0,fairProgress:0,headerAlpha:0,panelAlpha:0,shareAlpha:0,
      vignetteAlpha:0,storyAlpha:0,storyText:'',storyColor:'#F7931A',
      twistAlpha:0,twistText:'',phaseLabel:'',phaseLabelAlpha:0,zoomScale:1,
      bannerAlpha:0,bannerLabel:'',bannerText:'',bannerColor:'#F7931A'};
    let ph=phases[0];
    for(const p of phases){if(t>=p.s&&t<p.e)ph=p;}
    const pt=(t-ph.s)/(ph.e-ph.s);
    if(ph.s===0){
      F.vignetteAlpha=1;F.storyAlpha=eio(t,700,1600,8500,11000);
      F.storyText=ph.text;F.storyColor=ph.color;
      F.zoomScale=0.94+0.1*pt;
    }else{
      const fs=ph.show;
      F.grid=fs.grid||0;
      F.priceLine=fs.priceLine||0;
      F.priceProgress=fs.priceAnim?eo(pt):fs.priceLine?1:0;
      F.fairLine=fs.fairLine||0;
      F.fairProgress=fs.fairAnim?eo(pt):fs.fairLine?1:0;
      F.fill=fs.fill?eio(t,ph.s,ph.s+1500,ph.e,ph.e):0;
      F.markers=fs.markers?eio(t,ph.s,ph.s+3400,ph.e,ph.e):0;
      F.heatStrip=fs.heatStrip?eio(t,ph.s,ph.s+3000,ph.e,ph.e):0;
      F.headerAlpha=fs.showAll?eo(pt):0;
      F.panelAlpha=fs.showPanel?eio(t,ph.s,ph.s+1000,ph.e-1500,ph.e):0;
      F.shareAlpha=fs.showAll?eo(pt):0;
      F.vignetteAlpha=0.3;
      F.bannerAlpha=eio(t,ph.s+300,ph.s+1000,ph.e-900,ph.e);
      F.bannerLabel=ph.label;F.bannerText=ph.text;F.bannerColor=ph.color;
      F.zoomScale=1;
    }
    render(now,F);requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function eo(t){return t>=1?1:t<=0?0:1-Math.pow(1-t,3);}
function eio(t,a,b,c,d){if(t<a)return 0;if(t<b)return eo((t-a)/(b-a));if(t<c)return 1;if(t<d)return 1-eo((t-c)/(d-c));return 0;}

// =================================================================
// INIT
// =================================================================
updateStats();render();
(function tick(){if(!S.cinema)render(performance.now());requestAnimationFrame(tick);})();
</script>
