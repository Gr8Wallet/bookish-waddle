  ctx.textAlign='center';ctx.fillStyle='rgba(247,147,26,'+(0.6*a)+')';
  ctx.font='700 '+(W<640?10:13)+'px "Arial Black",Arial';
  ctx.fillText('SUPPLY-ADJ. CDD (90T)',0,0);ctx.restore();
  // year ticks
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.font='700 '+(W<640?13:20)+'px "Arial Black",Arial';
  const step=W<640?4:2;
  for(const[i,y] of yearIdx){ if((+y)%step!==0||y==='2010') continue;
    const x=xForI(i); if(x<PAD_L-2||x>W-PAD_R+2)continue;
    ctx.strokeStyle='rgba(255,255,255,'+(0.05*a)+')';ctx.beginPath();
    ctx.moveTo(x,PAD_T);ctx.lineTo(x,H-PAD_B);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,'+(0.72*a)+')';ctx.fillText(y,x,H-PAD_B+(showHeat?22:8));}
}

function drawZones(F){ // red translucent bands where cdd>threshold
  const a=F.zoneA*F.heatA; if(a<=0)return;
  let seg=null;
  for(let i=0;i<N;i++){const c=CD[i];
    if(c!=null&&c>=threshold){ if(!seg)seg=[i,i]; else seg[1]=i; }
    else if(seg){ paintZone(seg,F,a); seg=null; }}
  if(seg)paintZone(seg,F,a);
}
let zoneGrd=null,zoneGrdKey='';
function paintZone(seg,F,a){
  const x0=xForI(seg[0]),x1=xForI(seg[1]);
  const glow=F.zoneGlow||0;
  const key=a.toFixed(3)+'|'+glow.toFixed(3)+'|'+H;
  if(key!==zoneGrdKey){ // one gradient per frame, not per zone
    zoneGrd=ctx.createLinearGradient(0,PAD_T,0,H-PAD_B);
    zoneGrd.addColorStop(0,'rgba(255,65,54,'+(0.16*a+0.14*glow)+')');
    zoneGrd.addColorStop(1,'rgba(255,65,54,'+(0.02*a)+')');
    zoneGrdKey=key;
  }
  ctx.fillStyle=zoneGrd;ctx.fillRect(x0,PAD_T,Math.max(x1-x0,1.5),H-PAD_B-PAD_T);
}

function drawPrice(F){
  const a=F.priceA; if(a<=0)return;
  const upto=Math.floor((N-1)*F.priceProg); if(upto<1)return;
  ctx.lineJoin='round';ctx.lineCap='round';
  // one downsampled path, reused for area + glow + core stroke
  const p=new Path2D();
  p.moveTo(xForI(0),yForP(PR[0]));
  for(let i=STEP;i<upto;i+=STEP)p.lineTo(xForI(i),yForP(PR[i]));
  p.lineTo(xForI(upto),yForP(PR[upto]));
  // soft luminous area under the price line
  const ar=new Path2D(p);
  ar.lineTo(xForI(upto),H-PAD_B);ar.lineTo(xForI(0),H-PAD_B);ar.closePath();
  const grd=ctx.createLinearGradient(0,PAD_T,0,H-PAD_B);
  grd.addColorStop(0,'rgba(255,255,255,'+(0.10*a)+')');
  grd.addColorStop(0.55,'rgba(255,255,255,'+(0.035*a)+')');
  grd.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=grd;ctx.fill(ar);
  // glow = wide translucent underlay stroke (much cheaper than shadowBlur)
  const lw=W<640?2.4:3.4;
  ctx.strokeStyle='rgba(255,255,255,'+(0.16*a)+')';ctx.lineWidth=lw*3.2;ctx.stroke(p);
  ctx.strokeStyle='rgba(255,255,255,'+a+')';ctx.lineWidth=lw;ctx.stroke(p);
  // glowing cursor while drawing
  if(F.priceProg<1&&F.priceProg>0){const x=xForI(upto),y=yForP(PR[upto]);
    ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=20;
    ctx.beginPath();ctx.arc(x,y,4.5,0,7);ctx.fill();ctx.shadowBlur=0;}
}

function drawCdd(F){
  const a=F.cddA; if(a<=0)return;
  const upto=Math.floor((N-1)*F.cddProg);
  // bucket the colored segments into ~24 paths instead of thousands of strokes
  const NB=24, paths=new Array(NB);
  let px=null,py=null;
  for(let i=0;i<=upto;i+=STEP){const c=CD[i]; if(c==null){px=null;continue;}
    const x=xForI(i),y=yForC(c);
    if(px!=null){
      const b=Math.min(NB-1,Math.round(cnorm(c)*(NB-1)));
      if(!paths[b])paths[b]=new Path2D();
      paths[b].moveTo(px,py);paths[b].lineTo(x,y);
    }
    px=x;py=y;}
  ctx.lineJoin='round';ctx.lineCap='round';
  const lw=W<640?2.1:2.8;
  for(let b=0;b<NB;b++){const p=paths[b]; if(!p)continue; const t=b/(NB-1);
    ctx.strokeStyle=cddColT(t,0.16*a);ctx.lineWidth=lw*3;ctx.stroke(p);
    ctx.strokeStyle=cddColT(t,a);ctx.lineWidth=lw;ctx.stroke(p);}
  if(F.cddProg<1&&F.cddProg>0){let j=upto;while(j>0&&CD[j]==null)j--;
    const x=xForI(j),y=yForC(CD[j]);
    ctx.fillStyle=cddCol(CD[j],1);ctx.shadowColor=ORANGE;ctx.shadowBlur=18;
    ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();ctx.shadowBlur=0;}
}

function drawHeatStrip(F){
  const a=F.heatA; if(a<=0)return;
  const y=H-PAD_B+2, h=W<640?9:13;
  const stepPx=3;
  for(let sx=PAD_L;sx<W-PAD_R;sx+=stepPx){
    const i=Math.round((sx-PAD_L)/(W-PAD_L-PAD_R)*(N-1));
    const c=CD[Math.max(0,Math.min(N-1,i))]; if(c==null)continue;
    ctx.fillStyle=cddCol(c,0.85*a);ctx.fillRect(sx,y,stepPx+0.6,h);}
}

function drawMarkers(F){
  ctx.textAlign='center';
  // greedy label stagger: neighbours closer than 150px climb to the next row
  let lastLx=-1e9, row=0;
  EV.forEach((e,k)=>{
    const a=F.markers[k]||0; if(a<=0)return;
    const active=e.cdd>=threshold;
    const x=xForI(e.i), y=yForC(e.cdd);
    const pulse=1+(F.markerPulse&&F.markerPulse[k]||0)*0.5;
    // diamond on cdd line
    ctx.save();ctx.translate(x,y);
    ctx.shadowColor=active?'rgba(255,65,54,0.85)':'transparent';ctx.shadowBlur=active?18*a:0;
    const s=(W<640?7:9.5)*pulse;
    function dia(k){ctx.beginPath();ctx.moveTo(0,-s*k);ctx.lineTo(s*k,0);ctx.lineTo(0,s*k);ctx.lineTo(-s*k,0);ctx.closePath();}
    ctx.fillStyle=active?'rgba(255,65,54,'+a+')':'rgba(150,150,155,'+a+')';
    dia(1);ctx.fill();ctx.shadowBlur=0;
    // crisp edge so it reads on any background
    ctx.strokeStyle='rgba(0,0,0,'+(0.85*a)+')';ctx.lineWidth=2.4;dia(1);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,'+(0.9*a)+')';ctx.lineWidth=1.2;dia(1);ctx.stroke();
    ctx.restore();
    row=(x-lastLx<150)?(row+1)%3:0; lastLx=x;
    const boxY=y-(W<640?30:40)-row*26;
    if(F.markerMode==='sell'){
      // fear label
      lbl(x,boxY,'VERNICHTET?',RED,a,10);
    } else {
      // spike label — date + price at the moment old coins woke up
      lbl(x,boxY,fmtMY(e.date).toUpperCase()+' · '+fmtP(e.price),'#fff',a);
      // connector to price line at that date
      const pyp=yForP(PR[e.i]);
      ctx.strokeStyle='rgba(255,255,255,'+(0.22*a)+')';ctx.setLineDash([3,4]);ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x,y+8);ctx.lineTo(x,pyp);ctx.stroke();ctx.setLineDash([]);
    }
  });
}
function lbl(x,y,txt,col,a,sz){
  sz=sz||(W<640?10:12);
  ctx.save();ctx.globalAlpha=a;
  ctx.font='900 '+sz+'px "Arial Black",Arial';ctx.textBaseline='middle';ctx.textAlign='center';
  const w=ctx.measureText(txt).width+16;
  ctx.fillStyle='rgba(10,10,12,0.88)';rr(x-w/2,y-11,w,22,6);ctx.fill();
  ctx.strokeStyle=(col===RED?'rgba(255,65,54,0.9)':'rgba(255,255,255,0.55)');ctx.lineWidth=1.4;ctx.stroke();
  ctx.fillStyle=col;ctx.fillText(txt,x,y);
  ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawToday(F){
  const a=F.todayA;const x=xForI(N-1);
  ctx.strokeStyle='rgba(255,255,255,'+(0.5*a)+')';ctx.setLineDash([5,6]);ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(x,PAD_T);ctx.lineTo(x,H-PAD_B);ctx.stroke();ctx.setLineDash([]);
  // live price dot
  const yp=yForP(PR[N-1]);
  const t=performance.now()/600;const pr=(Math.sin(t)*0.5+0.5);
  ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.shadowColor='#fff';ctx.shadowBlur=14+pr*10;
  ctx.beginPath();ctx.arc(x,yp,4.5,0,7);ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,'+((1-pr)*0.5*a)+')';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(x,yp,5+pr*9,0,7);ctx.stroke();
  // current cdd dot
  if(lastCdd!=null){const yc=yForC(lastCdd);
    ctx.fillStyle=cddCol(lastCdd,a);ctx.shadowColor=ORANGE;ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(x,yc,4,0,7);ctx.fill();ctx.shadowBlur=0;}
  // top label
  ctx.font='900 '+(W<640?10:12.5)+'px "Arial Black",Arial';ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillStyle='rgba(255,255,255,'+(0.85*a)+')';ctx.fillText('HEUTE',x,PAD_T-6);
}

let hover=null;
function drawCrosshair(){
  if(!hover)return;const{i}=hover;const x=xForI(i);
  const yp=yForP(PR[i]);
  // crosshair lines
  ctx.strokeStyle='rgba(255,255,255,0.28)';ctx.lineWidth=1;ctx.setLineDash([2,4]);
  ctx.beginPath();ctx.moveTo(x,PAD_T);ctx.lineTo(x,H-PAD_B);ctx.stroke();
  ctx.beginPath();ctx.moveTo(PAD_L,yp);ctx.lineTo(W-PAD_R,yp);ctx.stroke();ctx.setLineDash([]);
  // dots on both lines
  ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(x,yp,4,0,7);ctx.fill();ctx.shadowBlur=0;
  if(CD[i]!=null){const yc=yForC(CD[i]);ctx.fillStyle=cddCol(CD[i],1);
    ctx.shadowColor=ORANGE;ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(x,yc,4,0,7);ctx.fill();ctx.shadowBlur=0;}
  // terminal-style axis flags: white boxes, black text
  ctx.font='900 '+(W<640?11:13)+'px "Arial Black",Arial';ctx.textBaseline='middle';
  const pt=fmtP(PR[i]), pw=ctx.measureText(pt).width+14;
  ctx.fillStyle='#fff';rr(PAD_L-pw-6,yp-12,pw,24,5);ctx.fill();
  ctx.fillStyle='#000';ctx.textAlign='center';ctx.fillText(pt,PAD_L-6-pw/2,yp);
  const dt=fmtMY(D[i]), dw=ctx.measureText(dt).width+16;
  ctx.fillStyle='#fff';rr(Math.max(PAD_L,Math.min(W-PAD_R-dw,x-dw/2)),H-PAD_B+2,dw,24,5);ctx.fill();
  ctx.fillStyle='#000';ctx.fillText(dt,Math.max(PAD_L+dw/2,Math.min(W-PAD_R-dw/2,x)),H-PAD_B+14);
}

function drawTitle(a){
  ctx.save();ctx.textAlign='center';ctx.textBaseline='top';
  const cx=W/2;
  ctx.font='900 '+(W<640?13:19)+'px "Arial Black",Arial';
  // letter-spaced two-tone: COIN DAYS in white, DESTROYED in red glow
  const ls=W<640?2:4, t1='COIN DAYS ', t2='DESTROYED';
  let tw=0;for(const ch of t1+t2)tw+=ctx.measureText(ch).width+ls;
  let x=cx-tw/2;
  ctx.globalAlpha=0.9*a;
  for(const ch of t1){ctx.fillStyle='#fff';
    ctx.fillText(ch,x+ctx.measureText(ch).width/2,16);x+=ctx.measureText(ch).width+ls;}
  ctx.shadowColor='rgba(255,65,54,0.8)';ctx.shadowBlur=14;
  for(const ch of t2){ctx.fillStyle=RED;
    ctx.fillText(ch,x+ctx.measureText(ch).width/2,16);x+=ctx.measureText(ch).width+ls;}
  ctx.shadowBlur=0;
  ctx.font='700 '+(W<640?9:11)+'px "Arial Black",Arial';
  ctx.fillStyle='rgba(255,255,255,0.45)';
  ctx.fillText('SUPPLY-ADJUSTED · 90-TAGE-SCHNITT · WENN URALTE COINS ERWACHEN',cx,W<640?34:44);
  ctx.restore();ctx.globalAlpha=1;
}

function drawVignette(s){
  if(s<=0)return;
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.28,W/2,H/2,Math.max(W,H)*0.72);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+Math.min(0.9,s)+')');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

function drawBrand(a){
  if(a<=0)return;
  ctx.globalAlpha=0.55*a;ctx.textBaseline='alphabetic';
  const cx=W-58, y=H-48;             // shared center x for the stacked lockup
  // GREAT — white, centered over the word below
  ctx.textAlign='center';ctx.font='900 16px "Arial Black",Arial';
  ctx.fillStyle='#fff';ctx.fillText('GREAT',cx,y);
  // WALLY — WALL orange + final Y white, whole word centered on cx
  ctx.font='900 21px "Arial Black",Arial';ctx.textAlign='left';
  const ww=ctx.measureText('WALL').width, wy=ctx.measureText('Y').width;
  const sx=cx-(ww+wy)/2, yy=y+22;
  ctx.fillStyle=ORANGE;ctx.fillText('WALL',sx,yy);
  ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=8;
  ctx.fillText('Y',sx+ww,yy);
  ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.textAlign='center';
}

// ---------- cinema text ----------
function drawCenterText(t){
  const a=t.alpha; if(a<=0)return;
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
  const cx=W/2, cy=t.y!=null?t.y:H*0.46;
  const baseSz=t.big?(W<640?46:100):(W<640?26:48);
  const lh=baseSz*1.16;
  const total=(t.lines.length-1)*lh;
  const fnt=t.light?function(s){return '300 '+s+'px "Segoe UI Light","Helvetica Neue",Arial';}
                   :function(s){return '900 '+s+'px "Arial Black",Arial';};
  t.lines.forEach((ln,i)=>{
    let sz=baseSz;
    ctx.font=fnt(sz);
    // auto-fit
    let w=ctx.measureText(ln.t).width;
    const maxW=W*0.9;
    if(w>maxW){sz=sz*maxW/w;ctx.font=fnt(sz);}
    const scale=t.scale||1;
    const y=cy-total/2+i*lh;
    ctx.save();ctx.translate(cx,y);ctx.scale(scale,scale);
    const col=ln.c||'#fff';
    // bloom pass
    ctx.globalAlpha=a*0.5;ctx.shadowColor=col;ctx.shadowBlur=80;
    ctx.fillStyle=col;ctx.fillText(ln.t,0,0);
    ctx.globalAlpha=a;ctx.shadowBlur=ln.c?26:16;ctx.shadowColor=col;
    ctx.fillText(ln.t,0,0);
    ctx.restore();
  });
  ctx.restore();
}
function drawCaption(c){
  const a=c.alpha;if(a<=0)return;
  ctx.save();ctx.textAlign='center';ctx.textBaseline='top';
  ctx.font='900 '+(W<640?14:25)+'px "Arial Black",Arial';
  ctx.fillStyle='rgba(255,255,255,'+a+')';
  ctx.shadowColor='rgba(0,0,0,0.8)';ctx.shadowBlur=12;
  // letter-spaced
  const txt=c.txt, ls=W<640?2:4;
  let tw=0;for(const ch of txt)tw+=ctx.measureText(ch).width+ls;
  let x=W/2-tw/2;const y=PAD_T-2>28?38:38;
  for(const ch of txt){ctx.fillText(ch,x+ctx.measureText(ch).width/2,y);x+=ctx.measureText(ch).width+ls;}
  ctx.restore();
}

// ================= ANIMATION =================
let anim=null, animStart=0;
const T=33;
function ease(x){return 1-Math.pow(1-Math.max(0,Math.min(1,x)),3);}
function ramp(t,a,b){return ease((t-a)/(b-a));}
function pulse(t,a,b){const x=(t-a)/(b-a);if(x<0||x>1)return 0;return Math.sin(x*Math.PI);}
function seg(t,a,b){return t>=a&&t<=b;}

function cinemaFrame(t){
  const F={gridA:0,axisA:0,priceA:0,priceProg:0,cddA:0,cddProg:0,heatA:0,zoneA:1,
    todayA:0,brandA:0,dim:0,vig:1,markers:EV.map(()=>0),markerMode:'sell',
    markerPulse:EV.map(()=>0),zoneGlow:0,text:null,caption:null,live:false,crosshair:false};

  // ---- PHASE A: HOOK / These (0–9)
  if(t<9){
    F.vig=1;
    if(t<2.7){ // title
      const al=Math.min(ramp(t,0.3,1.4), 1-ramp(t,2.3,2.7));
      F.text={lines:[{t:'COINS WERDEN',c:'#fff'},{t:'ZERSTÖRT',c:RED}],big:true,
        alpha:al,scale:0.94+ramp(t,0.3,2.7)*0.10};
    } else if(t<5.6){
      const al=Math.min(ramp(t,2.9,3.7),1-ramp(t,5.1,5.6));
      F.text={lines:[{t:'Der Name klingt brutal:',c:'#fff'},
        {t:'COIN DAYS DESTROYED',c:ORANGE}],alpha:al,scale:0.95+ramp(t,2.9,5.6)*0.08,y:H*0.46};
    } else {
      const al=Math.min(ramp(t,5.8,6.6),1-ramp(t,8.5,9.0));
      F.text={lines:[{t:'Werden hier wirklich',c:'#fff'},{t:'Coins vernichtet?',c:RED}],
        alpha:al,scale:0.95+ramp(t,5.8,9)*0.09,y:H*0.46};
    }
    return F;
  }

  // ---- PHASE B: known reading (9–20)
  if(t<20){
    F.vig=1-ramp(t,9,11.2)*0.66;
    F.gridA=ramp(t,9,10.6); F.axisA=F.gridA;
    F.priceA=1; F.priceProg=ramp(t,9.4,15.2);
    F.cddA=ramp(t,13.4,14.6); F.cddProg=ramp(t,13.6,19.2);
    F.heatA=ramp(t,16,19.3);
    F.markerMode='sell';
    const ma=ramp(t,17.6,19.6);
    F.markers=EV.map(()=>ma);
    F.zoneA=ramp(t,16.5,19);
    if(t<13) F.caption={txt:'SIEH GENAU HIN',alpha:Math.min(ramp(t,9.6,10.6),1-ramp(t,12.4,13))};
    else F.caption={txt:'JEDER SPIKE — MASSEN-VERNICHTUNG?',alpha:Math.min(ramp(t,13.6,14.6),1-ramp(t,19.4,20))};
    return F;
  }

  // ---- PHASE C: TWIST (20–24.6)
  if(t<24.6){
    F.gridA=1;F.axisA=1;F.priceA=1;F.priceProg=1;F.cddA=showCddOr(1);F.cddProg=1;
    F.heatA=1;F.zoneA=1;F.markers=EV.map(()=>0.5);F.markerMode='sell';
    F.vig=1;
    F.dim=Math.min(ramp(t,20,20.7)*0.74, 0.74)*(1-ramp(t,23.9,24.6));
    if(t<22.4){
      const al=Math.min(ramp(t,20.4,21.0),1-ramp(t,22.0,22.4));
      F.text={lines:[{t:'FALSCH',c:RED}],big:true,alpha:al,scale:0.9+ramp(t,20.4,22.4)*0.16};
    } else {
      const al=Math.min(ramp(t,22.5,23.1),1-ramp(t,24.1,24.6));
      F.text={lines:[{t:'NICHT DIE COINS',c:'#fff'},{t:'IHRE ZEIT',c:ORANGE}],big:true,
        alpha:al,scale:0.92+ramp(t,22.5,24.6)*0.12};
    }
    return F;
  }

  // ---- PHASE D: new reading (24.6–30.6)
  if(t<30.6){
    F.gridA=1;F.axisA=1;F.priceA=1;F.priceProg=1;F.cddA=showCddOr(1);F.cddProg=1;
    F.heatA=1;F.zoneA=1;F.markerMode='gain';F.vig=0.34;
    F.zoneGlow=pulse(t,25,30.6);
    // staggered marker reveal + pulse — spread across 4s whatever the marker count
    const stg=4.0/Math.max(1,EV.length-1);
    F.markers=EV.map((e,k)=>{const s=25.0+k*stg;return ramp(t,s,s+0.8);});
    F.markerPulse=EV.map((e,k)=>{const s=25.0+k*stg;return pulse(t,s,s+1.4);});
    F.caption={txt:'URALTE COINS ERWACHEN — IHRE ZEIT STIRBT',
      alpha:Math.min(ramp(t,25,26),1-ramp(t,29.8,30.4))};
    return F;
  }

  // ---- PHASE E: finale HEUTE (30.6–33)
  F.gridA=1;F.axisA=1;F.priceA=1;F.priceProg=1;F.cddA=showCddOr(1);F.cddProg=1;
  F.heatA=1;F.zoneA=1;F.markers=EV.map(()=>1);F.markerMode='gain';
  F.todayA=ramp(t,30.6,31.8);F.brandA=ramp(t,31.2,32.4);F.vig=0.44;F.live=true;
  return F;
}
function showCddOr(v){return showCdd?v:0;}

function loop(now){
  if(!anim)return;
  let t=(now-animStart)/1000;
  if(t>=T){anim=null;stopCinema();return;}
  draw(cinemaFrame(t));
  anim=requestAnimationFrame(loop);
}
function startCinema(){
  if(anim)cancelAnimationFrame(anim);
  document.getElementById('panel').style.opacity=0;
  document.getElementById('sharewrap').style.opacity=0;
  document.getElementById('sharewrap').style.pointerEvents='none';
  animStart=performance.now();anim=requestAnimationFrame(loop);
}
function stopCinema(){
  if(anim){cancelAnimationFrame(anim);anim=null;}
  document.getElementById('panel').style.opacity=1;
  document.getElementById('sharewrap').style.opacity=1;
  document.getElementById('sharewrap').style.pointerEvents='';
  drawStatic();
}

// hidden key trigger: S then T
let sTime=0;
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='s')sTime=performance.now();
  else if(k==='t'&&performance.now()-sTime<500)startCinema();
  else if(e.key==='Escape')stopCinema();
});

// ---------- interaction ----------
cv.addEventListener('mousemove',e=>{
  if(anim){hover=null;return;}
  const x=e.clientX;
  if(x<PAD_L||x>W-PAD_R){hover=null;hideTip();return;}
  const i=Math.round((x-PAD_L)/(W-PAD_L-PAD_R)*(N-1));
  hover={i:Math.max(0,Math.min(N-1,i))};
  showTip(e.clientX,e.clientY,hover.i);
});
cv.addEventListener('mouseleave',()=>{hover=null;hideTip();});
const tip=document.getElementById('tip');
function showTip(mx,my,i){
  const c=CD[i];
  tip.innerHTML='<div class="d">'+fmtDate(D[i])+'</div>'+
    '<div class="r"><span>BTC</span><span style="color:#fff">'+fmtPfull(PR[i])+'</span></div>'+
    '<div class="r"><span>CDD</span><span style="color:'+(c!=null?cddCol(c,1):'#888')+'">'+(c!=null?c.toFixed(3):'—')+'</span></div>';
  tip.style.opacity=1;
  let tx=mx+16,ty=my+16;
  if(tx+180>W)tx=mx-180;if(ty+70>H)ty=my-70;
  tip.style.left=tx+'px';tip.style.top=ty+'px';
}
function hideTip(){tip.style.opacity=0;}

// panel controls
const thEl=document.getElementById('th');
thEl.addEventListener('input',()=>{threshold=+thEl.value;
  document.getElementById('thVal').textContent=threshold.toFixed(2);
  computeEvents();invalidateLayer();});
const pminBtn=document.getElementById('pmin');
pminBtn.addEventListener('mousedown',e=>e.stopPropagation());
pminBtn.addEventListener('click',function(){
  const p=document.getElementById('panel');p.classList.toggle('min');
  this.textContent=p.classList.contains('min')?'+':'–';});
document.getElementById('tCdd').addEventListener('click',function(){showCdd=!showCdd;
  this.classList.toggle('on',showCdd);invalidateLayer();});
document.getElementById('tHeat').addEventListener('click',function(){showHeat=!showHeat;
  this.classList.toggle('on',showHeat);invalidateLayer();});

// draggable panel
(function(){const p=document.getElementById('panel'),h=document.getElementById('phead');
  let dx=0,dy=0,dr=false;
  h.addEventListener('mousedown',e=>{dr=true;dx=e.clientX-p.offsetLeft;dy=e.clientY-p.offsetTop;
    h.style.cursor='grabbing';});
  window.addEventListener('mousemove',e=>{if(!dr)return;
    p.style.left=(e.clientX-dx)+'px';p.style.top=(e.clientY-dy)+'px';p.style.right='auto';});
  window.addEventListener('mouseup',()=>{dr=false;h.style.cursor='grab';});
})();

// share
const url=location.href, msg='Coin Days Destroyed — wenn uralte Bitcoins erwachen 🧟‍♂️📈';
document.getElementById('shWa').href='https://wa.me/?text='+encodeURIComponent(msg+' '+url);
document.getElementById('shX').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(msg)+'&url='+encodeURIComponent(url);
document.getElementById('shLink').addEventListener('click',()=>{navigator.clipboard&&navigator.clipboard.writeText(url);
  const b=document.getElementById('shLink'),o=b.innerHTML;
  b.innerHTML='<span style="color:#31d158;font-size:17px;font-weight:900">✓</span>';
  setTimeout(()=>{b.innerHTML=o;},1200);});

// stats
document.getElementById('sPrice').textContent=fmtPfull(LAST.price);
document.getElementById('sCdd').textContent=(lastCdd!=null?lastCdd.toFixed(3):'—');
document.getElementById('sMax').textContent=maxCdd.toFixed(3)+' ('+fmtMY(D[maxCddI])+')';

// live redraw for pulse dot — cheap: blit cached layer + few live elements
function tick(){if(!anim)drawStatic();requestAnimationFrame(tick);}
resize();drawStatic();requestAnimationFrame(tick);
})();
</script>
</body>
