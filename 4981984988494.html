   Gold Hochs waren. Kein Polblau, keine Skala: es gibt kein Kontinuum und
   keine Zwei-Pol-Aussage in diesem Bild, nur Kurs, Flut und Marke. */
/* Episodenfarbe: blasses Goldgelb (19.09.2026) - die Farbe folgt der Story.
   Oberflaeche #F5D77A (Leuchtdichte 214), Tiefe #8A6E1E. Klar gelb, nicht
   orange: das satte #F7931A bleibt allein der Hervorhebung vorbehalten. */
const C_EC=[245,215,122];
/* Farbskala TURBO (polynomiale Naeherung nach Mikhailov) fuer die Luecke:
   wie tief Bitcoin unter seiner Marke liegt, 0 % (blau) bis 60 % (rot).
   Die dunklen Enden werden abgeschnitten (t 0,18-0,92), damit auf Schwarz
   nichts verschwindet. Bitcoin-Orange bleibt die einzige Hervorhebung. */
function turbo(t){ t=Math.max(0,Math.min(1,t)); t=0.18+0.74*t;
  const r=0.13572138+t*(4.61539260+t*(-42.66032258+t*(132.13108234+t*(-152.94239396+t*59.28637943))));
  const g=0.09140261+t*(2.19418839+t*(4.84296658+t*(-14.18503333+t*(4.27729857+t*2.82956604))));
  const b=0.10667330+t*(12.64194608+t*(-60.58204836+t*(110.36276771+t*(-89.90310912+t*27.34824973))));
  return [Math.round(255*Math.max(0,Math.min(1,r))),Math.round(255*Math.max(0,Math.min(1,g))),Math.round(255*Math.max(0,Math.min(1,b)))]; }
const TIEF_MAX=0.85;  /* Skalenende: 85 % unter der Marke */
function tiefC(d,al){ const c=turbo(d/TIEF_MAX); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+al+')'; }
const ec = al => 'rgba(245,215,122,'+al+')';
const ecD = al => 'rgba(138,110,30,'+al+')';
const orA = al => 'rgba(247,147,26,'+al+')';

/* ===================== Geometrie ===================== */
function geo(){
  const W=S.W,H=S.H;
  /* Ein Pane. Kein Nebenstreifen - was die Episode sagt, steht im Kursverlauf. */
  return {W,H,L:0,R:W,aT:H*0.015,aB:H*0.902,bar1:H*0.938,bar2:H*0.975};
}
function xOf(ts,g){ return g.L + (ts-S.t0)/(T_RIGHT-S.t0)*(g.R-g.L); }
function tsOf(x,g){ return S.t0 + (x-g.L)/(g.R-g.L)*(T_RIGHT-S.t0); }

let YLO=1,YHI=10;
function calcY(g){
  let lo=Infinity,hi=-Infinity;
  const i1=Math.max(0,iOf(S.t0)-1), i2=NP-1;
  for(let i=i1;i<=i2;i++){ const v=D.px[i]; if(v<lo)lo=v; if(v>hi)hi=v; }
  /* Die Marke und die Flut gehoeren mit ins Bild - oben steht die Aussage,
     unten der Boden, von dem aus gemessen wird. */
  if(REK) for(let i=i1;i<=i2;i++){ const v=REK[i]; if(v>hi)hi=v; }   /* NaN vor dem Starttag faellt durch den Vergleich */
  if(AU)  for(let i=i1;i<=i2;i++){ const v=AU[i]; if(v<lo)lo=v; if(v>hi)hi=v; }
  if(!isFinite(lo)){lo=pxAt(S.t0);hi=lo;}
  const sp=Math.log10(Math.max(1.0000001,hi/lo));
  const pd=Math.min(0.19,Math.max(0.045,sp*0.05));
  YLO=lo/Math.pow(10,pd*0.6); YHI=hi*Math.pow(10,Math.min(0.75,Math.max(0.22,sp*0.115)));
}
function yOf(p,g){
  const a=Math.log10(YLO),b=Math.log10(YHI);
  return g.aB-(Math.log10(Math.max(p,YLO*0.2))-a)/(b-a)*(g.aB-g.aT);
}
function pxProTag(g){ return (g.R-g.L)*DAY/(T_RIGHT-S.t0); }

function occLast(x,y,w,h){ if(!OCC)return 0; let c=0;
  const x0=Math.max(0,Math.floor(x/10)),x1=Math.min(OCW-1,Math.ceil((x+w)/10));
  const y0=Math.max(0,Math.floor(y/10)),y1=Math.min(OCH-1,Math.ceil((y+h)/10));
  for(let j=y0;j<=y1;j++)for(let i=x0;i<=x1;i++)if(OCC[j*OCW+i])c++;
  return c; }

/* ===================== Schriftgroessen ===================== */
const fsAx =W=>Math.max(16,Math.min(32,W*0.0176));
const fsLab=W=>Math.max(14,Math.min(28,W*0.0152));
const fsAnn=W=>Math.max(15,Math.min(30,W*0.0164));
const fsBar=W=>Math.max(13,Math.min(22,W*0.0128));

function kontur(t,x,y,fs,col,align){
  ctx.save(); ctx.textAlign=align||'left'; ctx.textBaseline='middle';
  ctx.lineJoin='round'; ctx.lineWidth=Math.max(2,fs*0.26); ctx.strokeStyle='rgba(0,0,0,.82)';
  ctx.strokeText(t,x,y); ctx.fillStyle=col; ctx.fillText(t,x,y); ctx.restore();
}
function platte(t,x,y,fs,col,align){
  ctx.save(); ctx.font='700 '+fs+'px system-ui,sans-serif'; ctx.textBaseline='middle';
  const w=ctx.measureText(t).width, px=fs*0.42, py=fs*0.34;
  let bx=x; if(align==='center')bx=x-w/2; else if(align==='right')bx=x-w;
  ctx.fillStyle='rgba(0,0,0,.72)';
  rrect(bx-px,y-fs*0.62-py*0.1,w+px*2,fs*1.24+py*0.2,6); ctx.fill();
  ctx.textAlign='left'; ctx.fillStyle=col; ctx.fillText(t,bx,y); ctx.restore();
}
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ===================== Belegungskarte ===================== */
let OCC=null,OCW=0,OCH=0,FOKR=null;
function occReset(g){ OCW=Math.ceil(g.W/10); OCH=Math.ceil(g.H/10); OCC=new Uint8Array(OCW*OCH); }
function occAdd(x,y,w,h){ if(!OCC)return; const x0=Math.max(0,Math.floor(x/10)),x1=Math.min(OCW-1,Math.ceil((x+w)/10));
  const y0=Math.max(0,Math.floor(y/10)),y1=Math.min(OCH-1,Math.ceil((y+h)/10));
  for(let j=y0;j<=y1;j++)for(let i=x0;i<=x1;i++)OCC[j*OCW+i]=1; }
function occFree(x,y,w,h){ if(!OCC)return true; const x0=Math.max(0,Math.floor(x/10)),x1=Math.min(OCW-1,Math.ceil((x+w)/10));
  const y0=Math.max(0,Math.floor(y/10)),y1=Math.min(OCH-1,Math.ceil((y+h)/10));
  for(let j=y0;j<=y1;j++)for(let i=x0;i<=x1;i++)if(OCC[j*OCW+i])return false; return true; }

/* ===================== Zeichnen ===================== */
let CAM={sc:1,cx:0.5,cy:0.5};
let PANR=null, GA=1;

function render(now,F){
  F=F||{};
  const dpr=Math.min(2,window.devicePixelRatio||1);
  /* Rueckfallkette (27.08.2026): in Vorschauumgebungen ist innerWidth 0 —
     ohne sie zeichnet der Chart in eine Null-Flaeche. */
  const wW=Math.round(window.innerWidth||document.documentElement.clientWidth||1440);
  const wH=Math.round(window.innerHeight||document.documentElement.clientHeight||810);
  if(cv.width!==Math.round(wW*dpr)||cv.height!==Math.round(wH*dpr)){
    cv.width=Math.round(wW*dpr); cv.height=Math.round(wH*dpr);
    cv.style.width=wW+'px'; cv.style.height=wH+'px';
  }
  S.W=wW; S.H=wH;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(wW<80||wH<80){ ctx.fillStyle='#000'; ctx.fillRect(0,0,Math.max(1,wW),Math.max(1,wH)); return; }
  const g=geo(); calcY(g);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,g.W,g.H);
  occReset(g);
  PANR=null;   /* das Bedienfeld verschiebt keine Chart-Inhalte (03.09.2026) */
  occAdd(6,6,334,52);
  if(F.banner){ const fz=Math.max(17,Math.min(34,g.W*0.0192)), yb=g.H*0.085; occAdd(0,yb-fz*2.6,g.W,fz*5.4); }

  const F2=Object.assign({
    barsA:0, chartA:1, priceP:1, markP:1, rekP:1, rekFrom:0, flutP:1, fokusA:1,
    grain:0, flash:0, bigText:null, bigSub:null, banner:null, fullText:null, camS:1, camX:0.5
  },F);

  ctx.save();
  /* Kamerafahrt abgeschafft (03.09.2026): bei randlosem Datenfeld schneidet jede
     Vergroesserung oben und links ab. Bewegung kommt aus dem Zeitraum-Regler. */
  GA=F2.chartA; ctx.globalAlpha=GA;
  achsen(g);
  const aF=F2.aFlut===undefined?1:F2.aFlut, aM=F2.aMarke===undefined?1:F2.aMarke, aK=F2.aKurs===undefined?1:F2.aKurs;
  GA=F2.chartA*aF; ctx.globalAlpha=GA; flut(g,F2);
  GA=F2.chartA*aM; ctx.globalAlpha=GA; luecke(g,F2); marke(g,F2);
  GA=F2.chartA*aK; ctx.globalAlpha=GA; kurs(g,F2);
  GA=F2.chartA; ctx.globalAlpha=GA;
  if(S.marken){ marken(g,F2); }
  if(F2.callouts) for(const c of F2.callouts) callout(g,c);
  ctx.globalAlpha=1;
  ctx.restore();

  vignette(g);

  ctx.globalAlpha=F2.chartA*F2.fokusA;
  if(S.texte){ fokus(g); if(S.stufe===1 && F2.rekP>=1) skala(g); }
  ctx.globalAlpha=F2.chartA;
  leiste(g,F2);
  ctx.globalAlpha=1; GA=1;

  if(F2.banner) banner(g,F2.banner,F2.bannerA===undefined?1:F2.bannerA);
  if(F2.fullText) vollText(g,F2.fullText,F2.fullA===undefined?1:F2.fullA);
  if(F2.bigText) grosseZahl(g,F2.bigText,F2.bigSub,F2.bigA===undefined?1:F2.bigA);
  if(F2.barsA>0) balken(g,F2.barsA);
  if(F2.grain>0) korn(g,F2.grain);
  if(F2.flash>0){ ctx.fillStyle='rgba(255,255,255,'+F2.flash+')'; ctx.fillRect(0,0,g.W,g.H); }
}

/* ---------- Achsen ---------- */
function achsen(g){
  const fs=fsAx(g.W);
  ctx.font='600 '+fs+'px system-ui,sans-serif';
  const lo=Math.log10(YLO), hi=Math.log10(YHI);
  const dec=hi-lo; const mults = dec>3.2?[1]:(dec>1.6?[1,3]:[1,2,5]);
  ctx.save(); ctx.globalAlpha=0.72*GA;
  for(let e=Math.floor(lo);e<=Math.ceil(hi);e++){
    for(const m of mults){
      const v=m*Math.pow(10,e); if(v<YLO*1.02||v>YHI*0.99)continue;
      const y=yOf(v,g);
      ctx.strokeStyle='rgba(255,255,255,.09)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(g.L,y); ctx.lineTo(g.R,y); ctx.stroke();
      const t = v>=1000? (v>=1e6? '$'+(v/1e6)+'M' : '$'+(v/1000)+',000') : (v>=1? '$'+v : '$'+v.toFixed(2));
      const ly=Math.max(g.aT+fs*0.70,Math.min(g.aB-fs*0.70,y-fs*0.75));
      const lx=g.L+10;
      kontur(t,lx,ly,fs,'rgba(255,255,255,.92)','left');
      occAdd(lx-6,ly-fs*0.85,ctx.measureText(t).width+18,fs*1.7);
    }
  }
  ctx.restore();
  const y0=Math.ceil(yfrac(S.t0)), y1=Math.floor(yfrac(T_RIGHT));
  const bw=ctx.measureText('2026').width+g.W*0.012;
  let step=1; while(step<64 && ((y1-y0)/step+1)*bw > g.W*0.78) step++;
  const first=Math.ceil(y0/step)*step;
  ctx.save(); ctx.globalAlpha=0.75*GA;
  for(let y=first;y<=y1;y+=step){
    const ts=Date.UTC(y,0,1)/1000, x=xOf(ts,g); if(x<g.L+4||x>g.R-4)continue;
    ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,g.aT); ctx.lineTo(x,g.aB); ctx.stroke();
    kontur(String(y),x,g.aB-fs*0.85,fs,'rgba(255,255,255,.92)','center');
    occAdd(x-bw/2,g.aB-fs*1.7,bw,fs*1.7);
  }
  ctx.restore();
  ctx.save(); ctx.globalAlpha=.30*GA; ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,Math.round(g.aB+g.H*0.012)+0.5); ctx.lineTo(g.W,Math.round(g.aB+g.H*0.012)+0.5); ctx.stroke(); ctx.restore();
}

/* ---------- Die Flut ----------
   Der Goldpreis, in Dollar je Unze, auf derselben Achse wie der Kurs. Er ist
   die Wasseroberflaeche: Was Bitcoin in Gold wert ist, ist seine Hoehe ueber
   dieser Flaeche - auf der logarithmischen Achse ein Abstand, den man sehen
   kann. Die Flaeche darunter beantwortet die Frage, von wo aus gemessen wird;
   sie ist kein Schmuck. Wellen: die Oberflaeche noch dreimal nach unten
   versetzt, immer blasser. */
function flut(g,F){
  const P=F.flutP===undefined?1:F.flutP; if(P<=0||!AU) return;
  const i0=Math.max(0,iOf(S.t0)-1), i1=NP-1, bis=i0+Math.round((i1-i0)*P);
  if(bis<=i0) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(g.L,g.aT,g.R-g.L,g.aB-g.aT); ctx.clip();
  let yMin=Infinity;
  const pts=[]; for(let i=i0;i<=bis;i++){ const x=xOf(tsOfI(i),g), y=yOf(AU[i],g); pts.push([x,y]); if(y<yMin)yMin=y; occAdd(x-3,y-8,6,16); }
  const xe=pts[pts.length-1][0];
  const gr=ctx.createLinearGradient(0,yMin,0,g.aB);
  gr.addColorStop(0,ec(0.30)); gr.addColorStop(0.18,ec(0.11)); gr.addColorStop(0.6,ec(0.045)); gr.addColorStop(1,ec(0.015));
  ctx.beginPath(); ctx.moveTo(pts[0][0],g.aB);
  for(const p of pts) ctx.lineTo(p[0],p[1]);
  ctx.lineTo(xe,g.aB); ctx.closePath(); ctx.fillStyle=gr; ctx.fill();
  /* Wellen */
  ctx.lineJoin='round'; ctx.lineCap='round';
  for(let k=1;k<=3;k++){
    ctx.strokeStyle=ec(0.16/k); ctx.lineWidth=1.4;
    ctx.beginPath(); pts.forEach((p,j)=>{ const y=p[1]+k*9+Math.sin(j*0.7+k)*1.2; if(j===0)ctx.moveTo(p[0],y); else ctx.lineTo(p[0],y); });
    ctx.stroke();
  }
  /* Oberflaeche: Neonlinie in drei Zuegen */
  ctx.strokeStyle=ec(0.16); ctx.lineWidth=13; ctx.beginPath(); pts.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
  ctx.strokeStyle=ec(0.96); ctx.lineWidth=4.2; ctx.shadowColor=ec(0.6); ctx.shadowBlur=16;
  ctx.beginPath(); pts.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.3;
  ctx.beginPath(); pts.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]-1.6):ctx.moveTo(p[0],p[1]-1.6)); ctx.stroke();
  /* Lichtpunkt an der Spitze, solange sie sich zeichnet */
  if(P<1){ const p=pts[pts.length-1]; ctx.fillStyle=WH; ctx.shadowColor=ec(0.9); ctx.shadowBlur=18;
    ctx.beginPath(); ctx.arc(p[0],p[1],5,0,7); ctx.fill(); ctx.shadowBlur=0; }
  ctx.restore();
}

/* ---------- Die Luecke ----------
   Zwischen der Marke und dem Kurs liegt, was fuer ein neues Hoch in Gold
   fehlt - in Dollar, auf derselben Achse. Ein Band, das an der Marke beginnt
   und nach unten auslaeuft, nicht eine getoente Halbebene. */
function luecke(g,F){
  const P=F.rekP===undefined?1:F.rekP; if(P<=0.01||!REK) return;
  const from=F.rekFrom||0;
  const i0=Math.max(0,iOf(S.t0)-1), i1=NP-1;
  const bis=from+Math.round((i1-from)*P); if(bis<=i0) return;
  const dim = S.stufe===1 ? 1 : 0.45;
  ctx.save();
  ctx.beginPath(); ctx.rect(g.L,g.aT,g.R-g.L,g.aB-g.aT); ctx.clip();
  for(let i=i0;i<bis;i++){
    const x0=xOf(tsOfI(i),g), x1=xOf(tsOfI(i+1),g);
    if(x1<g.L-4||x0>g.R+4) continue;
    const yr0=yOf(REK[i],g), yr1=yOf(REK[i+1],g), yp0=yOf(D.px[i],g), yp1=yOf(D.px[i+1],g);
    const yt=Math.min(yr0,yr1), yb=Math.max(yp0,yp1);
    if(yb-yt<1) continue;
    const d=Math.max(0,1-D.px[i+1]/REK[i+1]);
    const gr=ctx.createLinearGradient(0,yt,0,yb);
    gr.addColorStop(0,tiefC(d,0.72*dim)); gr.addColorStop(0.55,tiefC(d,0.30*dim)); gr.addColorStop(1,tiefC(d,0.05*dim));
    ctx.fillStyle=gr;
    ctx.beginPath(); ctx.moveTo(x0,yr0); ctx.lineTo(x1,yr1); ctx.lineTo(x1,yp1); ctx.lineTo(x0,yp0); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* ---------- Der Kurs ----------
   Ein Pane, und darin der Bitcoin-Kurs von 2010 bis heute auf der
   Kalenderachse. Weiss, mit Schein. Orange nur dort, wo Bitcoin in dieser
   Woche auf seinem Hoch in Gold stand - die Rekordwochen, zweimal gezeichnet
   (breit und blass, dann schmal und voll) statt mit Schein. */
function kurs(g,F){
  const P = F.priceP===undefined?1:F.priceP;
  if(P<=0) return;
  const i0=Math.max(0,iOf(S.t0)-1), i1=NP-1;
  const bis = i0 + Math.round((i1-i0)*P);
  ctx.save();
  ctx.beginPath(); ctx.rect(g.L,g.aT,g.R-g.L,g.aB-g.aT); ctx.clip();
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,255,255,.97)'; ctx.lineWidth=4.4;
  ctx.shadowColor='rgba(255,255,255,.32)'; ctx.shadowBlur=14;
  ctx.beginPath();
  for(let i=i0;i<=bis;i++){ const x=xOf(tsOfI(i),g), y=yOf(D.px[i],g); if(i===i0)ctx.moveTo(x,y); else ctx.lineTo(x,y); occAdd(x-3,y-7,6,14); }
  ctx.stroke(); ctx.shadowBlur=0;
  /* Rekordwochen */
  const mp=F.markP===undefined?1:F.markP;
  if(mp>0){
    for(let pass=0;pass<2;pass++){
      ctx.strokeStyle=orA(pass===0?0.22*mp:0.98*mp); ctx.lineWidth=pass===0?11:4.8;
      for(let i=i0;i<bis;i++){
        if(!(REC[i]&&REC[i+1])) continue;
        ctx.beginPath(); ctx.moveTo(xOf(tsOfI(i),g),yOf(D.px[i],g)); ctx.lineTo(xOf(tsOfI(i+1),g),yOf(D.px[i+1],g)); ctx.stroke();
      }
    }
    ctx.fillStyle=orA(0.98*mp);
    for(let i=i0;i<=bis;i++){ if(!REC[i]) continue; if((i>0&&REC[i-1])||(i<NP-1&&REC[i+1])) continue;
      ctx.beginPath(); ctx.arc(xOf(tsOfI(i),g),yOf(D.px[i],g),3.6,0,7); ctx.fill(); }
  }
  ctx.restore();
  if(bis>=i1){
    const x=xOf(tsOfI(i1),g), y=yOf(D.px[i1],g);
    const ph=(performance.now()%4000)/4000;
    ctx.save(); ctx.globalAlpha=(0.55-0.35*ph)*GA;
    ctx.strokeStyle=WH; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.arc(x,y,6.4+5.6*ph,0,7); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.globalAlpha=GA; ctx.fillStyle=WH;
    ctx.beginPath(); ctx.arc(x,y,6.4,0,7); ctx.fill(); ctx.restore();
  }
}

/* ---------- Die Marke ----------
   So hoch stand Bitcoin ueber der Flut schon einmal: der Rekord in Unzen,
   mal Goldpreis, in Dollar. Sie erbt die Farbe der Flut, weil sie aus ihr
   gerechnet ist, und laeuft gestrichelt, weil sie kein Kurs ist. Wo der Kurs
   sie beruehrt, stand Bitcoin auf seinem Hoch in Gold. */
function marke(g,F){
  const P=F.rekP===undefined?1:F.rekP; if(P<=0||!REK) return;
  const from=F.rekFrom||0;
  const i0=Math.max(0,iOf(S.t0)-1), i1=NP-1;
  const bis=from+Math.round((i1-from)*P); if(bis<=i0) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(g.L,g.aT,g.R-g.L,g.aB-g.aT); ctx.clip();
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.setLineDash([9,8]);
  ctx.strokeStyle=ec(0.18); ctx.lineWidth=11;
  ctx.beginPath(); for(let i=i0;i<=bis;i++){ const x=xOf(tsOfI(i),g), y=yOf(REK[i],g); if(i===i0)ctx.moveTo(x,y); else ctx.lineTo(x,y); } ctx.stroke();
  ctx.strokeStyle=ec(0.98); ctx.lineWidth=4.6; ctx.shadowColor=ec(0.55); ctx.shadowBlur=18;
  ctx.beginPath(); for(let i=i0;i<=bis;i++){ const x=xOf(tsOfI(i),g), y=yOf(REK[i],g); if(i===i0)ctx.moveTo(x,y); else ctx.lineTo(x,y); occAdd(x-3,y-7,6,14); } ctx.stroke();
  ctx.shadowBlur=0; ctx.setLineDash([]);
  /* Lichtlauf: ein heller Punkt laeuft die Linie entlang, statt dass sie beschriftet wird */
  if(F.lichtP!==undefined && F.lichtP>0 && F.lichtP<1){
    const iL=i0+(bis-i0)*F.lichtP;
    for(let k=6;k>=0;k--){ const ii=Math.max(i0,iL-k*1.6); const a=Math.floor(ii), b=Math.min(bis,a+1), r=ii-a;
      const x=xOf(tsOfI(a)+r*D.step,g), y=yOf(REK[a]*Math.pow(REK[b]/REK[a],r),g);
      ctx.globalAlpha=GA*(k===0?1:0.55-k*0.075); ctx.fillStyle=k===0?WH:EC; ctx.shadowColor=EC; ctx.shadowBlur=k===0?22:0;
      ctx.beginPath(); ctx.arc(x,y,k===0?7:4.5-k*0.4,0,7); ctx.fill(); }
    ctx.shadowBlur=0; ctx.globalAlpha=GA;
  }
  /* Der Zeiger auf den Wert, um den es geht: das rechte Ende der Marke. */
  const xe=xOf(tsOfI(bis),g), ye=yOf(REK[bis],g);
  const ph=(performance.now()%1250)/1250;
  ctx.fillStyle='rgba(0,0,0,.96)'; ctx.beginPath(); ctx.arc(xe,ye,11.5,0,7); ctx.fill();
  ctx.fillStyle=EC; ctx.beginPath(); ctx.arc(xe,ye,8.2,0,7); ctx.fill();
  ctx.globalAlpha=GA*(0.50-0.30*ph); ctx.strokeStyle=EC; ctx.lineWidth=2.6;
  ctx.beginPath(); ctx.arc(xe,ye,8.2+6.0*ph,0,7); ctx.stroke();
  ctx.restore();
  /* Waehrend sie sich zeichnet, wandert ihr Wert mit - das ist der Beweis,
     nicht die Caption. */
  if(P<1 && from>0){
    const fsA=fsAnn(g.W); const t='$'+num(REK[bis],0);
    ctx.font='700 '+fsA+'px system-ui,sans-serif'; const tw=ctx.measureText(t).width;
    const tx=Math.max(g.L+10+tw,xe-14), ty=Math.max(g.aT+fsA,ye-fsA*1.4);
    ctx.font='800 '+fsA*1.15+'px system-ui,sans-serif';
    kontur(t,tx,ty,fsA*1.15,EC,'right');
  }
}

/* ---------- Dreieck ---------- */
function dreieck(x,y,r,up,fill,col){
  ctx.save(); ctx.lineJoin='round';
  const s=up?-1:1;
  ctx.beginPath(); ctx.moveTo(x,y+s*r*1.15); ctx.lineTo(x-r,y-s*r*0.75); ctx.lineTo(x+r,y-s*r*0.75); ctx.closePath();
  ctx.strokeStyle='rgba(0,0,0,.9)'; ctx.lineWidth=9; ctx.stroke();
  if(fill){ ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=18; ctx.fill(); ctx.shadowBlur=0; }
  else { ctx.strokeStyle=col; ctx.lineWidth=3.4; ctx.stroke(); }
  ctx.restore();
}
function etikett(t,x,y,fs,col){
  ctx.font='700 '+fs+'px system-ui,sans-serif'; const w=ctx.measureText(t).width;
  const cand=[-1.9,1.9,-3.5,3.5,-5.1,5.1,-6.7,6.7];
  for(const c of cand){ for(const dx of [0,-w*0.75,w*0.75]){ const yy=y+c*fs, xx=x+dx; const bx=xx-w/2-8, by=yy-fs;
    if(by<0||by+fs*2>S.H||bx<0||bx+w+16>S.W) continue;
    if(occFree(bx,by,w+16,fs*2)){ platte(t,xx,yy,fs,col,'center'); occAdd(bx,by,w+16,fs*2); return true; } } }
  return false;
}

/* ---------- Marken ----------
   Stufe 1: der Ring am letzten Hoch in Gold mit seiner einen Anmerkung, und
   ohne Messklammer (19.09.2026: unnoetig und unuebersichtlich).
   Stufe 2: ein Dreieck je Zyklushoch in Dollar - voll orange, wenn es auch
   in Gold ein Hoch war, sonst ein weisser Umriss. Stufe 3: ein Dreieck je
   Boden, orange wenn er in Gold ueber dem vorigen lag. Stufe 4: der Test. */
function marken(g,F){
  const P = F.markP===undefined?1:F.markP;
  if(P<=0.01 || !REK) return;
  const fsA=fsAnn(g.W), fsL=fsLab(g.W);
  const st=F.stufe||S.stufe;
  if(st===1){
    const xr=xOf(tsOfI(ST.iSeit),g), yr=yOf(D.px[ST.iSeit],g);
    if(xr>g.L-40&&xr<g.R+40){
      ctx.save(); ctx.globalAlpha=GA*P;
      ctx.strokeStyle='rgba(0,0,0,.85)'; ctx.lineWidth=7.0; ctx.beginPath(); ctx.arc(xr,yr,15,0,7); ctx.stroke();
      ctx.strokeStyle=OR; ctx.lineWidth=3.4; ctx.shadowColor=orA(0.7); ctx.shadowBlur=14; ctx.beginPath(); ctx.arc(xr,yr,15,0,7); ctx.stroke();
      const ph=(performance.now()%1200)/1200; ctx.shadowBlur=0; ctx.globalAlpha=GA*P*(0.6-0.55*ph); ctx.lineWidth=2.6;
      ctx.beginPath(); ctx.arc(xr,yr,15+20*ph,0,7); ctx.stroke();
      ctx.restore();
      if(F.ohneEtikett) return;
      const t=dstr(tsOfI(ST.iSeit))+' · '+num(ST.ozSeit,1)+' oz';
      ctx.font='700 '+fsA+'px system-ui,sans-serif'; const tw=ctx.measureText(t).width;
      const tx=Math.min(g.R-tw-14, Math.max(g.L+10, xr-tw-84));
      for(const dy of [-3.4,-2.2,2.2,3.8,5.4,-4.8]){ const ty=yr+dy*fsA; if(ty<g.aT+fsA*0.8||ty>g.aB-fsA) continue;
        if(occFree(tx-8,ty-fsA,tw+16,fsA*2)){ ctx.save(); ctx.globalAlpha=GA*P; platte(t,tx,ty,fsA,'rgba(255,255,255,.95)','left'); ctx.restore(); occAdd(tx-8,ty-fsA,tw+16,fsA*2); break; } }
    }
  } else if(st===2){
    ctx.save(); ctx.globalAlpha=GA*P;
    TOPS.forEach((tp,k)=>{ const x=xOf(tsOfI(tp.i),g), y=yOf(D.px[tp.i],g); if(x<g.L-20||x>g.R+20) return;
      const loc=Math.max(0,Math.min(1,(P-k*0.12)/0.5)); if(loc<=0) return;
      ctx.save(); ctx.translate(x,y-22); ctx.scale(0.55+0.45*loc,0.55+0.45*loc); ctx.globalAlpha=GA*P*loc;
      dreieck(0,0,11,true,tp.rec,tp.rec?OR:'rgba(255,255,255,.95)'); ctx.restore();
      if(loc>0.4 && !F.ohneEtikett) etikett(num(tp.oz,tp.oz<1?2:1)+' oz', x, y-22-fsL*1.2, fsL, tp.rec?OR:'rgba(255,255,255,.95)'); });
    ctx.restore();
  } else if(st===3){
    ctx.save(); ctx.globalAlpha=GA*P;
    FLOORS.forEach((fl,k)=>{ const x=xOf(tsOfI(fl.i),g), y=yOf(D.px[fl.i],g); if(x<g.L-20||x>g.R+20) return;
      const loc=Math.max(0,Math.min(1,(P-k*0.12)/0.5)); if(loc<=0) return;
      ctx.save(); ctx.translate(x,y+22); ctx.scale(0.55+0.45*loc,0.55+0.45*loc); ctx.globalAlpha=GA*P*loc;
      dreieck(0,0,11,false,fl.up,fl.up?OR:'rgba(255,255,255,.95)'); ctx.restore();
      if(loc>0.4 && !F.ohneEtikett) etikett(num(fl.oz,fl.oz<1?2:1)+' oz', x, y+22+fsL*1.2, fsL, fl.up?OR:'rgba(255,255,255,.95)'); });
    ctx.restore();
  } else if(st===4){
    test(g,P);
  }
}

/* ---------- Der Test (Nebenanzeige) ----------
   Bewegt Gold den Bitcoin-Kurs? Fuer jede Verschiebung von -52 bis +52 Wochen
   steht ein Balken: wie sehr die Quartalsbewegung von Gold mit der von Bitcoin
   zusammenlaeuft. Grau daneben dieselbe Rechnung mit einer Reihe, die nichts
   mit Bitcoin zu tun hat (CHF/JPY). Kein Fachwort im Bild: links "Gold
   zuerst", rechts "Bitcoin zuerst", und der graue Rahmen ist das, was eine
   sinnlose Reihe schafft. */
function test(g,P){
  if(!LL) return;
  const fsK=Math.max(12,Math.min(20,g.W*0.0115)), fsT=fsLab(g.W);
  const bw=Math.min(g.W*0.42,620), bh=Math.min(g.H*0.27,270);
  /* freie Lage suchen: bevorzugt links, ueber der Achse; das rechte Ende der Reihe bleibt frei */
  let bx=g.W*0.03, by=g.aT+(g.aB-g.aT)*0.10, best=1e9;
  for(let fy=0.06;fy<=0.62;fy+=0.04){ for(let fx=0.03;fx<=0.55;fx+=0.04){
    const xx=g.W*fx, yy=g.aT+(g.aB-g.aT)*fy; if(xx+bw>g.W*0.97||yy+bh>g.aB-10) continue;
    const c=occLast(xx-10,yy-10,bw+20,bh+20); if(c<best){best=c;bx=xx;by=yy; if(c===0){fy=99;break;}} } }
  ctx.save(); ctx.globalAlpha=GA*P;
  ctx.fillStyle='rgba(0,0,0,.78)'; rrect(bx,by,bw,bh,10); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1; rrect(bx,by,bw,bh,10); ctx.stroke();
  ctx.font='700 '+fsK+'px system-ui,sans-serif';
  const px0=bx+16, px1=bx+bw-16, py0=by+fsK*2.4, py1=by+bh-fsK*2.6, pym=(py0+py1)/2;
  const sc=(py1-py0)/2/0.34;
  /* graue Huelle: das schafft die sinnlose Reihe */
  ctx.fillStyle='rgba(160,166,176,.18)';
  ctx.fillRect(px0,pym-LL.maxFx*sc,px1-px0,LL.maxFx*sc*2);
  ctx.strokeStyle='rgba(160,166,176,.7)'; ctx.setLineDash([5,5]); ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(px0,pym-LL.maxFx*sc); ctx.lineTo(px1,pym-LL.maxFx*sc); ctx.moveTo(px0,pym+LL.maxFx*sc); ctx.lineTo(px1,pym+LL.maxFx*sc); ctx.stroke(); ctx.setLineDash([]);
  /* Balken: links Gold zuerst (+52), rechts Bitcoin zuerst (-52) */
  const n=LL.gold.length, w=(px1-px0)/n;
  const sh=Math.round(P*n);
  for(let k=0;k<sh;k++){ const p=LL.gold[n-1-k]; const x=px0+k*w; const h=p[1]*sc;
    ctx.fillStyle=Math.abs(p[1])>LL.maxFx?OR:ec(0.92); ctx.fillRect(x+w*0.15,Math.min(pym,pym-h),w*0.7,Math.abs(h)); }
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(px0,pym); ctx.lineTo(px1,pym); ctx.stroke();
  ctx.font='700 '+fsK*0.92+'px system-ui,sans-serif';
  kontur('GOLD FIRST',px0,py1+fsK*0.9,fsK*0.92,ec(0.95),'left');
  kontur('BITCOIN FIRST',px1,py1+fsK*0.9,fsK*0.92,'rgba(255,255,255,.9)','right');
  kontur('CHF/JPY',px1-6,pym-LL.maxFx*sc-fsK*0.55,fsK*0.85,'rgba(160,166,176,.95)','right');
  ctx.restore();
  occAdd(bx-6,by-6,bw+12,bh+12);
}

/* ---------- Callout ----------
   Kein Kasten, keine Verbindungslinie (19.09.2026): der Punkt leuchtet auf,
   und daneben steht das Etikett als freie Konturschrift in der Farbe des
   Elements. Hoechstens zwei kurze Zeilen; Woerter zwischen * in Orange. */
function callout(g,c){
  const a=c.a===undefined?1:c.a; if(a<=0.01) return;
  if(c.ts!==undefined){ c.x=xOf(c.ts,g); c.y=yOf(c.v,g); }
  const fs=fsAnn(g.W)*1.3; ctx.font='800 '+fs+'px system-ui,sans-serif';
  const lines=c.text.split(String.fromCharCode(10));
  /* Pulsring: der Punkt, um den es geht, pulsiert statt beschriftet zu werden (19.09.2026) */
  if(c.puls){ const ph=(performance.now()%1200)/1200; ctx.save(); ctx.globalAlpha=GA*a*(0.7-0.6*ph);
    ctx.strokeStyle=c.col||WH; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(c.x,c.y,15+22*ph,0,7); ctx.stroke(); ctx.restore(); }
  const widths=lines.map(l=>{ let lw=0; for(const [t] of teile(l)) lw+=ctx.measureText(t).width; return lw; });
  const w=Math.max(...widths), h=lines.length*fs*1.25;
  const col=c.col||WH;
  ctx.save(); ctx.globalAlpha=GA*a;
  /* Leuchtpunkt */
  ctx.shadowColor=col; ctx.shadowBlur=26; ctx.fillStyle=col;
  ctx.beginPath(); ctx.arc(c.x,c.y,7.5,0,7); ctx.fill(); ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(0,0,0,.9)'; ctx.lineWidth=2.4; ctx.beginPath(); ctx.arc(c.x,c.y,7.5,0,7); ctx.stroke();
  ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.globalAlpha=GA*a*0.55; ctx.beginPath(); ctx.arc(c.x,c.y,15,0,7); ctx.stroke();
  ctx.globalAlpha=GA*a;
  /* Text: rechtsbuendig links vom Punkt (Standard) oder linksbuendig rechts davon */
  const right=(c.side==='right');
  let tx=right? c.x+fs*1.1 : c.x-fs*1.1, ty=c.y+(c.dy||0)-h/2+fs*0.62;
  if(right){ if(tx+w>g.W-8) tx=g.W-8-w; } else { if(tx-w<8) tx=8+w; }
  ty=Math.max(g.aT+fs*0.7,Math.min(g.aB-h,ty));
  ctx.textBaseline='middle'; ctx.lineJoin='round';
  lines.forEach((l,i)=>{ const y=ty+i*fs*1.25; let x=right?tx:tx-widths[i];
    for(const [t,on] of teile(l)){ ctx.lineWidth=fs*0.24; ctx.strokeStyle='rgba(0,0,0,.88)'; ctx.textAlign='left';
      ctx.strokeText(t,x,y); ctx.fillStyle=on?OR:col; ctx.fillText(t,x,y); x+=ctx.measureText(t).width; } });
  ctx.restore();
}

function fokus(g){
  let kopf,zahl,lab,col,sch;
  const st=S.stufe;
  if(st===1){ kopf='KEPT UP WITH GOLD'; zahl='$'+num(ST.rek,0);
    lab='vs $'+num(ST.kurs,0); col=EC; sch=ec(0.55); }
  else if(st===2){ kopf=dstr(tsOfI(ST.topLast.i)).toUpperCase()+' IN GOLD'; zahl=num(ST.topLast.oz,1)+' oz';
    lab='−'+num(Math.abs(ST.topDD),1)+'% vs best day'; col=ST.topLast.rec?OR:'rgba(255,255,255,.95)'; sch='rgba(255,255,255,.4)'; }
  else if(st===3){ kopf='CYCLE LOW IN GOLD'; zahl=num(ST.floorLast.oz,1)+' oz';
    lab=num(ST.floorUp,0)+' of '+num(FLOORS.length,0)+' higher'; col=OR; sch=orA(0.55); }
  else { kopf='DOES GOLD LEAD?'; zahl=num(LL.besser,0)+' of '+num(LL.gold.length,0);
    lab='beat CHF/JPY'; col='rgba(255,255,255,.95)'; sch='rgba(255,255,255,.4)'; }

  const fsK=Math.max(13,Math.min(23,g.W*0.0126));
  const fsZ=Math.max(34,Math.min(84,g.W*0.0480));
  const fsL=Math.max(14,Math.min(27,g.W*0.0152));
  ctx.font='800 '+fsZ+'px system-ui,sans-serif';
  const wZ=ctx.measureText(zahl).width;
  ctx.font='700 '+fsK+'px system-ui,sans-serif';
  const wK=ctx.measureText(kopf).width;
  ctx.font='700 '+fsL+'px system-ui,sans-serif';
  const wL=ctx.measureText(lab).width;
  const bw=Math.max(wZ,wK,wL)+26;
  const bh=fsK*1.5+fsZ*1.30+fsL*1.5+10;
  const kx=[]; for(let f=0.02;f<=0.99;f+=0.035){ const xx=g.W*f; if(xx+bw<g.W-g.W*0.012) kx.push(xx); }
  let bx=kx[0], by=g.aT+(g.aB-g.aT)*0.06, best=1e9;
  for(let f=0.02;f<=0.80;f+=0.03){
    const cy=g.aT+(g.aB-g.aT)*f; if(cy+bh>g.aB-6)continue;
    for(const xx of kx){
      let c=occLast(xx-10,cy-10,bw+20,bh+20);
      c+= (cy > g.aT+(g.aB-g.aT)*0.86 ? 3 : 0);
      if(c<best){best=c;bx=xx;by=cy; if(c===0){f=99;break;}}
    }
  }
  ctx.save();
  let y=by+fsK*0.7;
  ctx.font='700 '+fsK+'px system-ui,sans-serif';
  kontur(kopf,bx,y,fsK,'rgba(255,255,255,.72)','left'); y+=fsK*1.4;
  ctx.font='800 '+fsZ+'px system-ui,sans-serif';
  y+=fsZ*0.66;
  ctx.save(); ctx.textBaseline='middle'; ctx.textAlign='left';
  ctx.shadowBlur=26; ctx.shadowColor=sch;
  ctx.lineJoin='round'; ctx.lineWidth=fsZ*0.20; ctx.strokeStyle='rgba(0,0,0,.85)';
  ctx.strokeText(zahl,bx,y); ctx.shadowBlur=0;
  ctx.fillStyle=col; ctx.fillText(zahl,bx,y); ctx.restore();
  y+=fsZ*0.66;
  ctx.font='700 '+fsL+'px system-ui,sans-serif';
  y+=fsL*0.95; kontur(lab,bx,y,fsL,'rgba(255,255,255,.88)','left');
  ctx.restore();
  occAdd(bx-16,by-14,bw+32,bh+22);
  FOKR=[bx-16,by-14,bw+32,bh+22];
}

/* ---------- Schluessel der Skala ----------
   Ein senkrechter Farbverlauf mit zwei Zahlen: 0 % oben, das Skalenende
   unten. Er sucht sich eine freie Flaeche im Bild, bevorzugt links oben,
   wo in den Jahren vor 2017 nichts liegt. */
function skala(g){
  const fs=fsBar(g.W), bw=fs*0.9, bh=fs*4.8;
  ctx.font='700 '+fs+'px system-ui,sans-serif';
  const t1='0%', t2='−'+num(TIEF_MAX*100,0)+'%', t3='';
  const tw=Math.max(ctx.measureText(t2).width, ctx.measureText(t3).width);
  const W=bw+fs*0.6+tw+16, H=bh+fs*2.6;
  let bx=-1,by=-1,best=1e9;
  for(let fy=0.05;fy<=0.70;fy+=0.03){ for(let fx=0.10;fx<=0.90;fx+=0.02){
    const xx=g.W*fx, yy=g.aT+(g.aB-g.aT)*fy; if(xx+W>g.W-10||yy+H>g.aB-10) continue;
    const c=occLast(xx-8,yy-8,W+16,H+16); if(c<best){best=c;bx=xx;by=yy; if(c===0){fy=99;break;}} } }
  if(best>0) return;   /* keine freie Flaeche: der Schluessel entfaellt */
  ctx.save();
  const gk=ctx.createLinearGradient(0,by+fs*1.2,0,by+fs*1.2+bh); for(let k=0;k<=8;k++) gk.addColorStop(k/8,tiefC(k/8*TIEF_MAX,0.95));
  ctx.fillStyle=gk; rrect(bx,by+fs*1.2,bw,bh,3); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1; rrect(bx,by+fs*1.2,bw,bh,3); ctx.stroke();
  kontur(t1,bx+bw+fs*0.6,by+fs*1.2+fs*0.4,fs,'rgba(255,255,255,.88)','left');
  kontur(t2,bx+bw+fs*0.6,by+fs*1.2+bh-fs*0.4,fs,'rgba(255,255,255,.88)','left');
  if(t3) kontur(t3,bx,by+fs*0.5,fs,'rgba(255,255,255,.72)','left');
  ctx.restore();
  occAdd(bx-8,by-8,W+16,H+16);
}

/* ---------- untere Leiste ----------
   Drei Legendeneintraege, eine tragende Ablesung mit der Quelle in derselben
   Zeile. Mehr steht hier nicht (Textbilanz, 03.09.2026). */
function leiste(g,F){
  const fs=fsBar(g.W);
  wortmarke(g, g.W*0.012, (g.bar1+g.bar2)/2, Math.max(74,g.W*0.072));
  if(!S.texte) return;
  const x0=g.W*0.012+Math.max(74,g.W*0.072)+g.W*0.022;
  ctx.font='700 '+fs+'px system-ui,sans-serif';
  let x=x0+fs*4.6;
  /* 1 - der Kurs, mit dem orangen Stueck: Hoch in Gold */
  /* die weisse Kurslinie braucht weder Wort noch Swatch (Textbilanz 19.09.2026) */
  /* 2 - die Flut */
  ctx.save(); ctx.fillStyle=ec(0.28); ctx.fillRect(x,g.bar1-fs*0.05,fs*2.2,fs*0.62);
  ctx.strokeStyle=EC; ctx.lineCap='round'; ctx.lineWidth=4.2; ctx.beginPath(); ctx.moveTo(x,g.bar1); ctx.lineTo(x+fs*2.2,g.bar1); ctx.stroke(); ctx.restore();
  const e2='Gold';
  kontur(e2,x+fs*2.6,g.bar1,fs,'rgba(255,255,255,.88)','left');
  x+=fs*2.6+ctx.measureText(e2).width+g.W*0.018;
  /* 3 - die gestrichelte Linie: zwei Woerter, der Strich sagt den Rest (Textbilanz 19.09.2026) */
  ctx.save(); ctx.strokeStyle=EC; ctx.lineCap='round'; ctx.lineWidth=4.2; ctx.setLineDash([6,6]);
  ctx.beginPath(); ctx.moveTo(x,g.bar1); ctx.lineTo(x+fs*2.2,g.bar1); ctx.stroke(); ctx.restore();
  const e3='kept up with gold';
  kontur(e3,x+fs*2.6,g.bar1,fs,'rgba(255,255,255,.88)','left');
  const ab=num(ST.oz,1)+' oz per bitcoin · '+pct(ST.ddSeit,0)+' since '+dstr(tsOfI(ST.iSeit));
  ctx.font='800 '+fs*1.04+'px system-ui,sans-serif';
  kontur(ab,x0,g.bar2,fs*1.04,'rgba(255,255,255,.92)','left');
}


function wortmarke(g,x,yMid,w){
  const h1=w*0.26, pitch=h1*0.90;
  ctx.save(); ctx.textBaseline='middle'; ctx.textAlign='left';
  ctx.font='900 '+h1+'px system-ui,sans-serif';
  const wA=ctx.measureText('GREAT').width;

  ctx.fillStyle='rgba(255,255,255,.95)'; ctx.fillText('GREAT',0,0); ctx.restore();
  const sc=w/(wB1+wB2);

  ctx.fillStyle=OR; ctx.fillText('WALL',0,0);
  ctx.fillStyle='rgba(255,255,255,.95)'; ctx.fillText('Y',wB1,0); ctx.restore();

}
function vignette(g){

let KORN=null;
function korn(g,a){
  if(!KORN){ const c=document.createElement('canvas'); c.width=c.height=170;
    const x=c.getContext('2d'), im=x.createImageData(170,170);

function teile(t){
  const out=[]; let i=0,cur='',on=false;
  while(i<t.length){ if(t[i]==='*'){ if(cur)out.push([cur,on]); cur=''; on=!on; i++; }
    else { cur+=t[i]; i++; } }
  if(cur)out.push([cur,on]); return out;
}
function vollText(g,txt,a){

    mx=0; for(const l of lines) mx=Math.max(mx,ctx.measureText(l.replace(/\*/g,'')).width); }

/* ===================== Highlight-Tasten s+1 … s+4 =====================
   Fuer die Aufnahme: s+1, s+2, s+3 arbeiten je EIN Key Takeaway cinematisch heraus,

const HL={start:0,n:0,sichern:null};

    if(t>4.0) F.callouts.push({ts:tsOfI(NP-1),v:D.px[NP-1],dy:fA*2.2,text:'*$'+num(D.kurs,0)+'*',a:Math.min(1,(t-4.0)/0.6)});
    if(t>6.9) F.callouts.push({ts:tsOfI(NP-1),v:ST.rek,dy:-fA*1.8,text:'*$'+num(ST.rek,0)+'*',col:EC,a:Math.min(1,(t-6.9)/0.6)});
    if(t>8.4){ const a=Math.min(1,(t-8.4)/0.6)*(t<12.6?1:Math.max(0,1-(t-12.6)/1.2));           /* 8,4-13,8 s Urteil */
      hlUrteil(F,a,'$'+num(ST.rek,0),'KEPT UP WITH GOLD'); }

    if(t>6.0){ const a=Math.min(1,(t-6.0)/0.6)*(t<10.5?1:Math.max(0,1-(t-10.5)/1.2));           /* 6-11,7 s Urteil */
      hlUrteil(F,a,num(ST.floorUp,0)+' OF '+num(FLOORS.length,0),'CYCLE LOWS HIGHER IN GOLD'); }

      hlUrteil(F,a,pct(dO,0),'BITCOIN IN GOLD SINCE '+dstr(tsOfI(iG)).slice(dstr(tsOfI(iG)).indexOf(' ')+1).toUpperCase()); }

function hlFrame(ms){ const F={}; const d=HL_DEFS[HL.n-1]; if(d) d.f(Math.min(ms,d.dauer)/1000,F); return F; }
function startHL(n){ if(!HL_DEFS[n-1]||CIN.start) return; if(HL.start) stopHL(); sichern(); HL.sichern=CIN.sichern; CIN.sichern=null;
  S.marken=true; S.texte=false; rechnen(); HL.n=n; HL.start=performance.now(); }
function stopHL(){ HL.start=0; HL.n=0; if(HL.sichern){ CIN.sichern=HL.sichern; HL.sichern=null; zurueck(); } }

/* ===================== Sequenz S+T ===================== */
const CIN={start:0,dauer:40000,sichern:null};

/* Alle Zahlen werden zur Laufzeit aus den Daten gerechnet. Zwei hervorgehobene
   Woerter je Beat, kein Fachwort, und kein Wort, dessen Bedeutung im Chart eine
   andere Farbe traegt. */
function hookBeats(){
  const NL=String.fromCharCode(10);
  return [
    'BITCOIN IS *DIGITAL GOLD*'+NL+'*EVERYONE* SAYS SO',
    'SINCE JAN 2025: GOLD *'+pct(ST.goldSeit,0)+'*'+NL+'BITCOIN: *ALL-TIME HIGH* ON '+dEN(D.athU[0]).toUpperCase(),
    '*MEASURED IN GOLD*'+NL+'THAT WAS *NO HIGH*',
    'HAD BITCOIN *KEPT UP WITH GOLD*'+NL+'IT WOULD BE AT *$'+num(ST.rek,0)+'*'
  ];
}
/* Etiketten: nur die Zahl (Textbilanz 19.09.2026) — was sie bedeutet, sagt die Stimme */
const cBTC=a=>{ const fA=fsAnn(S.W||1280); return {ts:tsOfI(NP-1),v:D.px[NP-1],dy:-fA*1.6,text:'*$'+num(D.kurs,0)+'*',a}; };
const cGOLD=a=>{ const fA=fsAnn(S.W||1280); return {ts:tsOfI(NP-1),v:AU[NP-1],dy:fA*1.4,text:'$'+num(AU[NP-1],0),col:EC,a}; };
const cREC=a=>{ const fA=fsAnn(S.W||1280); return {ts:tsOfI(ST.iRec),v:D.px[ST.iRec],dy:fA*1.9,text:'*'+num(ST.rm,1)+' oz*',col:EC,puls:true,a}; };
function frameFor(ms){
  const F={}; const t=ms/1000;
  const beats=hookBeats();
  const ease=x=>x<0?0:x>1?1:(1-Math.cos(Math.PI*x))/2;
  const T_ZOOM=Date.UTC(2024,0,5)/1000;
  const NL=String.fromCharCode(10);
  F.stufe=1;
  /* Callouts tragen Datenkoordinaten (ts, v); die Bildlage rechnet callout()
     beim Zeichnen. Jedes Etikett bleibt bis zum Szenenwechsel stehen. */
  const W=S.W||1280, fA=fsAnn(W);
  if(t<18.4){
    const BE=4.60, BLD=0.45;
    F.barsA=1; F.chartA=0;
    F.grain=0.35+0.5*Math.min(1,t/9.2)*(t<9.2?1:Math.max(0,(13.8-t)/4.6));
    const i=Math.min(3,Math.floor(t/BE)), lt=t-i*BE;
    F.fullText=beats[i];
    F.fullA=Math.min(1,lt/BLD)*Math.min(1,(BE-lt)/BLD);
    if(t>=9.2&&t<9.7) F.flash=1-(t-9.2)/0.5;
    F.t0=T_MIN; F.markP=0; F.rekP=0; F.flutP=0;
  } else if(t<23.6){
    /* Die Welt (5,2 s): der Kurs zeichnet sich, dann die Goldflut. Zwei
       Etiketten, beide bleiben stehen. */
    const p=(t-18.4)/5.2;
    F.barsA=1-ease(Math.min(1,p*1.6)); F.chartA=1; F.priceP=ease(Math.min(1,p/0.45));
    F.flutP=ease((p-0.40)/0.50);
    F.markP=0; F.rekP=0; F.t0=T_MIN; F.grain=0.12; F.aMarke=0;
    F.callouts=[];
    if(p>0.42) F.callouts.push(cBTC(Math.min(1,(p-0.42)*5)));
    if(p>0.86) F.callouts.push(cGOLD(Math.min(1,(p-0.86)*7)));
  } else if(t<28.4){
    /* Das Modell (4,8 s): die gestrichelte Linie zeichnet sich; am Ende der
       Punkt, an dem 1 Bitcoin am meisten Gold kaufte. Etiketten bleiben. */
    const p=(t-23.6)/4.8;
    F.barsA=0; F.chartA=1; F.priceP=1; F.flutP=1; F.t0=T_MIN; F.grain=0.10;
    F.rekP=ease(Math.min(1,p/0.55)); F.markP=0; F.aKurs=0.6; F.aFlut=0.6;
    F.lichtP=(p-0.55)/0.30;                                   /* Lichtlauf ueber die fertige Linie */
    F.callouts=[cBTC(1),cGOLD(1)];
    if(p>0.80) F.callouts.push(cREC(Math.min(1,(p-0.80)*5)));
  } else if(t<34.6){
    /* Die Kernszene (6,2 s): heranfahren, dann waechst die Linie seit dem
       besten Gold-Tag mit laufendem Wert; der Kurs steht. */
    const p=(t-28.4)/6.2;
    F.barsA=0; F.chartA=1; F.priceP=1; F.flutP=1; F.grain=0.10;
    const q1=Math.min(1,p/0.25);
    F.t0 = T_MIN+(T_ZOOM-T_MIN)*ease(q1);
    if(p<0.25){ F.rekP=1; F.markP=0; F.rekFrom=0; F.aMarke=1-0.6*q1; }
    else { const q2=Math.min(1,(p-0.25)/0.55); F.rekFrom=ST.iRec; F.rekP=Math.max(0.001,ease(q2)); F.markP=0; F.aMarke=1; }
    F.callouts=[];
    if(p>0.25) F.callouts.push({ts:tsOfI(ST.iRec),v:D.px[ST.iRec],dy:fA*2.0,side:'right',text:'*'+num(ST.rm,1)+' oz*',col:EC,puls:true,a:Math.min(1,(p-0.25)*6)});
    if(p>0.40) F.callouts.push({ts:tsOfI(NP-1),v:D.px[NP-1],dy:fA*2.2,text:'*$'+num(D.kurs,0)+'*',a:Math.min(1,(p-0.40)*6)});
    if(p>0.82) F.callouts.push({ts:tsOfI(NP-1),v:ST.rek,dy:-fA*1.8,text:'*$'+num(ST.rek,0)+'*',col:EC,a:Math.min(1,(p-0.82)*8)});
  } else {
    /* Das Urteil (5,4 s): die grosse Zahl steht, darunter der Satz der Episode. */
    const p=(t-34.6)/5.4;
    F.barsA=ease(Math.min(1,p*2.2))*0.55; F.chartA=0.35; F.priceP=1; F.flutP=1;
    F.markP=1; F.rekP=1; F.t0=T_MIN; F.fokusA=0; F.grain=0.14;
    F.bigText='$'+num(ST.rek,0);
    F.bigSub='KEPT UP WITH GOLD';
    F.bigA=Math.min(1,p*4)*Math.min(1,(1-p)*8+0.4);
  }
  return F;
}


let RAF=null;
function loop(){
  RAF=requestAnimationFrame(loop);
  if(CIN.start){
    const ms=performance.now()-CIN.start;
    if(ms>=CIN.dauer){ stopCin(); return; }
    const F=frameFor(ms);
    const altT=S.t0, altS=S.stufe;
    if(F.t0)S.t0=F.t0; if(F.stufe)S.stufe=F.stufe;
    render(performance.now(),F);
    S.t0=altT; S.stufe=altS;
  } else if(HL.start){
    const ms=performance.now()-HL.start;
    /* nach dem Aufbau bleibt das Bild stehen, bis irgendeine Taste gedrueckt wird (19.09.2026) */
    const F=hlFrame(ms);
    const altT=S.t0, altS=S.stufe;
    if(F.t0)S.t0=F.t0; if(F.stufe)S.stufe=F.stufe;
    render(performance.now(),F);
    S.t0=altT; S.stufe=altS;
  } else {
    render(performance.now(),{});
  }
}

function zurueck(){ if(CIN.sichern){ S.t0=CIN.sichern.t0; S.stufe=CIN.sichern.stufe;
  S.marken=CIN.sichern.marken; S.texte=CIN.sichern.texte; CIN.sichern=null; rechnen(); syncUI(); } }
function startCin(){ if(HL.start) stopHL(); sichern(); S.marken=true; S.texte=false; S.stufe=1; rechnen();
  const p=document.getElementById('pan'); CIN.panAlt=p.style.display; p.style.display='none';
  CIN.start=performance.now(); }

  const p=document.getElementById('pan'); p.style.display=CIN.panAlt||'';

/* ===================== Bedienung ===================== */
function syncUI(){
  const fz=(S.t0-T_MIN)/(T_MAXZ-T_MIN);
  document.getElementById('rZ').value=Math.round(Math.max(0,Math.min(1,fz))*1000);
  document.getElementById('lZ').textContent='FROM '+dstr(S.t0);
  document.querySelectorAll('.stufe').forEach(b=>b.classList.toggle('on',+b.dataset.s===S.stufe));
  document.getElementById('swM').classList.toggle('on',S.marken);
  document.getElementById('swT').classList.toggle('on',S.texte);

  document.getElementById('k1').textContent=num(ST.oz,1)+' oz';
  document.getElementById('k2').textContent=pct(ST.ddSeit,1);
  document.getElementById('k3').textContent=pct(ST.ddUsd,1);
  document.getElementById('k4').textContent=num(ST.wSince,0);
  document.getElementById('qz').innerHTML=
    'Price: Coin Metrics Community <b>PriceUSD</b>, weekly (Fridays), 23 Jul 2010 – '+dEN(D.stand)+
    ' ('+num(NP,0)+' weeks). Gold: COMEX front-month <b>GC=F</b> (Yahoo Finance), daily close, '+
    'aligned to the same Fridays. Reference point for every “today” figure: <b>'+dEN(D.stand)+'</b>, price $'+
    num(D.kurs,2)+', gold $'+num(D.gold,1)+' per ounce. All-time high in dollars $'+num(D.athU[1],0)+' on '+dEN(D.athU[0])+
    ' (daily); most gold per bitcoin on a daily basis '+num(D.rekD[1],1)+' oz on '+dEN(D.rekD[0])+', weekly '+
    num(ST.rm,1)+' oz on '+dstr(tsOfI(ST.iRec))+'.<br>'+
    'The <b>dashed line</b> has no fitted parameter: the most ounces one bitcoin could ever buy, times the gold price — '+
    'i.e. the price at which bitcoin would buy as much gold as on its best day. '+
    'On a daily basis it would sit at $'+num(D.rekD[1]*AU[NP-1],0)+' instead of $'+num(OZ[ST.iRec]*AU[NP-1],0)+' — '+
    'the headline uses the more conservative weekly figure.<br>'+
    '<b>The test</b> (view 4): 13-week log changes, 105 shifts. Best shift gold: '+
    num(LL.maxG,3)+', best shift CHF/JPY: '+num(LL.maxFx,3)+'. Weekly changes: gold explains '+
    num(LL.r2.g1*100,2)+'% of bitcoin’s move, CHF/JPY '+num(LL.r2.f1*100,2)+'%; over 13 weeks '+
    num(LL.r2.g13*100,2)+'% vs '+num(LL.r2.f13*100,2)+'%; on levels '+num(LL.r2.gN*100,1)+'% vs '+
    num(LL.r2.fN*100,1)+'% (the meaningless series wins there — levels measure trend, not relationship). '+
    'Co-movement over the last 13 weeks: '+num(LL.c13,2)+'.<br>'+
    'Honest limit: '+num(ST.wSince,0)+' weeks behind gold is <b>no record</b> — the longest stretch was '+num(ST.stMax,0)+' weeks ('+ST.stMaxVon+' to '+ST.stMaxBis+'). '+
    'The dashed line rises at every new high in gold: the most ounces one bitcoin had bought so far, times the gold price since.';
}
document.getElementById('panT').onclick=e=>{
  const p=document.getElementById('pan'); p.classList.toggle('zu');
  e.target.innerHTML=p.classList.contains('zu')?'&#9654;':'&#9664;';
};
document.getElementById('rZ').oninput=e=>{ const f=e.target.value/1000; S.t0=T_MIN+f*(T_MAXZ-T_MIN); syncUI(); };
document.querySelectorAll('.stufe').forEach(b=>b.onclick=()=>{ S.stufe=+b.dataset.s; syncUI(); });
document.getElementById('swM').onclick=()=>{ S.marken=!S.marken; syncUI(); };
document.getElementById('swT').onclick=()=>{ S.texte=!S.texte; syncUI(); };
(function(){ const p=document.getElementById('pan'),h=document.getElementById('panH');
  let dx=0,dy=0,on=false;
  h.addEventListener('mousedown',e=>{ if(e.target.id==='panT')return; on=true;
    dx=e.clientX-p.offsetLeft; dy=e.clientY-p.offsetTop; e.preventDefault(); });
  window.addEventListener('mousemove',e=>{ if(!on)return; p.style.left=(e.clientX-dx)+'px'; p.style.top=(e.clientY-dy)+'px'; });
  window.addEventListener('mouseup',()=>on=false); })();

let sZeit=0;
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(HL.start){ stopHL(); if(k!=='s'){ sZeit=0; return; } }   /* jede Taste beendet ein stehendes Highlight; 's' leitet gleich das naechste ein */
  if(k==='escape'){ if(CIN.start)stopCin(); sZeit=0; return; }
  if(k==='s'){ sZeit=performance.now(); return; }
  if(k==='t'){ if(sZeit&&performance.now()-sZeit<1200&&!CIN.start){ startCin(); } sZeit=0; return; }
  if(k>='1'&&k<='9'){ if(sZeit&&performance.now()-sZeit<1200){ startHL(+k); } sZeit=0; return; }
  sZeit=0;
});

/* Tooltip - Geistermarke am Kursverlauf: Datum, Kurs, Goldpreis, Bitcoin in
   Unzen, Abstand zum Hoch in Gold bis dahin, und die Marke in Dollar. */
const tt=document.getElementById('tt');
cv.addEventListener('mousemove',e=>{
  if(CIN.start||HL.start){tt.style.display='none';return;}
  const g=geo(); const ts=tsOf(e.clientX,g);
  if(ts<S.t0||ts>tsOfI(NP-1)){tt.style.display='none';return;}
  const i=Math.max(0,Math.min(NP-1,iOf(ts)));
  let z='';
  z+='<div style="color:'+EC+'">Gold $'+num(AU[i],0)+(isFinite(REK[i])?' · kept up with gold: $'+num(REK[i],REK[i]<10?2:0):'')+'</div>';
  z+='<div style="color:'+(REC[i]?OR:'#fff')+'">Bitcoin in gold: <b>'+num(OZ[i],OZ[i]<1?4:2)+' oz</b>'+(REC[i]?' — most gold ever':'')+'</div>';
  z+='<div style="color:'+GR+'">'+pct((OZ[i]/RM[i]-1)*100,1)+' vs best day so far ('+num(RM[i],RM[i]<1?4:1)+' oz)</div>';
  tt.innerHTML='<div class="d">'+dstr2(tsOfI(i))+'</div>'+
    '<div><b style="color:#fff">$'+num(D.px[i],D.px[i]<10?4:0)+'</b></div>'+z;
  tt.style.display='block';
  tt.style.left=Math.min(window.innerWidth-tt.offsetWidth-12,e.clientX+16)+'px';
  tt.style.top=Math.min(window.innerHeight-tt.offsetHeight-12,e.clientY+16)+'px';
});
cv.addEventListener('mouseleave',()=>tt.style.display='none');
window.addEventListener('blur',()=>tt.style.display='none');

/* Teilen */
const HREFS=[];
(function(){
  function titel(){
    return 'Bitcoin measured in gold: the high was on '+dstr(tsOfI(ST.iRec))+' ('+num(ST.rm,1)
      +' oz). Today it is '+num(ST.oz,1)+' oz, '+pct(ST.ddOz,0)+'. Had bitcoin kept up with gold it would be at $'
      +num(ST.rek,0)+' — '+pct(ST.gap,0)+' above the price. Gold does not move the price; gold moves the line. '
      +'Computed from '+num(NP,0)+' weeks since 2010.';
  }
  function ziel(){ const h=location.href; return (h.length>2000||h.indexOf('data:')===0)?'':h; }
  function fallback(txt){ try{ const r=navigator.clipboard.writeText(txt);
    if(r&&r.catch) r.catch(()=>{}); }catch(_){ } }
  function bind(sel,mk){
    const a=document.querySelector(sel);
    a.addEventListener('click',ev=>{ ev.preventDefault();
      const u=ziel(), url=mk(u);
      const sp=a.querySelector('span'), alt=sp.textContent;
      if(!url){ fallback(titel()+(u?' '+u:'')); sp.textContent='Text copied ✓'; setTimeout(()=>sp.textContent=alt,1800); return; }
      const w=window.open(url,'_blank','noopener,noreferrer');
      if(!w){ fallback(titel()+(u?' '+u:'')); sp.textContent='Text copied ✓'; setTimeout(()=>sp.textContent=alt,1800); }
    });
    HREFS.push(()=>a.setAttribute('href',mk(ziel())||'#'));
  }
  bind('#srl a.wa',u=>'https://wa.me/?text='+encodeURIComponent(titel()+(u?' '+u:'')));
  bind('#srl a.xx',u=>'https://x.com/intent/post?text='+encodeURIComponent(titel())+(u?'&url='+encodeURIComponent(u):''));
  bind('#srl a.yt',()=> 'https://www.youtube.com/@WalletGreat');
  const lk=document.querySelector('#srl a.lk');
  lk.addEventListener('click',ev=>{ ev.preventDefault(); const u=ziel();
    fallback(u||titel()); const sp=lk.querySelector('span'), alt=sp.textContent;
    sp.textContent='Copied ✓'; setTimeout(()=>sp.textContent=alt,1800); });
})();

/* Start */
rechnen(); syncUI(); HREFS.forEach(f=>f()); loop();
window.addEventListener('resize',()=>{});
</script>
