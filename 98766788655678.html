<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Yield Curve Lab — Euro-Zinskurve im Zeitverlauf</title>
<style>
  :root{
    --bg:#000; --ink:#fff; --accent:#F7931A; --danger:#FF3B30; --calm:#5AA9FF;
    --green:#23c55e; --dim:rgba(255,255,255,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* Control panel */
  #panel{position:fixed;top:18px;right:18px;width:264px;background:rgba(16,16,18,.82);
    border:1px solid rgba(255,255,255,.12);border-radius:14px;backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);padding:0 0 12px;z-index:20;user-select:none;
    box-shadow:0 18px 50px rgba(0,0,0,.55);font-size:13px}
  #panel.hidden{display:none}
  #phead{display:flex;align-items:center;justify-content:space-between;cursor:grab;
    padding:11px 13px;border-bottom:1px solid rgba(255,255,255,.08)}
  #phead .t{font-weight:800;letter-spacing:.5px;font-size:12px;color:#fff;text-transform:uppercase}
  #phead .hgrp{display:flex;align-items:center;gap:8px}
  #phead .q{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;
    border:1px solid rgba(255,255,255,.35);border-radius:50%;color:#fff;cursor:pointer;font-size:12px;
    font-weight:800;line-height:1}
  #phead .q:hover{border-color:var(--accent);color:var(--accent)}
  #phead .x{color:var(--dim);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
  /* explainer overlay */
  #explain{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px}
  #explain.hidden{display:none}
  #explain .card{max-width:640px;max-height:86vh;overflow-y:auto;background:#0d0e12;
    border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:26px 30px;
    box-shadow:0 30px 80px rgba(0,0,0,.7);line-height:1.62;font-size:14.5px;color:rgba(255,255,255,.88)}
  #explain h2{margin:0 0 6px;font-size:22px;color:#fff}
  #explain h3{margin:20px 0 6px;font-size:15px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
  #explain p{margin:8px 0}
  #explain .row{display:flex;gap:9px;margin:7px 0;align-items:baseline}
  #explain .row b{flex:0 0 78px;font-weight:800}
  #explain .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:2px;vertical-align:middle}
  #explain .cls{color:#fff}
  #explain .xbtn{float:right;margin:-6px -8px 0 0;color:var(--dim);cursor:pointer;font-size:24px;line-height:1}
  #explain .xbtn:hover{color:#fff}
  #explain .foot{margin-top:20px;text-align:center}
  #explain .foot button{background:var(--accent);color:#000;border:0;border-radius:10px;padding:11px 22px;
    font-weight:800;letter-spacing:.5px;cursor:pointer;font-size:14px}
  .prow{padding:9px 13px 4px}
  .prow label{display:flex;justify-content:space-between;color:var(--dim);
    font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
  .prow label b{color:#fff;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;-webkit-appearance:none;height:4px;border-radius:3px;
    background:rgba(255,255,255,.18);outline:none;margin:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
    border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 8px rgba(247,147,26,.7)}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;
    background:var(--accent);cursor:pointer}
  .toggles{display:flex;flex-wrap:wrap;gap:6px;padding:6px 13px 2px}
  .tg{flex:1 1 46%;padding:7px 6px;border:1px solid rgba(255,255,255,.14);border-radius:9px;
    text-align:center;font-size:11px;letter-spacing:.4px;color:var(--dim);cursor:pointer;
    text-transform:uppercase;transition:.15s}
  .tg.on{color:#fff;border-color:var(--accent);background:rgba(247,147,26,.16)}
  #playbtn{margin:10px 13px 2px;display:flex;align-items:center;justify-content:center;gap:9px;
    padding:11px;border-radius:11px;background:var(--accent);color:#000;font-weight:800;
    letter-spacing:1px;cursor:pointer;font-size:13px;text-transform:uppercase}
  .pmini{display:flex;gap:6px;padding:8px 13px 2px}
  .pmini .b{flex:1;text-align:center;padding:7px;border:1px solid rgba(255,255,255,.14);
    border-radius:9px;color:var(--dim);cursor:pointer;font-size:12px;font-weight:700}
  .pmini .b:hover{color:#fff;border-color:rgba(255,255,255,.3)}
  .pmini .b.on{color:#fff;border-color:var(--accent);background:rgba(247,147,26,.18)}
  .pmlabel{padding:8px 13px 0;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim)}

  body.cinema #panel, body.cinema #showpanel, body.cinema #hint, body.cinema #tip,
  body.explain #panel, body.explain #showpanel, body.explain #hint, body.explain #tip{display:none !important}
  #skiphint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:41;
    color:rgba(255,255,255,.4);font-size:12px;letter-spacing:.5px;pointer-events:none;display:none}
  body.explain #skiphint{display:block}
  /* draggable divider to resize the timeline */
  #stripgrip{position:fixed;left:50%;transform:translateX(-50%);z-index:16;width:132px;height:15px;
    cursor:ns-resize;display:flex;align-items:center;justify-content:center;touch-action:none}
  #stripgrip .bar{width:52px;height:4px;border-radius:3px;background:rgba(255,255,255,.30)}
  #stripgrip:hover .bar{background:rgba(247,147,26,.95);box-shadow:0 0 8px rgba(247,147,26,.6)}
  body.cinema #stripgrip, body.explain #stripgrip{display:none}
  #showpanel{position:fixed;top:18px;right:18px;z-index:20;display:none;cursor:pointer;
    background:rgba(16,16,18,.82);border:1px solid rgba(255,255,255,.14);border-radius:11px;
    padding:9px 13px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    color:var(--dim)}

  #tip{position:fixed;pointer-events:none;z-index:30;background:rgba(10,10,12,.94);
    border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:9px 12px;font-size:13px;
    line-height:1.5;opacity:0;transition:opacity .1s;white-space:nowrap;
    box-shadow:0 10px 30px rgba(0,0,0,.6)}
  #tip .m{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  #tip .v{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}

  #hint{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:15;
    color:rgba(255,255,255,.34);font-size:11px;letter-spacing:.4px;text-align:center;
    white-space:nowrap;pointer-events:none;transition:opacity .6s}

  @media (max-width:640px){
    #panel{width:calc(100vw - 24px);right:12px;top:auto;bottom:12px}
    #showpanel{right:12px;top:auto;bottom:12px}
    #hint{display:none}
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div id="panel">
  <div id="phead"><span class="t">Yield Curve Lab</span>
    <span class="hgrp"><span class="q" id="showhelp" title="Was ist eine Zinskurve?">?</span><span class="x" id="hidepanel">×</span></span>
  </div>
  <div id="playbtn"><span id="playicon">▶</span><span id="playtxt">Zeitreise</span></div>
  <div class="pmlabel">Szenario — zeigt den Cluster passender Kurven</div>
  <div class="pmini">
    <div class="b" id="cSteil" title="Alle steilen Kurven (2s10s ≥ 150 bp)">Steil</div>
    <div class="b" id="cInvers" title="Alle inversen Kurven (2s10s &lt; 0)">Invers</div>
    <div class="b" id="cNegativ" title="Alle Kurven mit negativem Kurzzins">Negativ</div>
    <div class="b" id="cNormal" title="Alle normalen Aufwärts-Kurven">Normal</div>
  </div>
  <div class="prow">
    <label>Tempo <b id="spdV">1.0×</b></label>
    <input type="range" id="spd" min="0.2" max="6" step="0.1" value="1.6">
  </div>
  <div class="toggles">
    <div class="tg" id="tgColor" title="Färbt die aktuelle Kurve: weiß wo sie steigt, rot wo sie fällt (= invers)">Kurve färben</div>
    <div class="tg" id="tgGhostAll" title="Blendet ALLE Kurven seit 2004 ein — nach Alter (violett 2004 → gelb heute)">Alle Kurven</div>
    <div class="tg" id="tgDens" title="Dichte-Verteilung der 3M- und 30J-Rendite an den Rändern — wo lag sie typischerweise?">Dichte 3M/30J</div>
    <div class="tg" id="tgBtc" title="Bitcoin-Preis (log) auf der Zeitleiste — orange Linie, Live-Preis am Playhead">₿ Bitcoin</div>
  </div>
</div>
<div id="showpanel">▤ Panel</div>

<div id="stripgrip" title="Ziehen, um die Zeitleiste größer/kleiner zu machen"><span class="bar"></span></div>

<div id="skiphint">Erklärung läuft … · Esc zum Beenden</div>

<div id="tip"></div>
<div id="hint">Zeitleiste unten ziehen · ← → Wochen · ⇧ + ← → Jahre · Leertaste = Play · Kurve antippen = Wert</div>

<script>
"use strict";
const RAW = JSON.parse(document.getElementById('curve-data').textContent);
const MATS = RAW.maturities;           // [0.25,...,30]
const MLAB = RAW.maturityLabels;       // ["3M",...,"30Y"]
const DATES = RAW.dates;               // ["2004-09-10",...]
const YLD = RAW.yields;                // [[...],[...]]  per date, per maturity
const BTC = RAW.btc || [];             // Bitcoin USD price per date (null before ~2010)
const N = DATES.length;
const NM = MATS.length;
const I2 = MATS.indexOf(2), I10 = MATS.indexOf(10), I3M = 0, I30 = NM-1;

// ---- precompute helpers ----
const SQ = MATS.map(m=>Math.sqrt(m));
const SQ0 = SQ[0], SQ1 = SQ[NM-1];
let gMin=Infinity, gMax=-Infinity;
const SPREAD = new Float32Array(N);      // 2s10s
for(let i=0;i<N;i++){
  const r=YLD[i];
  for(let j=0;j<NM;j++){ if(r[j]<gMin)gMin=r[j]; if(r[j]>gMax)gMax=r[j]; }
  SPREAD[i]=r[I10]-r[I2];
}
let sMin=Infinity,sMax=-Infinity;
for(let i=0;i<N;i++){ if(SPREAD[i]<sMin)sMin=SPREAD[i]; if(SPREAD[i]>sMax)sMax=SPREAD[i]; }
// fixed y-range (include zero, pad)
const YLO = Math.min(0,gMin)-0.35, YHI = gMax+0.4;
// Bitcoin log-price range (for the optional overlay on the timeline)
let bLo=1e9,bHi=-1e9,bFirst=-1;
for(let i=0;i<N;i++){ const p=BTC[i]; if(p!=null&&p>0){ if(bFirst<0)bFirst=i; const l=Math.log10(p); if(l<bLo)bLo=l; if(l>bHi)bHi=l; } }
const BLOG_LO=Math.floor(bLo), BLOG_HI=Math.ceil(bHi);   // e.g. -2 .. 6 (log10 USD)

const dateObj = DATES.map(d=>new Date(d+"T00:00:00Z"));
function idxForDate(str){
  const t=new Date(str+"T00:00:00Z").getTime();
  let best=0,bd=Infinity;
  for(let i=0;i<N;i++){const dd=Math.abs(dateObj[i].getTime()-t); if(dd<bd){bd=dd;best=i;}}
  return best;
}
const KEY = {
  start: 0,
  inv: idxForDate("2023-06-23"),
  neg: idxForDate("2020-08-01"),
  hike: idxForDate("2022-07-01"),
  crisis: idxForDate("2008-10-15"),
  steep: idxForDate("2009-05-29"),
  euro: idxForDate("2012-07-01"),
  now: N-1
};

// Curve-shape CLUSTERS. Each scenario is a family of curves (across all of history) that share a
// shape — selecting one shows exactly that cluster, coloured by age, plus a representative example.
const CLUSTERS = {
  steil:  {label:"Steile Kurven",       test:v=>(v[I10]-v[I2])>=1.5},
  invers: {label:"Inverse Kurven",      test:v=>(v[I10]-v[I2])<0},
  negativ:{label:"Negativzins-Kurven",  test:v=>v[0]<0},
  normal: {label:"Normale Kurven",      test:v=>{const s=v[I10]-v[I2];return s>=0.3&&s<1.5&&Math.min.apply(null,v)>=0;}}
};
// count each cluster + pick the most representative example (the extreme case, or the latest for "normal")
for(const k in CLUSTERS){ const c=CLUSTERS[k]; let cnt=0,rep=-1,best=-Infinity;
  for(let i=0;i<N;i++){ if(c.test(YLD[i])){ cnt++;
    const v=YLD[i], m = k==='steil'?(v[I10]-v[I2]) : k==='invers'?-(v[I10]-v[I2]) : k==='negativ'?-v[0] : i;
    if(m>best){best=m;rep=i;} } }
  c.count=cnt; c.rep=rep;
}

// marginal density of a maturity's yield, over the period UP TO the current slider position —
// so it grows and shifts as you scrub (where did this edge typically sit, so far?)
function densityFor(mi,upto){
  const bins=56, h=new Float32Array(bins);
  for(let i=0;i<=upto;i++){ let b=Math.floor((YLD[i][mi]-YLO)/(YHI-YLO)*bins); b=b<0?0:b>bins-1?bins-1:b; h[b]++; }
  const s=new Float32Array(bins);   // light 1-2-1 smoothing
  for(let b=0;b<bins;b++) s[b]=0.25*h[Math.max(0,b-1)]+0.5*h[b]+0.25*h[Math.min(bins-1,b+1)];
  let mx=0; for(const v of s) if(v>mx)mx=v;
  return {s,mx,bins};
}

// regimes -> label for badge
// regime = the historical EVENT / policy of that period (the WHY), never a description of the
// curve shape itself (that is what the badge shows). Kept consistent so nothing is redundant.
const REGIMES = [
  ["2004-09-01","2005-11-30","Ruhige Jahre vor der Krise"],
  ["2005-12-01","2007-07-31","EZB hebt die Zinsen"],
  ["2007-08-01","2008-08-31","Beginn der Finanzkrise"],
  ["2008-09-01","2009-12-31","Lehman-Pleite · EZB senkt drastisch"],
  ["2010-01-01","2012-07-25","Euro-Schuldenkrise"],
  ["2012-07-26","2014-05-31","Draghi: „Whatever it takes“"],
  ["2014-06-01","2019-12-31","EZB: Negativzins & Anleihekäufe"],
  ["2020-01-01","2021-12-31","Corona-Pandemie · Notkäufe (PEPP)"],
  ["2022-01-01","2023-09-30","EZB-Zinswende gegen die Inflation"],
  ["2023-10-01","2024-05-31","Leitzins auf Rekordhoch (4 %)"],
  ["2024-06-01","2100-01-01","EZB senkt die Zinsen wieder"]
].map(r=>[new Date(r[0]+"T00:00:00Z").getTime(),new Date(r[1]+"T00:00:00Z").getTime(),r[2]]);
function regimeFor(i){ const t=dateObj[i].getTime(); for(const r of REGIMES){ if(t>=r[0]&&t<=r[1]) return r[2]; } return ""; }

// ---- state ----
const S = {
  t: N-1,            // float time index
  playing:false, dir:1,
  speed:1.6,
  cloud:'none',      // history cloud: 'none' | 'all' | cluster key ('steil'|'invers'|'negativ'|'normal')
  colorLine:false,   // colour the main curve (falling / inverse parts red)
  density:false,     // marginal density of 3M & 30Y yields on the edges
  btc:false,         // optional Bitcoin price overlay on the timeline
  stripFrac:0.075,   // timeline band height as a fraction of the viewport (draggable)
  hoverMat:-1,
  cinema:false, cStart:0,
  explain:false, eStart:0,   // in-chart animated explainer (the "?" button)
};

// ---- canvas ----
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,L; // L = layout
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  const mob=W<640;
  const padL = mob?52:104;
  const padR = mob?26:58;
  const headH= mob?100:128;
  const matLabelH = mob?22:28;   // maturity tick labels under plot
  const stripLabelH = mob?18:24; // caption above strip
  const yearH  = mob?20:24;      // year labels under strip
  const botMargin = mob?16:40;   // leaves room for the hint line on desktop
  // the strip is anchored at the bottom; its height is user-draggable (S.stripFrac)
  const stripB = H-(yearH+botMargin);
  const maxStripH = stripB - (headH+90) - stripLabelH - matLabelH;  // keep the plot usable
  const stripH = Math.max(mob?36:46, Math.min(maxStripH, S.stripFrac*H));
  const stripT = stripB - stripH;
  const plotB = stripT - stripLabelH - matLabelH;
  L={mob,padL,padR,matLabelH,stripLabelH,
     plotL:padL, plotR:W-padR,
     plotT:headH,
     plotB,
     stripT,
     stripB,
     headH};
  L.plotW=L.plotR-L.plotL; L.plotH=L.plotB-L.plotT;
  // signature of the current geometry — cached layers rebuild whenever it changes
  L.sig=W+'x'+H+'@'+DPR+':'+Math.round(L.plotB)+':'+Math.round(stripT)+':'+Math.round(stripB);
  const grip=document.getElementById('stripgrip');
  if(grip){ grip.style.top=(stripT-(mob?16:19))+'px'; }
}
window.addEventListener('resize',layout); layout();

// scales
function X(m){ return L.plotL + (Math.sqrt(m)-SQ0)/(SQ1-SQ0)*L.plotW; }
function Y(v){ return L.plotB - (v-YLO)/(YHI-YLO)*L.plotH; }
function sX(i){ return L.plotL + i/(N-1)*L.plotW; }         // strip x by index
function sY(v){ const lo=Math.min(sMin,-0.1),hi=Math.max(sMax,0.1);
  return L.stripB - (v-lo)/(hi-lo)*(L.stripB-L.stripT); }

// interpolated curve at float index t
function curveAt(t){
  const a=Math.floor(t), b=Math.min(a+1,N-1), f=t-a;
  const ra=YLD[a], rb=YLD[b], out=new Array(NM);
  for(let j=0;j<NM;j++) out[j]=ra[j]+(rb[j]-ra[j])*f;
  return out;
}
function lerpDate(t){
  const a=Math.floor(t),b=Math.min(a+1,N-1),f=t-a;
  const ms=dateObj[a].getTime()+(dateObj[b].getTime()-dateObj[a].getTime())*f;
  return new Date(ms);
}
const MON=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
function fmtDate(d){ return d.getUTCDate().toString().padStart(2,'0')+". "+MON[d.getUTCMonth()]+" "+d.getUTCFullYear(); }
// One classification used by BOTH the badge and the area-fill tint, so they always agree.
// Thresholds follow the market convention for the 2s10s spread (10Y − 2Y):
//   < 0 bp      inverted (short > long) — recession signal
//   0–30 bp     flat (yields converging toward zero slope)
//   30–150 bp   normal upward (a healthy expansion curve sits ~100–150 bp)
//   > 150 bp    steep (wider than the healthy range)
function classify(spr){
  if(spr<0)    return {label:"INVERS",hex:"#FF3B30",rgb:[255,80,70]};
  if(spr<0.30) return {label:"FLACH", hex:"#F7931A",rgb:[247,160,60]};
  if(spr>=1.5) return {label:"STEIL", hex:"#5AA9FF",rgb:[90,150,255]};
  return               {label:"NORMAL",hex:"#25c55e",rgb:[46,200,110]};
}
// main-curve segment colour when "Kurve färben" is on: white where it rises, red where it falls.
function lineCol(sl){
  if(sl>=-0.02) return [236,241,249];
  const w=Math.min(1,(-sl-0.02)/0.6);
  return [255, Math.round(236-196*w), Math.round(241-206*w)];
}
// Viridis colour scale (dark violet -> blue -> teal -> green -> yellow) for age-colouring.
const VIRIDIS=[[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]];
function viridis(t){
  t=t<0?0:t>1?1:t;
  const n=VIRIDIS.length-1, x=t*n, i=Math.min(n-1,Math.floor(x)), f=x-i, a=VIRIDIS[i], b=VIRIDIS[i+1];
  return [Math.round(a[0]+(b[0]-a[0])*f),Math.round(a[1]+(b[1]-a[1])*f),Math.round(a[2]+(b[2]-a[2])*f)];
}

// ---------- RENDER ----------

  return {t:S.t, aGrid:1,aCurve:1,aGhost:1,aStrip:1,

}

// marginal density band hugging an edge: shows where that maturity's yield typically sat
function drawOneDensity(D,x0,dir,maxW,lbl){
  const bins=D.bins;
  ctx.beginPath();ctx.moveTo(x0,L.plotB);
  for(let b=0;b<bins;b++){ const yc=Y(YLO+((b+0.5)/bins)*(YHI-YLO)), w=(D.s[b]/D.mx)*maxW; ctx.lineTo(x0+dir*w,yc); }
  ctx.lineTo(x0,L.plotT);ctx.closePath();
  const grad=ctx.createLinearGradient(x0,0,x0+dir*maxW,0);
  grad.addColorStop(0,"rgba(120,200,255,.30)");grad.addColorStop(1,"rgba(120,200,255,0)");
  ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();
  for(let b=0;b<bins;b++){ const yc=Y(YLO+((b+0.5)/bins)*(YHI-YLO)), w=(D.s[b]/D.mx)*maxW; const x=x0+dir*w; b?ctx.lineTo(x,yc):ctx.moveTo(x,yc); }
  ctx.strokeStyle="rgba(150,210,255,.7)";ctx.lineWidth=1.3;ctx.stroke();
  ctx.fillStyle="rgba(160,215,255,.85)";ctx.font="700 "+(L.mob?9:11)+"px -apple-system,Segoe UI,sans-serif";
  ctx.textAlign=dir>0?"left":"right";ctx.textBaseline="bottom";
  ctx.fillText("Dichte "+lbl, x0+dir*5, L.plotB-(L.mob?4:6));   // bottom, clear of the age legend
}
function drawDensity(F){
  if(!S.density || S.cinema || S.explain) return;
  const upto=Math.round(F.t), mob=L.mob, maxW=mob?40:66;
  ctx.save();ctx.globalAlpha=(F.aGrid!==undefined?F.aGrid:1);
  drawOneDensity(densityFor(0,upto),    L.plotL, +1, maxW, "3M");    // left edge (3M), extends right
  drawOneDensity(densityFor(NM-1,upto), L.plotR, -1, maxW, "30J");   // right edge (30J), extends left
  ctx.restore();
}
// Catmull-Rom control points, with vertical clamp to segment endpoints (no overshoot spikes)
function crCtrl(pts){
  const cps=[];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||pts[i+1];
    let c1y=p1.y+(p2.y-p0.y)/6, c2y=p2.y-(p3.y-p1.y)/6;
    const lo=Math.min(p1.y,p2.y), hi=Math.max(p1.y,p2.y);
    c1y=Math.max(lo,Math.min(hi,c1y)); c2y=Math.max(lo,Math.min(hi,c2y));
    cps.push([p1.x+(p2.x-p0.x)/6,c1y, p2.x-(p3.x-p1.x)/6,c2y]);
  }
  return cps;
}
function ptsFor(vals){const p=[];for(let j=0;j<NM;j++)p.push({x:X(MATS[j]),y:Y(vals[j])});return p;}
function smoothPath(pts){
  const cps=crCtrl(pts);
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=0;i<cps.length;i++) ctx.bezierCurveTo(cps[i][0],cps[i][1],cps[i][2],cps[i][3],pts[i+1].x,pts[i+1].y);
}
// History cloud: either ALL curves, or one shape-CLUSTER (steil/invers/negativ/normal).
// Every drawn curve is coloured by AGE via Viridis (violet = 2004 … yellow = today).
// It only changes when the mode or the window size changes, so it is cached to an offscreen
// canvas and just blitted each frame — that keeps playback and scrubbing smooth.
const cloudCv=document.createElement('canvas'), cloudG=cloudCv.getContext('2d');
let cloudKey='';
function paintCloudTo(g, upto){
  const isAll = S.cloud==='all';
  const test = isAll? null : CLUSTERS[S.cloud].test;
  const alpha = isAll? 0.48 : 0.62;                       // less transparent than before
  const stepN = isAll? Math.max(1,Math.floor(N/340)) : 1;
  g.lineJoin="round";g.lineWidth=1.2;
  for(let i=0;i<=upto;i+=stepN){
    if(test && !test(YLD[i])) continue;
    const c=viridis(i/(N-1));                             // absolute age: 0=2004 … 1=today
    g.strokeStyle="rgba("+c[0]+","+c[1]+","+c[2]+","+alpha+")";
    const pts=ptsFor(YLD[i]), cps=crCtrl(pts);
    g.beginPath();g.moveTo(pts[0].x,pts[0].y);
    for(let k=0;k<cps.length;k++) g.bezierCurveTo(cps[k][0],cps[k][1],cps[k][2],cps[k][3],pts[k+1].x,pts[k+1].y);
    g.stroke();
  }
}
// "Alle Kurven" grows with the slider (only curves up to the current date); a cluster shows its whole
// family. Cached to an offscreen canvas, keyed by mode+size (+ the current week for "all").
function buildCloud(F){
  const upto = S.cloud==='all'? Math.round(F.t) : N-1;
  const key=S.cloud+'|'+L.sig+'|'+(S.cloud==='all'?upto:'');
  if(cloudKey===key) return;
  cloudKey=key;
  cloudCv.width=Math.round(W*DPR); cloudCv.height=Math.round(H*DPR);
  cloudG.setTransform(DPR,0,0,DPR,0,0); cloudG.clearRect(0,0,W,H);
  if(S.cloud!=='none') paintCloudTo(cloudG, upto);
}
function drawCloud(F){
  if(F.aGhost<=0 || S.cloud==='none') return;
  buildCloud(F);
  ctx.save();ctx.globalAlpha=F.aGhost;ctx.drawImage(cloudCv,0,0,W,H);ctx.restore();
}
// legend explaining the age colours + which cloud is shown
function drawAgeLegend(F){
  if(S.cloud==='none' || F.aGhost<=0 || S.cinema) return;
  const mob=L.mob;
  const w=mob?110:170, h=mob?7:9, x=L.plotL+(mob?8:14), y=L.plotT+(mob?12:16);
  const title = S.cloud==='all' ? "ALLE KURVEN · NACH ALTER"
              : (CLUSTERS[S.cloud].label.toUpperCase()+"  ·  "+CLUSTERS[S.cloud].count+" WOCHEN");
  ctx.save();ctx.globalAlpha=F.aGhost;
  const g=ctx.createLinearGradient(x,0,x+w,0);
  for(let s=0;s<=6;s++){const c=viridis(s/6);g.addColorStop(s/6,"rgb("+c[0]+","+c[1]+","+c[2]+")");}
  ctx.fillStyle=g;roundRect(x,y,w,h,3);ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=1;roundRect(x,y,w,h,3);ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.7)";ctx.font="700 "+(mob?"9px":"11px")+" -apple-system,Segoe UI,sans-serif";
  ctx.textBaseline="top";
  ctx.textAlign="left";ctx.fillText("2004", x, y+h+3);
  ctx.textAlign="right";ctx.fillText("heute", x+w, y+h+3);
  ctx.textAlign="left";ctx.fillStyle="rgba(255,255,255,.85)";
  ctx.font="800 "+(mob?"10px":"12px")+" -apple-system,Segoe UI,sans-serif";
  ctx.fillText(title, x, y-(mob?13:16));
  ctx.restore();
}
function drawCurve(F){
  if(F.aCurve<=0) return;
  const vals=curveAt(F.t);
  const pts=ptsFor(vals);
  const LW=L.mob?2.8:3.4;
  ctx.save();ctx.globalAlpha=F.aCurve;ctx.lineJoin="round";ctx.lineCap="round";
  // progressive reveal via clip (smooth curve draws whole, clip hides the not-yet-revealed part)
  let clipX=L.plotR;
  if(F.prog<1){ const fi=F.prog*(NM-1),a=Math.floor(fi),b=Math.min(a+1,NM-1),fr=fi-a;
    clipX=pts[a].x+(pts[b].x-pts[a].x)*fr; }
  ctx.beginPath();ctx.rect(L.plotL-6,L.plotT-80,clipX-L.plotL+12,L.plotH+160);ctx.clip();
  // gradient area fill under the curve, tinted by the SAME state as the badge (green/orange/blue/red).
  // Skip it whenever a history cloud is shown, so the cloud stays readable under the current line.
  if(S.cloud==='none'){
    const ft = classify(vals[I10]-vals[I2]).rgb;
    const gA=ctx.createLinearGradient(0,L.plotT+L.plotH*0.10,0,L.plotB);
    gA.addColorStop(0,"rgba("+ft[0]+","+ft[1]+","+ft[2]+",0.26)");
    gA.addColorStop(1,"rgba("+ft[0]+","+ft[1]+","+ft[2]+",0)");
    ctx.fillStyle=gA;
    smoothPath(pts);
    ctx.lineTo(pts[NM-1].x,L.plotB);ctx.lineTo(pts[0].x,L.plotB);ctx.closePath();ctx.fill();
  }
  // soft glow underlay (single smooth pass)
  ctx.strokeStyle="rgba(230,240,255,.18)";ctx.lineWidth=LW+5;
  ctx.shadowColor="rgba(190,212,255,.6)";ctx.shadowBlur=L.mob?14:22;
  smoothPath(pts);ctx.stroke();ctx.shadowBlur=0;
  // the selected day's curve. Default: one clean white line. "Kurve färben": white where it rises,
  // red where it falls (= the inverted stretches), via a per-segment gradient.
  ctx.shadowColor="rgba(255,255,255,.4)";ctx.shadowBlur=L.mob?7:11;
  if(!S.colorLine){
    ctx.strokeStyle="#ffffff";ctx.lineWidth=LW;
    smoothPath(pts);ctx.stroke();
  } else {
    const cps=crCtrl(pts);
    const nc=pts.map((p,j)=>{
      let sl;
      if(j===0) sl=(vals[1]-vals[0])/(SQ[1]-SQ[0]);
      else if(j===NM-1) sl=(vals[NM-1]-vals[NM-2])/(SQ[NM-1]-SQ[NM-2]);
      else sl=0.5*((vals[j+1]-vals[j])/(SQ[j+1]-SQ[j])+(vals[j]-vals[j-1])/(SQ[j]-SQ[j-1]));
      return lineCol(sl);
    });
    ctx.lineWidth=LW;
    for(let i=0;i<cps.length;i++){
      const a=nc[i],b=nc[i+1];
      const g=ctx.createLinearGradient(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y);
      g.addColorStop(0,"rgb("+a[0]+","+a[1]+","+a[2]+")");
      g.addColorStop(1,"rgb("+b[0]+","+b[1]+","+b[2]+")");
      ctx.strokeStyle=g;
      ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);
      ctx.bezierCurveTo(cps[i][0],cps[i][1],cps[i][2],cps[i][3],pts[i+1].x,pts[i+1].y);ctx.stroke();
    }
  }
  ctx.shadowBlur=0;
  // maturity dots (2Y & 10Y accented)
  for(let j=0;j<NM;j++){
    if(pts[j].x>clipX+0.5) break;
    const key=(j===I2||j===I10);
    ctx.beginPath();ctx.arc(pts[j].x,pts[j].y,key?(L.mob?4.2:5.4):(L.mob?2.4:3.2),0,7);
    ctx.fillStyle=key?"#F7931A":"#fff";
    if(key){ctx.shadowColor="rgba(247,147,26,.8)";ctx.shadowBlur=12;}
    ctx.fill();ctx.shadowBlur=0;
    if(j===S.hoverMat && !S.cinema){
      ctx.beginPath();ctx.arc(pts[j].x,pts[j].y,L.mob?7:9,0,7);
      ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=1.5;ctx.stroke();
    }
  }
  ctx.restore();
}
function drawHeader(F){

  const d=lerpDate(F.t); const vals=curveAt(F.t);

    ctx.strokeStyle=col;ctx.lineWidth=1.4;roundRect(bx,by,bw,bh,8);ctx.stroke();
    ctx.fillStyle=col;ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(txt,cx,by+bh/2+1);
  }
  ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// Bitcoin overlay helpers (log-price mapped into the strip band)
function btcY(p){ const t=(Math.log10(p)-BLOG_LO)/(BLOG_HI-BLOG_LO); return L.stripB - t*(L.stripB-L.stripT); }
function fmtUSD(p){ return p>=1000 ? "$"+Math.round(p).toLocaleString('en-US')
                  : p>=1 ? "$"+p.toFixed(0) : "$"+p.toFixed(2); }

// spread strip: static parts (fills, spread line, labels, year ticks) cached offscreen; playhead live
const stripCv=document.createElement('canvas'), stripG=stripCv.getContext('2d');
let stripKey='';
function paintStripTo(g){
  const mob=L.mob;

  if(!mob){
    g.textAlign="right";g.font="700 12.5px -apple-system,Segoe UI,sans-serif";
    const rTxt="rot = inverse Kurve ⚠", gTxt="grün = normal      ";

  g.save();
  g.beginPath();g.rect(L.plotL,zy,L.plotW,L.stripB-zy+4);g.clip();
  g.beginPath();g.moveTo(sX(0),zy);
  for(let i=0;i<N;i++) g.lineTo(sX(i),sY(SPREAD[i]));

  // optional Bitcoin price overlay (log scale) — orange line + faint $ scale ticks
  if(S.btc && bFirst>=0){
    g.textAlign="right";g.textBaseline="middle";g.font="700 "+(mob?"8px":"10px")+" -apple-system,Segoe UI,sans-serif";
    for(let e=0;e<=BLOG_HI;e++){ const p=Math.pow(10,e), y=btcY(p);

    }
    g.strokeStyle="#F7931A";g.lineWidth=mob?1.6:2.2;g.lineJoin="round";g.lineCap="round";

      if(started)g.lineTo(x,y);else{g.moveTo(x,y);started=true;} }
    g.stroke();g.shadowBlur=0;

function buildStrip(){

// ---------- CINEMA (S+T) ----------
const CT = 45.0;
function ease(t){return t<0?0:t>1?1:1-Math.pow(1-t,3);}
function smooth(t){return t<0?0:t>1?1:t*t*(3-2*t);}   // easeInOut — gentle accel + decel
function seg(e,a,b){return (e-a)/(b-a);}
function pulse(x){return Math.sin(Math.min(1,Math.max(0,x))*Math.PI);}
// hold full opacity across most of a phase, only fade at the very edges
function hold(e,a,b,fin,fout){fin=fin||0.6;fout=fout||0.7;
  return Math.min(1, Math.min((e-a)/fin,(b-e)/fout, 1));}
function cinemaFrame(e){
  const F={t:S.t,aGrid:0,aCurve:0,aGhost:0,aStrip:0,aHead:0,aWater:0,aBadge:0,prog:1,
    vignette:0.4,cinemaText:null,caption:null,dim:0,headOnlyDate:true};
  // eased sweep of the time index (easeInOut so it never jerks)
  function at(a,b,ia,ib){ return ia+(ib-ia)*smooth(seg(e,a,b)); }
  // Phase 0 — hook (0 – 5.5): title lingers, first curve draws slowly
  if(e<5.5){
    F.t=KEY.start; F.aGrid=ease(seg(e,1.4,3.0)); F.aCurve=ease(seg(e,2.4,5.0)); F.prog=ease(seg(e,2.4,5.2));
    F.cinemaText={title:"DIE ZINSKURVE",sub:"22 Jahre · in Bewegung",
      a:Math.min(ease(seg(e,0.2,1.4)),Math.min(1,(5.5-e)/1.0)),
      scale:0.93+0.10*ease(seg(e,0,5.5)),color:"#F7931A"};
    F.vignette=0.55;
  }
  // Phase 1 — 2004 → 2008 (5.5 – 14): slow, calm
  else if(e<14){
    F.t=at(5.5,14,KEY.start,KEY.crisis); F.aGrid=1;F.aCurve=1;F.aGhost=ease(seg(e,6,8));
    F.aHead=ease(seg(e,5.5,6.8));F.aStrip=ease(seg(e,6.2,7.6));
    F.vignette=0.32; F.caption={txt:"2004 – 2007  ·  RUHE VOR DER KRISE",a:hold(e,5.5,14)*0.92+0.08};
  }
  // Phase 2 — crisis steepening (14 – 20)
  else if(e<20){
    F.t=at(14,20,KEY.crisis,KEY.steep); F.aGrid=1;F.aCurve=1;F.aGhost=1;F.aHead=1;F.aStrip=1;
    F.vignette=0.3; F.caption={txt:"2008 – FINANZKRISE · DIE KURVE VERSTEILT",a:hold(e,14,20)*0.92+0.08};
  }
  // Phase 3 — long dip into negatives (20 – 28)
  else if(e<28){
    F.t=at(20,28,KEY.steep,KEY.neg); F.aGrid=1;F.aCurve=1;F.aGhost=1;F.aHead=1;F.aStrip=1;
    F.vignette=0.3; F.caption={txt:"NEGATIVZINS-ÄRA · DIE GANZE KURVE FÄLLT UNTER NULL",a:hold(e,20,28)*0.92+0.08};
  }
  // Phase 4 — twist (28 – 31)
  else if(e<31){
    F.t=KEY.neg; F.aGrid=0.5;F.aCurve=0.6;F.aGhost=0.45;F.aHead=0.35;F.aStrip=0.4;
    F.dim=pulse(seg(e,28,31))*0.55;
    F.cinemaText={big:"Dann kam die Wende.",a:pulse(seg(e,28.2,31)),color:"#fff",cy:0.45,scale:0.96+0.08*ease(seg(e,28,31))};
    F.vignette=0.5;
  }
  // Phase 5 — hiking + inversion (31 – 40)
  else if(e<40){
    F.t=at(31,40,KEY.neg,KEY.inv); F.aGrid=1;F.aCurve=1;F.aGhost=1;F.aHead=1;F.aStrip=1;F.aBadge=ease(seg(e,34,36));
    F.vignette=0.3;
    const c = e<36?"2022 – EZB-ZINSWENDE · DIE KURVE INVERTIERT":"TIEFSTE INVERSION · JUNI 2023  (−0,61%)";
    F.caption={txt:c,a:hold(e,31,40)*0.92+0.08};
  }
  // Phase 6 — normalise to today (40 – 45)
  else{
    F.t=at(40,44,KEY.inv,KEY.now); F.aGrid=1;F.aCurve=1;F.aGhost=1;F.aHead=1;F.aStrip=1;F.aBadge=1;
    F.aWater=ease(seg(e,42,44)); F.vignette=0.28;
    F.caption={txt:"HEUTE · ZURÜCK ZUR NORMALEN KURVE",a:hold(e,40,45,0.7,0.5)*0.92+0.08};
  }
  return F;
}

// ---------- LOOP (render-on-demand) ----------
// The page only repaints when something actually changed (dirty), while playing, or during the
// cinema. That removes the constant 60fps redraw that caused the stutter.
let last=performance.now();
let dirty=true;
function invalidate(){ dirty=true; }
function loop(now){
  const dt=(now-last)/1000; last=now;
  if(S.explain){
    const e=(now-S.eStart)/1000;
    if(e>=ET){ stopExplain(); }
    else { render(explainFrame(e)); requestAnimationFrame(loop); return; }
  }
  if(S.cinema){
    const e=(now-S.cStart)/1000;
    if(e>=CT){ S.cinema=false; document.body.classList.remove('cinema'); dirty=true; }
    else { render(cinemaFrame(e)); requestAnimationFrame(loop); return; }
  }
  if(S.playing){
    S.t+=S.dir*S.speed*dt*8;   // ~8 weekly steps/sec at 1x
    if(S.t>=N-1){S.t=N-1;S.playing=false;syncPlay();}
    if(S.t<0){S.t=0;S.playing=false;syncPlay();}
    dirty=true;
  }
  if(dirty){ render(frameStatic()); dirty=false; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// safety net: any user interaction schedules at least one repaint (so nothing can get "stuck")
['pointerdown','pointermove','pointerup','pointerleave','keydown','click','input','wheel','touchstart','touchmove','resize']
  .forEach(ev=>window.addEventListener(ev,invalidate,true));

// ---------- INTERACTION ----------
const stripHit=(y)=> y>=L.stripT-14 && y<=L.stripB+14;
let scrubbing=false;
function xToT(x){ const f=(x-L.plotL)/L.plotW; return Math.max(0,Math.min(N-1,f*(N-1))); }
cv.addEventListener('pointerdown',e=>{
  if(S.explain){ stopExplain(); return; }
  if(S.cinema) return;
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(stripHit(y)){ scrubbing=true; S.playing=false;syncPlay(); S.t=xToT(x); cv.setPointerCapture(e.pointerId);}
});
cv.addEventListener('pointermove',e=>{
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(scrubbing){ S.t=xToT(x); return; }
  // hover maturity
  if(y>=L.plotT&&y<=L.plotB){
    let best=-1,bd=1e9;
    for(let j=0;j<NM;j++){const dx=Math.abs(X(MATS[j])-x); if(dx<bd){bd=dx;best=j;}}
    if(bd< (L.mob?26:34)){ S.hoverMat=best; showTip(e.clientX,e.clientY,best); }
    else { S.hoverMat=-1; hideTip(); }
  } else { S.hoverMat=-1; hideTip(); }
});
cv.addEventListener('pointerup',e=>{scrubbing=false;});
cv.addEventListener('pointerleave',()=>{S.hoverMat=-1;hideTip();});

(function(){const p=document.getElementById('panel'),h=document.getElementById('phead');
  let dx=0,dy=0,drag=false;
  h.addEventListener('pointerdown',e=>{if(e.target.id==='hidepanel'||e.target.id==='showhelp')return;drag=true;
    const r=p.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;
    p.style.right='auto';p.style.bottom='auto';h.style.cursor='grabbing';h.setPointerCapture(e.pointerId);});
  h.addEventListener('pointermove',e=>{if(!drag)return;
    p.style.left=Math.max(4,Math.min(window.innerWidth-p.offsetWidth-4,e.clientX-dx))+'px';
    p.style.top=Math.max(4,Math.min(window.innerHeight-60,e.clientY-dy))+'px';});
  h.addEventListener('pointerup',e=>{drag=false;h.style.cursor='grab';});
})();

// draggable timeline divider — resize the strip by dragging its top edge
(function(){const grip=document.getElementById('stripgrip'); let rz=false;
  grip.addEventListener('pointerdown',e=>{rz=true;grip.setPointerCapture(e.pointerId);e.preventDefault();});
  grip.addEventListener('pointermove',e=>{ if(!rz)return;
    const frac=(L.stripB - e.clientY + (L.mob?14:16))/window.innerHeight;   // band top follows the grip
    S.stripFrac=Math.max(0.05,Math.min(0.44,frac)); layout(); invalidate(); });
  grip.addEventListener('pointerup',e=>{rz=false;});
})();

// fade hint after a while
setTimeout(()=>{const h=document.getElementById('hint');if(h)h.style.opacity=0;},9000);
syncPlay();
</script>
</body>
