<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Model Lab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial Black', 'Arial', sans-serif;
            background: #000;
            color: #00FF41;
            overflow: hidden;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        .panel {
            position: fixed;
            z-index: 100;
            background: rgba(8,8,8,0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 6px;
            width: 340px;
            max-height: 80vh;
            overflow-y: auto;
            user-select: none;
        }
        .panel::-webkit-scrollbar { width: 4px; }
        .panel::-webkit-scrollbar-thumb { background: #F7931A; border-radius: 2px; }
        .drag-handle {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; cursor: grab; background: rgba(247,147,26,0.12);
            border-radius: 6px 6px 0 0;
        }
        .drag-handle:active { cursor: grabbing; }
        .drag-handle span { font-size: 0.75rem; color: #F7931A; font-weight: bold; }
        .drag-dots { display: flex; gap: 3px; }
        .drag-dots i { width: 4px; height: 4px; background: #F7931A; border-radius: 50%; opacity: 0.6; }
        .panel-toggle { background: none; border: none; color: #F7931A; font-size: 1.1rem; cursor: pointer; padding: 0 4px; font-family: inherit; width: auto; }
        .panel-body { padding: 10px 12px; }
        .controls-wrapper { display: grid; grid-template-columns: 1fr; gap: 0.8rem; }
        .control-group { padding: 0.6rem 0; }
        .control-group + .control-group { border-top: 1px solid rgba(247,147,26,0.15); }
        .control-group h3 { color: #F7931A; margin-bottom: 0.5rem; font-size: 0.7rem; }
        .control-item { margin-bottom: 0.7rem; }
        .control-item:last-child { margin-bottom: 0; }
        .control-item label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.68rem; cursor: pointer; margin-bottom: 0.3rem; color: #FFFFFF; }
        .control-item input[type="checkbox"] { width: 14px; height: 14px; accent-color: #F7931A; cursor: pointer; }
        .slider-label { display: flex; justify-content: space-between; font-size: 0.65rem; color: #FFFFFF; margin-bottom: 0.2rem; }
        input[type="range"] {
            width: 100%; height: 4px; background: #222;
            border-radius: 2px; outline: none; -webkit-appearance: none; cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 12px; height: 12px; background: #F7931A;
            border-radius: 50%; cursor: pointer; box-shadow: 0 0 6px #F7931A;
        }
        input[type="range"]::-moz-range-thumb {
            width: 12px; height: 12px; background: #F7931A;
            border-radius: 50%; cursor: pointer; box-shadow: 0 0 6px #F7931A;
        }
        button {
            padding: 0.5rem 1rem; background: rgba(247,147,26,0.15); border: 1px solid #F7931A;
            color: #F7931A; font-family: inherit; font-size: 0.7rem; cursor: pointer;
            transition: all 0.2s; width: 100%; margin-top: 0.3rem; border-radius: 3px;
        }
        button:hover { background: rgba(247,147,26,0.3); }
        .btn-split { display: flex; gap: 0; margin-top: 0.5rem; }
        .btn-split button { border-radius: 0; margin: 0; }
        .btn-split button:first-child { border-radius: 3px 0 0 3px; border-right: none; }
        .btn-split button:last-child { border-radius: 0 3px 3px 0; }
        .import-area {
            margin-top: 0.4rem; display: none;
        }
        .import-area.active { display: block; }
        .import-area textarea {
            width: 100%; height: 120px; background: rgba(0,0,0,0.6); border: 1px solid #F7931A;
            color: #FFFFFF; font-family: 'Consolas', 'Courier New', monospace; font-size: 0.65rem;
            padding: 6px 8px; border-radius: 3px; resize: vertical; outline: none;
        }
        .import-area textarea:focus { border-color: #F7931A; box-shadow: 0 0 6px rgba(247,147,26,0.3); }
        .import-area button { margin-top: 0.3rem; }
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(247,147,26,0.9); color: #000; font-family: inherit;
            font-size: 0.75rem; font-weight: bold; padding: 8px 20px; border-radius: 4px;
            z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }
        .stats {
            padding: 0.6rem 0; border-top: 1px solid rgba(247,147,26,0.15);
            display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem 0.8rem;
        }
        .stat-item { display: flex; flex-direction: column; gap: 0.1rem; }
        .stat-label { font-size: 0.58rem; color: #888; }
        .stat-value { font-size: 0.75rem; color: #FFFFFF; font-weight: bold; }
        .panel.collapsed .panel-body { display: none; }
        .panel.collapsed .drag-handle { border-radius: 6px; }
        .accordion-header {
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; padding: 0; margin-bottom: 0.5rem;
        }
        .accordion-header h3 { margin-bottom: 0; pointer-events: none; }
        .accordion-arrow { color: #F7931A; font-size: 0.65rem; transition: transform 0.2s; }
        .control-group.collapsed .accordion-body { display: none; }
        .control-group.collapsed .accordion-arrow { transform: rotate(-90deg); }
        .tooltip {
            position: fixed; z-index: 200; pointer-events: none;
            background: rgba(8,8,8,0.92); backdrop-filter: blur(8px);
            padding: 8px 12px; border-radius: 4px;
            border-left: 3px solid #F7931A;
            font-size: 0.7rem; color: #FFFFFF; white-space: nowrap;
            display: none;
        }
        .tooltip .tt-date { color: #F7931A; font-weight: bold; margin-bottom: 4px; font-size: 0.75rem; }
        .tooltip .tt-row { display: flex; justify-content: space-between; gap: 16px; line-height: 1.6; }
        .tooltip .tt-label { color: #888; }
        .tooltip .tt-val { font-weight: bold; }
        .crosshair-v, .crosshair-h {
            position: fixed; z-index: 50; pointer-events: none; display: none;
        }
        .crosshair-v { width: 1px; background: rgba(255,255,255,0.25); }
        .crosshair-h { height: 1px; background: rgba(255,255,255,0.25); }
        @media (max-width: 600px) {
            .panel { width: calc(100vw - 20px); left: 10px !important; right: auto !important; max-height: 70vh; }
            .drag-handle span { font-size: 0.65rem; }
        }
        .share-btn-container {
            position: fixed; right: 0; top: 50%; transform: translateY(-50%);
            z-index: 150; display: flex; align-items: center;
        }
        .share-btn {
            width: 12px; height: 60px; background: #F7931A; border: none;
            cursor: pointer; border-radius: 6px 0 0 6px;
            transition: width 0.3s;
        }
        .share-btn:hover { width: 50px; }
        .share-options {
            display: none; flex-direction: column; gap: 0;
            background: rgba(8,8,8,0.95); opacity: 0; transition: opacity 0.3s;
        }
        .share-btn-container:hover .share-options { display: flex; opacity: 1; }
        .share-option {
            padding: 12px 16px; color: #FFFFFF; font-size: 0.75rem;
            border: none; background: none; cursor: pointer; text-align: left;
            white-space: nowrap; border-bottom: 1px solid rgba(247,147,26,0.2);
            transition: background 0.2s;
        }
        .share-option:last-child { border-bottom: none; }
        .share-option:hover { background: rgba(247,147,26,0.2); }
        .youtube-btn {
            position: fixed; bottom: 20px; right: 20px; z-index: 140;
            background: none; border: none; cursor: pointer; padding: 0;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .youtube-branding {
            display: flex; flex-direction: column; align-items: center;
            gap: 0; line-height: 1; font-family: 'Arial Black', Arial, sans-serif;
            font-weight: 900; font-size: 0.75rem; letter-spacing: -1px;
        }
        .branding-great { color: #FFFFFF; }
        .branding-wall { color: #F7931A; }
        .branding-y { color: #FFFFFF; }
        .youtube-btn:hover .youtube-branding { opacity: 0.8; }
        .youtube-icon { width: 32px; height: 32px; background: #FF0000; border-radius: 3px;
            display: flex; align-items: center; justify-content: center; font-size: 0.7rem;
            color: #FFFFFF; font-weight: bold; }
    </style>
</head>
<body>
<canvas id="chart"></canvas>
<div class="tooltip" id="tooltip"></div>
<div class="crosshair-v" id="crossV"></div>
<div class="crosshair-h" id="crossH"></div>
<div class="toast" id="toast"></div>
<div class="share-btn-container">
    <button class="share-btn" title="Share"></button>
    <div class="share-options">
        <button class="share-option" id="shareLink">🔗 Copy Link</button>
        <button class="share-option" id="shareWhatsApp">💬 WhatsApp</button>
        <button class="share-option" id="shareX">𝕏 Post on X</button>
        <button class="share-option" id="watchVideo">▶ Watch Video</button>
    </div>
</div>
<div class="panel" id="panel" style="top:20px;right:20px;">
    <div class="drag-handle" id="dragHandle">
        <span>SETTINGS</span>
        <div style="display:flex;align-items:center;gap:8px;">
            <div class="drag-dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <button class="panel-toggle" id="panelToggle">_</button>
        </div>
    </div>
    <div class="panel-body">
        <div class="controls-wrapper">
            <div class="control-group" id="accPL">
                <div class="accordion-header" onclick="this.parentElement.classList.toggle('collapsed')">
                    <h3>POWER LAW (log-trend)</h3><span class="accordion-arrow">&#9660;</span>
                </div>
                <div class="accordion-body">
                    <div class="control-item">
                        <div class="slider-label"><span>Intercept (log10 a)</span><span id="valIntercept">-5.30</span></div>
                        <input type="range" id="sliderIntercept" min="-8" max="-2" step="0.01" value="-5.3">
                    </div>
                    <div class="control-item">
                        <div class="slider-label"><span>Slope (b)</span><span id="valSlope">3.44</span></div>
                        <input type="range" id="sliderSlope" min="1" max="6" step="0.01" value="3.44">
                    </div>
                    <div class="control-item"><label><input type="checkbox" id="checkPL" checked> Power Law enabled</label></div>
                </div>
            </div>
            <div class="control-group" id="accSin">
                <div class="accordion-header" onclick="this.parentElement.classList.toggle('collapsed')">
                    <h3>4-YEAR CYCLE (sine)</h3><span class="accordion-arrow">&#9660;</span>
                </div>
                <div class="accordion-body">
                    <div class="control-item">
                        <div class="slider-label"><span>Amplitude (log-scale)</span><span id="valAmp">0.40</span></div>
                        <input type="range" id="sliderAmp" min="0" max="1.5" step="0.01" value="0.40">
                    </div>
                    <div class="control-item">
                        <div class="slider-label"><span>Period (weeks)</span><span id="valPeriod">208</span></div>
                        <input type="range" id="sliderPeriod" min="100" max="300" step="1" value="208">
                    </div>
                    <div class="control-item">
                        <div class="slider-label"><span>Phase</span><span id="valPhase">1.50</span></div>
                        <input type="range" id="sliderPhase" min="0" max="6.28" step="0.01" value="1.50">
                    </div>
                    <div class="control-item"><label><input type="checkbox" id="checkSin" checked> Sine enabled</label></div>
                </div>
            </div>
            <div class="control-group" id="accVol">
                <div class="accordion-header" onclick="this.parentElement.classList.toggle('collapsed')">
                    <h3>VOLATILITY</h3><span class="accordion-arrow">&#9660;</span>
                </div>
                <div class="accordion-body">
                    <div class="control-item">
                        <div class="slider-label"><span>Sigma (bandwidth)</span><span id="valSigma">0.30</span></div>
                        <input type="range" id="sliderSigma" min="0" max="1.0" step="0.01" value="0.30">
                    </div>
                    <div class="control-item"><label><input type="checkbox" id="checkVol" checked> Volatility enabled</label></div>
                </div>
            </div>
            <div class="control-group" id="accForecast">
                <div class="accordion-header" onclick="this.parentElement.classList.toggle('collapsed')">
                    <h3>FORECAST</h3><span class="accordion-arrow">&#9660;</span>
                </div>
                <div class="accordion-body">
                    <div class="control-item">
                        <div class="slider-label"><span>Years ahead</span><span id="valForecast">8</span></div>
                        <input type="range" id="sliderForecast" min="1" max="16" step="1" value="8">
                    </div>
                    <div class="control-item">
                        <div class="slider-label"><span>Cone width</span><span id="valCone">0.80</span></div>
                        <input type="range" id="sliderCone" min="0.1" max="2" step="0.01" value="0.80">
                    </div>
                    <button id="btnReset">RESET</button>
                    <div class="btn-split">
                        <button id="btnExport">Export Settings</button>
                        <button id="btnImportToggle">Import Settings</button>
                    </div>
                    <div class="import-area" id="importArea">
                        <textarea id="importText" placeholder="Paste settings text here..."></textarea>
                        <button id="btnImportApply">APPLY</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="stats">
            <div class="stat-item"><div class="stat-label">Current week</div><div class="stat-value" id="sWeek">-</div></div>
            <div class="stat-item"><div class="stat-label">Current price</div><div class="stat-value" id="sPrice">-</div></div>
            <div class="stat-item"><div class="stat-label">Model now</div><div class="stat-value" id="sModel">-</div></div>
            <div class="stat-item"><div class="stat-label">R² (log)</div><div class="stat-value" id="sR2">-</div></div>
            <div class="stat-item"><div class="stat-label">Forecast end</div><div class="stat-value" id="sForecast">-</div></div>
        </div>
    </div>
</div>

const START_DATE = new Date('2010-07-19');
const N = BTC.length;

function gaussianRandom() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

function modelPrice(week, params) {
    const {intercept, slope, usePL, amp, period, phase, useSin, sigma, useVol} = params;
    let logPrice = usePL ? (intercept + slope * Math.log10(week)) : Math.log10(week);
    if (useSin) logPrice += amp * Math.sin(2 * Math.PI * week / period + phase);
    if (useVol && sigma > 0) logPrice += sigma * gaussianRandom();
    return Math.pow(10, logPrice);
}

function weekToDate(week) {
    const d = new Date(START_DATE);
    d.setDate(d.getDate() + (week - 1) * 7);
    return d;
}

const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;

function resize() {
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.scale(dpr, dpr);
}
resize();
window.addEventListener('resize', () => { resize(); draw(); });

function getParams() {
    return {
        intercept: parseFloat(document.getElementById('sliderIntercept').value),
        slope: parseFloat(document.getElementById('sliderSlope').value),
        usePL: document.getElementById('checkPL').checked,
        amp: parseFloat(document.getElementById('sliderAmp').value),
        period: parseFloat(document.getElementById('sliderPeriod').value),
        phase: parseFloat(document.getElementById('sliderPhase').value),
        useSin: document.getElementById('checkSin').checked,
        sigma: parseFloat(document.getElementById('sliderSigma').value),
        useVol: document.getElementById('checkVol').checked,
    };
}

function draw() {
    const W = canvas.width / dpr;
    const H = canvas.height / dpr;
    const isMobile = W < 500;
    const pad = {l: isMobile ? 60 : 90, r: 20, t: 20, b: isMobile ? 40 : 50};
    const gW = W - pad.l - pad.r;
    const gH = H - pad.t - pad.b;

    // Animation progress
    let animationProgress = 1; // 0-1, where 1 = full animation done
    if (animationActive) {
        const elapsed = Date.now() - animationStartTime;
        if (elapsed >= 30000) {
            animationActive = false;
        } else {
            animationProgress = elapsed / 30000;
        }
    }

    // Cinematic helpers
    function subProg(start, end) {
        if (animationProgress >= 1) return 1;
        if (animationProgress <= start) return 0;
        if (animationProgress >= end) return 1;
        return (animationProgress - start) / (end - start);
    }
    function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
    function easeInOut(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3) / 2; }
    function bellFade(t) {
        if (t <= 0 || t >= 1) return 0;
        if (t < 0.15) return t / 0.15;
        if (t > 0.75) return (1 - t) / 0.25;
        return 1;
    }

    // Timeline (0-1 mapped to 0-30s):
    // 0.000-0.033 (0-1s):   Axes fade in
    // 0.033-0.167 (1-5s):   Price line draws L→R with glow tip
    // 0.167-0.333 (5-10s):  Model line draws L→R with glow tip
    // 0.333-0.500 (10-15s): Volatility band fades in
    // 0.500-0.633 (15-19s): Gradient segments fade in
    // 0.633-0.833 (19-25s): Future forecast draws + TODAY fades
    // 0.833-1.000 (25-30s): Watermark fades in

    const axesFade     = easeOut(subProg(0, 0.033));
    const priceDraw    = easeInOut(subProg(0.033, 0.167));
    const modelDraw    = easeInOut(subProg(0.167, 0.333));
    const bandFade     = easeOut(subProg(0.333, 0.500));
    const gradientFade = easeOut(subProg(0.500, 0.633));
    const forecastDraw = easeInOut(subProg(0.633, 0.833));
    const todayFade    = easeOut(subProg(0.600, 0.700));
    const wmFade       = easeOut(subProg(0.833, 1.000));

    const params = getParams();
    const forecastWeeks = parseInt(document.getElementById('sliderForecast').value) * 52;
    const totalWeeks = N + forecastWeeks;

    // Compute model for history
    const modelHist = [];
    for (let i = 0; i < N; i++) modelHist.push(modelPrice(i + 1, {...params, useVol: false}));

    // Compute model for future
    const modelFut = [];
    for (let i = 0; i < forecastWeeks; i++) modelFut.push(modelPrice(N + i + 1, {...params, useVol: false}));

    // Y range (log scale) - start at $0.1
    const allPrices = [...BTC.map(d => d.p), ...modelHist, ...modelFut].filter(p => p > 0);
    const minLog = -1; // $0.1
    const maxLog = Math.ceil(Math.log10(Math.max(...allPrices))) + 0.3;

    function toX(week) { return pad.l + ((week - 1) / (totalWeeks - 1)) * gW; }
    function toY(price) {
        if (price <= 0) return H - pad.b;
        const log = Math.log10(price);
        return pad.t + (1 - (log - minLog) / (maxLog - minLog)) * gH;
    }

    // Clear
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, W, H);

    // Y-axis ticks (fade in during animation)
    const tickFont = W < 500 ? '12px Arial Black' : '15px Arial Black';
    ctx.font = tickFont;
    ctx.textAlign = 'right';
    ctx.globalAlpha = axesFade;
    for (let exp = Math.ceil(minLog); exp <= Math.floor(maxLog); exp++) {
        const price = Math.pow(10, exp);
        const y = toY(price);
        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
        ctx.fillStyle = '#FFFFFF';
        const label = price >= 1e9 ? '$' + (price/1e9) + 'B' : price >= 1e6 ? '$' + (price/1e6) + 'M' : price >= 1000 ? '$' + (price/1000) + 'k' : '$' + price;
        ctx.fillText(label, pad.l - 8, y + 5);
    }

    // X-axis year ticks (fade in)
    ctx.textAlign = 'center';
    ctx.fillStyle = '#FFFFFF';
    ctx.font = tickFont;
    const yearStep = isMobile ? 4 : 2;
    for (let year = 2010; year <= 2040; year += yearStep) {
        const weekForYear = Math.round((new Date(year, 0, 1) - START_DATE) / (7 * 86400000)) + 1;
        if (weekForYear < 1 || weekForYear > totalWeeks) continue;
        const x = toX(weekForYear);
        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, H - pad.b); ctx.stroke();
        ctx.fillText(year.toString(), x, H - pad.b + 20);
    }
    ctx.globalAlpha = 1;

    // Volatility band (cinematic fade-in from model line outward)
    if (bandFade > 0) {
        if (params.useVol && params.sigma > 0) {
        const bandSigma = params.sigma * bandFade; // band expands outward
        ctx.globalAlpha = 0.15 * bandFade;
        ctx.fillStyle = '#00FF41';
        ctx.beginPath();
        for (let i = 0; i < N; i++) {
            ctx.lineTo(toX(i + 1), toY(modelHist[i] * Math.pow(10, bandSigma)));
        }
        for (let i = 0; i < forecastWeeks; i++) {
            ctx.lineTo(toX(N + i + 1), toY(modelFut[i] * Math.pow(10, bandSigma)));
        }
        for (let i = forecastWeeks - 1; i >= 0; i--) {
            ctx.lineTo(toX(N + i + 1), toY(modelFut[i] / Math.pow(10, bandSigma)));
        }
        for (let i = N - 1; i >= 0; i--) {
            ctx.lineTo(toX(i + 1), toY(modelHist[i] / Math.pow(10, bandSigma)));
        }
            ctx.closePath(); ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    // Gradient segments (cinematic fade-in)
    if (gradientFade > 0) {
        ctx.globalAlpha = 0.4 * gradientFade;
        ctx.lineWidth = 1;
        const step = Math.max(1, Math.floor(N / 500));
        for (let i = 0; i < N; i += step) {
            const x = toX(i + 1);
            const yPrice = toY(BTC[i].p);
            const yModel = toY(modelHist[i]);
            if (Math.abs(yPrice - yModel) > 2) {
                const grad = ctx.createLinearGradient(x, yPrice, x, yModel);
                grad.addColorStop(0, '#FFFFFF');
                grad.addColorStop(1, '#F7931A');
                ctx.strokeStyle = grad;
                ctx.beginPath(); ctx.moveTo(x, yPrice); ctx.lineTo(x, yModel); ctx.stroke();
            }
        }
        ctx.globalAlpha = 1;
    }

    // Historical price line (cinematic: draws L→R with glowing cursor)
    const priceCount = priceDraw < 1 ? Math.max(1, Math.floor(priceDraw * N)) : N;
    ctx.save();
    ctx.shadowColor = 'rgba(255,255,255,0.6)';
    ctx.shadowBlur = 6;
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < priceCount; i++) {
        const x = toX(i + 1);
        const y = toY(BTC[i].p);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();

    // Glowing cursor dot at tip of price line (during drawing)
    if (priceDraw > 0 && priceDraw < 1) {
        const tipIdx = priceCount - 1;
        const tipX = toX(tipIdx + 1);
        const tipY = toY(BTC[tipIdx].p);
        ctx.save();
        // Outer glow
        const glowR = 18 + 8 * Math.sin(Date.now() / 120);
        const glowGrad = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, glowR);
        glowGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
        glowGrad.addColorStop(0.3, 'rgba(255,255,255,0.4)');
        glowGrad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = glowGrad;
        ctx.beginPath(); ctx.arc(tipX, tipY, glowR, 0, Math.PI * 2); ctx.fill();
        // Inner bright dot
        ctx.fillStyle = '#FFFFFF';
        ctx.shadowColor = '#FFFFFF';
        ctx.shadowBlur = 20;
        ctx.beginPath(); ctx.arc(tipX, tipY, 3, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    // Model line - history (cinematic: draws L→R with glowing orange cursor)
    if (modelDraw > 0) {
        const modelCount = modelDraw < 1 ? Math.max(1, Math.floor(modelDraw * N)) : N;
        ctx.save();
        ctx.shadowColor = 'rgba(247,147,26,0.7)';
        ctx.shadowBlur = 8;
        ctx.strokeStyle = '#F7931A';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < modelCount; i++) {
            const x = toX(i + 1);
            const y = toY(modelHist[i]);
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.restore();

        // Glowing cursor dot at tip of model line (during drawing)
        if (modelDraw > 0 && modelDraw < 1) {
            const mTipIdx = modelCount - 1;
            const mTipX = toX(mTipIdx + 1);
            const mTipY = toY(modelHist[mTipIdx]);
            ctx.save();
            const mGlowR = 20 + 10 * Math.sin(Date.now() / 100);
            const mGlowGrad = ctx.createRadialGradient(mTipX, mTipY, 0, mTipX, mTipY, mGlowR);
            mGlowGrad.addColorStop(0, 'rgba(247,147,26,1)');
            mGlowGrad.addColorStop(0.3, 'rgba(247,147,26,0.5)');
            mGlowGrad.addColorStop(1, 'rgba(247,147,26,0)');
            ctx.fillStyle = mGlowGrad;
            ctx.beginPath(); ctx.arc(mTipX, mTipY, mGlowR, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#F7931A';
            ctx.shadowColor = '#F7931A';
            ctx.shadowBlur = 25;
            ctx.beginPath(); ctx.arc(mTipX, mTipY, 4, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        // Model line - future (dashed orange, cinematic draw)
        if (forecastDraw > 0) {
            const futCount = forecastDraw < 1 ? Math.max(1, Math.floor(forecastDraw * forecastWeeks)) : forecastWeeks;
            ctx.save();
            ctx.shadowColor = 'rgba(247,147,26,0.5)';
            ctx.shadowBlur = 6;
            ctx.strokeStyle = '#F7931A';
            ctx.lineWidth = 2;
            ctx.globalAlpha = forecastDraw;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(toX(N), toY(modelHist[N - 1]));
            for (let i = 0; i < futCount; i++) {
                ctx.lineTo(toX(N + i + 1), toY(modelFut[i]));
            }
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();

            // Glowing cursor for forecast line
            if (forecastDraw > 0 && forecastDraw < 1) {
                const fTipIdx = futCount - 1;
                const fTipX = toX(N + fTipIdx + 1);
                const fTipY = toY(modelFut[fTipIdx]);
                ctx.save();
                const fGlowR = 14 + 6 * Math.sin(Date.now() / 110);
                const fGlowGrad = ctx.createRadialGradient(fTipX, fTipY, 0, fTipX, fTipY, fGlowR);
                fGlowGrad.addColorStop(0, 'rgba(247,147,26,0.8)');
                fGlowGrad.addColorStop(1, 'rgba(247,147,26,0)');
                ctx.fillStyle = fGlowGrad;
                ctx.beginPath(); ctx.arc(fTipX, fTipY, fGlowR, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
        }
    }

    // Current week marker (cinematic fade-in)
    ctx.globalAlpha = todayFade;
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    const nowX = toX(N);
    ctx.beginPath(); ctx.moveTo(nowX, pad.t); ctx.lineTo(nowX, H - pad.b); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#888';
    ctx.font = '9px Arial Black';
    ctx.textAlign = 'center';
    ctx.fillText('TODAY', nowX, pad.t - 5);
    ctx.globalAlpha = 1;

    // Watermark "GREAT" / "WALLY" - branded (cinematic fade-in)
    ctx.globalAlpha = 0.3 * wmFade;
    ctx.font = 'bold 24px Arial Black';
    const wmX = W - pad.r - 12;
    const wmY = H - pad.b - 12;

    // Draw "GREAT" on first line (white), right-aligned
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'right';
    ctx.fillText('GREAT', wmX, wmY - 28);

    // Draw "WALLY" on second line: WALL in orange, Y in white
    const wallWidth = ctx.measureText('WALL').width;
    const yWidth = ctx.measureText('Y').width;
    const totalWidth = wallWidth + yWidth;
    const wallyStartX = wmX - totalWidth;

    ctx.fillStyle = '#F7931A';
    ctx.textAlign = 'left';
    ctx.fillText('WALL', wallyStartX, wmY);

    ctx.fillStyle = '#FFFFFF';
    ctx.fillText('Y', wallyStartX + wallWidth, wmY);

    ctx.globalAlpha = 1;

    // ──── Cinematic phase labels (big text, fade in → hold → fade out) ────
    if (animationActive || animationProgress < 1) {
        const labelSize = isMobile ? 36 : 72;
        const labelX = pad.l + gW * 0.45;
        const labelY = pad.t + gH * 0.78;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // "Price" — white, during price drawing (1-5s)
        const priceLabel = bellFade(subProg(0.033, 0.167));
        if (priceLabel > 0) {
            ctx.save();
            ctx.globalAlpha = priceLabel * 0.85;
            ctx.font = `bold ${labelSize}px Arial Black`;
            ctx.shadowColor = 'rgba(255,255,255,0.8)';
            ctx.shadowBlur = 30 * priceLabel;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText('Price', labelX, labelY);
            ctx.restore();
        }

        // "Model" — orange, during model drawing (5-10s)
        const modelLabel = bellFade(subProg(0.167, 0.333));
        if (modelLabel > 0) {
            ctx.save();
            ctx.globalAlpha = modelLabel * 0.85;
            ctx.font = `bold ${labelSize}px Arial Black`;
            ctx.shadowColor = 'rgba(247,147,26,0.8)';
            ctx.shadowBlur = 30 * modelLabel;
            ctx.fillStyle = '#F7931A';
            ctx.fillText('Model', labelX, labelY);
            ctx.restore();
        }

        // "Volatility" — green, during band expansion (10-15s)
        const volLabel = bellFade(subProg(0.333, 0.500));
        if (volLabel > 0) {
            ctx.save();
            ctx.globalAlpha = volLabel * 0.85;
            ctx.font = `bold ${labelSize}px Arial Black`;
            ctx.shadowColor = 'rgba(0,255,65,0.8)';
            ctx.shadowBlur = 30 * volLabel;
            ctx.fillStyle = '#00FF41';
            ctx.fillText('Volatility', labelX, labelY);
            ctx.restore();
        }

        // "Deviation" — gradient orange→white, during gradient segments (15-19s)
        const devLabel = bellFade(subProg(0.500, 0.633));
        if (devLabel > 0) {
            ctx.save();
            ctx.globalAlpha = devLabel * 0.85;
            ctx.font = `bold ${labelSize}px Arial Black`;
            ctx.shadowColor = 'rgba(247,147,26,0.6)';
            ctx.shadowBlur = 25 * devLabel;
            const devGrad = ctx.createLinearGradient(labelX - 160, labelY, labelX + 160, labelY);
            devGrad.addColorStop(0, '#F7931A');
            devGrad.addColorStop(1, '#FFFFFF');
            ctx.fillStyle = devGrad;
            ctx.fillText('Deviation', labelX, labelY);
            ctx.restore();
        }

        // "Forecast" — orange, during forecast drawing (19-25s)
        const fcLabel = bellFade(subProg(0.633, 0.833));
        if (fcLabel > 0) {
            ctx.save();
            ctx.globalAlpha = fcLabel * 0.85;
            ctx.font = `bold ${labelSize}px Arial Black`;
            ctx.shadowColor = 'rgba(247,147,26,0.8)';
            ctx.shadowBlur = 30 * fcLabel;
            ctx.fillStyle = '#F7931A';
            ctx.fillText('Forecast', labelX, labelY);
            ctx.restore();
        }

        ctx.textBaseline = 'alphabetic';
    }

    // Stats
    const lastPrice = BTC[N - 1].p;
    const lastModel = modelHist[N - 1];
    const forecastEnd = modelFut[forecastWeeks - 1] || 0;

    // R2 in log space
    const logActual = BTC.map(d => Math.log10(d.p)).filter(v => isFinite(v));
    const logPred = modelHist.map(v => Math.log10(v)).filter(v => isFinite(v));
    const len = Math.min(logActual.length, logPred.length);
    const meanLog = logActual.slice(0, len).reduce((a, b) => a + b, 0) / len;
    let ssTotal = 0, ssRes = 0;
    for (let i = 0; i < len; i++) {
        ssTotal += (logActual[i] - meanLog) ** 2;
        ssRes += (logActual[i] - logPred[i]) ** 2;
    }
    const r2 = 1 - ssRes / ssTotal;

    document.getElementById('sWeek').textContent = N;
    document.getElementById('sPrice').textContent = '$' + lastPrice.toLocaleString('en', {maximumFractionDigits: 0});
    document.getElementById('sModel').textContent = '$' + lastModel.toLocaleString('en', {maximumFractionDigits: 0});
    document.getElementById('sR2').textContent = r2.toFixed(4);
    document.getElementById('sForecast').textContent = '$' + forecastEnd.toLocaleString('en', {maximumFractionDigits: 0});

    // Update value displays
    document.getElementById('valIntercept').textContent = params.intercept.toFixed(2);
    document.getElementById('valSlope').textContent = params.slope.toFixed(2);
    document.getElementById('valAmp').textContent = params.amp.toFixed(2);
    document.getElementById('valPeriod').textContent = params.period.toFixed(0);
    document.getElementById('valPhase').textContent = params.phase.toFixed(2);
    document.getElementById('valSigma').textContent = params.sigma.toFixed(2);
    document.getElementById('valForecast').textContent = document.getElementById('sliderForecast').value;
    document.getElementById('valCone').textContent = parseFloat(document.getElementById('sliderCone').value).toFixed(2);

    // Store layout for hover
    chartState = { pad, W, H, totalWeeks, modelHist, modelFut, params, toX, toY, minLog, maxLog, gW, gH, forecastWeeks };
}

let chartState = null;

// Animation state for S+T trigger
let sPressed = false;
let lastSTime = 0;
let animationActive = false;
let animationStartTime = 0;

document.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 's') {
        const now = Date.now();
        if (now - lastSTime < 500) {
            // S was already pressed recently, ignore
            return;
        }
        sPressed = true;
        lastSTime = now;
    }
    if (e.key.toLowerCase() === 't') {
        if (sPressed && Date.now() - lastSTime < 500) {
            sPressed = false;
            startAnimation();
        }
    }
});

function formatPrice(p) {
    if (p >= 1e6) return '$' + (p/1e6).toFixed(2) + 'M';
    if (p >= 1e3) return '$' + p.toLocaleString('en', {maximumFractionDigits: 0});
    if (p >= 1) return '$' + p.toFixed(2);
    return '$' + p.toFixed(4);
}

const tooltip = document.getElementById('tooltip');
const crossV = document.getElementById('crossV');
const crossH = document.getElementById('crossH');

canvas.addEventListener('mousemove', (e) => {
    if (!chartState) return;
    const { pad, W, H, totalWeeks, modelHist, modelFut, params, toX, toY, forecastWeeks } = chartState;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    if (mx < pad.l || mx > W - pad.r || my < pad.t || my > H - pad.b) {
        tooltip.style.display = 'none';
        crossV.style.display = 'none';
        crossH.style.display = 'none';
        return;
    }

    const week = Math.round(1 + (mx - pad.l) / (W - pad.l - pad.r) * (totalWeeks - 1));
    const clampedWeek = Math.max(1, Math.min(totalWeeks, week));
    const isHistorical = clampedWeek <= N;
    const idx = clampedWeek - 1;

    const date = new Date(START_DATE);
    date.setDate(date.getDate() + idx * 7);
    const dateStr = date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

    let modelVal;
    if (isHistorical) {
        modelVal = modelHist[idx];
    } else {
        modelVal = modelFut[idx - N];
    }

    let html = '<div class="tt-date">Week ' + clampedWeek + ' — ' + dateStr + '</div>';
    if (isHistorical) {
        const price = BTC[idx].p;
        const deviation = ((price / modelVal - 1) * 100);
        html += '<div class="tt-row"><span class="tt-label">Price</span><span class="tt-val" style="color:#fff">' + formatPrice(price) + '</span></div>';
        html += '<div class="tt-row"><span class="tt-label">Model</span><span class="tt-val" style="color:#F7931A">' + formatPrice(modelVal) + '</span></div>';
        html += '<div class="tt-row"><span class="tt-label">Deviation</span><span class="tt-val" style="color:' + (deviation >= 0 ? '#00FF41' : '#ff4444') + '">' + (deviation >= 0 ? '+' : '') + deviation.toFixed(1) + '%</span></div>';
        if (params.useVol && params.sigma > 0) {
            html += '<div class="tt-row"><span class="tt-label">Band ±</span><span class="tt-val">' + formatPrice(modelVal * Math.pow(10, params.sigma)) + ' / ' + formatPrice(modelVal / Math.pow(10, params.sigma)) + '</span></div>';
        }
    } else {
        html += '<div class="tt-row"><span class="tt-label">Forecast</span><span class="tt-val" style="color:#F7931A">' + formatPrice(modelVal) + '</span></div>';
        if (params.useVol && params.sigma > 0) {
            html += '<div class="tt-row"><span class="tt-label">Band +</span><span class="tt-val">' + formatPrice(modelVal * Math.pow(10, params.sigma)) + '</span></div>';
            html += '<div class="tt-row"><span class="tt-label">Band -</span><span class="tt-val">' + formatPrice(modelVal / Math.pow(10, params.sigma)) + '</span></div>';
        }
    }

    tooltip.innerHTML = html;
    tooltip.style.display = 'block';

    const tx = e.clientX + 16;
    const ty = e.clientY - 16;
    const tr = tooltip.getBoundingClientRect();
    tooltip.style.left = (tx + tr.width > window.innerWidth ? e.clientX - tr.width - 16 : tx) + 'px';
    tooltip.style.top = (ty + tr.height > window.innerHeight ? window.innerHeight - tr.height - 8 : Math.max(8, ty)) + 'px';

    crossV.style.display = 'block';
    crossV.style.left = e.clientX + 'px';
    crossV.style.top = (rect.top + pad.t) + 'px';
    crossV.style.height = (H - pad.t - pad.b) + 'px';

    crossH.style.display = 'block';
    crossH.style.left = (rect.left + pad.l) + 'px';
    crossH.style.top = e.clientY + 'px';
    crossH.style.width = (W - pad.l - pad.r) + 'px';
});

canvas.addEventListener('mouseleave', () => {
    tooltip.style.display = 'none';
    crossV.style.display = 'none';
    crossH.style.display = 'none';
});

document.getElementById('btnImportApply').addEventListener('click', () => {
    const text = document.getElementById('importText').value;
    const get = (label) => {
        const re = new RegExp(label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*[:=]\\s*(.+)', 'i');
        const m = text.match(re);
        return m ? m[1].trim() : null;
    };
    const setSlider = (id, val) => { if (val !== null) document.getElementById(id).value = val; };
    const setCheck = (id, val) => { if (val !== null) document.getElementById(id).checked = val.toLowerCase() === 'yes'; };

    setSlider('sliderIntercept', get('Intercept (log10 a)'));
    setSlider('sliderSlope', get('Slope (b)'));
    setCheck('checkPL', get('Enabled'));

    const ampVal = get('Amplitude');
    if (ampVal) document.getElementById('sliderAmp').value = ampVal;
    setSlider('sliderPeriod', get('Period (weeks)'));
    setSlider('sliderPhase', get('Phase'));

    const lines = text.split('\n');
    let section = '';
    for (const line of lines) {
        if (line.includes('Power Law')) section = 'pl';
        else if (line.includes('4-Year') || line.includes('Cycle')) section = 'sin';
        else if (line.includes('Volatility')) section = 'vol';
        else if (line.includes('Forecast')) section = 'fc';
        else if (line.match(/Enabled\s*[:=]\s*(yes|no)/i)) {
            const val = line.match(/Enabled\s*[:=]\s*(yes|no)/i)[1].toLowerCase() === 'yes';
            if (section === 'pl') document.getElementById('checkPL').checked = val;
            else if (section === 'sin') document.getElementById('checkSin').checked = val;
            else if (section === 'vol') document.getElementById('checkVol').checked = val;
        }
    }

    setSlider('sliderSigma', get('Sigma (bandwidth)'));
    setSlider('sliderForecast', get('Years ahead'));
    setSlider('sliderCone', get('Cone width'));

    document.getElementById('importArea').classList.remove('active');
    draw();
    showToast('Settings imported');
});

// Panel drag logic
const panel = document.getElementById('panel');
const dragHandle = document.getElementById('dragHandle');
let isDragging = false, dragX = 0, dragY = 0;

dragHandle.addEventListener('mousedown', (e) => {
    if (e.target.closest('.panel-toggle')) return;
    isDragging = true;
    dragX = e.clientX - panel.offsetLeft;
    dragY = e.clientY - panel.offsetTop;
    document.body.style.cursor = 'grabbing';
});
document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    let x = e.clientX - dragX;
    let y = e.clientY - dragY;
    x = Math.max(0, Math.min(window.innerWidth - panel.offsetWidth, x));
    y = Math.max(0, Math.min(window.innerHeight - 40, y));
    panel.style.left = x + 'px';
    panel.style.top = y + 'px';
    panel.style.right = 'auto';
});
document.addEventListener('mouseup', () => {
    isDragging = false;
    document.body.style.cursor = '';
});

// Touch drag
dragHandle.addEventListener('touchstart', (e) => {
    if (e.target.closest('.panel-toggle')) return;
    isDragging = true;
    const t = e.touches[0];
    dragX = t.clientX - panel.offsetLeft;
    dragY = t.clientY - panel.offsetTop;
}, {passive: true});
document.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const t = e.touches[0];
    let x = t.clientX - dragX;
    let y = t.clientY - dragY;
    x = Math.max(0, Math.min(window.innerWidth - panel.offsetWidth, x));
    y = Math.max(0, Math.min(window.innerHeight - 40, y));
    panel.style.left = x + 'px';
    panel.style.top = y + 'px';
    panel.style.right = 'auto';
}, {passive: true});
document.addEventListener('touchend', () => { isDragging = false; });

// Panel collapse/expand
document.getElementById('panelToggle').addEventListener('click', () => {
    panel.classList.toggle('collapsed');
    document.getElementById('panelToggle').textContent = panel.classList.contains('collapsed') ? '+' : '_';
});

// Start collapsed on mobile
if (window.innerWidth <= 600) {
    panel.classList.add('collapsed');
    document.getElementById('panelToggle').textContent = '+';
}

// Share buttons
function getSettingsText() {
    const p = getParams();
    const forecast = document.getElementById('sliderForecast').value;
    const cone = document.getElementById('sliderCone').value;
    return `Intercept: ${p.intercept.toFixed(2)}, Slope: ${p.slope.toFixed(2)}, Amplitude: ${p.amp.toFixed(2)}, Period: ${p.period.toFixed(0)}, Phase: ${p.phase.toFixed(2)}, Sigma: ${p.sigma.toFixed(2)}, Forecast: ${forecast}yr, Cone: ${cone}`;
}

function getShareUrl() {
    const base = window.location.origin + window.location.pathname;
    const params = new URLSearchParams();
    const p = getParams();
    params.set('intercept', p.intercept.toFixed(2));
    params.set('slope', p.slope.toFixed(2));
    params.set('amp', p.amp.toFixed(2));
    params.set('period', p.period.toFixed(0));
    params.set('phase', p.phase.toFixed(2));
    params.set('sigma', p.sigma.toFixed(2));
    params.set('forecast', document.getElementById('sliderForecast').value);
    params.set('cone', parseFloat(document.getElementById('sliderCone').value).toFixed(2));
    return base + '?' + params.toString();
}

document.getElementById('shareLink').addEventListener('click', () => {
    navigator.clipboard.writeText(getShareUrl()).then(() => showToast('Link copied to clipboard'));
});

document.getElementById('shareWhatsApp').addEventListener('click', () => {
    const url = getShareUrl();
    const text = encodeURIComponent('Check out my Bitcoin Model Lab forecast: ' + url);
    window.open('https://wa.me/?text=' + text, '_blank');
});

document.getElementById('shareX').addEventListener('click', () => {
    const url = getShareUrl();
    const text = encodeURIComponent('Bitcoin Model Lab Forecast - ' + getSettingsText());
    window.open('https://twitter.com/intent/tweet?text=' + text + '&url=' + encodeURIComponent(url), '_blank');
});

document.getElementById('watchVideo').addEventListener('click', () => {
    window.open('https://www.youtube.com/@walletgreat', '_blank');
});

// Animation loop (only runs while animation is active)
let animRAF = null;
function animationFrame() {
    if (animationActive) {
        draw();
        animRAF = requestAnimationFrame(animationFrame);
    } else {
        animRAF = null;
        draw(); // final frame
    }
}
function startAnimation() {
    animationActive = true;
    animationStartTime = Date.now();
    if (!animRAF) animationFrame();
}

// Auto-start cinematic animation on page load
startAnimation();
</script>
